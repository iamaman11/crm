syntax = "proto3";

package crm.activities.v2;

import "crm/core/v2/operation.proto";
import "google/protobuf/timestamp.proto";

// Task ownership is assigned by signed Access; the browser cannot set actor.
enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_LOW = 1;
  TASK_PRIORITY_NORMAL = 2;
  TASK_PRIORITY_HIGH = 3;
  TASK_PRIORITY_URGENT = 4;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_OPEN = 1;
  TASK_STATUS_COMPLETED = 2;
}

message Task {
  string task_id = 1;
  string subject = 2;
  string description = 3;
  string account_id = 4;
  TaskPriority priority = 5;
  TaskStatus status = 6;
  google.protobuf.Timestamp due_at = 7;
  google.protobuf.Timestamp reminder_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  int64 version = 10;
  // Only the existing Task owner projects a real sales.deal relationship.
  // Empty for ordinary Account tasks. Only a validated Deal link at creation can set it.
  string related_deal_id = 11;
  // Historical v2 read aliases; both are projections of the same original
  // TaskOwner. New consumers use the shared typed owner below.
  string assignee_identity = 12;
  string owner_team_id = 13;
  crm.core.v2.ActorOrTeamOwner owner = 14;
}

message CreateTaskRequest {
  string task_id = 1;
  string subject = 2;
  optional string description = 3;
  string account_id = 4;
  TaskPriority priority = 5;
  google.protobuf.Timestamp due_at = 6;
  google.protobuf.Timestamp reminder_at = 7;
  crm.core.v2.MutationPrecondition precondition = 8;
  // Optional concrete Deal link, checked against the tenant and Account by the Task owner.
  optional string deal_id = 9;
  // Only an ACTIVE member in this tenant can be assigned by the administrator.
  // Absent uses the verified creator; never a caller-supplied actor claim.
  optional string assignee_email = 10;
  // Retained v2 wire aliases. Mixing either alias with owner is invalid.
  optional string owner_team_id = 11;
  crm.core.v2.ActorOrTeamOwner owner = 12;
}

message CreateTaskResponse {
  Task task = 1;
  crm.core.v2.MutationReceipt receipt = 2;
}

// Priority is required: absent means Keep, a present enum means Set.
// Clear is invalid, so an enum-valued oneof/parallel patch type is unnecessary.
// Absent patch = keep; explicit clear is valid only for optional values.
// Owner assignment uses the shared oneof. Reminder scheduling is a separate typed Task intent.
message UpdateTaskRequest {
  string task_id = 1;
  crm.core.v2.StringPatch subject = 2;
  crm.core.v2.StringPatch description = 3;
  optional TaskPriority priority = 4;
  crm.core.v2.TimestampPatch due_at = 5;
  crm.core.v2.MutationPrecondition precondition = 6;
  // Assign a different eligible human while retaining original domain CAS,
  // idempotency receipt, immutable history and audit. Absent means Keep.
  optional string assignee_email = 7;
  optional string owner_team_id = 8;
  // Canonical Keep (absent) / Set (oneof). Never combine with old aliases.
  crm.core.v2.ActorOrTeamOwner owner = 9;
}

message UpdateTaskResponse {
  Task task = 1;
  crm.core.v2.MutationReceipt receipt = 2;
}

// Original crm-activities ScheduleReminder: an unchanged time is a read-only
// no-op (changed=false and no receipt); changed schedules have CAS + receipt.
message ScheduleReminderRequest {
  string task_id = 1;
  google.protobuf.Timestamp reminder_at = 2;
  crm.core.v2.MutationPrecondition precondition = 3;
}

message ScheduleReminderResponse {
  Task task = 1;
  bool changed = 2;
  crm.core.v2.MutationReceipt receipt = 3;
}

message CompleteTaskRequest {
  string task_id = 1;
  crm.core.v2.MutationPrecondition precondition = 2;
}

message CompleteTaskResponse {
  Task task = 1;
  bool changed = 2;
  crm.core.v2.MutationReceipt receipt = 3;
}

// An active signed human takes an open task from their team pool.
message ClaimTaskRequest {
  string task_id = 1;
  crm.core.v2.MutationPrecondition precondition = 2;
}
message ClaimTaskResponse {
  Task task = 1;
  crm.core.v2.MutationReceipt receipt = 2;
}

message GetTaskRequest {
  string task_id = 1;
  // Optional original key: read-only, tenant-bound receipt reconciliation.
  optional string receipt_idempotency_key = 2;
}

message GetTaskResponse {
  Task task = 1;
  // Present only for a proven original commit; legacy unknown is absent.
  crm.core.v2.MutationCommitEvidence confirmed_mutation = 2;
}

message ListTasksRequest {
  crm.core.v2.PageRequest page = 1;
  optional TaskStatus status = 2;
  optional string account_id = 3;
  // Absent means all priorities. UNSPECIFIED and unknown values are invalid.
  optional TaskPriority priority = 4;
  // A concrete user journey: only Tasks linked to this Deal, NOT an
  // arbitrary resource-type filtering surface from legacy query runtime.
  optional string deal_id = 5;
  // Bounded case-sensitive subject/ID lookup in the original tenant Task owner.
  // Applied before paging; no projection or separate search service.
  string search = 6;
  // Select only open Tasks with a non-null due instant strictly before
  // the server clock. Executed in the signed original owner before paging.
  bool overdue_only = 7;
  // SK-06: absolute instants supplied from the user's chosen local-day bounds.
  // Owner filters before LIMIT; [due_from, due_before) is half-open.
  google.protobuf.Timestamp due_from = 8;
  google.protobuf.Timestamp due_before = 9;
  // Due-ordered keyset uses the (due_nanoseconds, task_id) pair, not the ID cursor.
  // Only dated records participate. Default false retains existing Task list order.
  bool sort_by_due = 10;
  // Include only Tasks with no deadline; incompatible with due-range/sort.
  bool without_due_only = 11;
  // Original Task owner filters before LIMIT. No browser page filtering.
  optional string assignee_email = 12;
  // Resolve from the signed Access Actor, never a caller-supplied identity.
  bool assigned_to_me = 13;
  optional string owner_team_id = 14;
  // Same owner dimension as Sales; mutually exclusive with assigned_to_me
  // and the historical input aliases.
  crm.core.v2.ActorOrTeamOwner owner_filter = 15;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  crm.core.v2.PageInfo page_info = 2;
  map<string, string> account_names = 3;
}

message ListTaskWorkloadRequest {}
message TaskWorkloadBucket {
  string assignee_identity = 1;
  string owner_team_id = 2;
  uint64 open_count = 3;
  uint64 completed_count = 4;
  uint64 overdue_open_count = 5;
  uint64 due_next_7_days_count = 6;
  crm.core.v2.ActorOrTeamOwner owner = 7;
}
message ListTaskWorkloadResponse {
  repeated TaskWorkloadBucket buckets = 1;
  int64 as_of_unix_seconds = 2;
}

service TaskService {
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc ScheduleReminder(ScheduleReminderRequest) returns (ScheduleReminderResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTaskWorkload(ListTaskWorkloadRequest) returns (ListTaskWorkloadResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
