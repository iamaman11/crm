syntax = "proto3";

package crm.activities.v2;

import "crm/core/v2/operation.proto";
import "google/protobuf/timestamp.proto";

// Task ownership is assigned by signed Access; the browser cannot set actor.
enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_LOW = 1;
  TASK_PRIORITY_NORMAL = 2;
  TASK_PRIORITY_HIGH = 3;
  TASK_PRIORITY_URGENT = 4;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_OPEN = 1;
  TASK_STATUS_COMPLETED = 2;
}

message Task {
  string task_id = 1;
  string subject = 2;
  string description = 3;
  string account_id = 4;
  TaskPriority priority = 5;
  TaskStatus status = 6;
  google.protobuf.Timestamp due_at = 7;
  google.protobuf.Timestamp reminder_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  int64 version = 10;
  // Only the existing Task owner projects a real sales.deal relationship.
  // Empty for ordinary Account tasks. Only a validated Deal link at creation can set it.
  string related_deal_id = 11;
}

message CreateTaskRequest {
  string task_id = 1;
  string subject = 2;
  optional string description = 3;
  string account_id = 4;
  TaskPriority priority = 5;
  google.protobuf.Timestamp due_at = 6;
  google.protobuf.Timestamp reminder_at = 7;
  crm.core.v2.MutationPrecondition precondition = 8;
  // Optional concrete Deal link, checked against the tenant and Account by the Task owner.
  optional string deal_id = 9;
}

message CreateTaskResponse {
  Task task = 1;
  crm.core.v2.MutationReceipt receipt = 2;
}

// Priority is required: absent means Keep, a present enum means Set.
// Clear is invalid, so an enum-valued oneof/parallel patch type is unnecessary.
// Absent patch = keep; explicit clear is valid only for optional values.
// Actor/owner remain fixed. Reminder scheduling is a separate typed Task intent.
message UpdateTaskRequest {
  string task_id = 1;
  crm.core.v2.StringPatch subject = 2;
  crm.core.v2.StringPatch description = 3;
  optional TaskPriority priority = 4;
  crm.core.v2.TimestampPatch due_at = 5;
  crm.core.v2.MutationPrecondition precondition = 6;
}

message UpdateTaskResponse {
  Task task = 1;
  crm.core.v2.MutationReceipt receipt = 2;
}

// Original crm-activities ScheduleReminder: an unchanged time is a read-only
// no-op (changed=false and no receipt); changed schedules have CAS + receipt.
message ScheduleReminderRequest {
  string task_id = 1;
  google.protobuf.Timestamp reminder_at = 2;
  crm.core.v2.MutationPrecondition precondition = 3;
}

message ScheduleReminderResponse {
  Task task = 1;
  bool changed = 2;
  crm.core.v2.MutationReceipt receipt = 3;
}

message CompleteTaskRequest {
  string task_id = 1;
  crm.core.v2.MutationPrecondition precondition = 2;
}

message CompleteTaskResponse {
  Task task = 1;
  bool changed = 2;
  crm.core.v2.MutationReceipt receipt = 3;
}

message GetTaskRequest {
  string task_id = 1;
  // Optional original key: read-only, tenant-bound receipt reconciliation.
  optional string receipt_idempotency_key = 2;
}

message GetTaskResponse {
  Task task = 1;
  // Present only for a proven original commit; legacy unknown is absent.
  crm.core.v2.MutationCommitEvidence confirmed_mutation = 2;
}

message ListTasksRequest {
  crm.core.v2.PageRequest page = 1;
  optional TaskStatus status = 2;
  optional string account_id = 3;
  // Absent means all priorities. UNSPECIFIED and unknown values are invalid.
  optional TaskPriority priority = 4;
  // A concrete user journey: only Tasks linked to this Deal, NOT an
  // arbitrary resource-type filtering surface from legacy query runtime.
  optional string deal_id = 5;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  crm.core.v2.PageInfo page_info = 2;
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc ScheduleReminder(ScheduleReminderRequest) returns (ScheduleReminderResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
