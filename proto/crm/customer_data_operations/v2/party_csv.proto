syntax = "proto3";

package crm.customer_data_operations.v2;

import "crm/core/v2/operation.proto";
import "crm/parties/v3/party.proto";

// Admin-only bounded transient preview, create-only CSV import and download.
// CSV bytes are returned by the same generated Connect RPC as its metadata.
// No persisted export/import jobs or extra storage services.
message PreviewPartyExportRequest {
  optional crm.parties.v3.PartyKind kind = 1;
}

message PreviewPartyExportResponse {
  uint32 count = 1;
  string csv_sha256_hex = 2;
  string specification_version = 3;
  repeated string fields = 4;
  uint32 maximum_tenant_parties = 5;
  bytes csv = 6;
}

message PartyImportSource {
  string source_id = 1;
  string display_name = 2;
}

message ListPartyImportSourcesRequest {}

message ListPartyImportSourcesResponse {
  repeated PartyImportSource sources = 1;
}

message RegisterPartyImportSourceRequest {
  string display_name = 1;
  crm.core.v2.MutationPrecondition precondition = 2;
}

message RegisterPartyImportSourceResponse {
  PartyImportSource source = 1;
  crm.core.v2.MutationReceipt receipt = 2;
}

message PreviewPartyImportRequest {
  bytes csv = 1;
  optional string receipt_idempotency_key = 2;
  // Omitted preserves the established create-only import behavior.
  optional string source_id = 3;
}

// One-based DATA record position, never a physical line number: a quoted CSV
// field can span several text lines. Original RowDiagnostic owns reason/field.
message PartyCsvRowIssue {
  uint32 row_position = 1;
  string field = 2;
  string code = 3;
}

message PreviewPartyImportResponse {
  uint32 count = 1;
  string csv_sha256_hex = 2;
  uint32 previously_imported = 3;
  repeated string target_party_ids = 4;
  crm.core.v2.MutationCommitEvidence confirmed_mutation = 5;
  // When nonempty, no target IDs are actionable and Apply rejects ALL rows.
  repeated PartyCsvRowIssue row_issues = 6;
  uint32 new_count = 7;
  uint32 matched_count = 8;
  // Binds source identity mappings and Party versions observed by this preview.
  string preview_fingerprint = 9;
}

message ApplyPartyImportRequest {
  bytes csv = 1;
  string expected_sha256_hex = 2;
  crm.core.v2.MutationPrecondition precondition = 3;
  optional string source_id = 4;
  string expected_preview_fingerprint = 5;
}

message ApplyPartyImportResponse {
  uint32 created_count = 1;
  uint32 replayed_count = 2;
  string source_sha256_hex = 3;
  crm.core.v2.MutationReceipt receipt = 4;
}

service PartyCsvService {
  rpc PreviewPartyExport(PreviewPartyExportRequest) returns (PreviewPartyExportResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListPartyImportSources(ListPartyImportSourcesRequest) returns (ListPartyImportSourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RegisterPartyImportSource(RegisterPartyImportSourceRequest) returns (RegisterPartyImportSourceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc PreviewPartyImport(PreviewPartyImportRequest) returns (PreviewPartyImportResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ApplyPartyImport(ApplyPartyImportRequest) returns (ApplyPartyImportResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}
