# The only active CRM is the Cloudflare Worker/D1 service. Original domain
# owners and the exact shared Rust crates they need form this workspace.
# Retired PostgreSQL product-plane crates are not workspace members.
[workspace]
resolver = "2"
members = [
  "crates/crm-core-contracts",
  "crates/crm-module-sdk",
  "crates/crm-proto-contracts",
  "crates/crm-sales-activities-link-contract-adapter",
  "crates/crm-customer-360-query-adapter",
  "modules/crm-sales",
  "modules/crm-activities",
  "modules/crm-sales-activities-link",
  "modules/crm-parties",
  "modules/crm-customer-accounts",
  "modules/crm-contact-points",
  "modules/crm-party-relationships",
  "modules/crm-consents",
  "modules/crm-identity-resolution",
  "modules/crm-customer-data-operations",
  "modules/crm-data-quality",
  "modules/crm-customer-enrichment",
  "modules/crm-customer-privacy",
]
[workspace.package]
edition = "2024"
license = "Proprietary"
rust-version = "1.100.0"

[workspace.lints.rust]
warnings = "deny"

# Strictly pinned reviewed native Rust dependencies; update manifests and lock together.
[workspace.dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
jiff = { version = "=0.2.46", default-features = false, features = ["std", "tzdb-bundle-always"] }
iso4217-static = { version = "=0.3.1", default-features = false }
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
email_address = { version = "=0.2.10", default-features = false, features = ["std"] }
phonenumber = { version = "=0.3.10", default-features = false }
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
serde_path_to_error = "=0.1.20"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
