    - sales.deal
    - sales.quote
    - sales.territory
    - sales.account_assignment
    - sales.routing_rule
    - sales.quota
  ui_extensions:
    - id: sales.pipeline.navigation
      type: navigation.item
      version: 1.0.0
      permission: sales.deal.read
      fallback: hide
    - id: sales.deal.summary
      type: record_page.panel
      version: 1.0.0
      permission: sales.deal.read
      fallback: readonly
consumes:
  capabilities: []
  events: []
storage:
  record_types:
    - sales.lead
    - sales.deal
    - sales.quote
    - sales.territory
    - sales.account_assignment
    - sales.routing_rule
    - sales.quota
  private_state_namespaces:
    - crm.sales
security:
  data_classes:
    - internal
    - confidential
    - personal
  network_egress: []
  secret_handles: []
quotas:
  maximum_bulk_records: 10000
  maximum_workflow_actions_per_transaction: 100
lifecycle:
  upgrade_policy: manual
  rollback_policy: supported
  uninstall_policy: retain_business_records
  migrations_path: modules/crm-sales/migrations
  retained_record_types:
    - sales.lead
    - sales.deal
    - sales.quote
    - sales.territory
    - sales.account_assignment
    - sales.routing_rule
    - sales.quota
