[package]
name = "crm-connect-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "axum"] }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# The deployed Worker needs only generated server/router and message types.
# Generated Rust client stubs are opt-in, without adding transport dependencies
# to the default graph. A future Rust client consumer must also enable
# connectrpc/client explicitly in its own dependency graph.
client = []

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
connectrpc-build = "=0.9.0"
protoc-bin-vendored = "3"
