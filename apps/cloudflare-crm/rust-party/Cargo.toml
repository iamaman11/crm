[package]
name = "crm-native-party-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Only for loopback workerd CI. The production build cannot accept these headers.
ci-local = []

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
crm-parties = { path = "../../../modules/crm-parties" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"

# Separate target package. The existing main Cargo workspace is untouched.
[workspace]
