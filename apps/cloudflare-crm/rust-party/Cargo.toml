[package]
name = "crm-native-party-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[lib]
crate-type = ["cdylib"]

# Native wasm-pack release profile: keep Binaryen optimization, but use
# its inexpensive -O1 level in place of the default -O (~77-87s in CI).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]

# The signed workerd suite tests behavior from the debug build without DWARF.
# Limit the override to the Worker so cached third-party artifacts stay reusable.
[profile.dev.package.crm-native-party-worker]
debug = false

[profile.dev.package.crm-connect-contracts]
debug = false

# Measured release candidate: reduce LLVM work for the generated Connect/D1
# boundary only. Original domain dependencies retain Cargo release opt-level 3;
# Binaryen -O1 still runs on the final WASM. Compare sealed size and live timings.
[profile.release.package.crm-native-party-worker]
opt-level = 2

# Preserve the existing optimization level of the moved generated code.
[profile.release.package.crm-connect-contracts]
opt-level = 2

# Optimize only the host-side Connect generators and their Rust formatter.
# These packages are absent from the normal WASM dependency graph.
[profile.dev.package.buffa-codegen]
opt-level = 2

[profile.dev.package.connectrpc-codegen]
opt-level = 2

[profile.dev.package."prettyplease:0.2.37"]
opt-level = 2

[profile.release.package.buffa-codegen]
opt-level = 2

[profile.release.package.connectrpc-codegen]
opt-level = 2

[profile.release.package."prettyplease:0.2.37"]
opt-level = 2

[features]
default = []
# Sole deployed runtime: one native workers-rs fetch; no JS tenant delegation.
native = []
# CI-only signed JWT fixture, same Rust verifier and D1 actor path.
native-ci = ["native"]

[dependencies]
crm-connect-contracts = { path = "connect-contracts" }
crm-customer-360-query-adapter = { path = "../../../crates/crm-customer-360-query-adapter" }
worker = { version = "=0.9.0", features = ["d1", "http"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "axum"] }
axum = { version = "0.8", default-features = false }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
tower-service = "0.3"
crm-parties = { path = "../../../modules/crm-parties" }
crm-sales = { path = "../../../modules/crm-sales" }
crm-activities = { path = "../../../modules/crm-activities" }
crm-sales-activities-link = { path = "../../../modules/crm-sales-activities-link" }
crm-sales-activities-link-contract-adapter = { path = "../../../crates/crm-sales-activities-link-contract-adapter" }
crm-proto-contracts = { path = "../../../crates/crm-proto-contracts", default-features = false, features = ["sales-activities-link"] }
prost = "0.14"
crm-customer-accounts = { path = "../../../modules/crm-customer-accounts" }
crm-contact-points = { path = "../../../modules/crm-contact-points" }
crm-party-relationships = { path = "../../../modules/crm-party-relationships" }
crm-consents = { path = "../../../modules/crm-consents" }
crm-identity-resolution = { path = "../../../modules/crm-identity-resolution" }
crm-customer-data-operations = { path = "../../../modules/crm-customer-data-operations" }
crm-data-quality = { path = "../../../modules/crm-data-quality" }
crm-customer-enrichment = { path = "../../../modules/crm-customer-enrichment" }
crm-customer-privacy = { path = "../../../modules/crm-customer-privacy" }
crm-module-sdk = { path = "../../../crates/crm-module-sdk" }
crm-core-contracts = { path = "../../../crates/crm-core-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }
wasm-bindgen-futures = "0.4"

# Separate target package. The existing main Cargo workspace is untouched.
[workspace]
members = ["connect-contracts"]
default-members = ["."]
