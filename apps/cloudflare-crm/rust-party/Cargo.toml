[package]
name = "crm-native-party-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Sole deployed runtime: one native workers-rs fetch; no JS tenant delegation.
native = []
# CI-only signed JWT fixture, same Rust verifier and D1 actor path.
native-ci = ["native"]

[dependencies]
crm-customer-360-query-adapter = { path = "../../../crates/crm-customer-360-query-adapter", default-features = false, features = ["account-overview"] }
worker = { version = "=0.8.7", features = ["d1", "http"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["axum"] }
axum = { version = "0.8", default-features = false }
buffa = { version = "=0.9.1", default-features = false }
buffa-types = { version = "=0.9.1", default-features = false }
tower-service = "0.3"
crm-parties = { path = "../../../modules/crm-parties" }
crm-sales = { path = "../../../modules/crm-sales" }
crm-activities = { path = "../../../modules/crm-activities" }
crm-sales-activities-link = { path = "../../../modules/crm-sales-activities-link" }
crm-sales-activities-link-contract-adapter = { path = "../../../crates/crm-sales-activities-link-contract-adapter" }
crm-proto-contracts = { path = "../../../crates/crm-proto-contracts" }
prost = "0.14"
crm-customer-accounts = { path = "../../../modules/crm-customer-accounts" }
crm-contact-points = { path = "../../../modules/crm-contact-points" }
crm-party-relationships = { path = "../../../modules/crm-party-relationships" }
crm-consents = { path = "../../../modules/crm-consents" }
crm-identity-resolution = { path = "../../../modules/crm-identity-resolution" }
crm-customer-data-operations = { path = "../../../modules/crm-customer-data-operations" }
crm-data-quality = { path = "../../../modules/crm-data-quality" }
crm-customer-enrichment = { path = "../../../modules/crm-customer-enrichment" }
crm-customer-privacy = { path = "../../../modules/crm-customer-privacy" }
crm-module-sdk = { path = "../../../crates/crm-module-sdk" }
crm-core-contracts = { path = "../../../crates/crm-core-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }
wasm-bindgen-futures = "0.4"

# Separate target package. The existing main Cargo workspace is untouched.
[workspace]

[build-dependencies]
connectrpc-build = "=0.9.0"
protoc-bin-vendored = "3"
