[package]
name = "crm-customer-enrichment-privacy-scope-adapter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crm-capability-plan-support = { path = "../crm-capability-plan-support" }
crm-capability-runtime = { path = "../crm-capability-runtime" }
crm-core-data = { path = "../crm-core-data" }
crm-customer-enrichment = { path = "../../modules/crm-customer-enrichment" }
crm-customer-enrichment-application-adapter = { path = "../crm-customer-enrichment-application-adapter" }
crm-customer-enrichment-capability-adapter = { path = "../crm-customer-enrichment-capability-adapter" }
crm-customer-enrichment-provider-process-composition = { path = "../crm-customer-enrichment-provider-process-composition" }
crm-customer-enrichment-review-adapter = { path = "../crm-customer-enrichment-review-adapter" }
crm-customer-privacy-owner-scope-support = { path = "../crm-customer-privacy-owner-scope-support" }
crm-identity-resolution = { path = "../../modules/crm-identity-resolution" }
crm-identity-resolution-capability-adapter = { path = "../crm-identity-resolution-capability-adapter" }
crm-identity-resolution-topology-composition = { path = "../crm-identity-resolution-topology-composition" }
crm-module-sdk = { path = "../crm-module-sdk" }
crm-proto-contracts = { path = "../crm-proto-contracts" }
crm-query-runtime = { path = "../crm-query-runtime" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }

[dev-dependencies]
crm-customer-privacy = { path = "../../modules/crm-customer-privacy" }
crm-parties = { path = "../../modules/crm-parties" }
crm-parties-capability-adapter = { path = "../crm-parties-capability-adapter" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
