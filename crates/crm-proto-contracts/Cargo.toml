[package]
name = "crm-proto-contracts"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
build = "build.rs"

# Host workspace and contract export retain the complete published schema.
# The Worker only needs the historical internal Sales -> Activities wire link.
[features]
default = ["full"]
full = ["sales-activities-link"]
sales-activities-link = []

[dependencies]
prost = { workspace = true }
prost-types = "0.14"
sha2 = { workspace = true }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[lints]
workspace = true
