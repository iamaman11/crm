[package]
name = "crm-connect-worker-send-proof"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "=0.8.7", features = ["http", "d1"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "axum"] }
axum = { version = "0.8", default-features = false }
tower-service = "0.3"
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
connectrpc-build = "=0.9.0"
protoc-bin-vendored = "3"
