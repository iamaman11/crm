name: Step 20 Evidence Materializer

on:
  push:
    branches:
      - repository-step-20-evidence-sync
  pull_request:
    branches:
      - main

concurrency:
  group: step20-evidence-materializer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20-evidence-sync
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install materializer dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Materialize accepted Step 20 evidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/materialize_step20_evidence_sync.py")
          content = path.read_text(encoding="utf-8")
          old = 're.subn(pattern, replacement.rstrip() + "\\n\\n", text)'
          new = 're.subn(pattern, lambda _match: replacement.rstrip() + "\\n\\n", text)'
          if old not in content:
              raise SystemExit("materializer replacement anchor missing")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/materialize_step20_evidence_sync.py

      - name: Normalize accepted Step 20 current-state wording
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = (
              "docs/PROJECT_STATUS.md",
              "docs/IMPLEMENTATION_ROADMAP.md",
              "docs/PHASE8_DELIVERY_PLAN.md",
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "docs/MODULE_CATALOG.md",
              "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
              "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
              "docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md",
              "docs/CUSTOMER_PRIVACY_OPERATIONS_READINESS.md",
          )
          exact = (
              (
                  "Repository Step 20B may begin only after the accepted Step 20A evidence is synchronized through this packet.",
                  "Repository Step 20B is accepted through PR #294; Repository Step 21 Phase 8A closure is next.",
              ),
              (
                  "Step 20B restore, SLO, observability, performance, security and supply-chain operations evidence is the only next permitted packet.",
                  "Step 20B restore, SLO, observability, performance, security and supply-chain operations evidence is accepted through PR #294; Repository Step 21 Phase 8A closure is the only next permitted packet.",
              ),
              (
                  "Repository Step 20B production operations, restore, SLO, observability, security, performance and supply-chain evidence;",
                  "Repository Step 21 Phase 8A closure review;",
              ),
              (
                  "Step 20B production operations, restore, SLO, observability, security, performance and supply-chain evidence;",
                  "Repository Step 21 Phase 8A closure review;",
              ),
              (
                  "Step 20B operations parity remains.",
                  "Step 20 operations parity is accepted through PR #294.",
              ),
          )
          for name in paths:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in exact:
                  text = text.replace(old, new)
              text = re.sub(
                  r"(?i)\brepository step 20 remains in progress\b",
                  "Repository Step 20 is complete",
                  text,
              )
              text = re.sub(
                  r"(?i)\bstep 20 remains in progress\b",
                  "Step 20 is complete",
                  text,
              )
              text = re.sub(
                  r"(?i)\brepository step 20b is next\b",
                  "Repository Step 21 Phase 8A closure is next",
                  text,
              )
              text = re.sub(
                  r"(?i)\bstep 20b is next\b",
                  "Step 21 is next",
                  text,
              )
              text = re.sub(
                  r"(?i)\bstep 20b next\b",
                  "Step 21 next",
                  text,
              )
              text = re.sub(
                  r"(?m)^-> 20\.[^\n]*$",
                  "-> 20. Phase 8A frontend, accessibility, browser and operations evidence — complete through PRs #292 and #294",
                  text,
              )
              path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_architecture_documentation_consistency.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_guard = 'r"step 20[^\\n.;]{0,120}(?:not started|in progress|next)",'
          new_guard = 'r"step 20(?![ab])[^\\n.;]{0,80}(?:not started|in progress)|step 20b[^\\n.;]{0,80}\\bnext\\b",'
          if old_guard not in test_text:
              raise SystemExit("Step 20 stale-state guard anchor missing")
          test_path.write_text(test_text.replace(old_guard, new_guard, 1), encoding="utf-8")

          from scripts.repository_navigation import generated_documents
          root = Path.cwd()
          for path, content in generated_documents(root).items():
              path.write_text(content, encoding="utf-8")
          PY

      - name: Validate synchronized documentation and navigation
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_architecture_documentation_consistency
          python -m unittest tests.test_repository_navigation

      - name: Commit materialized evidence
        # This workflow is temporary and is removed before the review head.
        run: |
          if git diff --quiet; then
            echo "Evidence is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs repository-packet.json tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          git commit -m "docs: synchronize accepted Repository Step 20 evidence"
          git push origin HEAD:repository-step-20-evidence-sync
