name: Temporary Step 19 Evidence Sync PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-19-evidence-sync.yml"
      - ".github/workflows/temporary-step-19-evidence-sync-pr.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-19-evidence-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-19-evidence-sync
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruamel.yaml
      - name: Execute synchronization payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-step-19-evidence-sync.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = source[start:end]
          payload = "\n".join(line[10:] if line.startswith("          ") else line for line in payload.splitlines()) + "\n"
          payload = payload.replace(
              "updated, count = re.subn(pattern, body.rstrip(), text, flags=re.DOTALL)",
              "updated, count = re.subn(pattern, lambda _: body.rstrip(), text, flags=re.DOTALL)",
          )
          Path('/tmp/step19_evidence_sync.py').write_text(payload, encoding='utf-8')
          PY
          python /tmp/step19_evidence_sync.py
          python - <<'PY'
          from pathlib import Path
          documents = [
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "docs/IMPLEMENTATION_ROADMAP.md",
              "docs/MODULE_CATALOG.md",
              "docs/PHASE8_DELIVERY_PLAN.md",
              "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
              "docs/PROJECT_STATUS.md",
              "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
          ]
          replacements = [
              ("Step 19 is next", "Step 19 is complete; Step 20 is next"),
              ("zero Customer Privacy workers", "one Customer Privacy owner worker"),
              ("- a real Customer Privacy worker lifecycle using the accepted reusable conformance;\n", ""),
              ("- disable/uninstall fail-closed semantics;\n", ""),
              ("The next permitted implementation packet is Repository Step 19: the real Customer Privacy worker lifecycle and complete process/end-to-end acceptance. Repository Step 18 is complete through PR #285.", "The next permitted implementation packet is Repository Step 20: Phase 8A frontend, accessibility, browser and operations evidence. Repository Step 19 is complete through PRs #287–#290."),
              ("No Step 19 or later implementation may start while Step 18 remains unfinished.", "No Step 20 or later implementation may start before the accepted Repository Step 19 closure evidence is synchronized."),
              ("1–18. accepted and complete\n-> 19. Customer Privacy worker and complete process/end-to-end acceptance\n-> 20. Phase 8A frontend and operations evidence", "1–19. accepted and complete\n-> 20. Phase 8A frontend, accessibility, browser and operations evidence"),
              ("- **Stage F — in progress:** mutation/query and worker conformance are accepted; contract lifecycle remains.", "- **Stage F — complete through PR #290:** mutation/query and worker conformance, complete contract lifecycle enforcement and real Customer Privacy worker adoption/lifecycle proof are accepted."),
          ]
          for relative in documents:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          python scripts/generate_repository_navigation.py --write
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-19-evidence-sync.yml
          rm .github/workflows/temporary-step-19-evidence-sync-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize Repository Step 19 closure evidence"
          git push origin HEAD:repository-step-19-evidence-sync
