name: Temporary Step 19 Evidence Sync PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-step-19-evidence-sync.yml"
      - ".github/workflows/temporary-step-19-evidence-sync-pr.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-19-evidence-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-19-evidence-sync
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruamel.yaml
      - name: Execute synchronization payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-step-19-evidence-sync.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = source[start:end]
          payload = "\n".join(line[10:] if line.startswith("          ") else line for line in payload.splitlines()) + "\n"
          payload = payload.replace(
              "updated, count = re.subn(pattern, body.rstrip(), text, flags=re.DOTALL)",
              "updated, count = re.subn(pattern, lambda _: body.rstrip(), text, flags=re.DOTALL)",
          )
          Path('/tmp/step19_evidence_sync.py').write_text(payload, encoding='utf-8')
          PY
          python /tmp/step19_evidence_sync.py
          python - <<'PY'
          from pathlib import Path
          import re

          documents = (
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "docs/IMPLEMENTATION_ROADMAP.md",
              "docs/MODULE_CATALOG.md",
              "docs/PHASE8_DELIVERY_PLAN.md",
              "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
              "docs/PROJECT_STATUS.md",
              "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
          )
          accepted_worker = "one accepted Customer Privacy owner worker: `crm.customer-privacy` / `owner-execution` at phase `260`"
          for relative in documents:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"Repository Step 19 is (?:now )?(?:the )?next[^.\n]*\.",
                  "Repository Step 19 is complete. Repository Step 20 is the only next permitted implementation packet.",
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r"Repository Steps 1[–-](?:17|18) are complete\.",
                  "Repository Steps 1–19 are complete.",
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r"\*\*0 Customer Privacy workers\*\*",
                  "**1 Customer Privacy owner worker** (`crm.customer-privacy` / `owner-execution`, phase `260`)",
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r"Customer Privacy (?:remains at|still has|still publishes) (?:\*\*)?0 (?:Customer Privacy )?workers(?:\*\*)?[^.]*\.",
                  f"Customer Privacy now has {accepted_worker}.",
                  text,
                  flags=re.IGNORECASE,
              )
              text = text.replace(
                  "19. Customer Privacy worker and full process/end-to-end acceptance;",
                  "19. Customer Privacy worker and full process/end-to-end acceptance — **complete through PR #290**;",
              )
              text = text.replace(
                  "19. Repository Step 19 — Customer Privacy worker and full E2E;",
                  "19. Repository Step 19 — Customer Privacy worker and full E2E — **complete through PR #290**;",
              )
              text = re.sub(
                  r"### Repository Step 19\n\n- a real Customer Privacy worker lifecycle;\n- complete activation, authorization, lease/replay/crash and process/end-to-end evidence;\n- disable/uninstall fail-closed semantics\.\n",
                  "### Repository Step 19 — complete through PR #290\n\n- real assembled `crm-api` owner-worker lifecycle accepted on clean and rollback/reapplied PostgreSQL schemas;\n- activation, authorization, replay/restart and process/end-to-end evidence accepted;\n- uninstall non-discovery and no-effect behavior accepted.\n",
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r"No Step 19 or later implementation may (?:begin|start)[^.]*\.",
                  "No Step 20 or later implementation may begin before the accepted Repository Step 19 closure evidence is synchronized.",
                  text,
                  flags=re.IGNORECASE,
              )
              text = text.replace(
                  "The remaining product work after Step 17 is:",
                  "The remaining Phase 8A.11 product work after accepted Repository Step 19 is:",
              )
              text = text.replace("- disable/uninstall fail-closed semantics;\n", "")
              text = text.replace("- a real Customer Privacy worker lifecycle using the accepted reusable conformance;\n", "")
              path.write_text(text, encoding="utf-8")
          PY
          python scripts/generate_repository_navigation.py --write
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-19-evidence-sync.yml
          rm .github/workflows/temporary-step-19-evidence-sync-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize Repository Step 19 closure evidence"
          git push origin HEAD:repository-step-19-evidence-sync
