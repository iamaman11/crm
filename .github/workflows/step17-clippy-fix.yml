name: Step 17 Clippy Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-clippy-fix.yml"

concurrency:
  group: step17-clippy-fix-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-contract-usage-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply callback-based telemetry factory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one target, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          adapter = Path("crates/crm-capability-adapters/src/contract_usage_telemetry.rs")
          replace_once(
              adapter,
              '''/// The returned renderer shares the same counters. Recording remains
          /// synchronous and cannot alter gateway outcomes.
          pub fn meter_contract_registries(
              catalog: &'static [(&'static str, &'static str, &'static str, &'static str, u32)],
              registries: [Arc<dyn CapabilityRegistryPort>; 2],
              definitions: [&[CapabilityDefinition]; 2],
          ) -> Result<
              (
                  [Arc<dyn CapabilityRegistryPort>; 2],
                  Arc<dyn Fn() -> String + Send + Sync>,
              ),
              SdkError,
          > {
          ''',
              '''/// The published renderer shares the same counters. Recording remains
          /// synchronous and cannot alter gateway outcomes.
          pub fn meter_contract_registries<F>(
              catalog: &'static [(&'static str, &'static str, &'static str, &'static str, u32)],
              registries: [Arc<dyn CapabilityRegistryPort>; 2],
              definitions: [&[CapabilityDefinition]; 2],
              publish_metrics: F,
          ) -> Result<[Arc<dyn CapabilityRegistryPort>; 2], SdkError>
          where
              F: FnOnce(Arc<dyn Fn() -> String + Send + Sync>),
          {
          ''',
          )
          replace_once(
              adapter,
              '''    let renderer: Arc<dyn Fn() -> String + Send + Sync> =
                  Arc::new(move || renderer_metrics.render_prometheus());
          
              let mutation: Arc<dyn CapabilityRegistryPort> = Arc::new(MeteredCapabilityRegistry {
          ''',
              '''    let renderer: Arc<dyn Fn() -> String + Send + Sync> =
                  Arc::new(move || renderer_metrics.render_prometheus());
              publish_metrics(renderer);
          
              let mutation: Arc<dyn CapabilityRegistryPort> = Arc::new(MeteredCapabilityRegistry {
          ''',
          )
          replace_once(adapter, "    Ok(([mutation, query], renderer))\n", "    Ok([mutation, query])\n")
          replace_once(
              adapter,
              '''        let ([mutation, query], render) = meter_contract_registries(
                      CATALOG,
                      registries,
                      [std::slice::from_ref(&definition), &[]],
                  )
                  .unwrap();
          ''',
              '''        let mut render = None;
                  let [mutation, query] = meter_contract_registries(
                      CATALOG,
                      registries,
                      [std::slice::from_ref(&definition), &[]],
                      |renderer| render = Some(renderer),
                  )
                  .unwrap();
                  let render = render.unwrap();
          ''',
          )
          replace_once(
              adapter,
              '''        let ([mutation, _], render) = meter_contract_registries(
                      CATALOG,
                      registries,
                      [std::slice::from_ref(&definition), &[]],
                  )
                  .unwrap();
          ''',
              '''        let mut render = None;
                  let [mutation, _] = meter_contract_registries(
                      CATALOG,
                      registries,
                      [std::slice::from_ref(&definition), &[]],
                      |renderer| render = Some(renderer),
                  )
                  .unwrap();
                  let render = render.unwrap();
          ''',
          )
          replace_once(
              adapter,
              '''            [&[], &[]],
                  )
                  .err()
          ''',
              '''            [&[], &[]],
                      |_| {},
                  )
                  .err()
          ''',
          )
          replace_once(
              adapter,
              '''            [&[wrong_owner], &[]],
                  )
                  .err()
          ''',
              '''            [&[wrong_owner], &[]],
                      |_| {},
                  )
                  .err()
          ''',
          )
          replace_once(
              adapter,
              '''        let (_, render) = meter_contract_registries(
                      CATALOG,
                      [Arc::clone(&no_registry), no_registry],
                      [&[definition], &[]],
                  )
                  .unwrap();
          ''',
              '''        let mut render = None;
                  meter_contract_registries(
                      CATALOG,
                      [Arc::clone(&no_registry), no_registry],
                      [&[definition], &[]],
                      |renderer| render = Some(renderer),
                  )
                  .unwrap();
                  let render = render.unwrap();
          ''',
          )

          runtime = Path("crates/crm-application-runtime/src/runtime.rs")
          replace_once(
              runtime,
              '''        let ([mutation_registry, query_registry], contract_usage_metrics_text) =
                      meter_contract_registries(
                          DEPRECATED_CONTRACTS,
                          [
                              composition.mutation_registry(),
                              composition.query_registry(),
                          ],
                          [&mutation_definitions, &query_definitions],
                      )
                      .map_err(|error| ApplicationRuntimeError::Assembly(error.to_string()))?;
          ''',
              '''        let mut contract_usage_metrics_text: Arc<dyn Fn() -> String + Send + Sync> =
                      Arc::new(String::new);
                  let [mutation_registry, query_registry] = meter_contract_registries(
                      DEPRECATED_CONTRACTS,
                      [
                          composition.mutation_registry(),
                          composition.query_registry(),
                      ],
                      [&mutation_definitions, &query_definitions],
                      |renderer| contract_usage_metrics_text = renderer,
                  )
                  .map_err(|error| ApplicationRuntimeError::Assembly(error.to_string()))?;
          ''',
          )
          PY
      - name: Format and test telemetry
        run: |
          cargo fmt --all
          cargo test --locked -p crm-capability-adapters contract_usage_telemetry
          cargo check --locked -p crm-application-runtime --all-targets
      - name: Run full workspace Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Enforce accepted complexity ceilings
        run: |
          mkdir -p artifacts
          python scripts/analyze_workspace.py \
            --json-output artifacts/workspace-complexity-baseline.json \
            --markdown-output artifacts/workspace-complexity-baseline.md
          python scripts/analyze_step13_complexity.py \
            --json-output artifacts/step13-complexity-baseline.json \
            --markdown-output artifacts/step13-complexity-baseline.md
          python scripts/check_step13_exit_evidence.py \
            --check \
            --json-output artifacts/step13-exit-evidence.json \
            --markdown-output artifacts/step13-exit-evidence.md
      - name: Publish bounded Clippy fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/step17-clippy-fix.yml
          git add \
            crates/crm-capability-adapters/src/contract_usage_telemetry.rs \
            crates/crm-application-runtime/src/runtime.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Step 17: simplify telemetry factory signature"
          git push origin HEAD:step17-contract-usage-telemetry
