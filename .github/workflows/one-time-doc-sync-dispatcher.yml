name: One-Time Documentation Sync Dispatcher

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-doc-sync-dispatcher.yml"
      - ".github/workflows/one-time-customer-accounts-post-merge-doc-sync.yml"

permissions:
  contents: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: docs/customer-accounts-privacy-post-merge-sync
          fetch-depth: 0
      - name: Execute synchronization payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-time-customer-accounts-post-merge-doc-sync.yml')
          lines = path.read_text().splitlines()
          marker = '      - name: Synchronize accepted Customer Accounts state'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          payload = []
          for line in lines[run_index + 1:]:
              if line and not line.startswith('          '):
                  break
              payload.append(line[10:] if line.startswith('          ') else '')
          script = Path('/tmp/customer-accounts-doc-sync.sh')
          script.write_text('\n'.join(payload) + '\n')
          PY
          bash /tmp/customer-accounts-doc-sync.sh
      - name: Remove temporary workflows and publish synchronization
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-customer-accounts-post-merge-doc-sync.yml
          rm .github/workflows/one-time-doc-sync-dispatcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/one-time-customer-accounts-post-merge-doc-sync.yml .github/workflows/one-time-doc-sync-dispatcher.yml
          git diff --cached --check
          git commit -m "Synchronize Customer Accounts privacy acceptance"
          git push origin HEAD:docs/customer-accounts-privacy-post-merge-sync
