name: Temporary Active Packet Guard Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - ".github/workflows/update-active-packet-guard.yml"
      - "scripts/update_active_packet_consistency_guard.py"
      - "repository-packet.json"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update exact active packet consistency guard
        run: python scripts/update_active_packet_consistency_guard.py
      - name: Commit guard update
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_architecture_documentation_consistency.py
          git commit -m "Synchronize active packet documentation guard"
          git push origin "HEAD:${HEAD_BRANCH}"
