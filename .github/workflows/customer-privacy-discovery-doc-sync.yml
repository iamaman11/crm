name: Customer Privacy Discovery Documentation Sync

on:
  push:
    branches:
      - feature/customer-privacy-production-discovery-snapshot
    paths:
      - ".github/workflows/customer-privacy-discovery-doc-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/customer-privacy-production-discovery-snapshot
          fetch-depth: 0
      - name: Synchronize exact status text
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new))

          replace(
              "docs/PROJECT_STATUS.md",
              "Latest production-runtime-affecting architecture baseline: `aec7130bd48302d20bf821a617c339b2a9d755cf`. The Stage B no-growth closure and the discovery/snapshot freeze are non-runtime architecture work and do not add production routes, workers or dependency resolution changes.",
              "Latest accepted package baseline: PR #205 / merge `f0f46238cf103f6e36487f599181e83849342021`. The current bounded packet implements internal production discovery and immutable PostgreSQL snapshot persistence inside that accepted package boundary without adding public routes, workers or packages."
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "All nine contributions remain contract-only/non-runtime. They add no Customer Privacy worker, public ingress, production discovery, planning or owner action execution.",
              "All nine owner contribution coordinates remain non-public owner-owned reads. Production discovery now invokes their accepted executors through the Customer Privacy internal application/production boundary; it adds no public ingress, Customer Privacy worker, planning or owner action execution."
          )
          replace(
              "docs/PROJECT_STATUS.md",
              '''## Frozen product packet — Scope discovery and immutable snapshot

State: **Contract and acceptance semantics frozen; production implementation not started**.

The frozen boundary defines:

- deterministic invocation and terminal completeness of all nine exact owner contributions;
- exact registry version/digest and owner-coordinate compatibility binding;
- fail-closed unavailable, disabled, stale or incompatible owners;
- one immutable lineage bound to tenant, privacy case, canonical Party, topology generation, registry version/digest, purpose and effective request time;
- purpose/effective-time-bound authoritative snapshot identity around the existing deterministic aggregation;
- bounded pagination, page/cursor receipts, deterministic owner/resource/data-class ordering and no payload disclosure;
- replay, retry, registry/topology drift and crash-window semantics;
- permission-aware snapshot reads and exact audit evidence;
- clean PostgreSQL, FORCE RLS, rollback/schema removal, reapply, repeated and real-process acceptance required before runtime discovery can be accepted.

The pure Customer Privacy domain now exposes strict non-runtime lineage, bound-owner contribution and immutable discovery-snapshot contracts with canonical rehydration. It does not register the discovery coordinate in production.

Planning, retention decisions, restrictions, legal holds and owner action execution remain prohibited until discovery and immutable snapshot runtime acceptance is complete.

## Next bounded product packet — Stage C Customer Privacy golden-package pilot

State: **Ready after acceptance of the freeze packet; behavior-neutral only**.

The pilot must establish the accepted Customer Privacy application/PostgreSQL/production ownership boundary without adding discovery behavior:

```text
modules/crm-customer-privacy/
crates/crm-customer-privacy-application/
crates/crm-customer-privacy-postgres/
crates/crm-customer-privacy-production/
```

It must preserve every existing coordinate, route, activation, authorization, RLS, audit, idempotency and process behavior; add no generic-runtime business switch; and report package, dependency, fan-out, public-surface and build/test effects. Runtime discovery starts only after this separate behavior-neutral pilot is accepted.
''',
              '''## Active product packet — Production scope discovery and immutable snapshot

State: **Implemented in PR #206; exact-head gate review pending until every applicable permanent workflow passes on one unchanged source SHA**.

The implementation preserves the PR #204 freeze and records later evidence separately in `CUSTOMER_PRIVACY_DISCOVERY_SNAPSHOT_IMPLEMENTATION.md` and `contracts/customer-privacy-discovery-snapshot-implementation.json`.

It provides exact-nine activation-gated discovery, immutable lineage, bounded owner pagination, durable page receipts and contiguous checkpoints, deterministic safe-resource aggregation, strict snapshot identity/rehydration, replay and crash-window recovery, permission-aware internal reads, safe audit evidence and FORCE-RLS PostgreSQL persistence. Public routes remain unchanged, Customer Privacy workers remain zero, mutations remain four, queries remain two and workspace packages remain 113.

Planning, retention decisions, restrictions, legal holds and owner action execution remain prohibited and unimplemented.

## Next bounded product packet — Deterministic planning and permission-aware plan/outcome reads

State: **Ready only after PR #206 exact-head acceptance and merge**.

The next packet may consume the immutable discovery snapshot but must not silently rediscover, rebase lineage, weaken authorization or begin restrictions, holds, retention decisions or owner execution.
'''
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "Issue #194 is **Open**. Stage A is complete. The bounded **Stage B no-growth closure is complete**; broader issue #194 stages and later natural-boundary calibration remain open.",
              "Issue #194 is **Open**. Stage A, Stage B no-growth and the Stage C Customer Privacy golden-package pilot are complete; broader issue #194 stages and later natural-boundary calibration remain open."
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "- 110 effective workspace packages: 96 technical crates, 13 business modules and one deployable service;",
              "- 113 effective workspace packages after the accepted Stage C golden package: 99 technical crates, 13 business modules and one deployable service;"
          )
          replace(
              "docs/PROJECT_STATUS.md",
              '''1. accept the discovery/snapshot contract and acceptance freeze on one unchanged exact head;
2. run the Stage C behavior-neutral Customer Privacy golden-package pilot;
3. implement discovery/snapshot inside the accepted application/PostgreSQL/production packages;
4. after discovery acceptance, continue deterministic planning and the remaining privacy lifecycle sequence;
5. apply residual architecture calibration only at natural packet boundaries unless it blocks correctness.''',
              '''1. preserve the accepted discovery/snapshot freeze and Stage C golden package;
2. accept PR #206 production discovery/snapshot evidence on one unchanged exact head;
3. continue with deterministic planning and permission-aware plan/outcome reads;
4. continue restrictions, holds/retention, execution and convergence only through later bounded packets;
5. apply residual architecture calibration only at natural packet boundaries unless it blocks correctness.'''
          )

          replace(
              "docs/IMPLEMENTATION_ROADMAP.md",
              "| B — dependency, crate and exception governance | **In progress — foundation accepted** | Reproducible baseline, new-crate/exception governance and two calibrated inheritance policies are accepted. Complete the no-growth boundary before Stage C. |",
              "| B — dependency, crate and exception governance | **Complete for no-growth prerequisite** | Repository-wide root-family no-growth is accepted; later bounded debt reduction remains natural-boundary work. |"
          )
          replace(
              "docs/IMPLEMENTATION_ROADMAP.md",
              "| C — golden owner package and persistence model | **Ready after Stage B no-growth closure and feature freeze** | Use Customer Privacy as the first real pilot; keep consolidation behavior-neutral. |",
              "| C — golden owner package and persistence model | **Complete** | PR #205 accepted the Customer Privacy domain/application/PostgreSQL/production package boundary. |"
          )
          replace(
              "docs/IMPLEMENTATION_ROADMAP.md",
              '''1. **Stage B no-growth closure:** freeze the remaining direct-consumer inventory for root dependency families and block new direct declarations outside an explicit owned exception. Preserve bounded role-based migrations for existing consumers.
2. **Customer Privacy discovery/snapshot freeze:** define exact contract, snapshot identity, registry/topology binding, ordering, digests, failure, replay, authorization and acceptance semantics without adding runtime behavior.
3. **Stage C Customer Privacy pilot:** replace the current capability-fragment packaging with accepted domain/application/PostgreSQL/production ownership only through a separate behavior-neutral PR. Consolidate only where dependency boundaries permit it.
4. **Discovery/snapshot implementation:** implement in the accepted target packages with zero command/query/worker/composition-fragment crates and no generic business switches.
5. **Subsequent privacy lifecycle packets:** planning, restrictions, legal hold/retention, execution, access/export, deletion/anonymization, tombstone and convergence.
6. **Residual architecture calibration:** exact supported Rust/toolchain policy, workspace lints, additional dependency cohorts, public-surface/fan-out budgets and later stages proceed at natural product boundaries unless they block correctness.''',
              '''1. **Accepted prerequisites:** Stage B no-growth, the discovery/snapshot freeze and Stage C Customer Privacy golden packages remain authoritative.
2. **Current gate review:** accept production discovery and immutable snapshot persistence on one unchanged exact head without public ingress, worker registration, package growth or dependency debt.
3. **Next privacy packet:** deterministic planning and permission-aware plan/outcome reads over the immutable snapshot.
4. **Later privacy lifecycle packets:** restrictions, legal hold/retention, execution, access/export, deletion/anonymization, tombstone and convergence.
5. **Residual architecture calibration:** exact supported Rust/toolchain policy, workspace lints, additional dependency cohorts, public-surface/fan-out budgets and later stages proceed at natural product boundaries unless they block correctness.'''
          )
          replace(
              "docs/IMPLEMENTATION_ROADMAP.md",
              "All nine privacy owner-scope implementations are accepted. The coordinates remain contract-only/non-runtime and add no Customer Privacy discovery, planning or execution runtime.",
              "All nine privacy owner-scope implementations are accepted. Their coordinates remain non-public owner-owned reads; PR #206 composes them into trusted internal production discovery while adding no planning or execution runtime."
          )
          replace(
              "docs/IMPLEMENTATION_ROADMAP.md",
              '''### 7.3 Next bounded packet — scope discovery and immutable snapshot freeze

State: **Ready; runtime implementation not started**.

Before runtime implementation:

- inspect existing schemas, contracts, case lifecycle, persistence and governance;
- freeze snapshot identity, registry binding, ordering, digests, replay and failure semantics;
- prohibit planning, owner mutation, provider calls, restrictions, legal-hold decisions, retention decisions and destructive actions;
- define permission-aware snapshot reads and exact audit evidence;
- define clean PostgreSQL, rollback/reapply, crash/retry and real-process acceptance;
- inventory the current Customer Privacy capability-specific crates and identify real dependency seams for the separate Stage C pilot.

Architecture guardrail:

- do not add one crate per command, query, worker or composition fragment;
- target Customer Privacy domain/application/PostgreSQL/production packaging;
- keep consolidation behavior-neutral and separate from feature implementation;
- do not modify generic router or worker algorithms merely to register the packet.
''',
              '''### 7.3 Current bounded packet — production scope discovery and immutable snapshot

State: **Gate review in PR #206; implementation complete, merge pending exact-head acceptance**.

The packet implements exact-nine trusted internal discovery, immutable lineage and page evidence, safe deterministic aggregation, strict immutable snapshot persistence/rehydration, replay/crash recovery, permission-aware reads and safe audit. It remains inside the accepted four Customer Privacy packages, keeps the workspace at 113 packages and adds no public route or Customer Privacy worker.

The historical freeze remains unchanged. Planning, restrictions, holds, retention decisions, owner action execution and Phase 8B remain unimplemented. After merge, the next bounded packet is deterministic planning and permission-aware plan/outcome reads.
'''
          )

          replace(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "All nine coordinates remain contract-only/non-runtime. They add no public ingress, Customer Privacy worker, production discovery, planning or owner action execution.",
              "All nine coordinates remain non-public owner-owned reads. PR #206 composes them into trusted internal production discovery without public ingress, Customer Privacy worker, planning or owner action execution."
          )
          replace(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "Stage B remains in progress until new direct declarations are blocked outside an explicit owned exception. Existing consumers migrate only through bounded role-based cohorts.",
              "Stage B no-growth is accepted through PR #203, and the Stage C Customer Privacy golden-package pilot is accepted through PR #205. Existing dependency debt may only shrink through bounded role-based cohorts."
          )
          replace(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "State: **Next cross-cutting implementation packet**.",
              "State: **Complete for the no-growth prerequisite through PR #203**."
          )
          replace(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "State: **Ready after documentation synchronization; production discovery is not implemented**.",
              "State: **Complete as the preserved historical freeze through PR #204**."
          )
          replace(
              "docs/PHASE8_DELIVERY_PLAN.md",
              '''### Packet C — Stage C Customer Privacy golden-package pilot

State: **Blocked on Packet A and the frozen Packet B boundary**.

Current repository fact:

- `modules/crm-customer-privacy` exists;
- `crm-customer-privacy-application`, `crm-customer-privacy-postgres` and `crm-customer-privacy-production` do not yet exist;
- current behavior is split across persistence, create/submit/subject/cancel, query and composition crates.

Target:

```text
modules/crm-customer-privacy/
crates/crm-customer-privacy-application/
crates/crm-customer-privacy-postgres/
crates/crm-customer-privacy-production/
```

The pilot is behavior-neutral. It preserves coordinates, routes, activation, authorization, RLS, audit, idempotency and process behavior; consolidates only across valid dependency seams; adds no discovery behavior; reports before/after package count, edges, fan-out, public surface and build/test effect; and exposes one Customer Privacy production contribution entry point without generic-runtime business switches.

If consolidation is required, perform consolidation only in a separate behavior-neutral PR.
''',
              '''### Packet C — Stage C Customer Privacy golden-package pilot

State: **Complete through PR #205**.

The accepted boundary is:

```text
modules/crm-customer-privacy/
crates/crm-customer-privacy-application/
crates/crm-customer-privacy-postgres/
crates/crm-customer-privacy-production/
```

The pilot preserved routes, workers and behavior while establishing the package boundary used by Packet D.
'''
          )
          replace(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "State: **Blocked on accepted Packet C packaging**.",
              "State: **Implemented in PR #206; exact-head gate review pending**."
          )
          replace(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "Implement the frozen Packet B semantics inside the accepted application/PostgreSQL/production packages.",
              "PR #206 implements the frozen Packet B semantics inside the accepted application/PostgreSQL/production packages and records evidence without rewriting the historical freeze."
          )

          Path(".github/workflows/customer-privacy-discovery-doc-sync.yml").unlink()
      - name: Commit synchronized documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Synchronize Customer Privacy discovery status"
          git push origin HEAD:feature/customer-privacy-production-discovery-snapshot
