name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: rustfmt, clippy
      - name: Resolve Rust cache identity
        id: rust-cache-identity
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee rust-toolchain-identity.txt
          echo "toolchain=$(sha256sum rust-toolchain-identity.txt | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
      - name: Restore trusted Rust CI cache
        id: rust-cache-restore
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-quality-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-identity.outputs.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-quality-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-identity.outputs.toolchain }}-
      - name: Record Rust cache restore telemetry
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/rust-cache-telemetry.json <<EOF
          {
            "schema_version": "crm.rust-cache-telemetry/v1",
            "event_name": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "candidate_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "toolchain_identity": "${{ steps.rust-cache-identity.outputs.toolchain }}",
            "exact_hit": "${{ steps.rust-cache-restore.outputs.cache-hit || 'false' }}",
            "primary_key": "${{ steps.rust-cache-restore.outputs.cache-primary-key }}",
            "matched_key": "${{ steps.rust-cache-restore.outputs.cache-matched-key || 'none' }}",
            "main_write_eligible": "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
          }
          EOF
          {
            echo "### Trusted Rust cache pilot"
            echo "- Exact hit: \`${{ steps.rust-cache-restore.outputs.cache-hit || 'false' }}\`"
            echo "- Primary key: \`${{ steps.rust-cache-restore.outputs.cache-primary-key }}\`"
            echo "- Matched key: \`${{ steps.rust-cache-restore.outputs.cache-matched-key || 'none' }}\`"
            echo "- Main write eligible: \`${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload Rust cache telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-cache-telemetry
          path: artifacts/rust-cache-telemetry.json
          if-no-files-found: error
          retention-days: 30
      - run: python scripts/check_architecture.py
      - name: Generate resolved Cargo lockfile
        run: cargo generate-lockfile
      - name: Upload resolved Cargo lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Verify committed Cargo lockfile is current
        run: |
          if [ -n "$(git status --porcelain -- Cargo.lock)" ]; then
            echo "Cargo.lock is missing or out of date. Download the cargo-lockfile artifact and commit it."
            git status --short -- Cargo.lock
            exit 1
          fi
      - name: Check Rust formatting
        id: rustfmt
        run: cargo fmt --all -- --check
      - name: Generate formatted source diagnostics
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: cargo fmt --all
      - name: Upload formatted source diagnostics
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustfmt-diagnostics
          path: |
            crates/*/src/
            crates/*/tests/
            modules/*/src/
            modules/*/tests/
            services/*/src/
          if-no-files-found: error
          retention-days: 7
      - name: Run Clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.txt
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clippy-diagnostics
          path: clippy.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run workspace tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 | tee tests.txt
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics
          path: tests.txt
          if-no-files-found: error
          retention-days: 7
      - name: Save trusted Rust CI cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success() && steps.rust-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache-restore.outputs.cache-primary-key }}
