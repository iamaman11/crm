name: Cloudflare CRM Spike CI
on:
  pull_request:
    paths:
      - "apps/cloudflare-crm/**"
      - ".github/workflows/cloudflare-crm-spike.yml"
  push:
    branches:
      - main
    paths:
      - "apps/cloudflare-crm/**"
      - ".github/workflows/cloudflare-crm-spike.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  cloudflare-crm-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install CRM dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/cloudflare-crm
      - name: Fast feature/schema contract doctor
        run: npm run doctor
        working-directory: apps/cloudflare-crm
      - name: Locate module and error code without network
        working-directory: apps/cloudflare-crm
        run: |
          npm run locate -- deals
          npm run locate -- INVALID_INPUT
          npm run locate -- customer360
      - name: Check native-only ownership and release diagnostic contracts
        run: npm test
        working-directory: apps/cloudflare-crm
      - name: Build React CRM
        run: npm run build
        working-directory: apps/cloudflare-crm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned existing Rust CI
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Verify all existing Rust business modules compile for WebAssembly
        run: |
          cargo check --locked --target wasm32-unknown-unknown \
            -p crm-sales -p crm-activities -p crm-sales-activities-link \
            -p crm-parties -p crm-customer-accounts -p crm-contact-points \
            -p crm-party-relationships -p crm-consents -p crm-identity-resolution \
            -p crm-customer-data-operations -p crm-data-quality \
            -p crm-customer-enrichment -p crm-customer-privacy
      - name: Execute the original Rust domain rules from WASM in Node
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          mkdir -p "$probe/src"
          cat > "$probe/Cargo.toml" <<EOF
          [package]
          name = "crm-wasm-probe"
          version = "0.1.0"
          edition = "2024"
          [lib]
          crate-type = ["cdylib"]
          [dependencies]
          crm-parties = { path = "$GITHUB_WORKSPACE/modules/crm-parties" }
          crm-sales = { path = "$GITHUB_WORKSPACE/modules/crm-sales" }
          crm-activities = { path = "$GITHUB_WORKSPACE/modules/crm-activities" }
          crm-sales-activities-link = { path = "$GITHUB_WORKSPACE/modules/crm-sales-activities-link" }
          crm-customer-accounts = { path = "$GITHUB_WORKSPACE/modules/crm-customer-accounts" }
          crm-contact-points = { path = "$GITHUB_WORKSPACE/modules/crm-contact-points" }
          crm-party-relationships = { path = "$GITHUB_WORKSPACE/modules/crm-party-relationships" }
          crm-consents = { path = "$GITHUB_WORKSPACE/modules/crm-consents" }
          crm-identity-resolution = { path = "$GITHUB_WORKSPACE/modules/crm-identity-resolution" }
          crm-customer-data-operations = { path = "$GITHUB_WORKSPACE/modules/crm-customer-data-operations" }
          crm-data-quality = { path = "$GITHUB_WORKSPACE/modules/crm-data-quality" }
          crm-customer-enrichment = { path = "$GITHUB_WORKSPACE/modules/crm-customer-enrichment" }
          crm-customer-privacy = { path = "$GITHUB_WORKSPACE/modules/crm-customer-privacy" }
          crm-module-sdk = { path = "$GITHUB_WORKSPACE/crates/crm-module-sdk" }
          crm-core-contracts = { path = "$GITHUB_WORKSPACE/crates/crm-core-contracts" }
          EOF
          cat > "$probe/src/lib.rs" <<'RUST'
          use crm_parties::{
              CreateParty, UpdateParty, Party, PartyId, PartyKind,
              encode_party_state, decode_party_state,
          };
          // This is a diagnostic ABI only: all domain rules are from existing crm-parties.
          #[unsafe(no_mangle)]
          pub extern "C" fn crm_party_domain_probe() -> i32 {
              let id = match PartyId::try_new("wasm-proof-01") {
                  Ok(v) => v,
                  Err(_) => return 1,
              };
              let mut party = match Party::create(CreateParty {
                  party_id: id, kind: PartyKind::Organization,
                  display_name: "  Example  Organization ".to_owned(),
                  occurred_at_unix_nanos: 10,
              }) {
                  Ok(v) => v,
                  Err(_) => return 2,
              };
              if party.display_name() != "Example Organization" || party.version() != 1 {
                  return 3;
              }
              if party.apply_update(UpdateParty {
                  expected_version: 1, display_name: "Example Corporation".to_owned(),
                  occurred_at_unix_nanos: 20,
              }).is_err() { return 4; }
              if party.version() != 2 { return 5; }
              if party.apply_update(UpdateParty {
                  expected_version: 1, display_name: "Should Fail".to_owned(),
                  occurred_at_unix_nanos: 30,
              }).err().map(|e| e.code) != Some("PARTIES_PARTY_VERSION_CONFLICT".to_string()) {
                  return 6;
              }
              let saved = match encode_party_state(&party) {
                  Ok(v) => v, Err(_) => return 7,
              };
              let loaded = match decode_party_state(&saved) {
                  Ok(v) => v, Err(_) => return 8,
              };
              if loaded != party { return 9; }
              let error = Party::create(CreateParty {
                  party_id: PartyId::try_new("wasm-proof-02").unwrap(),
                  kind: PartyKind::Person, display_name: " ".to_owned(),
                  occurred_at_unix_nanos: 21,
              }).err();
              if error.map(|e| e.code) != Some("PARTIES_DISPLAY_NAME_INVALID".to_string()) {
                  return 10;
              }
              0
          }
          // Calls authoritative original owners: no separate validation rules.
          #[unsafe(no_mangle)]
          pub extern "C" fn crm_owner_domain_probe() -> i32 {
              // crm.customer-accounts: a commercial account is NOT a Party.
              let account = match crm_customer_accounts::Account::create(
                  crm_customer_accounts::CreateAccount {
                      account_id: crm_customer_accounts::AccountId::try_new("wasm-account-01").unwrap(),
                      name: "  WASM   Account  ".into(),
                      party_associations: vec![crm_customer_accounts::AccountPartyAssociation::new(
                          crm_customer_accounts::PartyReference::try_new("wasm-party-01").unwrap(),
                          crm_customer_accounts::AccountPartyRole::Primary,
                      )],
                      occurred_at_unix_nanos: 100,
                  },
              ) { Ok(x) => x, Err(_) => return 11 };
              if account.version() != 1 || account.name() != "WASM Account" { return 12; }
              let bytes = match crm_customer_accounts::encode_account_state(&account) {
                  Ok(x) => x, Err(_) => return 13,
              };
              if crm_customer_accounts::decode_account_state(&bytes).ok() != Some(account.clone()) {
                  return 14;
              }
              if crm_customer_accounts::Account::create(crm_customer_accounts::CreateAccount {
                  account_id: crm_customer_accounts::AccountId::try_new("wasm-account-02").unwrap(),
                  name: " ".into(), party_associations: vec![], occurred_at_unix_nanos: 100,
              }).is_ok() { return 15; }

              // crm.contact-points: canonical Party endpoint, verified by owner.
              let mut contact = match crm_contact_points::ContactPoint::create(
                  crm_contact_points::CreateContactPoint {
                      contact_point_id: crm_contact_points::ContactPointId::try_new("wasm-contact-01").unwrap(),
                      party_ref: crm_contact_points::PartyReference::try_new("wasm-party-01").unwrap(),
                      kind: crm_contact_points::ContactPointKind::Email,
                      value: "proof@example.org".into(), preferred: true,
                      valid_from_unix_nanos: None, valid_until_unix_nanos: None,
                      occurred_at_unix_nanos: 100,
                  },
              ) { Ok(x) => x, Err(_) => return 21 };
              if contact.version() != 1 || contact.normalized_value().is_empty() { return 22; }
              if contact.verify(crm_contact_points::VerifyContactPoint {
                  expected_version: 1, evidence_ref: "wasm-proof".into(), occurred_at_unix_nanos: 101,
              }).is_err() { return 23; }
              if !contact.verification().is_verified() || contact.version() != 2 { return 24; }
              let bytes = match crm_contact_points::encode_contact_point_state(&contact) {
                  Ok(x) => x, Err(_) => return 25,
              };
              if crm_contact_points::decode_contact_point_state(&bytes).ok() != Some(contact.clone()) {
                  return 26;
              }
              if contact.verify(crm_contact_points::VerifyContactPoint {
                  expected_version: 1, evidence_ref: "stale".into(), occurred_at_unix_nanos: 102,
              }).is_ok() { return 27; }

              // crm.sales: authoritative deal stage and persisted-state invariants.
              let deal = match crm_sales::Deal::create(crm_sales::CreateDeal {
                  deal_id: crm_module_sdk::RecordId::try_new("wasm-deal-01").unwrap(),
                  name: "WASM Deal".into(),
                  owner: crm_sales::DealOwner::Team(crm_sales::TeamId::try_new("sales-team-01").unwrap()),
                  account: None, primary_contact: None,
                  stage: crm_sales::DealStage::try_new(
                      crm_sales::PipelineId::try_new("main-pipeline").unwrap(),
                      crm_sales::StageId::try_new("new").unwrap(), 1,
                  ).unwrap(),
                  amount: None, expected_close_date: None,
                  probability: crm_core_contracts::BasisPoints::try_new(1000).unwrap(),
                  occurred_at_unix_nanos: 100,
              }) { Ok(x) => x, Err(_) => return 31 };
              if deal.version() != 1 || deal.name() != "WASM Deal" { return 32; }
              let bytes = match crm_sales::encode_deal_state(&deal) {
                  Ok(x) => x, Err(_) => return 33,
              };
              if crm_sales::decode_deal_state(&bytes).ok() != Some(deal.clone()) { return 34; }
              if crm_sales::DealStage::try_new(
                  crm_sales::PipelineId::try_new("main-pipeline").unwrap(),
                  crm_sales::StageId::try_new("invalid").unwrap(), 0,
              ).is_ok() { return 35; }

              // crm.activities: original task completion and optimistic version.
              let mut task = match crm_activities::Task::create(crm_activities::CreateTask {
                  task_id: crm_module_sdk::RecordId::try_new("wasm-task-01").unwrap(),
                  subject: "WASM task".into(), description: None,
                  owner: crm_activities::TaskOwner::Team(crm_activities::TeamId::try_new("team-01").unwrap()),
                  related_resources: vec![], priority: crm_activities::TaskPriority::Normal,
                  due_at_unix_nanos: None, reminder_at_unix_nanos: None,
                  occurred_at_unix_nanos: 100,
              }) { Ok(x) => x, Err(_) => return 41 };
              if task.version() != 1 { return 42; }
              if task.complete(crm_activities::CompleteTask {
                  expected_version: 1, occurred_at_unix_nanos: 101,
              }).is_err() { return 43; }
              if task.version() != 2 || task.status() != crm_activities::TaskStatus::Completed {
                  return 44;
              }
              let bytes = match crm_activities::encode_task_state(&task) {
                  Ok(x) => x, Err(_) => return 45,
              };
              if crm_activities::decode_task_state(&bytes).ok() != Some(task.clone()) { return 46; }
              if task.complete(crm_activities::CompleteTask {
                  expected_version: 1, occurred_at_unix_nanos: 102,
              }).is_ok() { return 47; }
              0
          }

          // One WASM executable invokes symbols from all 13 ORIGINAL domain/link crates.
          // This is a *composition/link* gate, not a claim of D1 readiness or full
          // Cloudflare execution of twelve not-yet-connected owner workflows.
          #[unsafe(no_mangle)]
          pub extern "C" fn crm_13_module_link_probe() -> i32 {
              let modules = [
                  crm_sales::CRATE_NAME,
                  crm_activities::CRATE_NAME,
                  crm_sales_activities_link::MODULE_ID,
                  crm_parties::MODULE_ID,
                  crm_customer_accounts::MODULE_ID,
                  crm_contact_points::MODULE_ID,
                  crm_party_relationships::MODULE_ID,
                  crm_consents::MODULE_ID,
                  crm_identity_resolution::MODULE_ID,
                  crm_data_quality::MODULE_ID,
                  crm_customer_enrichment::MODULE_ID,
                  crm_customer_privacy::MODULE_ID,
              ];
              let expected = [
                  "crm-sales", "crm-activities", "crm.sales-activities-link",
                  "crm.parties", "crm.customer-accounts", "crm.contact-points",
                  "crm.party-relationships", "crm.consents", "crm.identity-resolution",
                  "crm.data-quality", "crm.customer-enrichment", "crm.customer-privacy",
              ];
              if modules != expected { return 1; }
              let import_id = match crm_customer_data_operations::ImportJobId::try_new("wasm-import-01") {
                  Ok(v) => v, Err(_) => return 2,
              };
              if import_id.as_str() != "wasm-import-01" { return 3; }
              0
          }
          RUST
          cargo build --manifest-path "$probe/Cargo.toml" --target wasm32-unknown-unknown
          node - "$probe/target/wasm32-unknown-unknown/debug/crm_wasm_probe.wasm" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          (async () => {
            const { instance } = await WebAssembly.instantiate(fs.readFileSync(file), {});
            if (typeof instance.exports.crm_party_domain_probe !== 'function') {
              throw new Error('Rust Party WASM export missing');
            }
            const result = instance.exports.crm_party_domain_probe();
            if (result !== 0) throw new Error('Existing Rust domain WASM rejected, code=' + result);
            if (typeof instance.exports.crm_13_module_link_probe !== 'function') {
              throw new Error('Thirteen original modules did not export the same WASM probe');
            }
            const moduleLink = instance.exports.crm_13_module_link_probe();
            if (moduleLink !== 0) throw new Error('Thirteen modules link probe rejected, code=' + moduleLink);
            if (typeof instance.exports.crm_owner_domain_probe !== 'function') {
              throw new Error('Original owner domain behavior ABI missing');
            }
            const ownerResult = instance.exports.crm_owner_domain_probe();
            if (ownerResult !== 0) throw new Error('Original owner domain invariants failed, code=' + ownerResult);
            console.log(JSON.stringify({event:'crm.rust-domain-wasm', result:'PASS',
              crate:'crm-parties', target:'wasm32-unknown-unknown',
              runtime:'node WebAssembly', tests:['normalize','version',
                'stale update denied','serialize/rehydrate','invalid name denied'],
              module_link:{result:'PASS', original_crates:13, wasm_binary:'one',
                domain_executed:['crm-parties','crm-customer-accounts','crm-contact-points',
                  'crm-sales','crm-activities','crm-customer-data-operations identifier'],
                remaining_domain_behaviors:'NOT_TESTED'},
              owners:{result:'PASS',modules:['crm-customer-accounts','crm-contact-points',
                'crm-sales','crm-activities'],operations:['create','roundtrip','negative','version'],
                live_d1:'NOT_TESTED'},
              cloudflare_worker_invocation:'NOT_TESTED', d1_adapter:'NOT_TESTED'}));
          })().catch(error => {console.error(error);process.exitCode=1;});
          NODE
      - name: Build Rust workers-rs Party Worker for isolated workerd CI
        working-directory: apps/cloudflare-crm/rust-party
        run: |
          cargo install --locked worker-build --version 0.8.7
          worker-build --release --features ci-local
      - name: Record native Party dependency lock for exact reproducibility
        working-directory: apps/cloudflare-crm/rust-party
        shell: bash
        run: |
          echo 'NATIVE_PARTY_CARGO_LOCK_BEGIN'
          base64 -w 80 Cargo.lock
          echo
          echo 'NATIVE_PARTY_CARGO_LOCK_END'
      - name: Test original Rust Party through workerd and isolated native D1
        working-directory: apps/cloudflare-crm
        run: node rust-party/test/local.mjs
      - name: Compile one native Rust Worker Access JWT candidate (not deployed)
        working-directory: apps/cloudflare-crm/rust-party
        run: worker-build --release --features native
      - name: Dry-run exact native entrypoint upload with original CRM Wrangler configuration
        working-directory: apps/cloudflare-crm
        shell: bash
        env:
          CRM_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Explicit root config is essential: without it Wrangler walks to
          # rust-party/wrangler.jsonc and selects the nonexistent test D1.
          npx wrangler versions upload rust-party/build/index.js \
            --config wrangler.jsonc --name crm-dev --var "GIT_SHA:$CRM_HEAD_SHA" \
            --dry-run --outdir /tmp/crm-native-party-version-proof 2>&1 | \
            tee /tmp/crm-native-party-wrangler-bindings.log
          grep -F 'env.DB (crm-dev)' /tmp/crm-native-party-wrangler-bindings.log
          grep -F 'env.ASSETS' /tmp/crm-native-party-wrangler-bindings.log
          if grep -F 'CRM_CI_LOCAL_ONLY' /tmp/crm-native-party-wrangler-bindings.log; then
            echo 'FAIL: CI-local auth flag must never be in Cloudflare native version' >&2
            exit 1
          fi
          test -d /tmp/crm-native-party-version-proof
          test -s rust-party/build/index_bg.wasm
          test -s rust-party/build/index.js
          grep -F '"main": "./rust-party/build/index.js"' wrangler.jsonc
          grep -F '"binding": "DB"' wrangler.jsonc
          grep -F '"binding": "ASSETS"' wrangler.jsonc
      - name: Keep the exact native Rust candidate for the existing main-only protected release
        run: |
          set -euo pipefail
          mkdir -p apps/cloudflare-crm/.release/native-build
          cp apps/cloudflare-crm/rust-party/build/index.js apps/cloudflare-crm/.release/native-build/index.js
          cp apps/cloudflare-crm/rust-party/build/index_bg.wasm apps/cloudflare-crm/.release/native-build/index_bg.wasm
          test -s apps/cloudflare-crm/.release/native-build/index_bg.wasm
      - name: Compile native Rust Access gate using isolated RSA test keys
        working-directory: apps/cloudflare-crm/rust-party
        run: worker-build --release --features native-ci
      - name: Install Chromium for physical React to native Rust Worker proof
        working-directory: apps/cloudflare-crm
        run: npx playwright install --with-deps chromium
      - name: Test native WebCrypto JWT and all React CRM screens under workerd
        working-directory: apps/cloudflare-crm
        env:
          CRM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node rust-party/test/native.mjs
      - name: Preserve native Rust browser proof and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-native-party-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/cloudflare-crm/e2e-evidence-native/
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare only the native Rust entrypoint for deployment
        working-directory: apps/cloudflare-crm/rust-party
        run: worker-build --release --features native
      - name: Inspect native-only deployment bundle without deploying
        working-directory: apps/cloudflare-crm
        run: |
          test -f rust-party/build/index.js
          npx wrangler deploy --dry-run --outdir /tmp/crm-native-workers-rs
      - name: Validate release and E2E scripts
        run: |
          node --check apps/cloudflare-crm/scripts/deploy.mjs
          node --check apps/cloudflare-crm/test/native-runtime.test.mjs
          node --check apps/cloudflare-crm/e2e/live.mjs
      - name: Check CRM target
        run: |
          grep -F '5bd5e1e1e813f061afc259e91334262d' apps/cloudflare-crm/wrangler.jsonc
          grep -F '35fc7ee9-9710-485f-8fb3-f5a398b229b4' apps/cloudflare-crm/wrangler.jsonc
          grep -F 'mod pilot;' apps/cloudflare-crm/rust-party/src/lib.rs
          grep -F 'mod access;' apps/cloudflare-crm/rust-party/src/lib.rs
          if grep -F '"main": "./worker/unified.mjs"' apps/cloudflare-crm/wrangler.jsonc; then
            echo 'FAIL: JS dispatcher must not be published' >&2
            exit 1
          fi
      - name: Seal compiled Rust and React outputs for this exact checkout
        shell: bash
        env:
          CRM_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd apps/cloudflare-crm
          test -s dist/index.html
          test -s rust-party/build/index.js
          test -s rust-party/build/index_bg.wasm
          mkdir -p .release
          printf '%s\n' "$CRM_BUILD_SHA" > .release/source-sha.txt
          test -s .release/native-build/index.js
          test -s .release/native-build/index_bg.wasm
          find dist rust-party/build .release/native-build -type f -print0 | LC_ALL=C sort -z |
            xargs -0 sha256sum > .release/compiled-sha256.txt
          sha256sum --check --strict .release/compiled-sha256.txt
          echo "CRM compiled bundle sealed for $CRM_BUILD_SHA"
      - name: Preserve exact compiled bundle for the protected deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-native-bundle-${{ github.sha }}
          path: |
            apps/cloudflare-crm/dist/
            apps/cloudflare-crm/rust-party/build/
            apps/cloudflare-crm/.release/source-sha.txt
            apps/cloudflare-crm/.release/compiled-sha256.txt
            apps/cloudflare-crm/.release/native-build/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  deploy-crm-dev:
    needs: cloudflare-crm-spike
    permissions:
      contents: read
      actions: read
    # Sole deployment owner; all releases and native acceptance are gated by main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: crm-dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install CRM dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/cloudflare-crm
      - name: Install Chromium for browser test
        run: npx playwright install --with-deps chromium
        working-directory: apps/cloudflare-crm
      - name: Restore CI-verified Rust WASM and React bundle without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "crm-native-bundle-$GITHUB_SHA" --dir apps/cloudflare-crm
          cd apps/cloudflare-crm
          test "$(cat .release/source-sha.txt)" = "$GITHUB_SHA"
          sha256sum --check --strict .release/compiled-sha256.txt
          test -s dist/index.html
          test -s rust-party/build/index.js
          test -s rust-party/build/index_bg.wasm
          echo "CRM exact-source release artifact verified for $GITHUB_SHA"
      - name: Deploy React, D1 and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs
      - name: Browser E2E on published CRM
        env:
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CRM_E2E_B_CLIENT_ID: ${{ secrets.CRM_E2E_B_CLIENT_ID }}
          CRM_E2E_B_CLIENT_SECRET: ${{ secrets.CRM_E2E_B_CLIENT_SECRET }}
        run: node apps/cloudflare-crm/e2e/live.mjs
      - name: Verify native Rust Party persisted data and D1 audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs verify-data
      - name: Restore previous Worker if release acceptance failed
        if: ${{ failure() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs rollback
      - name: Save release evidence and browser failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-dev-release-${{ github.sha }}
          path: |
            apps/cloudflare-crm/.release/*.json
            apps/cloudflare-crm/e2e-failure.png
            apps/cloudflare-crm/e2e-mobile.png
            apps/cloudflare-crm/e2e-evidence/*.png
            apps/cloudflare-crm/e2e-evidence/manifest.json
            apps/cloudflare-crm/.release/native-proof/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
