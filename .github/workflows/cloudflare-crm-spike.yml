name: Cloudflare CRM Spike CI
# Every source change may affect a shared Rust owner, Protobuf schema, generated
# TypeScript client or deployment policy. Avoid paths filters: they bypass CRM CI.
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  cloudflare-crm-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # immutable Protobuf baseline is a historical accepted commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # All CRM PR checks execute in THIS job. No other workflow targets PR to dev.
      # Pure source checks must fail before npm, Cargo builds or Chromium.
      - name: Fast repository CI topology, architecture, and source syntax
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_ci_event_policy.py
          python -m unittest tests.test_ci_event_policy
          python scripts/check_action_pinning.py
          node --check scripts/crm-architecture-ast.mjs
          node --check scripts/crm-rpc-descriptors.mjs
          node --check scripts/crm-rpc-descriptors.test.mjs
          node --check scripts/crm-connect-binary-fixture.mjs
          python -m py_compile scripts/crm-module-coverage.py scripts/crm-active-rust-surface.py
          node --check scripts/crm-architecture-ast.test.mjs
          node --check apps/cloudflare-crm/rust-party/test/native.mjs
          node --check apps/cloudflare-crm/e2e/live.mjs
      - name: Verify Python governance and affected-scope tests using declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
          python -m unittest tests.test_affected_scope tests.test_crm_module_coverage
          python scripts/crm-module-coverage.py --output /tmp/crm-module-coverage.json
          echo "CRM_MODULE_COVERAGE_REPORT=/tmp/crm-module-coverage.json" >> "$GITHUB_ENV"
          CRM_MODULE_COVERAGE_REPORT=/tmp/crm-module-coverage.json \
            node apps/cloudflare-crm/scripts/architecture-gate.mjs
      - name: Test active Rust owner surface policy and anti-bypass checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_crm_active_rust_surface
          python scripts/crm-active-rust-surface.py \
            --json-output /tmp/crm-active-rust-surface.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned existing Rust CI
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Verify Rust owner formatting before WASM compilation
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          # The accepted contract-only Worker is byte-for-byte frozen; do not
          # rewrite it merely to satisfy a newly introduced formatting gate.
          # A full Worker rustfmt check becomes mandatory with the cutover.
          if [ "$(node -p 'require("./apps/cloudflare-crm/architecture-policy.json").phase')" = "cutover" ]; then
            cargo fmt --manifest-path apps/cloudflare-crm/rust-party/Cargo.toml -- --check
          fi
      # Fail before the expensive WASM pipeline if the shared contract breaks.
      # The repo's existing frozen workspace provides Buf, Protobuf-ES, and TS.
      - name: Install pinned shared contract toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.13.1
          pnpm --version | grep -Fx '11.13.1'
          pnpm install --frozen-lockfile
      - name: Enforce canonical Protobuf compatibility and typed packages
        shell: bash
        run: |
          set -euo pipefail
          # This SHA is the physically accepted Cloudflare release, NOT dev HEAD.
          accepted=e1ac0cd341d6ffdea4986f37a96e11f50e4b5fff
          git cat-file -e "${accepted}^{commit}"
          pnpm exec buf build proto --output /tmp/crm-cloudflare-accepted-schema.binpb
          pnpm exec buf format -d --exit-code proto
          pnpm exec buf lint proto
          pnpm exec buf breaking proto --against ".git#ref=${accepted}"
          # checkout of dev need not contain a local main branch.
          # Fetch the exact main commit, then compare by immutable SHA.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          git cat-file -e "${main_sha}^{commit}"
          pnpm exec buf breaking proto --against ".git#ref=${main_sha}"
          pnpm exec buf generate --template buf.gen.web.yaml
          pnpm exec buf build proto --as-file-descriptor-set -o /tmp/crm-proto-descriptors.binpb
          node scripts/crm-rpc-descriptors.mjs /tmp/crm-proto-descriptors.binpb
          CRM_PROTO_DESCRIPTOR_FILE=/tmp/crm-proto-descriptors.binpb \
            node --test scripts/crm-rpc-descriptors.test.mjs
          node scripts/crm-architecture-ast.mjs
          node --test scripts/crm-architecture-ast.test.mjs
          test -s packages/client/gen/crm/sales/v1/deal_pb.ts
          pnpm --filter @ultimate-crm/client typecheck
          pnpm --filter @ultimate-crm/ui typecheck
          # A frozen checkout never changes the source lockfile.
          git diff --exit-code -- pnpm-lock.yaml
      - name: Enforce canonical architecture and freeze obsolete runtime
        shell: bash
        run: node apps/cloudflare-crm/scripts/architecture-gate.mjs
      - name: Typecheck entire Cloudflare CRM on full cutover
        shell: bash
        run: |
          if [ "$(node -p 'require("./apps/cloudflare-crm/architecture-policy.json").phase')" = "cutover" ]; then
            pnpm --filter cloudflare-crm typecheck
          fi
      - name: Install CRM dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/cloudflare-crm
      - name: Fast syntax check of native E2E before Rust/WASM build
        working-directory: apps/cloudflare-crm
        run: node --check rust-party/test/native.mjs
      - name: Fast feature/schema contract doctor
        run: npm run doctor
        working-directory: apps/cloudflare-crm
      - name: Locate module and error code without network
        working-directory: apps/cloudflare-crm
        run: |
          npm run locate -- deals
          npm run locate -- INVALID_INPUT
          npm run locate -- customer360
      - name: Check native-only ownership and release diagnostic contracts
        run: npm test
        working-directory: apps/cloudflare-crm
      - name: Build React CRM
        run: npm run build
        working-directory: apps/cloudflare-crm
      - name: Verify every activated Rust module compiles for WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          report = json.load(open(os.environ["CRM_MODULE_COVERAGE_REPORT"], encoding="utf-8"))
          names = sorted({m["crate_name"] for m in report["modules"] if m["linked"]})
          if not names:
              raise SystemExit("No linked Rust modules in compiled manifest report")
          command = ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"]
          for name in names:
              command.extend(["-p", name])
          subprocess.run(command, check=True)
          print(json.dumps({"event":"crm.linked-owner-wasm-check","result":"PASS",
                            "compiled_crates":names,"count":len(names)}))
          PY
      - name: Execute the original Rust domain rules from WASM in Node
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          mkdir -p "$probe/src"
          cat > "$probe/Cargo.toml" <<EOF
          [package]
          name = "crm-wasm-probe"
          version = "0.1.0"
          edition = "2024"
          [lib]
          crate-type = ["cdylib"]
          [dependencies]
          crm-module-sdk = { path = "$GITHUB_WORKSPACE/crates/crm-module-sdk" }
          crm-core-contracts = { path = "$GITHUB_WORKSPACE/crates/crm-core-contracts" }
          EOF
          cat > "$probe/src/lib.rs" <<'RUST'
          use crm_parties::{
              CreateParty, UpdateParty, Party, PartyId, PartyKind,
              encode_party_state, decode_party_state,
          };
          // This is a diagnostic ABI only: all domain rules are from existing crm-parties.
          #[unsafe(no_mangle)]
          pub extern "C" fn crm_party_domain_probe() -> i32 {
              let id = match PartyId::try_new("wasm-proof-01") {
                  Ok(v) => v,
                  Err(_) => return 1,
              };
              let mut party = match Party::create(CreateParty {
                  party_id: id, kind: PartyKind::Organization,
                  display_name: "  Example  Organization ".to_owned(),
                  occurred_at_unix_nanos: 10,
              }) {
                  Ok(v) => v,
                  Err(_) => return 2,
              };
              if party.display_name() != "Example Organization" || party.version() != 1 {
                  return 3;
              }
              if party.apply_update(UpdateParty {
                  expected_version: 1, display_name: "Example Corporation".to_owned(),
                  occurred_at_unix_nanos: 20,
              }).is_err() { return 4; }
              if party.version() != 2 { return 5; }
              if party.apply_update(UpdateParty {
                  expected_version: 1, display_name: "Should Fail".to_owned(),
                  occurred_at_unix_nanos: 30,
              }).err().map(|e| e.code) != Some("PARTIES_PARTY_VERSION_CONFLICT".to_string()) {
                  return 6;
              }
              let saved = match encode_party_state(&party) {
                  Ok(v) => v, Err(_) => return 7,
              };
              let loaded = match decode_party_state(&saved) {
                  Ok(v) => v, Err(_) => return 8,
              };
              if loaded != party { return 9; }
              let error = Party::create(CreateParty {
                  party_id: PartyId::try_new("wasm-proof-02").unwrap(),
                  kind: PartyKind::Person, display_name: " ".to_owned(),
                  occurred_at_unix_nanos: 21,
              }).err();
              if error.map(|e| e.code) != Some("PARTIES_DISPLAY_NAME_INVALID".to_string()) {
                  return 10;
              }
              0
          }
          // Calls authoritative original owners: no separate validation rules.
          // Include the SAME owner behavior code as the native Worker CI gate.
          // No competing test-only domain logic in this workflow.
          mod original_domain_probe {
              include!(concat!(env!("GITHUB_WORKSPACE"),
                  "/apps/cloudflare-crm/rust-party/src/original_domain_probe.rs"));
          }
          #[unsafe(no_mangle)]
          pub extern "C" fn crm_owner_domain_probe() -> i32 {
              original_domain_probe::check()
          }

          RUST
          # Reuse the same compiled canonical module report, not another
          # manually maintained list of owner crates in the WASM fixture.
          python - "$probe/Cargo.toml" <<'PY'
          import json
          import os
          import sys
          report = json.load(open(os.environ["CRM_MODULE_COVERAGE_REPORT"], encoding="utf-8"))
          with open(sys.argv[1], "a", encoding="utf-8") as cargo:
              for module in sorted(report["modules"], key=lambda m:m["crate_name"]):
                  if not module["linked"]:
                      continue
                  crate, relative = module["crate_name"], module["crate_path"]
                  cargo.write(f'{crate} = {{ path = "{os.environ["GITHUB_WORKSPACE"]}/{relative}" }}\n')
          PY
          cargo build --manifest-path "$probe/Cargo.toml" --target wasm32-unknown-unknown
          node - "$probe/target/wasm32-unknown-unknown/debug/crm_wasm_probe.wasm" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          (async () => {
            const { instance } = await WebAssembly.instantiate(fs.readFileSync(file), {});
            if (typeof instance.exports.crm_party_domain_probe !== 'function') {
              throw new Error('Rust Party WASM export missing');
            }
            const result = instance.exports.crm_party_domain_probe();
            if (result !== 0) throw new Error('Existing Rust domain WASM rejected, code=' + result);
            if (typeof instance.exports.crm_owner_domain_probe !== 'function') {
              throw new Error('Original owner domain behavior ABI missing');
            }
            const ownerResult = instance.exports.crm_owner_domain_probe();
            if (ownerResult !== 0) throw new Error('Original owner domain invariants failed, code=' + ownerResult);
            console.log(JSON.stringify({event:'crm.rust-domain-wasm', result:'PASS',
              crate:'crm-parties', target:'wasm32-unknown-unknown',
              runtime:'node WebAssembly', tests:['normalize','version',
                'stale update denied','serialize/rehydrate','invalid name denied'],
              module_link:{result:'CHECKED_IN_EARLIER_STAGE',
                evidence:'generated manifest activation + cargo check for every linked crate',
                domain_behaviors:'PARTIAL_ORIGINAL_OWNER_FIXTURE'},
              owners:{result:'PASS',modules:['crm-customer-accounts','crm-contact-points',
                'crm-sales','crm-activities'],operations:['create','roundtrip','negative','version'],
                live_d1:'NOT_TESTED'},
              cloudflare_worker_invocation:'NOT_TESTED', d1_adapter:'NOT_TESTED'}));
          })().catch(error => {console.error(error);process.exitCode=1;});
          NODE
      # Cache only the pinned installer binaries. No target/ or generated build
      # output crosses source revisions; main always builds its exact SHA.
      - name: Cache pinned native Rust tool CLIs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-crm-rust1971-wasm-bindgen-0.2.130-worker-build-0.8.7-v1
      - name: Install exact native wasm-bindgen CLI from Cargo registry
        # worker-build 0.8.7 officially supports WASM_BINDGEN_BIN. Fetching the
        # pinned CLI from crates.io avoids unstable GitHub Releases binary URLs.
        run: |
          if ! command -v wasm-bindgen >/dev/null ||
             [ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.130" ]; then
            cargo install --locked wasm-bindgen-cli --version 0.2.130
          fi
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.130"
          echo "WASM_BINDGEN_BIN=$(command -v wasm-bindgen)" >> "$GITHUB_ENV"
      - name: Install pinned Binaryen optimizer through npm
        # worker-build 0.8.7 supports WASM_OPT_BIN; use the SAME upstream
        # Binaryen version 132, without relying on GitHub Releases downloads.
        run: |
          npm install --prefix "$RUNNER_TEMP/crm-binaryen" --no-save --no-audit --no-fund binaryen@132.0.0
          WASM_OPT="$RUNNER_TEMP/crm-binaryen/node_modules/binaryen/bin/wasm-opt"
          test -x "$WASM_OPT"
          "$WASM_OPT" --version | grep '132'
          echo "WASM_OPT_BIN=$WASM_OPT" >> "$GITHUB_ENV"
      - name: Install pinned workers-rs build CLI
        run: |
          if ! command -v worker-build >/dev/null ||
             ! worker-build --version 2>&1 | grep -Fq '0.8.7'; then
            cargo install --locked worker-build --version 0.8.7
          fi
          worker-build --version
      - name: Build isolated native D1 test Worker
        working-directory: apps/cloudflare-crm/rust-party
        run: worker-build --release --features ci-local
      - name: Test original Rust Party through workerd and isolated native D1
        working-directory: apps/cloudflare-crm
        run: |
          if [ "$(node -p 'require("./architecture-policy.json").phase')" = "contract-only" ]; then
            node rust-party/test/contract-only-local.mjs
          else
            node rust-party/test/local.mjs
          fi
      # Only one production-feature WASM build on main; this same binary is sealed
      # and published. PR also runs alternative test features for coverage.
      - name: Build exact native Rust Worker for review or release
        working-directory: apps/cloudflare-crm/rust-party
        run: worker-build --release --features native
      - name: Enforce committed native Worker dependency lock
        run: git diff --exit-code -- apps/cloudflare-crm/rust-party/Cargo.lock
      - name: Dry-run exact native entrypoint upload with original CRM Wrangler configuration
        working-directory: apps/cloudflare-crm
        shell: bash
        env:
          CRM_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Explicit root config is essential: without it Wrangler walks to
          # rust-party/wrangler.jsonc and selects the nonexistent test D1.
          npx wrangler versions upload rust-party/build/index.js \
            --config wrangler.jsonc --name crm-dev --var "GIT_SHA:$CRM_HEAD_SHA" \
            --dry-run --outdir /tmp/crm-native-party-version-proof 2>&1 | \
            tee /tmp/crm-native-party-wrangler-bindings.log
          grep -F 'env.DB (crm-dev)' /tmp/crm-native-party-wrangler-bindings.log
          grep -F 'env.ASSETS' /tmp/crm-native-party-wrangler-bindings.log
          if grep -F 'CRM_CI_LOCAL_ONLY' /tmp/crm-native-party-wrangler-bindings.log; then
            echo 'FAIL: CI-local auth flag must never be in Cloudflare native version' >&2
            exit 1
          fi
          test -d /tmp/crm-native-party-version-proof
          test -s rust-party/build/index_bg.wasm
          test -s rust-party/build/index.js
          grep -F '"main": "./rust-party/build/index.js"' wrangler.jsonc
          grep -F '"binding": "DB"' wrangler.jsonc
          grep -F '"binding": "ASSETS"' wrangler.jsonc
      - name: Keep the exact native Rust candidate for the existing main-only protected release
        run: |
          set -euo pipefail
          mkdir -p apps/cloudflare-crm/.release/native-build
          cp apps/cloudflare-crm/rust-party/build/index.js apps/cloudflare-crm/.release/native-build/index.js
          cp apps/cloudflare-crm/rust-party/build/index_bg.wasm apps/cloudflare-crm/.release/native-build/index_bg.wasm
          test -s apps/cloudflare-crm/.release/native-build/index_bg.wasm
      - name: Compile native Rust Access gate using isolated RSA test keys
        working-directory: apps/cloudflare-crm/rust-party
        run: worker-build --release --features native-ci
      - name: Install Chromium for physical React to native Rust Worker proof
        working-directory: apps/cloudflare-crm
        run: npx playwright install --with-deps chromium
      - name: Test native WebCrypto JWT and all React CRM screens under workerd
        working-directory: apps/cloudflare-crm
        env:
          CRM_SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(node -p 'require("./architecture-policy.json").phase')" = "contract-only" ]; then
            node rust-party/test/contract-only-native.mjs
          else
            node rust-party/test/native.mjs
          fi
      - name: Preserve native Rust browser proof and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-native-party-proof-${{ github.sha }}
          path: apps/cloudflare-crm/e2e-evidence-native/
          if-no-files-found: warn
          retention-days: 7
      - name: Restore compiled production Worker after JWT test
        run: |
          cp apps/cloudflare-crm/.release/native-build/index.js apps/cloudflare-crm/rust-party/build/index.js
          cp apps/cloudflare-crm/.release/native-build/index_bg.wasm apps/cloudflare-crm/rust-party/build/index_bg.wasm
          cmp apps/cloudflare-crm/.release/native-build/index.js apps/cloudflare-crm/rust-party/build/index.js
          cmp apps/cloudflare-crm/.release/native-build/index_bg.wasm apps/cloudflare-crm/rust-party/build/index_bg.wasm
      - name: Validate release and E2E scripts
        run: |
          node --check apps/cloudflare-crm/scripts/deploy.mjs
          node --check apps/cloudflare-crm/test/native-runtime.test.mjs
          node --check apps/cloudflare-crm/e2e/live.mjs
          node --check apps/cloudflare-crm/e2e/contract-only.mjs
          node --check apps/cloudflare-crm/rust-party/test/contract-only-local.mjs
          node --check apps/cloudflare-crm/rust-party/test/contract-only-native.mjs
      - name: Check CRM target
        run: |
          grep -F '5bd5e1e1e813f061afc259e91334262d' apps/cloudflare-crm/wrangler.jsonc
          grep -F '35fc7ee9-9710-485f-8fb3-f5a398b229b4' apps/cloudflare-crm/wrangler.jsonc
          grep -F 'mod account_overview;' apps/cloudflare-crm/rust-party/src/lib.rs
          if grep -F 'mod pilot;' apps/cloudflare-crm/rust-party/src/lib.rs ||
             test -f apps/cloudflare-crm/rust-party/src/pilot.rs; then
            echo 'FAIL: duplicate pilot Rust domain cannot be published' >&2
            exit 1
          fi
          grep -F 'mod access;' apps/cloudflare-crm/rust-party/src/lib.rs
          if grep -F '"main": "./worker/unified.mjs"' apps/cloudflare-crm/wrangler.jsonc; then
            echo 'FAIL: JS dispatcher must not be published' >&2
            exit 1
          fi
      - name: Seal exactly tested development bundle
        shell: bash
        env:
          CRM_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd apps/cloudflare-crm
          test -s dist/index.html
          test -s rust-party/build/index.js
          test -s rust-party/build/index_bg.wasm
          mkdir -p .release
          printf '%s\n' "$CRM_BUILD_SHA" > .release/source-sha.txt
          test -s .release/native-build/index.js
          test -s .release/native-build/index_bg.wasm
          find dist rust-party/build .release/native-build -type f -print0 | LC_ALL=C sort -z |
            xargs -0 sha256sum > .release/compiled-sha256.txt
          sha256sum --check --strict .release/compiled-sha256.txt
          echo "CRM compiled bundle sealed for $CRM_BUILD_SHA"
      - name: Preserve exact compiled bundle for the protected deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-native-bundle-${{ github.sha }}
          path: |
            apps/cloudflare-crm/dist/
            apps/cloudflare-crm/rust-party/build/
            apps/cloudflare-crm/.release/source-sha.txt
            apps/cloudflare-crm/.release/compiled-sha256.txt
            apps/cloudflare-crm/.release/native-build/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  deploy-crm-dev:
    needs: cloudflare-crm-spike
    permissions:
      contents: read
      actions: read
    # Sole deployment owner: only permanent dev branch may publish crm-dev.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: crm-dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install CRM dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/cloudflare-crm
      - name: Install Chromium for browser test
        run: npx playwright install --with-deps chromium
        working-directory: apps/cloudflare-crm
      - name: Restore CI-verified Rust WASM and React bundle without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "crm-native-bundle-$GITHUB_SHA" --dir apps/cloudflare-crm
          cd apps/cloudflare-crm
          test "$(cat .release/source-sha.txt)" = "$GITHUB_SHA"
          sha256sum --check --strict .release/compiled-sha256.txt
          test -s dist/index.html
          test -s rust-party/build/index.js
          test -s rust-party/build/index_bg.wasm
          echo "CRM exact-source release artifact verified for $GITHUB_SHA"
      - name: Deploy React, D1 and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs
      - name: Isolate protected Access A/B tests in fresh tenants of the same D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_B_CLIENT_ID: ${{ secrets.CRM_E2E_B_CLIENT_ID }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs prepare-e2e
      - name: Browser E2E on published CRM
        env:
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CRM_E2E_B_CLIENT_ID: ${{ secrets.CRM_E2E_B_CLIENT_ID }}
          CRM_E2E_B_CLIENT_SECRET: ${{ secrets.CRM_E2E_B_CLIENT_SECRET }}
        run: |
          if [ "$(node -p 'require("./apps/cloudflare-crm/architecture-policy.json").phase')" = "contract-only" ]; then
            node apps/cloudflare-crm/e2e/contract-only.mjs
          else
            node apps/cloudflare-crm/e2e/live.mjs
          fi
      - name: Verify native Rust Party persisted data and D1 audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs verify-data
      - name: Restore previous Worker if release acceptance failed
        if: ${{ failure() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs rollback
      - name: Save release evidence and browser failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-dev-release-${{ github.sha }}
          path: |
            apps/cloudflare-crm/.release/*.json
            apps/cloudflare-crm/e2e-failure.png
            apps/cloudflare-crm/e2e-mobile.png
            apps/cloudflare-crm/e2e-evidence/*.png
            apps/cloudflare-crm/e2e-evidence/manifest.json
            apps/cloudflare-crm/.release/native-proof/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
