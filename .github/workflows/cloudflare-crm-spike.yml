name: Cloudflare CRM Spike CI
# One development pipeline. Markdown is documentation, never an application build input.
# Mixed documentation/code pushes still run the complete pipeline.
on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - '**/*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  cloudflare-crm-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # repository navigation uses Git; API acceptance does not use historical SHAs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.18'
      # Code changes execute this pipeline once on dev; PRs are optional discussion.
      # Pure source checks must fail before npm, Cargo builds or Chromium.
      - name: Fast repository CI topology, architecture, and source syntax
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_ci_event_policy.py
          python -m unittest tests.test_ci_event_policy
          python scripts/check_action_pinning.py
          node --check scripts/crm-architecture-ast.mjs
          node --check scripts/crm-rpc-descriptors.mjs
          node --check scripts/crm-rpc-descriptors.test.mjs
          node --check scripts/crm-connect-binary-fixture.mjs
          python -m py_compile scripts/crm-module-coverage.py
          node --check scripts/crm-architecture-ast.test.mjs
          node --check scripts/crm-core-v2.test.mjs
          node --check scripts/crm-cutover-contracts.test.mjs
          node --check scripts/crm-clean-schema.test.mjs
          node --check apps/cloudflare-crm/rust-party/test/native.mjs
          node --check apps/cloudflare-crm/rust-party/test/typed-browser.mjs
          node --check apps/cloudflare-crm/e2e/live.mjs
          node --check apps/cloudflare-crm/scripts/deploy.mjs
          node --check apps/cloudflare-crm/test/native-runtime.test.mjs
      - name: Verify Python governance and affected-scope tests using declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
          python -m pip check
          python -m unittest tests.test_affected_scope tests.test_crm_module_coverage tests.test_repository_navigation tests.test_architecture_documentation_consistency
          python scripts/generate_repository_navigation.py --check
          python scripts/repo.py packet-check --base origin/dev
          python scripts/crm-module-coverage.py --output /tmp/crm-module-coverage.json
          echo "CRM_MODULE_COVERAGE_REPORT=/tmp/crm-module-coverage.json" >> "$GITHUB_ENV"
          CRM_MODULE_COVERAGE_REPORT=/tmp/crm-module-coverage.json \
            node apps/cloudflare-crm/scripts/architecture-gate.mjs
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned existing Rust CI
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Verify Rust owner formatting before WASM compilation
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/cloudflare-crm/rust-party/Cargo.toml -- --check
      # Fail before the expensive WASM pipeline if the shared contract breaks.
      # The repo's existing frozen workspace provides Buf, Protobuf-ES, and TS.
      - name: Install pinned shared contract toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.13.1
          pnpm --version | grep -Fx '11.13.1'
          pnpm install --frozen-lockfile
      - name: Validate current Protobuf contracts
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking current CRM source $GITHUB_SHA; development API compatibility is not frozen" >> "$GITHUB_STEP_SUMMARY"
          pnpm exec buf build proto
          pnpm exec buf format -d --exit-code proto
          pnpm exec buf lint proto
      - name: Generate types and check descriptors, architecture and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec buf generate --template buf.gen.web.yaml
          pnpm exec buf build proto --as-file-descriptor-set -o /tmp/crm-proto-descriptors.binpb
          node scripts/crm-rpc-descriptors.mjs /tmp/crm-proto-descriptors.binpb
          CRM_PROTO_DESCRIPTOR_FILE=/tmp/crm-proto-descriptors.binpb \
            node --test scripts/crm-core-v2.test.mjs scripts/crm-cutover-contracts.test.mjs
          CRM_PROTO_DESCRIPTOR_FILE=/tmp/crm-proto-descriptors.binpb \
            node --test scripts/crm-rpc-descriptors.test.mjs
          node --test scripts/crm-clean-schema.test.mjs
          node scripts/crm-architecture-ast.mjs
          node --test scripts/crm-architecture-ast.test.mjs
          test -s packages/client/gen/crm/sales/v1/deal_pb.ts
          pnpm --filter @ultimate-crm/client typecheck
          pnpm exec vitest run packages/client/src/cloudflare-v2-contract.test.ts
          pnpm --filter @ultimate-crm/ui typecheck
          # A frozen checkout never changes the source lockfile.
          git diff --exit-code -- pnpm-lock.yaml
      - name: Typecheck Cloudflare CRM TypeScript sources
        run: pnpm --filter cloudflare-crm typecheck
      - name: Check native-only ownership and release diagnostic contracts
        run: pnpm test
        working-directory: apps/cloudflare-crm
      - name: Build React CRM
        run: pnpm run build
        working-directory: apps/cloudflare-crm
      # Cargo still validates freshness and runs for this exact source. Changing
      # toolchain/config/lock/codegen inputs starts a new cache family.
      - name: Restore Cargo compilation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/cloudflare-crm/rust-party/target
          key: ${{ runner.os }}-crm-rust1971-wasm-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/build.rs', '**/.cargo/config*', 'rust-toolchain*', 'proto/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-crm-rust1971-wasm-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/build.rs', '**/.cargo/config*', 'rust-toolchain*', 'proto/**') }}-
      - name: Compile the actual Worker owner graph for WebAssembly
        run: cargo check --locked --manifest-path apps/cloudflare-crm/rust-party/Cargo.toml --target wasm32-unknown-unknown --features native
      - name: Run Clippy on the actual Worker for WebAssembly
        run: cargo clippy --locked --manifest-path apps/cloudflare-crm/rust-party/Cargo.toml --target wasm32-unknown-unknown --features native -- -D clippy::all -D unfulfilled_lint_expectations
      - name: Test original Rust owners with the Worker dependency features
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path
          report = json.load(open(os.environ["CRM_MODULE_COVERAGE_REPORT"], encoding="utf-8"))
          worker = Path("apps/cloudflare-crm/rust-party")
          cargo = tomllib.loads((worker / "Cargo.toml").read_text(encoding="utf-8"))
          by_path = {(worker / dep["path"]).resolve(): dep
                     for dep in cargo["dependencies"].values()
                     if isinstance(dep, dict) and "path" in dep}
          linked = [module for module in report["modules"] if module["linked"]]
          if not linked:
              raise SystemExit("No linked original owners")
          for module in linked:
              dep = by_path[Path(module["crate_path"]).resolve()]
              command = ["cargo", "test", "--locked", "-p", module["crate_name"]]
              if not dep.get("default-features", True):
                  command.append("--no-default-features")
              if dep.get("features"):
                  command.extend(["--features", ",".join(dep["features"])])
              subprocess.run(command, check=True)
          PY
      # Installer binaries are cached separately from Cargo compilation outputs.
      - name: Cache pinned native Rust tool CLIs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-crm-rust1971-wasm-bindgen-0.2.130-worker-build-0.8.7-v1
      - name: Install exact native wasm-bindgen CLI from Cargo registry
        # worker-build 0.8.7 officially supports WASM_BINDGEN_BIN. Fetching the
        # pinned CLI from crates.io avoids unstable GitHub Releases binary URLs.
        run: |
          if ! command -v wasm-bindgen >/dev/null ||
             [ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.130" ]; then
            cargo install --locked wasm-bindgen-cli --version 0.2.130
          fi
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.130"
          echo "WASM_BINDGEN_BIN=$(command -v wasm-bindgen)" >> "$GITHUB_ENV"
      - name: Use Binaryen optimizer from the frozen workspace
        # worker-build 0.8.7 supports WASM_OPT_BIN; use the SAME upstream
        # Binaryen version 132, without relying on GitHub Releases downloads.
        run: |
          WASM_OPT="$GITHUB_WORKSPACE/node_modules/binaryen/bin/wasm-opt"
          test -x "$WASM_OPT"
          "$WASM_OPT" --version | grep '132'
          echo "WASM_OPT_BIN=$WASM_OPT" >> "$GITHUB_ENV"
      - name: Install pinned workers-rs build CLI
        run: |
          if ! command -v worker-build >/dev/null ||
             ! worker-build --version 2>&1 | grep -Fq '0.8.7'; then
            cargo install --locked worker-build --version 0.8.7
          fi
          worker-build --version
      # One production-feature WASM build; native-ci is a separate test-key build.
      # Deployment restores this production artifact without compiling it again.
      - name: Build exact native Rust Worker for review or release
        working-directory: apps/cloudflare-crm/rust-party
        run: worker-build --release --locked --features native
      - name: Enforce committed native Worker dependency lock
        run: git diff --exit-code -- apps/cloudflare-crm/rust-party/Cargo.lock
      - name: Dry-run exact native entrypoint upload with original CRM Wrangler configuration
        working-directory: apps/cloudflare-crm
        shell: bash
        env:
          CRM_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Explicit root config is essential: without it Wrangler walks to
          # rust-party/wrangler.jsonc and selects the nonexistent test D1.
          npx wrangler versions upload rust-party/build/index.js \
            --config wrangler.jsonc --name crm-dev --var "GIT_SHA:$CRM_HEAD_SHA" \
            --dry-run --outdir /tmp/crm-native-party-version-proof 2>&1 | \
            tee /tmp/crm-native-party-wrangler-bindings.log
          grep -F 'env.DB (crm-dev)' /tmp/crm-native-party-wrangler-bindings.log
          grep -F 'env.ASSETS' /tmp/crm-native-party-wrangler-bindings.log
          if grep -F 'CRM_CI_LOCAL_ONLY' /tmp/crm-native-party-wrangler-bindings.log; then
            echo 'FAIL: CI-local auth flag must never be in Cloudflare native version' >&2
            exit 1
          fi
          test -d /tmp/crm-native-party-version-proof
          test -s rust-party/build/index_bg.wasm
          test -s rust-party/build/index.js
          grep -F '"main": "./rust-party/build/index.js"' wrangler.jsonc
          grep -F '"binding": "DB"' wrangler.jsonc
          grep -F '"binding": "ASSETS"' wrangler.jsonc
      - name: Keep the complete production Worker for review and release
        run: |
          set -euo pipefail
          mkdir -p apps/cloudflare-crm/.release/native-build
          cp -a apps/cloudflare-crm/rust-party/build/. apps/cloudflare-crm/.release/native-build/
          test -s apps/cloudflare-crm/.release/native-build/index_bg.wasm
      - name: Compile native Rust Access gate using isolated RSA test keys
        working-directory: apps/cloudflare-crm/rust-party
        run: worker-build --release --locked --features native-ci
      - name: Install and launch Chromium after native compilation
        working-directory: apps/cloudflare-crm
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu already ships many browser libraries; do not
          # unconditionally call apt and depend on an external Ubuntu mirror.
          # Verify by launching the SAME pinned Playwright Chromium headlessly.
          for attempt in 1 2; do
            if npx playwright install chromium; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Pinned Playwright Chromium download failed"
              exit 1
            fi
            sleep 10
          done
          launch_browser() {
            node --input-type=module -e '
              import { chromium } from "playwright";
              const browser = await chromium.launch({headless: true});
              const page = await browser.newPage();
              await page.goto("data:text/html,<h1>CRM browser preflight</h1>");
              if (await page.locator("h1").innerText() !== "CRM browser preflight")
                throw new Error("Chromium rendered unexpected content");
              await browser.close();
            '
          }
          if launch_browser; then
            echo "Chromium physically launched with existing system libraries"
          else
            echo "::warning::Chromium needs OS libraries; installing declared Playwright dependencies"
            for attempt in 1 2; do
              if npx playwright install-deps chromium && launch_browser; then
                exit 0
              fi
              if [ "$attempt" -eq 2 ]; then
                echo "::error::Chromium system dependencies or physical launch failed"
                exit 1
              fi
              sleep 10
            done
          fi
      - name: Test signed RPC and generated-client React scenarios under workerd
        id: crm_native_workerd
        working-directory: apps/cloudflare-crm
        env:
          CRM_SOURCE_SHA: ${{ github.sha }}
          CRM_RPC_RUNTIME_PROOF: /tmp/crm-rpc-runtime.json
        run: |
          node rust-party/test/native.mjs
      - name: Verify compiled router, executed policy and RPC calls against Buf
        run: |
          set -euo pipefail
          python scripts/crm-module-coverage.py --output /tmp/crm-module-coverage.json --runtime-proof /tmp/crm-rpc-runtime.json
          node scripts/crm-rpc-descriptors.mjs /tmp/crm-proto-descriptors.binpb --require-runtime
      - name: Preserve executed RPC evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-rpc-runtime-${{ github.sha }}
          path: |
            /tmp/crm-rpc-runtime.json
            /tmp/crm-module-coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native Rust browser proof and screenshot
        # No misleading second FAIL when an earlier gate skipped workerd/browser.
        # A successful workerd test without mandatory evidence still fails the
        # explicit "Require actual browser acceptance" step below.
        if: ${{ always() && steps.crm_native_workerd.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-native-party-proof-${{ github.sha }}
          path: apps/cloudflare-crm/e2e-evidence-native/
          if-no-files-found: warn
          retention-days: 7
      - name: Restore compiled production Worker after JWT test
        run: |
          cp -a apps/cloudflare-crm/.release/native-build/. apps/cloudflare-crm/rust-party/build/
          diff --recursive --brief apps/cloudflare-crm/.release/native-build apps/cloudflare-crm/rust-party/build
      - name: Check CRM target
        run: |
          grep -F '5bd5e1e1e813f061afc259e91334262d' apps/cloudflare-crm/wrangler.jsonc
          grep -F '35fc7ee9-9710-485f-8fb3-f5a398b229b4' apps/cloudflare-crm/wrangler.jsonc
          grep -F 'mod account_overview;' apps/cloudflare-crm/rust-party/src/lib.rs
          if grep -F 'mod pilot;' apps/cloudflare-crm/rust-party/src/lib.rs ||
             test -f apps/cloudflare-crm/rust-party/src/pilot.rs; then
            echo 'FAIL: duplicate pilot Rust domain cannot be published' >&2
            exit 1
          fi
          grep -F 'mod access;' apps/cloudflare-crm/rust-party/src/lib.rs
          if grep -F '"main": "./worker/unified.mjs"' apps/cloudflare-crm/wrangler.jsonc; then
            echo 'FAIL: JS dispatcher must not be published' >&2
            exit 1
          fi
      - name: Require actual browser acceptance before sealing any artifact
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const evidence = JSON.parse(readFileSync("apps/cloudflare-crm/e2e-evidence-native/typed-browser.json", "utf8"));
            assert.equal(evidence.result, "PASS");
            assert.equal(evidence.source_sha, process.env.GITHUB_SHA);
            assert.deepEqual(evidence.features, ["native-ci"]);
          '
      - name: Seal exactly tested development bundle
        shell: bash
        env:
          CRM_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd apps/cloudflare-crm
          test -s dist/index.html
          test -s rust-party/build/index.js
          test -s rust-party/build/index_bg.wasm
          mkdir -p .release
          printf '%s\n' "$CRM_BUILD_SHA" > .release/source-sha.txt
          test -s .release/native-build/index.js
          test -s .release/native-build/index_bg.wasm
          node --input-type=module -e '
            import {execFileSync} from "node:child_process";
            import {writeFileSync} from "node:fs";
            const run=(command,args)=>execFileSync(command,args,{encoding:"utf8"}).trim();
            writeFileSync(".release/provenance.json",JSON.stringify({
              tested_sha:process.env.CRM_BUILD_SHA,
              tree:run("git",["rev-parse","HEAD^{tree}"]),
              production_features:["native"],runtime_test_features:["native-ci"],
              tools:{node:process.version,pnpm:run("pnpm",["--version"]),
                rust:run("rustc",["--version"]),python:run("python",["--version"]),
                buf:run("pnpm",["exec","buf","--version"])},
              independent_byte_reproducibility:"NOT_TESTED"
            },null,2)+"\n");
          '
          find dist rust-party/build .release/native-build -type f -print0 | LC_ALL=C sort -z |
            xargs -0 sha256sum > .release/compiled-sha256.txt
          sha256sum .release/provenance.json >> .release/compiled-sha256.txt
          sha256sum --check --strict .release/compiled-sha256.txt
          echo "CRM compiled bundle sealed for $CRM_BUILD_SHA"
      - name: Preserve exact compiled bundle for independent review and deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-native-bundle-${{ github.sha }}
          path: |
            apps/cloudflare-crm/dist/
            apps/cloudflare-crm/rust-party/build/
            apps/cloudflare-crm/.release/source-sha.txt
            apps/cloudflare-crm/.release/provenance.json
            apps/cloudflare-crm/.release/compiled-sha256.txt
            apps/cloudflare-crm/.release/native-build/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  deploy-crm-dev:
    needs: cloudflare-crm-spike
    permissions:
      contents: read
      actions: read
    # Sole deployment owner: only permanent dev branch may publish crm-dev.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: crm-dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Install pinned CRM dependencies
        run: |
          npm install --global pnpm@11.13.1
          pnpm install --frozen-lockfile
      - name: Install Chromium for browser test
        run: npx playwright install --with-deps chromium
        working-directory: apps/cloudflare-crm
      - name: Restore CI-verified Rust WASM and React bundle without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "crm-native-bundle-$GITHUB_SHA" --dir apps/cloudflare-crm
          cd apps/cloudflare-crm
          test "$(cat .release/source-sha.txt)" = "$GITHUB_SHA"
          sha256sum --check --strict .release/compiled-sha256.txt
          test -s dist/index.html
          test -s rust-party/build/index.js
          test -s rust-party/build/index_bg.wasm
          echo "CRM exact-source release artifact verified for $GITHUB_SHA"
      - name: Deploy React, D1 and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs
      - name: Isolate protected Access A/B tests in fresh tenants of the same D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CRM_E2E_B_CLIENT_ID: ${{ secrets.CRM_E2E_B_CLIENT_ID }}
          CRM_E2E_B_CLIENT_SECRET: ${{ secrets.CRM_E2E_B_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs prepare-e2e
      - name: Browser E2E on published CRM
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CRM_E2E_B_CLIENT_ID: ${{ secrets.CRM_E2E_B_CLIENT_ID }}
          CRM_E2E_B_CLIENT_SECRET: ${{ secrets.CRM_E2E_B_CLIENT_SECRET }}
        run: node apps/cloudflare-crm/e2e/live.mjs
      - name: Verify browser D1 audit and exact Cloudflare request traces
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs verify-data
      - name: Stop public entry if release acceptance failed
        if: ${{ failure() || cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
