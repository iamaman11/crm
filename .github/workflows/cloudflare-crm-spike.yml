name: Cloudflare CRM Spike CI
# One development pipeline. Markdown is documentation, never an application build input.
# Mixed documentation/code pushes still run the complete pipeline.
on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - '**/*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  cloudflare-crm-spike:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      bundle_name: ${{ steps.seal.outputs.bundle_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # JSON packet policy checks Git paths; no Markdown inputs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Code changes execute this pipeline once on dev; PRs are optional discussion.
      # Pure source checks must fail before npm, Cargo builds or Chromium.
      - name: Fast repository CI topology, architecture, and source syntax
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_ci_event_policy.py
          python -m unittest tests.test_ci_event_policy
          python scripts/check_action_pinning.py
          node --check apps/cloudflare-crm/rust-party/test/native.mjs
          node --check apps/cloudflare-crm/rust-party/test/production-access.mjs
          node --check apps/cloudflare-crm/rust-party/test/typed-browser.mjs
          node --check apps/cloudflare-crm/rust-party/test/ui-diagnostics.mjs
          node --check apps/cloudflare-crm/e2e/live.mjs
          node --check apps/cloudflare-crm/e2e/published-smoke.mjs
          node --check apps/cloudflare-crm/scripts/deploy.mjs
      - name: Verify Python governance and affected-scope tests using declared dependencies
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          TIMEFORMAT='crm.governance pip-install elapsed_seconds=%3R'
          # Install only active governance dependencies; keep the existing pinned
          # versions as constraints. Historical Python tools retain their dev requirements.
          time python -m pip install --disable-pip-version-check --constraint requirements-dev.txt jsonschema ruamel.yaml
          TIMEFORMAT='crm.governance pip-check elapsed_seconds=%3R'
          time python -m pip check
          # Machine-readable policies, executable schemas, contracts and owners.
          # Product documentation and status live in GitHub Issues, not .md.
          TIMEFORMAT='crm.governance unit-tests elapsed_seconds=%3R'
          time python -m unittest tests.test_affected_scope tests.test_crm_module_coverage tests.test_module_manifest_validation
          TIMEFORMAT='crm.governance packet-check elapsed_seconds=%3R'
          time python scripts/repo.py packet-check --base origin/dev --before "$PUSH_BEFORE" --json > /tmp/crm-legacy-packet.json
          cat /tmp/crm-legacy-packet.json
          TIMEFORMAT='crm.governance module-coverage elapsed_seconds=%3R'
          time python scripts/crm-module-coverage.py --output /tmp/crm-module-coverage.json
          echo "CRM_MODULE_COVERAGE_REPORT=/tmp/crm-module-coverage.json" >> "$GITHUB_ENV"
          CRM_MODULE_COVERAGE_REPORT=/tmp/crm-module-coverage.json \
            node apps/cloudflare-crm/scripts/architecture-gate.mjs
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned existing Rust CI
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Verify Rust owner formatting before WASM compilation
        run: |
          rustc --version | grep -F "rustc 1.100.0 "
          cargo --version | grep -F "cargo 1.100.0 "
          set -euo pipefail
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/cloudflare-crm/rust-party/Cargo.toml --all -- --check
      # The Mozilla compiler cache reuses Rust object results across source SHA changes.
      # Cargo still checks fingerprints and compiles changed sources and native feature graphs.
      - name: Install pinned sccache for Rust compilation
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Enable cross-commit compiler cache
        shell: bash
        run: |
          set -euo pipefail
          test -x "$SCCACHE_PATH"
          echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --version
      # Cargo unpacks registry/cache and git/db on demand. Keep compiled dependencies
      # and fingerprints, but avoid transferring a second copy of dependency sources.
      - name: Restore Cargo compilation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            apps/cloudflare-crm/rust-party/target
          # Cache entries are immutable. Refresh when manifests or codegen inputs
          # change; ordinary source edits still use Cargo fingerprints and sccache.
          key: ${{ runner.os }}-${{ runner.arch }}-crm-cargo-v4-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'apps/cloudflare-crm/rust-party/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'apps/cloudflare-crm/rust-party/Cargo.toml', 'apps/cloudflare-crm/rust-party/connect-contracts/Cargo.toml', 'crates/*/Cargo.toml', 'modules/*/Cargo.toml') }}-${{ hashFiles('proto/**/*.proto', 'apps/cloudflare-crm/active-proto-versions.json', 'apps/cloudflare-crm/rust-party/connect-contracts/build.rs', 'crates/crm-proto-contracts/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-crm-cargo-v4-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'apps/cloudflare-crm/rust-party/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'apps/cloudflare-crm/rust-party/Cargo.toml', 'apps/cloudflare-crm/rust-party/connect-contracts/Cargo.toml', 'crates/*/Cargo.toml', 'modules/*/Cargo.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-crm-cargo-v4-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'apps/cloudflare-crm/rust-party/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-crm-cargo-v4-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'apps/cloudflare-crm/rust-party/Cargo.lock') }}
            ${{ runner.os }}-${{ runner.arch }}-crm-cargo-v4-${{ hashFiles('rust-toolchain.toml') }}-
      # Measure before changing Cargo's native target/build cache layout.
      - name: Measure restored Cargo cache components
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "$HOME/.cargo/registry/index"
            "$HOME/.cargo/registry/cache"
            "$HOME/.cargo/git/db"
            target
            target/debug/deps
            target/debug/build
            target/debug/incremental
            target/wasm32-unknown-unknown/debug/deps
            target/wasm32-unknown-unknown/debug/build
            target/wasm32-unknown-unknown/release/deps
            target/wasm32-unknown-unknown/release/build
            apps/cloudflare-crm/rust-party/target
            apps/cloudflare-crm/rust-party/target/debug/deps
            apps/cloudflare-crm/rust-party/target/debug/build
            apps/cloudflare-crm/rust-party/target/wasm32-unknown-unknown/debug/deps
            apps/cloudflare-crm/rust-party/target/wasm32-unknown-unknown/release/deps
          )
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              bytes=$(du -sb "$path" | cut -f1)
              printf '{"event":"crm.cargo-cache-size","path":"%s","bytes":%s}\n' "$path" "$bytes"
            fi
          done
      # The scanner is pinned independently of application dependencies.
      # Cache only its executable, not a security result: every run still
      # evaluates both the root and Worker Cargo.lock files from this SHA.
      - name: Cache pinned cargo-deny CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/crm-cargo-deny/bin/cargo-deny
          key: ${{ runner.os }}-crm-rust1100-cargo-deny-0.22.0-v1
      # #471 S2: independent root dependency security gate. The root lock is
      # free of the upstream Cloudflare chrono advisory; do NOT silently ignore
      # or misreport the separately deferred Worker native/WASM finding.
      - name: Verify locked ROOT Rust dependencies, licenses and sources
        shell: bash
        run: |
          set -euo pipefail
          deny="$RUNNER_TEMP/crm-cargo-deny/bin/cargo-deny"
          if [ ! -x "$deny" ] || [ "$("$deny" --version 2>/dev/null)" != "cargo-deny 0.22.0" ]; then
            cargo install --locked --root "$RUNNER_TEMP/crm-cargo-deny" cargo-deny --version 0.22.0
          fi
          "$deny" --version | grep -Fx 'cargo-deny 0.22.0'
          "$deny" --locked --config deny.toml --target x86_64-unknown-linux-gnu --target x86_64-pc-windows-msvc check --show-stats
          (cd apps/cloudflare-crm/rust-party && "$deny" --locked --config "$GITHUB_WORKSPACE/deny.toml" --target wasm32-unknown-unknown check --show-stats)
          echo "CRM_ROOT_AND_WORKER_DEPENDENCY_SECURITY=PASS"
      # Fail before the expensive WASM pipeline if the shared contract breaks.
      # The repo's existing frozen workspace provides Buf, Protobuf-ES, and TS.
      - name: Install pinned shared contract toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.21.0
          pnpm --version | grep -Fx '12.21.0'
          pnpm install --frozen-lockfile
      # Temporary #486 migration parity. The old checks still run, and the
      # native report replaces their output only after exact equality.
      - name: Prove native manifest and packet governance parity
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm web:typecheck:tools
          python - <<'PY' > /tmp/crm-legacy-manifest-digests.json
          import json
          from pathlib import Path
          from scripts.validate_module_manifests import canonical_digest, strict_yaml_load
          paths = sorted(Path("modules").glob("*/module.yaml"))
          print(json.dumps({p.as_posix(): canonical_digest(strict_yaml_load(p.read_text(encoding="utf8"), str(p))) for p in paths}))
          PY
          node apps/cloudflare-crm/scripts/governance-parity.mts "$PUSH_BEFORE" /tmp/crm-legacy-packet.json /tmp/crm-module-coverage.json /tmp/crm-legacy-manifest-digests.json /tmp/crm-production-metadata.json
          echo "CRM_PRODUCTION_METADATA_FILE=/tmp/crm-production-metadata.json" >> "$GITHUB_ENV"
      # Report actual compiler-cache hits/misses, rather than assuming cache speedup.
      # The Mozilla action also emits end-of-job statistics for the complete job.
      # Clippy checks WASM compilation, so a separate cargo check repeats the work.
      # The parallel pnpm codegen/tsc + Rust compilation occasionally exhausts
      # GitHub runner process slots (EAGAIN/os error 11), wasting entire heavy
      # attempts. Run the cheaper contract/frontend gate first, then Clippy
      # within the SAME job; no duplicate CI, checker or compilation.
      - name: Validate typed schema and frontend, then WASM Clippy
        env:
          CRM_PROTO_DESCRIPTOR_FILE: /tmp/crm-proto-descriptors.binpb
        shell: bash
        run: |
          set -euo pipefail
          pnpm web:check
          git diff --exit-code -- pnpm-lock.yaml
          # TypeScript/Buf has finished: allow three compiler jobs on the four-vCPU runner.
          # Preserve the serial gate boundary that avoids codegen/Clippy EAGAIN.
          cargo clippy --jobs 3 --locked --workspace --manifest-path apps/cloudflare-crm/rust-party/Cargo.toml --target wasm32-unknown-unknown --features native -- -D clippy::all -D unfulfilled_lint_expectations
      # Installer binaries are cached separately from Cargo compilation outputs.
      - name: Cache pinned native Rust tool CLIs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-crm-rust1100-wasm-bindgen-0.2.130-worker-build-0.9.0-v1
      - name: Install exact native wasm-bindgen CLI from Cargo registry
        # worker-build 0.9.0 officially supports WASM_BINDGEN_BIN. Fetching the
        # pinned CLI from crates.io avoids unstable GitHub Releases binary URLs.
        run: |
          if ! command -v wasm-bindgen >/dev/null ||
             [ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.130" ]; then
            cargo install --locked wasm-bindgen-cli --version 0.2.130
          fi
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.130"
          echo "WASM_BINDGEN_BIN=$(command -v wasm-bindgen)" >> "$GITHUB_ENV"
      - name: Use Binaryen optimizer from the frozen workspace
        # worker-build 0.9.0 supports WASM_OPT_BIN; use the SAME upstream
        # Binaryen version 132, without relying on GitHub Releases downloads.
        run: |
          WASM_OPT="$GITHUB_WORKSPACE/node_modules/binaryen/bin/wasm-opt"
          test -x "$WASM_OPT"
          "$WASM_OPT" --version | grep '132'
          echo "WASM_OPT_BIN=$WASM_OPT" >> "$GITHUB_ENV"
      - name: Install pinned workers-rs build CLI
        run: |
          if ! command -v worker-build >/dev/null ||
             ! worker-build --version 2>&1 | grep -Fq '0.9.0'; then
            cargo install --locked worker-build --version 0.9.0
          fi
          worker-build --version
      - name: Build the test Worker, run Rust owner tests and prepare Chromium
        env:
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          RUST_LOG: worker_build::build=info
        working-directory: apps/cloudflare-crm
        shell: bash
        run: |
          # Cargo's own HTML report; no second compilation or custom profiler.
          mkdir -p "$RUNNER_TEMP/crm-cargo-timings"
          rm -f rust-party/target/cargo-timings/cargo-timing.html
          (cd rust-party && worker-build --dev --locked --features native-ci --timings &&
            cp target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/crm-cargo-timings/native-ci.html") &
          worker_pid=$!
          (cd "$GITHUB_WORKSPACE" && node apps/cloudflare-crm/scripts/test-rust-owners.mts) &
          owners_pid=$!
          status=0
          bash scripts/prepare-chromium.sh || status=$?
          wait "$owners_pid" || status=$?
          wait "$worker_pid" || status=$?
          exit "$status"
      - name: Build the release Worker and test signed workerd/D1/Chromium
        id: crm_native_workerd
        working-directory: apps/cloudflare-crm
        env:
          RUST_LOG: worker_build::build=info
          CRM_SOURCE_SHA: ${{ github.sha }}
          CRM_RPC_RUNTIME_PROOF: /tmp/crm-rpc-runtime.json
        shell: bash
        run: |
          # Workerd reads the completed native-ci build. The release has its own output directory.
          # Three Cargo jobs is the measured best on this 4-vCPU runner: four slowed the
          # release, test build, and concurrent workerd/Chromium compared with three.
          echo "CRM_RUNNER_LOGICAL_CPUS=$(nproc)"
          rm -f rust-party/target/cargo-timings/cargo-timing.html
          (cd rust-party && CARGO_BUILD_JOBS=3 worker-build --release --out-dir ../.release/native-build --locked --features native --timings &&
            cp target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/crm-cargo-timings/native-release.html") &
          release_pid=$!
          status=0
          node rust-party/test/native.mjs || status=$?
          wait "$release_pid" || status=$?
          exit "$status"
      - name: Preserve Cargo build timing reports
        if: ${{ always() && steps.crm_native_workerd.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-cargo-timings-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crm-cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
      - name: Verify compiled router, executed policy and RPC calls against Buf
        run: |
          set -euo pipefail
          export CRM_RPC_RUNTIME_PROOF=/tmp/crm-rpc-runtime.json
          node scripts/crm-rpc-descriptors.mjs /tmp/crm-proto-descriptors.binpb --require-runtime
      - name: Preserve executed RPC evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-rpc-runtime-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/crm-rpc-runtime.json
            /tmp/crm-module-coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native Rust browser proof and screenshot
        # No misleading second FAIL when an earlier gate skipped workerd/browser.
        # A successful workerd test without mandatory evidence still fails the
        # explicit "Require actual browser acceptance" step below.
        if: ${{ always() && steps.crm_native_workerd.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-native-party-proof-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: apps/cloudflare-crm/e2e-evidence-native/
          if-no-files-found: warn
          retention-days: 7
      - name: Select the production build for Wrangler verification
        working-directory: apps/cloudflare-crm/rust-party
        run: |
          mv build "$RUNNER_TEMP/crm-tested-native-ci"
          mv ../.release/native-build build
      # Prove the production binary can run with the external JWKS provider
      # intercepted only by Wrangler's Node test harness. Keep all current
      # native-ci business/compiled-policy proofs until parity is established.
      - name: Prove signed Access on the existing production WASM artifact
        working-directory: apps/cloudflare-crm
        env:
          CRM_SOURCE_SHA: ${{ github.sha }}
          CRM_PRODUCTION_ACCESS_PROOF: /tmp/crm-production-access.json
          CRM_RPC_RUNTIME_PROOF: /tmp/crm-rpc-runtime.json
        run: node rust-party/test/production-access.mjs
      - name: Enforce committed native Worker dependency lock
        run: git diff --exit-code -- apps/cloudflare-crm/rust-party/Cargo.lock
      - name: Dry-run exact native entrypoint upload with original CRM Wrangler configuration
        working-directory: apps/cloudflare-crm
        shell: bash
        env:
          CRM_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Explicit root config is essential: without it Wrangler walks to
          # rust-party/wrangler.jsonc and selects the nonexistent test D1.
          npx wrangler versions upload rust-party/build/index.js \
            --config wrangler.jsonc --name crm-dev --var "GIT_SHA:$CRM_HEAD_SHA" \
            --dry-run --outdir /tmp/crm-native-party-version-proof 2>&1 | \
            tee /tmp/crm-native-party-wrangler-bindings.log
          grep -F 'env.DB (crm-dev)' /tmp/crm-native-party-wrangler-bindings.log
          grep -F 'env.ASSETS' /tmp/crm-native-party-wrangler-bindings.log
          if grep -F 'CRM_CI_LOCAL_ONLY' /tmp/crm-native-party-wrangler-bindings.log; then
            echo 'FAIL: CI-local auth flag must never be in Cloudflare native version' >&2
            exit 1
          fi
          test -d /tmp/crm-native-party-version-proof
          test -s rust-party/build/index_bg.wasm
          test -s rust-party/build/index.js
      - name: Require actual browser acceptance before sealing any artifact
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const evidence = JSON.parse(readFileSync("apps/cloudflare-crm/e2e-evidence-native/typed-browser.json", "utf8"));
            assert.equal(evidence.result, "PASS");
            assert.equal(evidence.source_sha, process.env.GITHUB_SHA);
            assert.deepEqual(evidence.features, ["native-ci"]);
          '
      - name: Seal runtime-tested source and verified production bundle
        id: seal
        shell: bash
        env:
          CRM_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd apps/cloudflare-crm
          test -s dist/index.html
          test -s rust-party/build/index.js
          test -s rust-party/build/index_bg.wasm
          mkdir -p .release
          printf '%s\n' "$CRM_BUILD_SHA" > .release/source-sha.txt
          node --input-type=module -e '
            import {execFileSync} from "node:child_process";
            import {readFileSync,writeFileSync,readdirSync,statSync} from "node:fs";
            import {createHash} from "node:crypto";
            import {gzipSync} from "node:zlib";
            import {join} from "node:path";
            const run=(command,args)=>execFileSync(command,args,{encoding:"utf8",maxBuffer:8*1024*1024}).trim();
            const size=path=>statSync(path).size;
            const treeBytes=path=>readdirSync(path,{withFileTypes:true}).reduce((total,entry)=>{
              const child=join(path,entry.name);
              return total+(entry.isDirectory()?treeBytes(child):size(child));
            },0);
            const gzip9=path=>gzipSync(readFileSync(path),{level:9}).byteLength;
            const textAssetGzip9=dir=>readdirSync(dir,{withFileTypes:true}).reduce((total,entry)=>{
              const child=join(dir,entry.name);
              return total+(entry.isDirectory()?textAssetGzip9(child):
                /\.(?:html|css|js|json|svg)$/.test(entry.name)?gzip9(child):0);
            },0);
            const hash=path=>createHash("sha256").update(readFileSync(path)).digest("hex");
            const wasmGraph=(features,edges)=>run("cargo",["tree","--locked","--manifest-path",
              "rust-party/Cargo.toml","--target","wasm32-unknown-unknown","--features",features,
              "--edges",edges,"--charset","ascii"]);
            const productionAccess=JSON.parse(readFileSync("/tmp/crm-production-access.json","utf8"));
            if(productionAccess.result!=="PASS"||productionAccess.compiled_router_policy_parity!==true||
              productionAccess.source_sha!==process.env.CRM_BUILD_SHA||
              productionAccess.artifact.wasm!==hash("rust-party/build/index_bg.wasm")||
              productionAccess.artifact.entry!==hash("rust-party/build/index.js"))
              throw Error("production Access proof must match the sealed artifact");
            writeFileSync(".release/provenance.json",JSON.stringify({
              production_access_probe:productionAccess,
              tested_sha:process.env.CRM_BUILD_SHA,
              tree:run("git",["rev-parse","HEAD^{tree}"]),
              production_features:["native"],runtime_test_features:["native-ci"],
              tools:{node:process.version,pnpm:run("pnpm",["--version"]),
                rust:run("rustc",["--version"]),python:run("python",["--version"]),
                buf:run("pnpm",["exec","buf","--version"])},
              foundation_baseline:{
                bytes:{production_wasm:size("rust-party/build/index_bg.wasm"),
                  production_worker:treeBytes("rust-party/build"),react_dist:treeBytes("dist")},
                gzip9_bytes:{production_wasm:gzip9("rust-party/build/index_bg.wasm"),
                  production_worker_entry_js:gzip9("rust-party/build/index.js"),
                  react_text_assets_sum:textAssetGzip9("dist")},
                gzip9_method:"Node zlib level 9 per file; React sum html/css/js/json/svg; not CDN transfer, CPU, or memory",
                lock_sha256:{root_cargo:hash("../../Cargo.lock"),worker_cargo:hash("rust-party/Cargo.lock"),
                  pnpm:hash("../../pnpm-lock.yaml")},
                native_owners:JSON.parse(readFileSync("/tmp/crm-native-owner-dependency-trees.json","utf8")),
                worker_wasm:{production_normal:wasmGraph("native","normal"),
                  production_normal_build:wasmGraph("native","normal,build"),
                  ci_normal_build_dev:wasmGraph("native-ci","normal,build,dev")}
              },
              independent_byte_reproducibility:"NOT_TESTED"
            },null,2)+"\n");
          '
          # Log existing measured provenance for direct CI comparisons; no extra build.
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const {foundation_baseline:b}=JSON.parse(readFileSync(".release/provenance.json","utf8"));
            console.log(JSON.stringify({event:"crm.release-size",bytes:b.bytes,gzip9_bytes:b.gzip9_bytes}));
          '
          # Seal the same production directory that passed the Wrangler dry-run.
          find dist rust-party/build -type f -print0 | LC_ALL=C sort -z |
            xargs -0 sha256sum > .release/compiled-sha256.txt
          sha256sum .release/provenance.json >> .release/compiled-sha256.txt
          sha256sum --check --strict .release/compiled-sha256.txt
          echo "bundle_name=crm-native-bundle-$CRM_BUILD_SHA-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "CRM compiled bundle sealed for $CRM_BUILD_SHA"
      - name: Preserve exact compiled bundle for independent review and deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.seal.outputs.bundle_name }}
          path: |
            apps/cloudflare-crm/dist/
            apps/cloudflare-crm/rust-party/build/
            apps/cloudflare-crm/.release/source-sha.txt
            apps/cloudflare-crm/.release/provenance.json
            apps/cloudflare-crm/.release/compiled-sha256.txt
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  deploy-crm-dev:
    needs: cloudflare-crm-spike
    permissions:
      contents: read
      actions: read
    # Sole deployment owner: only permanent dev branch may publish crm-dev.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-26.04
    environment: crm-dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Install pinned CRM dependencies
        run: |
          npm install --global pnpm@12.21.0
          pnpm install --frozen-lockfile
      # The deploy smoke also uses chromium.launch({headless:true}).
      - name: Install headless Chromium for browser smoke
        working-directory: apps/cloudflare-crm
        shell: bash
        run: bash scripts/prepare-chromium.sh
      - name: Restore CI-verified Rust WASM and React bundle without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          CRM_BUNDLE_NAME: ${{ needs.cloudflare-crm-spike.outputs.bundle_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$CRM_BUNDLE_NAME" --dir apps/cloudflare-crm
          cd apps/cloudflare-crm
          test "$(cat .release/source-sha.txt)" = "$GITHUB_SHA"
          sha256sum --check --strict .release/compiled-sha256.txt
          test -s dist/index.html
          test -s rust-party/build/index.js
          test -s rust-party/build/index_bg.wasm
          echo "CRM exact-source release artifact verified for $GITHUB_SHA"
      - name: Deploy React, D1 and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs
      - name: Isolate protected Access A/B tests in fresh tenants of the same D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CRM_E2E_B_CLIENT_ID: ${{ secrets.CRM_E2E_B_CLIENT_ID }}
          CRM_E2E_B_CLIENT_SECRET: ${{ secrets.CRM_E2E_B_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs prepare-e2e
      # Small production smoke; independent Gate B follows dev merge outside CI.
      - name: Published Chromium smoke of real Access, typed RPC, D1 and roles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CRM_E2E_B_CLIENT_ID: ${{ secrets.CRM_E2E_B_CLIENT_ID }}
          CRM_E2E_B_CLIENT_SECRET: ${{ secrets.CRM_E2E_B_CLIENT_SECRET }}
        run: node apps/cloudflare-crm/e2e/live.mjs
      - name: Verify browser D1 audit and exact Cloudflare request traces
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs verify-data
      - name: Stop public entry if release acceptance failed
        if: ${{ failure() || cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRM_E2E_A_CLIENT_ID: ${{ secrets.CRM_E2E_A_CLIENT_ID }}
          CRM_E2E_A_CLIENT_SECRET: ${{ secrets.CRM_E2E_A_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          CRM_D1_DATABASE_ID: 35fc7ee9-9710-485f-8fb3-f5a398b229b4
        run: node apps/cloudflare-crm/scripts/deploy.mjs fail-closed
      - name: Save release evidence and browser failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-dev-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            apps/cloudflare-crm/.release/*.json
            apps/cloudflare-crm/e2e-failure.png
            apps/cloudflare-crm/e2e-mobile.png
            apps/cloudflare-crm/e2e-evidence/*.png
            apps/cloudflare-crm/e2e-evidence/*.json
            apps/cloudflare-crm/.release/native-proof/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
