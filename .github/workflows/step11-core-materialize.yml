name: Step 11 Core Materializer

on:
  push:
    branches:
      - repository-step-11-owner-privacy-actions
    paths:
      - .github/workflows/step11-core-materialize.yml
      - scripts/step11_core_materialize.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/step11-core-materialize.yml
      - scripts/step11_core_materialize.py

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'repository-step-11-owner-privacy-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repository-step-11-owner-privacy-actions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply exact core changes
        run: |
          python3 scripts/step11_core_materialize.py
          cargo fmt --all
          cargo test -p crm-core-data
      - name: Commit materialized source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/crm-core-data/src/postgres_batch
          git commit -m "Core data: add governed optimistic delete primitive"
          git push origin HEAD:repository-step-11-owner-privacy-actions
