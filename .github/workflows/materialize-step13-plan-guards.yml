name: Materialize Step 13 Plan Guards

on:
  push:
    branches:
      - repository-step-13-plan-hardening

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-13-plan-hardening
          fetch-depth: 0
      - name: Materialize permanent plan guards
        run: python scripts/materialize_step13_plan_guards.py
      - name: Commit guards and remove temporary materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          git rm .github/workflows/materialize-step13-plan-guards.yml scripts/materialize_step13_plan_guards.py
          git commit -m "Test hardened repository step 13 plan boundary"
          git push origin HEAD:repository-step-13-plan-hardening
