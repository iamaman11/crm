name: Materialize Step 13 Plan Guards

on:
  push:
    branches:
      - repository-step-13-plan-hardening
    paths:
      - ".github/workflows/materialize-step13-plan-guards.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-13-plan-hardening
          fetch-depth: 0
      - name: Materialize permanent plan guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          allowed = "ALLOWED_PACKET_PATHS = ['docs/ACTIVE_PACKET.md', 'docs/adr/ADR-031-step-13-complexity-remeasurement-and-anti-circumvention.md', 'repository-packet.json', 'scripts/generate_repository_navigation.py', 'tests/test_architecture_documentation_consistency.py', 'tests/test_repository_navigation.py']"
          old_allowed = "ALLOWED_PACKET_PATHS = ['docs/ACTIVE_PACKET.md', 'docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md', 'docs/IMPLEMENTATION_ROADMAP.md', 'docs/PHASE8_DELIVERY_PLAN.md', 'docs/PROJECT_STATUS.md', 'docs/generated/REPOSITORY_MAP.md', 'repository-packet.json', 'scripts/generate_repository_navigation.py', 'tests/test_architecture_documentation_consistency.py', 'tests/test_repository_navigation.py']"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_block(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{label}: start marker missing")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return text[:start_index] + replacement + text[end_index:]

          architecture_path = Path('tests/test_architecture_documentation_consistency.py')
          architecture = architecture_path.read_text(encoding='utf-8')
          architecture = replace_once(architecture, old_allowed, allowed, 'architecture allowed paths')
          architecture = replace_once(
              architecture,
              '        cls.module_development = read("docs/MODULE_DEVELOPMENT.md")\n',
              '        cls.module_development = read("docs/MODULE_DEVELOPMENT.md")\n        cls.adr31 = read("docs/adr/ADR-031-step-13-complexity-remeasurement-and-anti-circumvention.md")\n',
              'architecture ADR fixture',
          )
          architecture_method = '''    def test_active_packet_is_machine_declared_and_generated(self) -> None:
              self.assertEqual(self.packet["schema_version"], "crm.repository-packet/v1")
              self.assertEqual(self.packet["packet_id"], "repository-step-13-plan-hardening")
              self.assertEqual(self.packet["status"], "active")
              self.assertEqual(self.packet["baseline"]["ref"], "main")
              self.assertEqual(
                  self.packet["baseline"]["sha"],
                  "dfd1478dcfc084cf855fcc409c9b8faec8eaa5cf",
              )
              self.assertEqual(self.packet["tracking_issues"], [194, 126])
              self.assertEqual(self.packet["allowed_paths"], ALLOWED_PACKET_PATHS)
              self.assertEqual(
                  self.packet["required_checks"],
                  [
                      "Affected Scope CI",
                      "Customer Privacy Access Export CI",
                      "Customer Privacy Owner Execution CI",
                      "Rust CI",
                      "Rust Generated Sync",
                  ],
              )
              self.assertIn(
                  "the plan cannot treat the previous 110-package baseline as current 113-package completion evidence",
                  self.packet["acceptance"],
              )
              self.assertIn(
                  "unregistered source-level lint suppressions and equivalent bypasses are explicitly inside step-13 governance scope",
                  self.packet["acceptance"],
              )
              self.assertIn("repository-step-13-plan-hardening", self.active_packet)
              self.assertIn("dfd1478dcfc084cf855fcc409c9b8faec8eaa5cf", self.active_packet)
              self.assertIn("Repository step 13 remains the next permitted implementation step", self.adr31)
              self.assertIn("current accepted workspace contains 113 packages", self.adr31)
              self.assertIn("#[allow(...)]", self.adr31)
              self.assertIn("representative ordinary-capability and new-owner change-cost reports", self.adr31)
              self.assertIn("Step 14 remains blocked", self.adr31)

'''
          architecture = replace_block(
              architecture,
              '    def test_active_packet_is_machine_declared_and_generated(self) -> None:\n',
              '    def test_stage_accountability_and_live_catalog_are_current(self) -> None:\n',
              architecture_method,
              'architecture packet method',
          )
          architecture_path.write_text(architecture, encoding='utf-8')

          navigation_path = Path('tests/test_repository_navigation.py')
          navigation = navigation_path.read_text(encoding='utf-8')
          navigation = replace_once(navigation, old_allowed, allowed, 'navigation allowed paths')
          navigation_method = '''    def test_active_packet_declaration_is_valid_and_exact(self) -> None:
              packet = load_packet(ROOT)
              self.assertEqual(packet["packet_id"], "repository-step-13-plan-hardening")
              self.assertEqual(packet["status"], "active")
              self.assertEqual(packet["baseline"]["ref"], "main")
              self.assertEqual(
                  packet["baseline"]["sha"],
                  "dfd1478dcfc084cf855fcc409c9b8faec8eaa5cf",
              )
              self.assertEqual(packet["tracking_issues"], [194, 126])
              self.assertEqual(packet["allowed_paths"], ALLOWED_PACKET_PATHS)
              self.assertEqual(
                  packet["required_checks"],
                  [
                      "Affected Scope CI",
                      "Customer Privacy Access Export CI",
                      "Customer Privacy Owner Execution CI",
                      "Rust CI",
                      "Rust Generated Sync",
                  ],
              )
              self.assertIn(
                  "permanent tests reject stale packet identity, baseline, checks or missing ADR anti-complexity requirements",
                  packet["acceptance"],
              )

'''
          navigation = replace_block(
              navigation,
              '    def test_active_packet_declaration_is_valid_and_exact(self) -> None:\n',
              '    def test_affected_scope_workflow_executes_real_packet_check(self) -> None:\n',
              navigation_method,
              'navigation packet method',
          )
          navigation = replace_once(
              navigation,
              '                    ("Governance CI", ".github/workflows/governance.yml"),\n',
              '                    ("Customer Privacy Access Export CI", ".github/workflows/customer-privacy-access-export.yml"),\n                    ("Customer Privacy Owner Execution CI", ".github/workflows/customer-privacy-owner-execution.yml"),\n',
              'navigation workflow fixture',
          )
          navigation = replace_once(
              navigation,
              '                    "f36592211bed3e0df7cf3771164b4bc24026eff3"\n',
              '                    "dfd1478dcfc084cf855fcc409c9b8faec8eaa5cf"\n',
              'navigation baseline fixture',
          )
          navigation_path.write_text(navigation, encoding='utf-8')
          PY
      - name: Commit guards and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          git rm .github/workflows/materialize-step13-plan-guards.yml
          git commit -m "Test hardened repository step 13 plan boundary"
          git push origin HEAD:repository-step-13-plan-hardening
