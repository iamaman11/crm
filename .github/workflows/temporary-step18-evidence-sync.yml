name: Temporary Step 18 Evidence Sync

on:
  push:
    branches:
      - repository-step-18-doctor-bootstrap-evidence-sync

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-18-doctor-bootstrap-evidence-sync
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install navigation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Synchronize exact accepted evidence
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          SOURCE = "76a0d93d594b6ffbb890f90d3cb9037febf4c3f8"
          MERGE = "87bc0d33befc4525b62aa7e0e1884abc07e12abf"
          EVIDENCE = (
              "Repository Step 18 is in progress through accepted PR #281 / source `"
              + SOURCE
              + "` / squash merge `"
              + MERGE
              + "` / 7 of 7 applicable permanent workflows on one unchanged exact head. "
              "The accepted first slice delivers deterministic repository-pinned `doctor` and locked isolated `bootstrap`; "
              "the next permitted bounded implementation packet is `dev-up` and `dev-reset`, while `seed-demo` and `smoke` remain later Step 18 slices."
          )

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_all(path: str, old: str, new: str, *, minimum: int = 1) -> None:
              content = read(path)
              count = content.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrence(s) of {old!r}, found {count}")
              write(path, content.replace(old, new))

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {count}")
              write(path, content.replace(old, new))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex did not match exactly once: {pattern}")
              write(path, updated)

          normative = (
              "docs/PROJECT_STATUS.md",
              "docs/IMPLEMENTATION_ROADMAP.md",
              "docs/PHASE8_DELIVERY_PLAN.md",
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "docs/MODULE_CATALOG.md",
          )
          for path in normative:
              replace_all(
                  path,
                  "Repository Step 18 is the next permitted implementation step and is not started.",
                  EVIDENCE,
              )

          replace_once(
              "docs/PROJECT_STATUS.md",
              "Repository Steps 1–17 are complete. Architecture Stages A, B, D, E and G are complete.",
              "Repository Steps 1–17 are complete. Repository Step 18 is in progress through the accepted doctor/bootstrap slice in PR #281. Architecture Stages A, B, D, E and G are complete.",
          )
          replace_once(
              "docs/PROJECT_STATUS.md",
              "\n\n## Current measured repository baseline",
              "\n\n## Repository Step 18 accepted doctor/bootstrap slice\n\n"
              + EVIDENCE
              + "\n\nAccepted behavior:\n\n"
              "- `repo.py doctor` provides deterministic human and JSON output, repository-pinned Rust/Node/pnpm validation, Python venv validation and actionable fail-closed remediation;\n"
              "- the bootstrap profile excludes Docker, while the full profile additionally validates Docker CLI, Compose v2 and daemon reachability;\n"
              "- `repo.py bootstrap` creates an isolated `.venv`, installs committed Python constraints, uses Cargo `--locked` and pnpm `--frozen-lockfile`, and verifies locked metadata plus generated navigation;\n"
              "- dry-run executes no command and reports the exact ordered argument-array plan;\n"
              "- no runtime, owner, route, worker, contract, schema, migration, dependency, lockfile or product behavior changed.\n"
              "\n## Current measured repository baseline",
          )
          replace_once(
              "docs/PROJECT_STATUS.md",
              "\n\n## Customer Privacy product boundary",
              "\n| 18 (doctor/bootstrap slice) | PR #281 / source `"
              + SOURCE
              + "` / merge `"
              + MERGE
              + "` / 7 of 7 | Deterministic repository-pinned doctor and locked isolated bootstrap; Step 18 remains in progress with dev-up/dev-reset next |\n\n## Customer Privacy product boundary",
          )

          replace_once(
              "docs/IMPLEMENTATION_ROADMAP.md",
              "Repository Steps 1–17 are complete. Repository Step 18 is the next permitted implementation step and is **not started**.",
              "Repository Steps 1–17 are complete. Repository Step 18 is **in progress through accepted PR #281**; doctor/bootstrap are accepted and dev-up/dev-reset are the next permitted bounded implementation packet.",
          )
          replace_once(
              "docs/IMPLEMENTATION_ROADMAP.md",
              "18. deterministic local lifecycle commands — **next, not started**;",
              "18. deterministic local lifecycle commands — **in progress through PR #281; doctor/bootstrap accepted, dev-up/dev-reset next**;",
          )
          replace_once(
              "docs/IMPLEMENTATION_ROADMAP.md",
              "### 3.5 Binding next repository sequence",
              "### 3.5 Accepted Repository Step 18 doctor/bootstrap slice\n\n"
              + EVIDENCE
              + "\n\nThe slice changes no product behavior or runtime ownership. Step 18 remains open until dev-up, dev-reset, seed-demo and smoke are separately accepted.\n\n"
              "### 3.6 Binding next repository sequence",
          )

          replace_once(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "## 5. Accepted Repository Steps 14–17 architecture results",
              "## 5. Accepted Repository Steps 14–18 architecture results",
          )
          replace_once(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "### Repository Step 18 — next, not started",
              "### Repository Step 18 — in progress through PR #281",
          )
          replace_once(
              "docs/PHASE8_DELIVERY_PLAN.md",
              "- deterministic `doctor`, `bootstrap`, `dev-up`, `dev-reset`, `seed-demo` and `smoke` commands on a clean environment.",
              "- accepted through PR #281: deterministic repository-pinned `doctor` and locked isolated `bootstrap`;\n- next bounded packet: deterministic `dev-up` and `dev-reset`;\n- later Step 18 slices: `seed-demo` and end-to-end `smoke` on a clean environment.",
          )

          replace_once(
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "Current blocking baseline after Step 17:",
              "Current blocking baseline after the accepted Step 18 doctor/bootstrap slice:",
          )
          replace_once(
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "| H — reproducible environment and navigation | **In progress** | `affected`, `check-affected`, `explain`, fail-closed `packet-check`, generated active packet and repository map | deterministic `doctor`, `bootstrap`, `dev-up`, `dev-reset`, `seed-demo`, `smoke` at Step 18 |",
              "| H — reproducible environment and navigation | **In progress** | `affected`, `check-affected`, `explain`, fail-closed `packet-check`, generated active packet/repository map, plus accepted deterministic `doctor` and locked `bootstrap` through PR #281 | deterministic `dev-up`, `dev-reset`, `seed-demo` and `smoke` in the remaining Step 18 slices |",
          )
          replace_once(
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "18. deterministic local lifecycle commands: `doctor`, `bootstrap`, `dev-up`, `dev-reset`, `seed-demo` and `smoke` — **next, not started**;",
              "18. deterministic local lifecycle commands: `doctor`, `bootstrap`, `dev-up`, `dev-reset`, `seed-demo` and `smoke` — **in progress through PR #281; doctor/bootstrap accepted, dev-up/dev-reset next**;",
          )

          replace_once(
              "docs/MODULE_CATALOG.md",
              "Repository Step 17 is complete through PR #279; Repository Step 18 is next and not started.",
              "Repository Step 17 is complete through PR #279; Repository Step 18 is in progress through PR #281, with doctor/bootstrap accepted and dev-up/dev-reset next.",
          )
          replace_once(
              "docs/MODULE_CATALOG.md",
              "- PR #249 / accepted source `7876945586e5a6cc94f8d3b0f6ba2b57316484d2` / merge `f36592211bed3e0df7cf3771164b4bc24026eff3` / 37 of 37 permanent workflows — complete first-party production contribution aggregation through `crm-first-party-modules` without behavior changes.",
              "- PR #249 / accepted source `7876945586e5a6cc94f8d3b0f6ba2b57316484d2` / merge `f36592211bed3e0df7cf3771164b4bc24026eff3` / 37 of 37 permanent workflows — complete first-party production contribution aggregation through `crm-first-party-modules` without behavior changes;\n- PR #281 / accepted source `"
              + SOURCE
              + "` / merge `"
              + MERGE
              + "` / 7 of 7 permanent workflows — deterministic repository-pinned doctor and locked isolated bootstrap, with no module readiness or product behavior change.",
          )

          packet = {
              "schema_version": "crm.repository-packet/v1",
              "packet_id": "repository-step-18-doctor-bootstrap-evidence-sync",
              "title": "Synchronize accepted Step 18 doctor and bootstrap evidence",
              "status": "active",
              "baseline": {"ref": "main", "sha": MERGE},
              "tracking_issues": [194],
              "objective": "Record the exact accepted PR #281 source, squash merge and 7-of-7 workflow evidence across every live normative source; mark Repository Step 18 in progress rather than complete; and make deterministic dev-up/dev-reset the only next permitted implementation packet without changing runtime or product behavior.",
              "allowed_paths": [
                  "docs/ACTIVE_PACKET.md",
                  "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
                  "docs/IMPLEMENTATION_ROADMAP.md",
                  "docs/MODULE_CATALOG.md",
                  "docs/PHASE8_DELIVERY_PLAN.md",
                  "docs/PROJECT_STATUS.md",
                  "repository-packet.json",
                  "tests/test_architecture_documentation_consistency.py",
                  "tests/test_repository_navigation.py",
              ],
              "forbidden_paths": [
                  ".github/workflows/**",
                  "AGENTS.md",
                  "Cargo.lock",
                  "Cargo.toml",
                  "README.md",
                  "affected-scope-policy.json",
                  "apps/**",
                  "contracts/**",
                  "crates/**",
                  "database/**",
                  "evidence/**",
                  "modules/**",
                  "package.json",
                  "packages/**",
                  "pnpm-lock.yaml",
                  "proto/**",
                  "requirements-dev.txt",
                  "rust-toolchain.toml",
                  "schemas/**",
                  "scripts/**",
                  "services/**",
              ],
              "deliverables": [
                  "record exact PR #281 source, squash merge and 7-of-7 workflow evidence in all five normative documents",
                  "mark Repository Step 18 in progress with doctor/bootstrap accepted and dev-up/dev-reset next",
                  "preserve seed-demo and smoke as later bounded Step 18 slices",
                  "update active-packet and documentation-consistency guards to the accepted evidence-sync packet",
              ],
              "required_checks": [
                  "Affected Scope CI",
                  "Complexity Baseline CI",
                  "Governance CI",
                  "Rust Generated Sync",
                  "Rust CI",
              ],
              "acceptance": [
                  "the branch is based exactly on merge commit " + MERGE,
                  "all five normative documents contain PR #281, source " + SOURCE + ", merge " + MERGE + " and 7 of 7",
                  "Step 18 is described as in progress rather than complete",
                  "dev-up/dev-reset are the only next permitted implementation packet and Step 19 remains blocked",
                  "the final diff contains only declared documentation, packet, generated navigation and permanent guard files",
                  "one unchanged exact head passes every applicable permanent workflow with zero unresolved comments or review threads",
              ],
              "non_goals": [
                  "implement dev-up, dev-reset, seed-demo or smoke",
                  "start Repository Step 19 or change Customer Privacy worker behavior",
                  "change runtime, routes, contracts, schemas, migrations, dependencies, lockfiles or product behavior",
                  "complete Repository Step 18, Phase 8A, an expert module or architecture 10/10",
              ],
          }
          write("repository-packet.json", json.dumps(packet, indent=2) + "\n")

          consistency = "tests/test_architecture_documentation_consistency.py"
          content = read(consistency)
          content = content.replace(
              "    def test_step_17_is_complete_and_step_18_is_next(self) -> None:",
              "    def test_step_17_is_complete_and_step_18_is_in_progress(self) -> None:",
          )
          content = content.replace(
              '        self.assertIn("Repository Step 18 is the next permitted implementation packet", self.status)',
              '        self.assertIn("Repository Step 18 is in progress through accepted PR #281", self.status)',
          )
          content = content.replace(
              '        self.assertIn("**next, not started**", self.plan)',
              '        self.assertIn("**in progress through PR #281; doctor/bootstrap accepted, dev-up/dev-reset next**", self.plan)',
          )
          new_packet_method = '''    def test_active_step_18_doctor_bootstrap_evidence_sync_packet_is_exact(self) -> None:
              self.assertEqual(self.packet["schema_version"], "crm.repository-packet/v1")
              self.assertEqual(self.packet["packet_id"], "repository-step-18-doctor-bootstrap-evidence-sync")
              self.assertEqual(self.packet["status"], "active")
              self.assertEqual(
                  self.packet["baseline"],
                  {"ref": "main", "sha": "87bc0d33befc4525b62aa7e0e1884abc07e12abf"},
              )
              self.assertEqual(self.packet["tracking_issues"], [194])
              self.assertEqual(
                  set(self.packet["allowed_paths"]),
                  {
                      "docs/ACTIVE_PACKET.md",
                      "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
                      "docs/IMPLEMENTATION_ROADMAP.md",
                      "docs/MODULE_CATALOG.md",
                      "docs/PHASE8_DELIVERY_PLAN.md",
                      "docs/PROJECT_STATUS.md",
                      "repository-packet.json",
                      "tests/test_architecture_documentation_consistency.py",
                      "tests/test_repository_navigation.py",
                  },
              )
              self.assertEqual(
                  self.packet["required_checks"],
                  [
                      "Affected Scope CI",
                      "Complexity Baseline CI",
                      "Governance CI",
                      "Rust Generated Sync",
                      "Rust CI",
                  ],
              )
              for document in self.normative_documents:
                  for marker in (
                      "PR #281",
                      "76a0d93d594b6ffbb890f90d3cb9037febf4c3f8",
                      "87bc0d33befc4525b62aa7e0e1884abc07e12abf",
                      "7 of 7",
                  ):
                      self.assertIn(marker, document)
              self.assertIn(self.packet["packet_id"], self.active_packet)
              self.assertIn(self.packet["baseline"]["sha"], self.active_packet)
              self.assertIn(
                  "record exact PR #281 source, squash merge and 7-of-7 workflow evidence in all five normative documents",
                  self.packet["deliverables"],
              )
              self.assertIn(
                  "implement dev-up, dev-reset, seed-demo or smoke",
                  self.packet["non_goals"],
              )

          '''
          content, count = re.subn(
              r"    def test_active_step_18_doctor_bootstrap_packet_is_exact\(self\) -> None:\n.*?(?=    def test_repository_map_and_product_inventory_remain_exact)",
              new_packet_method,
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to replace architecture consistency packet method")
          write(consistency, content)

          navigation = "tests/test_repository_navigation.py"
          content = read(navigation)
          new_active_method = '''    def test_active_packet_declaration_is_exact(self) -> None:
              packet = load_packet(ROOT)
              self.assertEqual(packet["schema_version"], "crm.repository-packet/v1")
              self.assertEqual(packet["packet_id"], "repository-step-18-doctor-bootstrap-evidence-sync")
              self.assertEqual(packet["status"], "active")
              self.assertEqual(
                  packet["baseline"],
                  {"ref": "main", "sha": "87bc0d33befc4525b62aa7e0e1884abc07e12abf"},
              )
              self.assertEqual(packet["tracking_issues"], [194])
              self.assertEqual(
                  set(packet["allowed_paths"]),
                  {
                      "docs/ACTIVE_PACKET.md",
                      "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
                      "docs/IMPLEMENTATION_ROADMAP.md",
                      "docs/MODULE_CATALOG.md",
                      "docs/PHASE8_DELIVERY_PLAN.md",
                      "docs/PROJECT_STATUS.md",
                      "repository-packet.json",
                      "tests/test_architecture_documentation_consistency.py",
                      "tests/test_repository_navigation.py",
                  },
              )
              self.assertEqual(
                  packet["required_checks"],
                  [
                      "Affected Scope CI",
                      "Complexity Baseline CI",
                      "Governance CI",
                      "Rust Generated Sync",
                      "Rust CI",
                  ],
              )
              self.assertIn(
                  "record exact PR #281 source, squash merge and 7-of-7 workflow evidence in all five normative documents",
                  packet["deliverables"],
              )
              self.assertIn(
                  "implement dev-up, dev-reset, seed-demo or smoke",
                  packet["non_goals"],
              )

          '''
          content, count = re.subn(
              r"    def test_active_packet_declaration_is_exact\(self\) -> None:\n.*?(?=    def test_generated_navigation_is_deterministic_and_current)",
              new_active_method,
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to replace repository navigation packet method")
          content = content.replace("repository-step-18-doctor-bootstrap", "repository-step-18-doctor-bootstrap-evidence-sync")
          content = content.replace("2659aed59a9fb9ac5a21d957f3eda85b54599d84", MERGE)
          write(navigation, content)
          PY

          python scripts/generate_repository_navigation.py --write
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation
      - name: Commit synchronized evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/ACTIVE_PACKET.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/MODULE_CATALOG.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/PROJECT_STATUS.md \
            repository-packet.json \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          git diff --cached --exit-code && { echo "No evidence changes produced"; exit 1; } || true
          git commit -m "Synchronize accepted Step 18 doctor bootstrap evidence"
          git push origin HEAD:repository-step-18-doctor-bootstrap-evidence-sync
