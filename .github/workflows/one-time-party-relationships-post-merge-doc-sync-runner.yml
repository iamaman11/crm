name: One-Time Party Relationships Post-Merge Documentation Sync Runner

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-party-relationships-post-merge-doc-sync-runner.yml"
      - ".github/scripts/party_relationships_post_merge_doc_sync.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact documentation head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
      - name: Synchronize accepted documentation
        run: python .github/scripts/party_relationships_post_merge_doc_sync.py
      - name: Remove temporary synchronization files and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-party-relationships-post-merge-doc-sync.yml
          rm -f .github/workflows/one-time-party-relationships-post-merge-doc-sync-runner.yml
          rm -f .github/scripts/party_relationships_post_merge_doc_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize party relationships privacy acceptance"
          git push origin "HEAD:${HEAD_REF}"
