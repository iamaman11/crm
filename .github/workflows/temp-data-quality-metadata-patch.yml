name: Temporary Data Quality Metadata Patch

on:
  push:
    branches:
      - feature/data-quality-privacy-scope
    paths:
      - ".github/workflows/temp-data-quality-metadata-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/data-quality-privacy-scope
          fetch-depth: 0
      - name: Isolate malformed metadata fixture and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("crates/crm-data-quality-privacy-scope-adapter/tests/postgres_scope.rs")
          text = source.read_text(encoding="utf-8")
          old = '''async fn set_record_data_class(admin: &PgPool, tenant: &str, record_id: &str, value: &str) {
              sqlx::query("UPDATE crm.records SET data_class = $3 WHERE tenant_id = $1 AND record_id = $2")
                  .bind(tenant)
                  .bind(record_id)
                  .bind(value)
                  .execute(admin)
                  .await
                  .unwrap();
          }
          '''
          new = '''async fn set_record_data_class(admin: &PgPool, tenant: &str, record_id: &str, value: &str) {
              let mut transaction = admin.begin().await.unwrap();
              sqlx::query("SET LOCAL session_replication_role = 'replica'")
                  .execute(&mut *transaction)
                  .await
                  .unwrap();
              sqlx::query("UPDATE crm.records SET data_class = $3 WHERE tenant_id = $1 AND record_id = $2")
                  .bind(tenant)
                  .bind(record_id)
                  .bind(value)
                  .execute(&mut *transaction)
                  .await
                  .unwrap();
              transaction.commit().await.unwrap();
          }
          '''
          if old not in text:
              raise SystemExit("expected metadata fixture helper was not found")
          source.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/temp-data-quality-metadata-patch.yml").unlink()
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(privacy): isolate malformed Data Quality fixture"
          git push origin HEAD:feature/data-quality-privacy-scope
