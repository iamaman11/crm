name: One-time Step 10 Rust Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-step10-rust-fix.yml"

permissions:
  contents: write

concurrency:
  group: one-time-step10-rust-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply exact production-boundary and acceptance fixes
        run: |
          python scripts/one_time_step10_rust_fix_runner.py
          cargo fmt --all
      - name: Verify focused compilation
        run: |
          cargo test --locked -p crm-customer-privacy --test access_export --no-run
          cargo check --locked -p crm-customer-data-operations-execution-composition
          cargo check --locked -p crm-customer-privacy-production
          cargo test --locked -p crm-application-runtime --test customer_privacy_access_export_postgres --no-run
      - name: Commit focused fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/crm-customer-data-operations-execution-composition/src/lib.rs \
            crates/crm-customer-privacy-production/src/access_export.rs \
            modules/crm-customer-privacy/tests/access_export.rs \
            crates/crm-application-runtime/tests/customer_privacy_access_export_postgres.rs
          git diff --cached --exit-code && { echo "Expected production-boundary fixes were not materialized."; exit 1; } || true
          git commit -m "Step 10: align production integration boundaries"
          git restore scripts/one_time_step10_rust_fix.py
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          # Revision 10: scope u64-to-i64 conversion to record persistence only.
