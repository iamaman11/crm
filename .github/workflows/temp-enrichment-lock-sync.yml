name: Temporary Enrichment Lock Sync

on:
  push:
    branches:
      - docs/customer-enrichment-privacy-accepted
    paths:
      - ".github/workflows/temp-enrichment-lock-sync.yml"

concurrency:
  group: temp-enrichment-lock-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/customer-enrichment-privacy-accepted
          fetch-depth: 0
      - name: Regenerate and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(rust): refresh generated lockfile"
          git push origin HEAD:docs/customer-enrichment-privacy-accepted
