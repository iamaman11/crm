name: Customer Privacy Planning Test Fix

on:
  pull_request:
    paths:
      - ".github/workflows/customer-privacy-planning-test-fix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/customer-privacy-planning-freeze
          fetch-depth: 0
      - name: Fix planning test action matrix collection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("modules/crm-customer-privacy/src/scope_planning_tests.rs")
          text = path.read_text()
          old = ".map(|item| (item.evidence_class(), item.action(), item.reason()))"
          new = ".map(|item| (item.evidence_class(), (item.action(), item.reason())))"
          if old not in text:
              raise SystemExit("planning action matrix test expression mismatch")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/customer-privacy-planning-test-fix.yml").unlink()
          PY
      - name: Commit test fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix Customer Privacy planning action matrix test"
          git push origin HEAD:feature/customer-privacy-planning-freeze
