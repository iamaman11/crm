name: Temporary Step 20A Evidence Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-fixture-fix.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-evidence-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-evidence-sync
          fetch-depth: 0
      - name: Synchronize accepted Step 20A evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'black==26.3.1' 'ruamel.yaml>=0.18.6,<0.19'
          python - <<'PY'
          from pathlib import Path
          import re

          documents = [
              Path("docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md"),
              Path("docs/IMPLEMENTATION_ROADMAP.md"),
              Path("docs/MODULE_CATALOG.md"),
              Path("docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md"),
              Path("docs/PHASE8_DELIVERY_PLAN.md"),
              Path("docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md"),
              Path("docs/PROJECT_STATUS.md"),
              Path("docs/WORKSPACE_COMPLEXITY_BASELINE.md"),
          ]

          source = "938cebed1e78bf7debf40dc544431bfe819970f4"
          merge = "fffd6baf35544eea736d183af0a5ba38518cce9a"
          current_state = (
              "Repository Step 20A is accepted through PR #292. Repository Step 20 remains "
              "in progress; Repository Step 20B restore, SLO, observability, performance, "
              "security and supply-chain operations evidence is the only next permitted "
              "implementation packet."
          )

          exact_replacements = {
              "Repository Steps 1–19 are complete. Repository Step 19 is complete through PRs #287–#290. Repository Step 20 is the only next permitted implementation packet.":
                  "Repository Steps 1–19 and the bounded Repository Step 20A product-plane slice are accepted. " + current_state,
              "Repository Steps 1–19 are complete. Repository Step 19 is complete. Repository Step 20 is next: Phase 8A frontend, accessibility, browser and operations evidence.":
                  "Repository Steps 1–19 and the bounded Repository Step 20A product-plane slice are accepted. " + current_state,
              "The next permitted bounded implementation packet is Repository Step 20: Phase 8A frontend, accessibility, browser and operations evidence.":
                  current_state,
              "Steps 18 and 19 are complete; Step 20 is next.":
                  "Steps 18 and 19 and the bounded Step 20A slice are accepted; Step 20 remains in progress and Step 20B is next.",
              "20. Phase 8A frontend, accessibility, browser and operations evidence;":
                  "20. Phase 8A frontend, accessibility, browser and operations evidence — **in progress; Step 20A accepted through PR #292, Step 20B next**;",
              "Stage I frontend and operations parity — **Incomplete**.":
                  "Stage I frontend and operations parity — **In progress; Step 20A accepted through PR #292, Step 20B next**.",
          }

          evidence_block = f"""
          ## Accepted Repository Step 20A evidence

          PR #292 / source `{source}` / squash merge `{merge}` / 17 of 17 applicable permanent workflows on one unchanged exact head accepts the bounded Customer Privacy product-plane slice.

          The accepted evidence proves:

          - exact typed `customer_privacy.case.list@1.0.0` and `customer_privacy.case.get@1.0.0` governed clients with envelope, contract, descriptor-hash, data-class, payload-size and retention checks before rendering;
          - an authenticated capability-gated `/customer/privacy` route while backend authentication, tenant isolation, authorization and visibility remain authoritative;
          - a bounded accessible case list/detail experience with explicit loading, empty, error and retry states, live announcements, deterministic focus behavior and permission/not-found concealment;
          - a governed Party and verified PrivacyCase fixture created through assembled production composition and mutations, with no direct Customer Privacy record writes and no mock backend;
          - real PostgreSQL, assembled `crm-api`, Vite and Chromium acceptance for keyboard-only list/detail review, session expiry and cross-tenant concealment;
          - no backend route, capability, contract, manifest, schema, migration, dependency, lockfile or Rust production-source change.

          Step 20A is accepted. Repository Step 20 remains in progress; Step 20B restore, SLO, observability, performance, security and supply-chain operations evidence is the only next permitted packet. Phase 8A.11, Phase 8A, product-complete expert modules, architecture 10/10 and the Universal CRM product remain incomplete. The accepted one-worker Customer Privacy inventory, seven public mutations, four permission-aware public queries, 5,377 public Rust items, 91 suppressions and the `crm-application-runtime` 7,269 LOC ceiling remain unchanged.
          """
          evidence_block = "\n".join(line[10:] if line.startswith("          ") else line for line in evidence_block.strip().splitlines())

          for path in documents:
              text = path.read_text(encoding="utf-8")
              for old, new in exact_replacements.items():
                  text = text.replace(old, new)
              text = text.replace(
                  "Repository Step 20 is the next permitted bounded implementation packet",
                  "Repository Step 20A is accepted through PR #292; Repository Step 20 remains in progress and Repository Step 20B is the next permitted bounded implementation packet",
              )
              text = text.replace(
                  "Repository Step 20 is the only next permitted bounded implementation packet",
                  "Repository Step 20A is accepted through PR #292; Repository Step 20 remains in progress and Repository Step 20B is the only next permitted bounded implementation packet",
              )
              text = text.replace(
                  "Repository Step 20 is next",
                  "Repository Step 20A is accepted through PR #292; Repository Step 20 remains in progress and Repository Step 20B is next",
              )
              text = text.replace(
                  "Step 20 is next",
                  "Step 20A is accepted through PR #292; Step 20 remains in progress and Step 20B is next",
              )
              if path.name == "PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md":
                  text = text.replace(
                      "Status: **Repository Step 20A implementation evidence — in progress**",
                      "Status: **Repository Step 20A accepted through PR #292; Repository Step 20 remains in progress**",
                  )
                  text = text.replace(
                      "The final Step 20A acceptance must prove",
                      "The accepted Step 20A evidence proves",
                  )
              if "## Accepted Repository Step 20A evidence" not in text:
                  text = text.rstrip() + "\n\n" + evidence_block + "\n"
              path.write_text(text, encoding="utf-8")

          stale_patterns = (
              re.compile(r"\brepository step 20 is (?:the )?(?:only )?next", re.I),
              re.compile(r"\bstep 20 is next", re.I),
              re.compile(r"next permitted bounded implementation packet is repository step 20", re.I),
          )
          stale = []
          for path in documents:
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if any(pattern.search(line) for pattern in stale_patterns):
                      stale.append(f"{path}:{number}: {line}")
          if stale:
              raise SystemExit("stale Step 20 state remains:\n" + "\n".join(stale))

          architecture_path = Path("tests/test_architecture_documentation_consistency.py")
          architecture = architecture_path.read_text(encoding="utf-8")
          architecture = architecture.replace(
              '        cls.product_plan = read("docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md")\n',
              '        cls.product_plan = read("docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md")\n        cls.product_plane = read("docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md")\n',
          )
          architecture_method = '''    def test_active_step_20a_evidence_sync_packet_is_exact(self) -> None:
              self.assertEqual(self.packet["schema_version"], "crm.repository-packet/v1")
              self.assertEqual(self.packet["packet_id"], "repository-step-20a-evidence-sync")
              self.assertEqual(self.packet["status"], "active")
              self.assertEqual(
                  self.packet["baseline"],
                  {"ref": "main", "sha": "fffd6baf35544eea736d183af0a5ba38518cce9a"},
              )
              self.assertEqual(self.packet["tracking_issues"], [194, 126])
              self.assertEqual(
                  set(self.packet["allowed_paths"]),
                  {
                      "docs/ACTIVE_PACKET.md",
                      "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
                      "docs/IMPLEMENTATION_ROADMAP.md",
                      "docs/MODULE_CATALOG.md",
                      "docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md",
                      "docs/PHASE8_DELIVERY_PLAN.md",
                      "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
                      "docs/PROJECT_STATUS.md",
                      "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
                      "repository-packet.json",
                      "tests/test_architecture_documentation_consistency.py",
                      "tests/test_repository_navigation.py",
                  },
              )
              self.assertEqual(
                  self.packet["required_checks"],
                  [
                      "Affected Scope CI",
                      "Complexity Baseline CI",
                      "Governance CI",
                      "Product Plane CI",
                      "Rust Generated Sync",
                      "Rust CI",
                  ],
              )
              self.assertIn(self.packet["packet_id"], self.active_packet)
              self.assertIn(self.packet["baseline"]["sha"], self.active_packet)
              self.assertIn(
                  "record PR #292 source 938cebed1e78bf7debf40dc544431bfe819970f4 squash merge fffd6baf35544eea736d183af0a5ba38518cce9a and 17 of 17 applicable permanent workflows in every live normative source",
                  self.packet["deliverables"],
              )
              self.assertIn(
                  "start or implement Repository Step 20B operations work",
                  self.packet["non_goals"],
              )
              evidence_documents = (
                  self.status,
                  self.roadmap,
                  self.phase8,
                  self.plan,
                  self.catalog,
                  self.product_plan,
                  self.product_plane,
                  self.complexity,
              )
              for document in evidence_documents:
                  for marker in (
                      "PR #292",
                      "938cebed1e78bf7debf40dc544431bfe819970f4",
                      "fffd6baf35544eea736d183af0a5ba38518cce9a",
                      "17 of 17",
                      "Step 20B",
                  ):
                      self.assertIn(marker, document)
                  lowered = document.lower()
                  self.assertNotRegex(lowered, r"\\brepository step 20 is (?:the )?(?:only )?next")
                  self.assertNotRegex(lowered, r"\\bstep 20 is next")
                  self.assertNotIn(
                      "next permitted bounded implementation packet is repository step 20",
                      lowered,
                  )
              self.assertIn("real PostgreSQL", self.product_plane)
              self.assertIn("assembled `crm-api`", self.product_plane)
              self.assertIn("Chromium acceptance", self.product_plane)
              self.assertIn("Repository Step 20 remains in progress", self.product_plane)

          '''
          architecture, count = re.subn(
              r"    def test_active_step_20a_product_plane_packet_is_exact\(self\) -> None:\n.*?(?=    def test_repository_map_and_product_inventory_remain_exact)",
              architecture_method,
              architecture,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"expected one architecture packet guard, replaced {count}")
          architecture_path.write_text(architecture, encoding="utf-8")

          navigation_path = Path("tests/test_repository_navigation.py")
          navigation = navigation_path.read_text(encoding="utf-8")
          navigation_method = '''    def test_active_step_20a_evidence_sync_packet_declaration_is_exact(self) -> None:
              packet = load_packet(ROOT)
              self.assertEqual(packet["schema_version"], "crm.repository-packet/v1")
              self.assertEqual(packet["packet_id"], "repository-step-20a-evidence-sync")
              self.assertEqual(packet["status"], "active")
              self.assertEqual(
                  packet["baseline"],
                  {"ref": "main", "sha": "fffd6baf35544eea736d183af0a5ba38518cce9a"},
              )
              self.assertEqual(packet["tracking_issues"], [194, 126])
              self.assertEqual(
                  set(packet["allowed_paths"]),
                  {
                      "docs/ACTIVE_PACKET.md",
                      "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
                      "docs/IMPLEMENTATION_ROADMAP.md",
                      "docs/MODULE_CATALOG.md",
                      "docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md",
                      "docs/PHASE8_DELIVERY_PLAN.md",
                      "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
                      "docs/PROJECT_STATUS.md",
                      "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
                      "repository-packet.json",
                      "tests/test_architecture_documentation_consistency.py",
                      "tests/test_repository_navigation.py",
                  },
              )
              self.assertEqual(
                  packet["required_checks"],
                  [
                      "Affected Scope CI",
                      "Complexity Baseline CI",
                      "Governance CI",
                      "Product Plane CI",
                      "Rust Generated Sync",
                      "Rust CI",
                  ],
              )
              self.assertIn(
                  "record PR #292 source 938cebed1e78bf7debf40dc544431bfe819970f4 squash merge fffd6baf35544eea736d183af0a5ba38518cce9a and 17 of 17 applicable permanent workflows in every live normative source",
                  packet["deliverables"],
              )
              self.assertIn(
                  "start or implement Repository Step 20B operations work",
                  packet["non_goals"],
              )

          '''
          navigation, count = re.subn(
              r"    def test_active_step_20a_product_plane_packet_declaration_is_exact\(self\) -> None:\n.*?(?=    def test_generated_navigation_is_deterministic_and_current)",
              navigation_method,
              navigation,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"expected one navigation packet guard, replaced {count}")
          navigation = navigation.replace(
              "repository-step-20a-customer-privacy-product-plane",
              "repository-step-20a-evidence-sync",
          )
          navigation = navigation.replace(
              "46f5be276cf2935f1940827581b81cf197b87111",
              "fffd6baf35544eea736d183af0a5ba38518cce9a",
          )
          navigation = navigation.replace(
              "Step 20A product-plane acceptance",
              "Step 20A evidence synchronization",
          )
          navigation_path.write_text(navigation, encoding="utf-8")
          PY
          python scripts/generate_repository_navigation.py --write
          black tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-20a-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize accepted Step 20A evidence"
          git push origin HEAD:repository-step-20a-evidence-sync
