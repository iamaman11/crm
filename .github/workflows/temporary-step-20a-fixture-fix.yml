name: Temporary Step 20A Fixture Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-fixture-fix.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-customer-privacy-product-plane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-customer-privacy-product-plane
          fetch-depth: 0
      - name: Format and verify permanent guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'black==26.3.1' 'ruamel.yaml>=0.18.6,<0.19'
          black tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-20a-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: normalize Step 20A permanent guards"
          git push origin HEAD:repository-step-20a-customer-privacy-product-plane
