name: Temporary Step 20A Fixture Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-fixture-fix.yml"
      - ".github/workflows/temporary-step-20a-packet-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-customer-privacy-product-plane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-customer-privacy-product-plane
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install 'ruamel.yaml>=0.18.6,<0.19'
      - name: Apply corrected governed fixture payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/temporary-step-20a-packet-sync.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = source[start:end]
          payload = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in payload.splitlines()
          ) + "\n"
          pattern = re.compile(
              r"(?P<indent>\s+)page_size: 25,\n"
              r"(?P=indent)cursor: String::new\(\),\n"
              r"(?P<close>\s+)},"
          )
          replacement = (
              r"\g<indent>page_size: 25,\n"
              r"\g<indent>cursor: String::new(),\n"
              r"\g<indent>kind: None,\n"
              r"\g<indent>status: None,\n"
              r"\g<close>},"
          )
          payload, count = pattern.subn(replacement, payload, count=1)
          if count != 1:
              raise SystemExit(f'expected one ListPrivacyCasesRequest fixture, corrected {count}')
          Path('/tmp/step20a_fixture.py').write_text(payload, encoding='utf-8')
          PY
          python /tmp/step20a_fixture.py
          cargo fmt --all
          python scripts/generate_repository_navigation.py --write
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          cargo test -p crm-api --test seed_e2e_fixture --no-run
          rm .github/workflows/temporary-step-20a-packet-sync.yml
          rm .github/workflows/temporary-step-20a-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: assemble governed Customer Privacy browser fixture"
          git push origin HEAD:repository-step-20a-customer-privacy-product-plane
