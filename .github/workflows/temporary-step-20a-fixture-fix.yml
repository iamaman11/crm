name: Temporary Step 20A Evidence Quality Pass

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-fixture-fix.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-evidence-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-evidence-sync
          fetch-depth: 0
      - name: Remove residual Step 20 ambiguity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'black==26.3.1' 'ruamel.yaml>=0.18.6,<0.19'
          python - <<'PY'
          from pathlib import Path

          documents = [
              Path("docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md"),
              Path("docs/IMPLEMENTATION_ROADMAP.md"),
              Path("docs/MODULE_CATALOG.md"),
              Path("docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md"),
              Path("docs/PHASE8_DELIVERY_PLAN.md"),
              Path("docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md"),
              Path("docs/PROJECT_STATUS.md"),
              Path("docs/WORKSPACE_COMPLEXITY_BASELINE.md"),
          ]
          old = (
              "Repository Steps 1–19 are complete. Repository Step 20 — Phase 8A frontend, "
              "accessibility, browser and operations evidence — is the only next permitted "
              "implementation packet."
          )
          new = (
              "Repository Steps 1–19 and the bounded Repository Step 20A product-plane slice "
              "are accepted. Repository Step 20 remains in progress; Repository Step 20B "
              "restore, SLO, observability, performance, security and supply-chain operations "
              "evidence is the only next permitted implementation packet."
          )
          for path in documents:
              text = path.read_text(encoding="utf-8").replace(old, new)
              path.write_text(text, encoding="utf-8")

          stale = []
          for path in documents:
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  lowered = line.lower()
                  ambiguous_next = (
                      "step 20" in lowered
                      and "next permitted" in lowered
                      and "step 20b" not in lowered
                  )
                  stale_is_next = (
                      ("step 20 is next" in lowered or "repository step 20 is next" in lowered)
                      and "step 20b" not in lowered
                  )
                  if ambiguous_next or stale_is_next:
                      stale.append(f"{path}:{number}: {line}")
          if stale:
              raise SystemExit("ambiguous Step 20 state remains:\n" + "\n".join(stale))

          guard = Path("tests/test_architecture_documentation_consistency.py")
          text = guard.read_text(encoding="utf-8")
          marker = '''                self.assertNotIn(
                      "next permitted bounded implementation packet is repository step 20",
                      lowered,
                  )
          '''
          replacement = marker + '''                for line in document.splitlines():
                      lowered_line = line.lower()
                      self.assertFalse(
                          "step 20" in lowered_line
                          and "next permitted" in lowered_line
                          and "step 20b" not in lowered_line,
                          line,
                      )
          '''
          if marker not in text:
              raise SystemExit("architecture semantic guard marker missing")
          guard.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
          black tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-20a-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove residual Step 20 ambiguity"
          git push origin HEAD:repository-step-20a-evidence-sync
