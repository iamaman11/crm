      - "crates/crm-application-composition/**"
      - "crates/crm-application-runtime/**"
      - "crates/crm-module-manifest/**"
      - "docs/ARCHITECTURE_READINESS.md"
      - "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md"
      - "docs/ARCHITECTURE_CI_SCALABILITY_AND_DEVICE_LAB_PLAN.md"
      - "docs/SYSTEM_INVARIANTS.md"
      - "docs/APPLICATION_ARCHITECTURE.md"
      - "docs/DELIVERY_GOVERNANCE.md"
      - "docs/DEVELOPMENT_WORKFLOW.md"
      - "docs/IMPLEMENTATION_ROADMAP.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/PHASE8_DELIVERY_PLAN.md"
      - "docs/PHASE8A11_CUSTOMER_PRIVACY_ARCHITECTURE.md"
      - "docs/PHASE8A11_CUSTOMER_PRIVACY_GUARDRAILS.md"
      - "docs/MODULE_CATALOG.md"
      - "docs/CRM_CAPABILITY_COVERAGE.md"
      - "docs/MODULE_DEVELOPMENT.md"
      - "docs/adr/ADR-024-controlled-data-formats-and-canonicalization.md"
      - "schemas/**"
      - "modules/*/module.yaml"
      - "scripts/check_module_compatibility.py"
      - "scripts/check_production_route_classifications.py"
      - "scripts/check_native_module_composition.py"
      - "scripts/check_ci_event_policy.py"
      - "scripts/compile_module_manifest_ir.py"
      - "scripts/module_manifest_projection.py"
      - "scripts/validate_module_manifests.py"
      - "scripts/check_architecture.py"
      - "scripts/scaffold_module.py"
      - "scripts/repo.py"
      - "tests/test_contract_bindings.py"
      - "tests/test_customer_privacy_architecture_freeze.py"
      - "tests/test_customer_privacy_contract_inventory.py"
      - "tests/test_customer_privacy_owner_scope_contracts.py"
      - "tests/test_ci_event_policy.py"
      - "tests/test_module_compatibility.py"
      - "tests/test_module_manifest_validation.py"
      - "tests/test_module_scaffolding.py"
      - "tests/test_production_route_classifications.py"
      - "tests/test_native_module_composition.py"
      - "architecture-policy.json"
      - "requirements-dev.txt"
      - ".github/pull_request_template.md"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - "Cargo.toml"
      - "contracts/**"
      - "crates/crm-application-composition/**"
      - "crates/crm-application-runtime/**"
      - "crates/crm-module-manifest/**"
      - "docs/ARCHITECTURE_READINESS.md"
      - "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md"
      - "docs/ARCHITECTURE_CI_SCALABILITY_AND_DEVICE_LAB_PLAN.md"
      - "docs/SYSTEM_INVARIANTS.md"
      - "docs/APPLICATION_ARCHITECTURE.md"
      - "docs/DELIVERY_GOVERNANCE.md"
      - "docs/DEVELOPMENT_WORKFLOW.md"
      - "docs/IMPLEMENTATION_ROADMAP.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/PHASE8_DELIVERY_PLAN.md"
      - "docs/PHASE8A11_CUSTOMER_PRIVACY_ARCHITECTURE.md"
      - "docs/PHASE8A11_CUSTOMER_PRIVACY_GUARDRAILS.md"
      - "docs/MODULE_CATALOG.md"
      - "docs/CRM_CAPABILITY_COVERAGE.md"
      - "docs/MODULE_DEVELOPMENT.md"
      - "docs/adr/ADR-024-controlled-data-formats-and-canonicalization.md"
      - "schemas/**"
      - "modules/*/module.yaml"
      - "scripts/check_module_compatibility.py"
      - "scripts/check_production_route_classifications.py"
      - "scripts/check_native_module_composition.py"
      - "scripts/check_ci_event_policy.py"
      - "scripts/compile_module_manifest_ir.py"
      - "scripts/module_manifest_projection.py"
      - "scripts/validate_module_manifests.py"
      - "scripts/check_architecture.py"
      - "scripts/scaffold_module.py"
      - "scripts/repo.py"
      - "tests/test_contract_bindings.py"
      - "tests/test_customer_privacy_architecture_freeze.py"
      - "tests/test_customer_privacy_contract_inventory.py"
      - "tests/test_customer_privacy_owner_scope_contracts.py"
      - "tests/test_ci_event_policy.py"
      - "tests/test_module_compatibility.py"
      - "tests/test_module_manifest_validation.py"
      - "tests/test_module_scaffolding.py"
      - "tests/test_production_route_classifications.py"
      - "tests/test_native_module_composition.py"
      - "architecture-policy.json"
      - "requirements-dev.txt"
      - ".github/pull_request_template.md"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Enforce immutable module publication compatibility
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/check_module_compatibility.py --base-ref "origin/${BASE_REF}"
      - name: Enforce CI event and concurrency policy
        run: python scripts/check_ci_event_policy.py
      - name: Test CI event and concurrency policy
        run: python -m pytest tests/test_ci_event_policy.py
      - name: Run permanent native architecture conformance preflight
        run: python scripts/repo.py conformance
