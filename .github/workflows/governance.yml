concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.12.0"
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Temporarily verify and commit target database readiness
        if: github.event_name == 'pull_request' && github.head_ref == 'repository-step-18-dev-up-reset' && github.actor != 'github-actions[bot]'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          CRM_RUN_LOCAL_DOCKER_ACCEPTANCE: "1"
          CRM_LOCAL_NAMESPACE: database-ready-${{ github.run_id }}
          CRM_LOCAL_POSTGRES_PORT: "55433"
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          implementation = Path('scripts/local_dev.py')
          content = implementation.read_text(encoding='utf-8')

          wait_ready = textwrap.dedent('''
              def wait_ready(self, config: DevConfig, attempts: int = 60) -> None:
                  database_query = (
                      "SELECT 1 FROM pg_database "
                      f"WHERE datname = '{config.database}';"
                  )
                  for attempt in range(attempts):
                      ready = self.execute(
                          (
                              "docker",
                              "exec",
                              config.container_name,
                              "pg_isready",
                              "--username",
                              config.admin_user,
                              "--dbname",
                              "postgres",
                          ),
                          None,
                      )
                      database_ready = False
                      if ready.returncode == 0:
                          database = self.execute(
                              (
                                  "docker",
                                  "exec",
                                  config.container_name,
                                  "psql",
                                  "--username",
                                  config.admin_user,
                                  "--dbname",
                                  "postgres",
                                  "--no-psqlrc",
                                  "--tuples-only",
                                  "--no-align",
                                  "--command",
                                  database_query,
                              ),
                              None,
                          )
                          database_ready = (
                              database.returncode == 0
                              and database.stdout.strip() == "1"
                          )
                      if database_ready:
                          return
                      container = self.inspect_container(config.container_name)
                      state = container.get("State") if container else None
                      status = state.get("Status") if isinstance(state, dict) else None
                      if status in {"dead", "exited", "removing"}:
                          raise LifecycleError(
                              "local PostgreSQL container stopped before readiness: "
                              f"{status}"
                          )
                      if attempt + 1 < attempts:
                          self.sleep(1.0)
                  raise LifecycleError(
                      "local PostgreSQL target database did not become ready within 60 seconds"
                  )
          ''').strip('\n')
          wait_ready = textwrap.indent(wait_ready, '    ') + '\n'
          content, count = re.subn(
              r'    def wait_ready\(self, config: DevConfig, attempts: int = 60\) -> None:\n.*?(?=\n\ndef _schema_inputs)',
              wait_ready.rstrip('\n'),
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected wait_ready once, found {count}')

          initialize = textwrap.dedent('''
              def _initialize(runtime: DockerRuntime, root: Path, config: DevConfig) -> int:
                  runtime.execute_sql(
                      config,
                      """
              DO $crm_local$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'crm_app_test') THEN
                  CREATE ROLE crm_app_test LOGIN PASSWORD 'crm_app_test';
                ELSE
                  ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test';
                END IF;
              END
              $crm_local$;
              """,
                  )
                  for relative in config.schema_paths:
                      runtime.execute_sql(
                          config,
                          (root / relative).read_text(encoding="utf-8"),
                      )
                  runtime.execute_sql(
                      config,
                      f"COMMENT ON DATABASE {config.database} IS '{_marker(config)}';\\n",
                  )
                  count = runtime.execute_sql(
                      config,
                      "SELECT count(*) FROM information_schema.tables "
                      "WHERE table_schema = 'crm';\\n",
                  )
                  try:
                      return int([line for line in count.splitlines() if line.strip()][-1])
                  except (IndexError, ValueError) as error:
                      raise LifecycleError(
                          "cannot verify initialized CRM table count"
                      ) from error
          ''').strip('\n') + '\n'
          content, count = re.subn(
              r'def _initialize\(runtime: DockerRuntime, root: Path, config: DevConfig\) -> int:\n.*?(?=\n\ndef _report)',
              initialize.rstrip('\n'),
              content,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected initialize once, found {count}')
          implementation.write_text(content, encoding='utf-8')

          tests = Path('tests/test_local_dev.py')
          content = tests.read_text(encoding='utf-8')
          marker = '    def test_fresh_up_then_unchanged_up_is_idempotent(self) -> None:\n'
          methods = textwrap.dedent('''
              def test_wait_ready_requires_the_target_database(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      prepare_root(root)
                      config = build_dev_config(
                          root,
                          environ={"CRM_LOCAL_NAMESPACE": "unit-ready"},
                      )
                      probes = 0
                      sleeps: list[float] = []
                      calls: list[list[str]] = []

                      def execute(command, input_text):
                          nonlocal probes
                          command = list(command)
                          calls.append(command)
                          if command[:3] == ["docker", "container", "inspect"]:
                              payload = [{"State": {"Running": True, "Status": "running"}}]
                              return subprocess.CompletedProcess(
                                  command,
                                  0,
                                  json.dumps(payload),
                                  "",
                              )
                          if "pg_isready" in command:
                              return subprocess.CompletedProcess(command, 0, "", "")
                          if "psql" in command and "--command" in command:
                              probes += 1
                              return subprocess.CompletedProcess(
                                  command,
                                  0,
                                  "1" if probes == 2 else "",
                                  "",
                              )
                          raise AssertionError(command)

                      runtime = DockerRuntime(
                          root,
                          execute=execute,
                          sleep=sleeps.append,
                      )
                      runtime.wait_ready(config, attempts=2)
                  self.assertEqual(probes, 2)
                  self.assertEqual(sleeps, [1.0])
                  psql_calls = [command for command in calls if "psql" in command]
                  self.assertEqual(len(psql_calls), 2)
                  for command in psql_calls:
                      self.assertEqual(command[command.index("--dbname") + 1], "postgres")

              def test_application_role_is_provisioned_before_first_migration(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      prepare_root(root)
                      runtime = FakeRuntime()
                      dev_up(
                          root,
                          runtime=runtime,
                          doctor_report={"ok": True},
                          environ={"CRM_LOCAL_NAMESPACE": "unit-role-order"},
                      )
                  self.assertIn("CREATE ROLE crm_app_test", runtime.sql[0])
                  self.assertEqual(runtime.sql[1], "CREATE SCHEMA crm;\\n")

          ''')
          methods = textwrap.indent(methods, '    ')
          if content.count(marker) != 1:
              raise SystemExit(
                  f'expected test insertion marker once, found {content.count(marker)}'
              )
          tests.write_text(content.replace(marker, methods + marker), encoding='utf-8')
          PY
          python -m unittest tests.test_local_dev
          python -m unittest tests.test_local_lifecycle_docker
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/local_dev.py tests/test_local_dev.py
          git diff --cached --quiet && { echo "No readiness update produced"; exit 1; }
          git commit -m "Wait for the target database before local migrations"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Enforce immutable module publication compatibility
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/check_module_compatibility.py --base-ref "origin/${BASE_REF}"
      - name: Enforce CI event and concurrency policy
        run: python scripts/check_ci_event_policy.py
      - name: Test CI event and concurrency policy
        run: python -m unittest tests.test_ci_event_policy
      - name: Enforce immutable third-party Action pinning
        run: python scripts/check_action_pinning.py
      - name: Test immutable third-party Action pinning
        run: python -m unittest tests.test_action_pinning
      - name: Test affected-scope analyzer
        run: python -m unittest tests.test_affected_scope
      - name: Test PostgreSQL process isolation policy
        run: python -m unittest tests.test_postgres_process_isolation
      - name: Test workspace complexity analyzer
        run: python -m unittest tests.test_workspace_analysis
      - name: Test workspace dependency and exception governance
        run: python -m unittest tests.test_workspace_governance
      - name: Enforce workspace dependency, crate and exception governance
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/analyze_workspace_governance.py --base-ref "origin/${BASE_REF}" --check
      - name: Test calibrated workspace dependency policies
        run: python -m unittest tests.test_workspace_dependency_policy
      - name: Enforce calibrated workspace dependency policies
        run: python scripts/check_workspace_dependency_policy.py --check
      - name: Test CI runtime telemetry analyzer
        run: python -m unittest tests.test_ci_telemetry
      - name: Run permanent native architecture conformance preflight
        run: python scripts/repo.py conformance
      - name: Run deterministic local PostgreSQL Docker acceptance
        env:
          CRM_RUN_LOCAL_DOCKER_ACCEPTANCE: "1"
          CRM_LOCAL_NAMESPACE: governance-${{ github.run_id }}
          CRM_LOCAL_POSTGRES_PORT: "55432"
        run: python -m unittest tests.test_local_lifecycle_docker
