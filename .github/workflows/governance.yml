name: Governance CI

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "architecture-governance.json"
      - "workspace-dependency-policy.json"
      - "affected-scope-policy.json"
      - "Makefile"
      - "contracts/**"
      - "crates/**/Cargo.toml"
      - "modules/**/Cargo.toml"
      - "crates/crm-application-composition/**"
      - "crates/crm-first-party-modules/**"
      - "crates/crm-module-manifest/**"
      - "schemas/**"
      - "modules/*/module.yaml"
      - "scripts/check_module_compatibility.py"
      - "scripts/check_production_route_classifications.py"
      - "scripts/check_native_module_composition.py"
      - "scripts/check_ci_event_policy.py"
      - "scripts/check_action_pinning.py"
      - "scripts/check_workspace_dependency_policy.py"
      - "scripts/affected_scope.py"
      - "scripts/analyze_workspace.py"
      - "scripts/analyze_workspace_governance.py"
      - "scripts/analyze_ci_telemetry.py"
      - "scripts/compile_module_manifest_ir.py"
      - "scripts/local_lifecycle.py"
      - "scripts/module_manifest_projection.py"
      - "scripts/validate_module_manifests.py"
      - "scripts/check_architecture.py"
      - "scripts/scaffold_module.py"
      - "scripts/repo.py"
      - "repository-packet.json"
      - "scripts/repository_navigation.py"
      - "tests/test_contract_bindings.py"
      - "tests/test_customer_privacy_architecture_freeze.py"
      - "tests/test_customer_privacy_contract_inventory.py"
      - "tests/test_customer_privacy_owner_scope_contracts.py"
      - "tests/test_ci_event_policy.py"
      - "tests/test_action_pinning.py"
      - "tests/test_affected_scope.py"
      - "tests/test_local_lifecycle.py"
      - "tests/test_workspace_analysis.py"
      - "tests/test_workspace_governance.py"
      - "tests/test_workspace_dependency_policy.py"
      - "tests/test_ci_telemetry.py"
      - "tests/test_module_compatibility.py"
      - "tests/test_module_manifest_validation.py"
      - "tests/test_module_scaffolding.py"
      - "tests/test_production_route_classifications.py"
      - "tests/test_native_module_composition.py"
      - "architecture-policy.json"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "architecture-governance.json"
      - "workspace-dependency-policy.json"
      - "affected-scope-policy.json"
      - "Makefile"
      - "contracts/**"
      - "crates/**/Cargo.toml"
      - "modules/**/Cargo.toml"
      - "crates/crm-application-composition/**"
      - "crates/crm-first-party-modules/**"
      - "crates/crm-module-manifest/**"
      - "schemas/**"
      - "modules/*/module.yaml"
      - "scripts/check_module_compatibility.py"
      - "scripts/check_production_route_classifications.py"
      - "scripts/check_native_module_composition.py"
      - "scripts/check_ci_event_policy.py"
      - "scripts/check_action_pinning.py"
      - "scripts/check_workspace_dependency_policy.py"
      - "scripts/affected_scope.py"
      - "scripts/analyze_workspace.py"
      - "scripts/analyze_workspace_governance.py"
      - "scripts/analyze_ci_telemetry.py"
      - "scripts/compile_module_manifest_ir.py"
      - "scripts/local_lifecycle.py"
      - "scripts/module_manifest_projection.py"
      - "scripts/validate_module_manifests.py"
      - "scripts/check_architecture.py"
      - "scripts/scaffold_module.py"
      - "scripts/repo.py"
      - "repository-packet.json"
      - "scripts/repository_navigation.py"
      - "tests/test_contract_bindings.py"
      - "tests/test_customer_privacy_architecture_freeze.py"
      - "tests/test_customer_privacy_contract_inventory.py"
      - "tests/test_customer_privacy_owner_scope_contracts.py"
      - "tests/test_ci_event_policy.py"
      - "tests/test_action_pinning.py"
      - "tests/test_affected_scope.py"
      - "tests/test_local_lifecycle.py"
      - "tests/test_workspace_analysis.py"
      - "tests/test_workspace_governance.py"
      - "tests/test_workspace_dependency_policy.py"
      - "tests/test_ci_telemetry.py"
      - "tests/test_module_compatibility.py"
      - "tests/test_module_manifest_validation.py"
      - "tests/test_module_scaffolding.py"
      - "tests/test_production_route_classifications.py"
      - "tests/test_native_module_composition.py"
      - "architecture-policy.json"
      - "requirements-dev.txt"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Uses the single canonical packageManager version from root package.json.
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Enforce immutable module publication compatibility
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/check_module_compatibility.py --base-ref "origin/${BASE_REF}"
      - name: Enforce CI event and concurrency policy
        run: python scripts/check_ci_event_policy.py
      - name: Test CI event and concurrency policy
        run: python -m unittest tests.test_ci_event_policy
      - name: Enforce immutable third-party Action pinning
        run: python scripts/check_action_pinning.py
      - name: Test immutable third-party Action pinning
        run: python -m unittest tests.test_action_pinning
      - name: Test affected-scope analyzer
        run: python -m unittest tests.test_affected_scope
      - name: Test workspace complexity analyzer
        run: python -m unittest tests.test_workspace_analysis
      - name: Test workspace dependency and exception governance
        run: python -m unittest tests.test_workspace_governance
      - name: Enforce workspace dependency, crate and exception governance
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/analyze_workspace_governance.py --base-ref "origin/${BASE_REF}" --check
      - name: Test calibrated workspace dependency policies
        run: python -m unittest tests.test_workspace_dependency_policy
      - name: Enforce calibrated workspace dependency policies
        run: python scripts/check_workspace_dependency_policy.py --check
      - name: Test CI runtime telemetry analyzer
        run: python -m unittest tests.test_ci_telemetry
      - name: Run permanent native architecture conformance preflight
        run: python scripts/repo.py conformance

