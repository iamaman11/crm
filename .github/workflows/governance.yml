concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Enforce immutable module publication compatibility
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/check_module_compatibility.py --base-ref "origin/${BASE_REF}"
      - name: Enforce CI event and concurrency policy
        run: python scripts/check_ci_event_policy.py
      - name: Test CI event and concurrency policy
        run: python -m unittest tests.test_ci_event_policy
      - name: Enforce immutable third-party Action pinning
        run: python scripts/check_action_pinning.py
      - name: Test immutable third-party Action pinning
        run: python -m unittest tests.test_action_pinning
      - name: Test affected-scope analyzer
        run: python -m unittest tests.test_affected_scope
      - name: Test PostgreSQL process isolation policy
        run: python -m unittest tests.test_postgres_process_isolation
      - name: Test workspace complexity analyzer
        run: python -m unittest tests.test_workspace_analysis
      - name: Test CI runtime telemetry analyzer
        run: python -m unittest tests.test_ci_telemetry
      - name: Run permanent native architecture conformance preflight
        run: python scripts/repo.py conformance

  one_time_party_relationships_docs_sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 184 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact documentation head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
      - name: Synchronize accepted documentation
        run: python .github/scripts/party_relationships_post_merge_doc_sync.py
      - name: Restore permanent workflow and publish docs-only result
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- .github/workflows/governance.yml
          rm -f .github/workflows/one-time-party-relationships-post-merge-doc-sync.yml
          rm -f .github/workflows/one-time-party-relationships-post-merge-doc-sync-runner.yml
          rm -f .github/scripts/party_relationships_post_merge_doc_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize party relationships privacy acceptance"
          git push origin "HEAD:${HEAD_REF}"
