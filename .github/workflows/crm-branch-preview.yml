name: CRM Branch Preview

# Trusted control plane: runs from default-branch workflow source after a
# successful feature Gate A. It never executes branch-controlled scripts.
on:
  workflow_run:
    workflows: ["Cloudflare CRM Spike CI"]
    types: [completed]
    branches:
      - 'feat/parallel/**'

permissions:
  actions: read
  contents: read

jobs:
  preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'feat/parallel/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    environment: crm-dev
    timeout-minutes: 45
    outputs:
      worker_name: ${{ steps.preview.outputs.worker_name }}
      database_name: ${{ steps.preview.outputs.database_name }}
      database_id: ${{ steps.preview.outputs.database_id }}
      preview_host: ${{ steps.preview.outputs.preview_host }}
      source_sha: ${{ steps.preview.outputs.source_sha }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Install pinned workspace tools
        run: |
          npm install --global pnpm@12.21.0
          pnpm --version | grep -Fx '12.21.0'
          pnpm install --frozen-lockfile
      - name: Validate trusted Gate A run identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_WORKFLOW_ID" = "410642125"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_BRANCH" == feat/parallel/* ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test "$GITHUB_REPOSITORY" = "iamaman11/crm"
          echo "Validated successful feature Gate A run $SOURCE_RUN_ID attempt $SOURCE_RUN_ATTEMPT at $SOURCE_SHA"
      - name: Download exact sealed Gate A artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="crm-native-bundle-${SOURCE_SHA}-attempt-${SOURCE_RUN_ATTEMPT}"
          mkdir -p apps/cloudflare-crm/.release/preview
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" --dir apps/cloudflare-crm/.release/preview
          test "$(cat apps/cloudflare-crm/.release/preview/.release/source-sha.txt)" = "$SOURCE_SHA"
          sha256sum --check --strict apps/cloudflare-crm/.release/preview/.release/compiled-sha256.txt
          SOURCE_SHA="$SOURCE_SHA" node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const p=JSON.parse(readFileSync("apps/cloudflare-crm/.release/preview/.release/provenance.json","utf8"));
            assert.equal(p.tested_sha,process.env.SOURCE_SHA);
            assert.equal(p.production_features.join(","),"native");
            assert.equal(p.production_access_probe.source_sha,process.env.SOURCE_SHA);
            assert.equal(p.production_access_probe.compiled_router_policy_parity,true);
          '
          test -s apps/cloudflare-crm/.release/preview/dist/index.html
          test -s apps/cloudflare-crm/.release/preview/rust-party/build/index.js
          test -s apps/cloudflare-crm/.release/preview/rust-party/build/index_bg.wasm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .preview-source
          fetch-depth: 1
          persist-credentials: false
      - name: Validate migration-only source input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .preview-source rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readdirSync,lstatSync} from "node:fs";
            const dir=".preview-source/apps/cloudflare-crm/migrations";
            const files=readdirSync(dir).filter(x=>x.endsWith(".sql")).sort();
            assert.equal(files.length,43,"preview requires the complete migration chain 0001..0043");
            for(let i=0;i<files.length;i++){
              assert.equal(files[i].slice(0,4),String(i+1).padStart(4,"0"),"migration chain must be contiguous");
              assert.ok(lstatSync(dir+"/"+files[i]).isFile(),"migration input must be a regular file");
            }
          '
      - name: Create isolated physical D1 and trusted preview config
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from "node:fs";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const run=process.env.SOURCE_RUN_ID;
          const attempt=process.env.SOURCE_RUN_ATTEMPT;
          const sha=process.env.SOURCE_SHA;
          const workerName=`crm-preview-${run}-${attempt}`;
          const databaseName=workerName;
          const previewHost=`${workerName}.crm-5bd5e1e1.workers.dev`;
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`,{
            method:"POST",
            headers:{authorization:`Bearer ${token}`,"content-type":"application/json"},
            body:JSON.stringify({name:databaseName,jurisdiction:"eu"})
          });
          const payload=await response.json();
          if(!response.ok||payload.success!==true||!payload.result?.uuid){
            throw new Error("Isolated D1 creation failed: HTTP "+response.status+" "+JSON.stringify(payload.errors||[]));
          }
          const databaseId=payload.result.uuid;
          const config={
            name:workerName,
            main:"./.release/preview/rust-party/build/index.js",
            workers_dev:false,
            preview_urls:false,
            account_id:account,
            compatibility_date:"2026-11-07",
            d1_databases:[{
              binding:"DB",
              database_name:databaseName,
              database_id:databaseId,
              migrations_dir:"../../.preview-source/apps/cloudflare-crm/migrations"
            }],
            assets:{
              directory:"./.release/preview/dist",
              binding:"ASSETS",
              not_found_handling:"single-page-application",
              run_worker_first:["/api/*","/crm.*/*"]
            },
            version_metadata:{binding:"CF_VERSION_METADATA"},
            observability:{
              enabled:true,
              redact_query_string:true,
              logs:{enabled:true,head_sampling_rate:1,invocation_logs:false},
              traces:{enabled:true,head_sampling_rate:1}
            },
            vars:{GIT_SHA:sha}
          };
          writeFileSync("apps/cloudflare-crm/preview-wrangler.jsonc",JSON.stringify(config,null,2)+"\n");
          const out=[
            `worker_name=${workerName}`,
            `database_name=${databaseName}`,
            `database_id=${databaseId}`,
            `preview_host=${previewHost}`,
            `source_sha=${sha}`
          ].join("\n")+"\n";
          writeFileSync(process.env.GITHUB_OUTPUT,out,{flag:"a"});
          writeFileSync(process.env.RUNNER_TEMP+"/crm-preview-lease.json",JSON.stringify({
            worker_name:workerName,database_name:databaseName,database_id:databaseId,
            preview_host:previewHost,source_sha:sha,source_run_id:run,
            source_run_attempt:Number(attempt),created_at:new Date().toISOString(),
            expires_after_minutes:30
          },null,2)+"\n");
          NODE
      - name: Apply exact source migrations to isolated D1
        working-directory: apps/cloudflare-crm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
        run: pnpm exec wrangler d1 migrations apply "${{ steps.preview.outputs.database_name }}" --remote --config preview-wrangler.jsonc --yes
      - name: Deploy exact sealed Worker and React assets without public route
        working-directory: apps/cloudflare-crm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
        run: pnpm exec wrangler deploy --config preview-wrangler.jsonc
      - name: Preserve preview lease evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-branch-preview-lease-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/crm-preview-lease.json
          if-no-files-found: error
          retention-days: 1
      - name: Record preview lease in job summary
        shell: bash
        run: |
          {
            echo "## Isolated CRM branch preview provisioned"
            echo "- Source SHA: `$SOURCE_SHA`"
            echo "- Worker: `${{ steps.preview.outputs.worker_name }}`"
            echo "- Physical D1: `${{ steps.preview.outputs.database_name }}` (`${{ steps.preview.outputs.database_id }}`)"
            echo "- Host reserved: `${{ steps.preview.outputs.preview_host }}`"
            echo "- Worker remains private until the trusted coordinator adds the Access destination and enables its workers.dev subdomain."
            echo "- Lease: 30 minutes; cleanup runs in this job even after failure/cancellation."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Hold bounded preview lease for independent Browser MCP Gate B
        if: ${{ steps.preview.outcome == 'success' }}
        run: sleep 1800
      - name: Remove temporary Access grants, Worker and physical D1
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const suffix=`${process.env.SOURCE_RUN_ID}-${process.env.SOURCE_RUN_ATTEMPT}`;
          const workerName=`crm-preview-${suffix}`;
          const previewHost=`${workerName}.crm-5bd5e1e1.workers.dev`;
          async function cf(path,method="GET",body){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{
              method,headers:{authorization:`Bearer ${token}`,...(body?{"content-type":"application/json"}:{})},
              ...(body?{body:JSON.stringify(body)}:{})
            });
            const p=r.status===204?{success:true}:await r.json();
            if(!r.ok||p.success!==true)throw new Error(`Cloudflare cleanup ${method} ${path} HTTP ${r.status}: ${JSON.stringify(p.errors||[])}`);
            return p.result;
          }
          const appId="2d57d620-2371-4454-a533-150f72e732b7";
          const app=await cf(`/access/apps/${appId}`);
          const destinations=(app.destinations||[]).filter(x=>x.uri!==previewHost);
          if(destinations.length!==(app.destinations||[]).length){
            const next={...app,destinations};
            for(const k of ["id","uid","aud","created_at","updated_at","policies","self_hosted_domains"])delete next[k];
            await cf(`/access/apps/${appId}`,"PUT",next);
          }
          const policies=await cf(`/access/apps/${appId}/policies?per_page=100`);
          for(const p of policies||[]){
            if(p.name===`crm-preview-${suffix}`)await cf(`/access/apps/${appId}/policies/${p.id}`,"DELETE");
          }
          const tokens=await cf("/access/service_tokens?per_page=100");
          for(const t of tokens||[]){
            if(t.name===`crm-preview-${suffix}`)await cf(`/access/service_tokens/${t.id}`,"DELETE");
          }
          const workers=await cf("/workers/scripts?per_page=100");
          if((workers||[]).some(w=>w.id===workerName))await cf(`/workers/scripts/${workerName}`,"DELETE");
          const databases=await cf("/d1/database?per_page=100");
          const db=(databases||[]).find(x=>x.name===workerName);
          if(db)await cf(`/d1/database/${db.uuid}`,"DELETE");
          console.log(JSON.stringify({event:"crm.branch-preview-cleanup",worker:workerName,host:previewHost,worker_deleted:true,database_deleted:!!db,access_destination_removed:true,temporary_access_grants_removed:true}));
          NODE
