name: CRM Branch Preview

# The coordinator launches this workflow from main for a reviewed Writer Gate A.
# Only the sealed Worker, assets and migration blobs come from the writer SHA.
on:
  workflow_dispatch:
    inputs:
      gate_a_run_id:
        description: Successful Writer Gate A run ID
        required: true
        type: string
      automation_cron:
        description: Enable the Automation five-minute Cron
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: crm-writer-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && vars.CRM_BRANCH_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-26.04
    environment: crm-preview
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ inputs.gate_a_run_id }}
      PREVIEW_CRON: ${{ inputs.automation_cron }}
      PREVIEW_WORKER: crm-writer-preview
      PREVIEW_HOST: crm-writer-preview.crm-5bd5e1e1.workers.dev
      CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Verify exact Writer Gate A and trusted migration base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          sha=$(jq -er '
            select(.workflow_id==410642125 and .event=="push" and .conclusion=="success"
              and .status=="completed" and .head_repository.full_name=="iamaman11/crm"
              and (.head_branch|test("^feat/parallel/[a-zA-Z0-9/_-]+$")))
            | .head_sha | select(test("^[0-9a-f]{40}$"))
          ' <<< "$run")
          attempt=$(jq -er '.run_attempt|tostring|select(test("^[1-9][0-9]*$"))' <<< "$run")
          git fetch --no-tags origin "$sha" refs/heads/dev:refs/remotes/origin/dev
          base=$(git rev-parse origin/dev)
          git merge-base --is-ancestor "$base" "$sha"
          git diff --exit-code "$base" "$sha" -- .github/workflows/cloudflare-crm-spike.yml
          {
            echo "SOURCE_SHA=$sha"
            echo "SOURCE_RUN_ATTEMPT=$attempt"
            echo "BASE_SHA=$base"
          } >> "$GITHUB_ENV"
      - name: Restore and verify the sealed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle=apps/cloudflare-crm/.release/preview
          mkdir -p "$bundle"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "crm-native-bundle-$SOURCE_SHA-attempt-$SOURCE_RUN_ATTEMPT" --dir "$bundle"
          test "$(cat "$bundle/.release/source-sha.txt")" = "$SOURCE_SHA"
          (cd "$bundle" && sha256sum --check --strict .release/compiled-sha256.txt)
          tree=$(git rev-parse "$SOURCE_SHA^{tree}")
          jq -e --arg sha "$SOURCE_SHA" --arg tree "$tree" '
            .tested_sha==$sha and .tree==$tree and .production_features==["native"]
            and (.production_access_probe |
              .source_sha==$sha and .result=="PASS" and
              .compiled_router_policy_parity and .configured_audience_enforced)
          ' "$bundle/.release/provenance.json" > /dev/null
          test -s "$bundle/dist/index.html"
          test -s "$bundle/rust-party/build/index.js"
          test -s "$bundle/rust-party/build/index_bg.wasm"
      - name: Copy validated migration blobs from the exact source tree
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          import {mkdirSync,writeFileSync} from "node:fs";
          const dir = "apps/cloudflare-crm/migrations";
          const target = "apps/cloudflare-crm/.release/preview/migrations";
          function migrations(sha) {
            const entries = execFileSync("git", ["ls-tree", "-z", sha + ":" + dir], {encoding:"utf8"});
            const result = new Map();
            const numbers = new Set();
            for (const entry of entries.split("\0").filter(Boolean)) {
              const match = /^100644 blob ([0-9a-f]{40})\t((\d{4})_[a-z0-9_]+\.sql)$/.exec(entry);
              assert.ok(match, "Preview migration must be a regular numbered SQL file");
              const [,blob,name,number] = match;
              assert.ok(!numbers.has(number), "Duplicate migration number: " + number);
              numbers.add(number);
              result.set(name,blob);
            }
            assert.ok(result.size, "Migration tree is empty");
            return result;
          }
          const base = migrations(process.env.BASE_SHA);
          const source = migrations(process.env.SOURCE_SHA);
          const lastBase = [...base.keys()].sort().at(-1);
          for (const [name,blob] of base) {
            assert.equal(source.get(name),blob,"Base migration changed: " + name);
          }
          for (const name of source.keys()) {
            assert.ok(base.has(name) || name.slice(0,4) > lastBase.slice(0,4),
              "New migration must follow the base: " + name);
          }
          if (process.env.PREVIEW_CRON === "true") {
            assert.ok(source.has("0044_activity_automation_dispatch.sql"),
              "Automation Cron requires the dispatch migration");
          }
          mkdirSync(target);
          for (const [name,blob] of source) {
            writeFileSync(target + "/" + name,execFileSync("git",["cat-file","blob",blob]));
          }
          console.log("Verified " + source.size + " migrations against " + process.env.BASE_SHA);
          NODE
      - name: Install pinned workspace tools from main
        run: |
          npm install --global pnpm@12.21.0
          pnpm --version | grep -Fx '12.21.0'
          pnpm install --frozen-lockfile
      - name: Verify dedicated Access application and create private resources
        id: provision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          ACCESS_APP_ID: ${{ vars.CRM_PREVIEW_ACCESS_APP_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          import {appendFileSync,writeFileSync} from "node:fs";
          const env = process.env;
          const api = "https://api.cloudflare.com/client/v4/accounts/" + env.CLOUDFLARE_ACCOUNT_ID;
          const headers = {authorization:"Bearer " + env.CLOUDFLARE_API_TOKEN,"content-type":"application/json"};
          async function request(path,options) {
            return fetch(api + path,{headers,signal:AbortSignal.timeout(20000),...options});
          }
          async function result(response) {
            assert.ok(response.ok, "Cloudflare API HTTP " + response.status);
            const json = await response.json();
            assert.equal(json.success,true,"Cloudflare API rejected the operation");
            return json.result;
          }
          assert.ok(env.CLOUDFLARE_API_TOKEN,"Missing dedicated preview API token");
          assert.match(env.ACCESS_APP_ID ?? "",/^[0-9a-f-]{32,36}$/);
          const app = await result(await request("/access/apps/" + env.ACCESS_APP_ID));
          assert.equal(app.type,"self_hosted");
          const domains = [...new Set([app.domain,...(app.destinations ?? []).map(item => item.uri)].filter(Boolean))];
          assert.deepEqual(domains,[env.PREVIEW_HOST],"Preview Access app must have exactly the preview hostname");
          assert.ok((app.destinations ?? []).every(item => item.type === "public" &&
            item.uri === env.PREVIEW_HOST && !item.overrides?.length),
            "Preview Access app contains an unexpected destination");
          const policies = await result(await request("/access/apps/" + env.ACCESS_APP_ID + "/policies"));
          assert.ok(policies.length && policies.every(policy => policy.decision === "non_identity" &&
            policy.include.length && policy.include.every(rule => rule.service_token?.token_id)),
            "Preview Access may only admit explicit service tokens");
          const dev = JSON.parse(execFileSync("git",["show",env.BASE_SHA + ":apps/cloudflare-crm/wrangler.jsonc"],{encoding:"utf8"}));
          assert.match(dev.vars?.CRM_ACCESS_AUDIENCE ?? "",/^[0-9a-f]{64}$/);
          assert.match(app.aud ?? "",/^[0-9a-f]{64}$/);
          assert.notEqual(app.aud,dev.vars.CRM_ACCESS_AUDIENCE,"Preview and dev Access audiences must differ");
          const worker = await request("/workers/scripts/" + env.PREVIEW_WORKER + "/settings");
          assert.equal(worker.status,404,"Preview Worker already exists or its ownership could not be verified");

          const name = "crm-writer-preview-" + env.GITHUB_RUN_ID + "-" + env.GITHUB_RUN_ATTEMPT;
          const database = await result(await request("/d1/database",{
            method:"POST",body:JSON.stringify({name,jurisdiction:"eu"})
          }));
          assert.match(database.uuid ?? "",/^[0-9a-f-]{36}$/);
          appendFileSync(env.GITHUB_OUTPUT,"database_name=" + name + "\ndatabase_id=" + database.uuid + "\n");
          const config = {
            name:env.PREVIEW_WORKER,main:"./.release/preview/rust-party/build/index.js",
            workers_dev:false,preview_urls:false,
            account_id:env.CLOUDFLARE_ACCOUNT_ID,compatibility_date:dev.compatibility_date,
            d1_databases:[{binding:"DB",database_name:name,database_id:database.uuid,
              migrations_dir:".release/preview/migrations"}],
            assets:{...dev.assets,directory:"./.release/preview/dist"},
            version_metadata:dev.version_metadata,observability:dev.observability,
            vars:{GIT_SHA:env.SOURCE_SHA,CRM_ACCESS_AUDIENCE:app.aud},
            ...(env.PREVIEW_CRON === "true" ? {triggers:{crons:["*/5 * * * *"]}} : {})
          };
          writeFileSync("apps/cloudflare-crm/preview-wrangler.jsonc",JSON.stringify(config,null,2) + "\n");
          NODE
      - name: Apply migrations and enroll dedicated preview service identities
        working-directory: apps/cloudflare-crm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          PREVIEW_DATABASE: ${{ steps.provision.outputs.database_name }}
          PREVIEW_DATABASE_ID: ${{ steps.provision.outputs.database_id }}
          CLIENT_A: ${{ secrets.CRM_PREVIEW_A_CLIENT_ID }}
          CLIENT_B: ${{ secrets.CRM_PREVIEW_B_CLIENT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply "$PREVIEW_DATABASE" --remote --config preview-wrangler.jsonc --force
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const env = process.env;
          const [a,b] = [env.CLIENT_A,env.CLIENT_B].map(value => value?.toLowerCase());
          assert.match(a ?? "",/^[a-z0-9.-]{8,120}\.access$/);
          assert.match(b ?? "",/^[a-z0-9.-]{8,120}\.access$/);
          assert.notEqual(a,b);
          const batch = [[a,"a"],[b,"b"]].flatMap(([id,suffix]) => [
            {sql:"INSERT INTO crm_tenants(id,name) VALUES (?,?)",params:["writer-" + suffix,"Writer preview " + suffix]},
            {sql:"INSERT INTO crm_users(email,tenant_id,role,active) VALUES (?,?,'admin',1)",
              params:["service:" + id,"writer-" + suffix]},
          ]);
          const url = "https://api.cloudflare.com/client/v4/accounts/" + env.CLOUDFLARE_ACCOUNT_ID +
            "/d1/database/" + env.PREVIEW_DATABASE_ID + "/query";
          const response = await fetch(url,{method:"POST",
            headers:{authorization:"Bearer " + env.CLOUDFLARE_API_TOKEN,"content-type":"application/json"},
            body:JSON.stringify({batch}),signal:AbortSignal.timeout(20000)});
          assert.ok(response.ok,"Preview identity setup HTTP " + response.status);
          const body = await response.json();
          assert.ok(body.success && body.result.length === batch.length &&
            body.result.every(write => write.success),"Preview identity setup failed");
          NODE
      - name: Deploy sealed Worker privately
        id: deploy
        working-directory: apps/cloudflare-crm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config preview-wrangler.jsonc
      - name: Read back the Worker bindings and verify Access at the edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          PREVIEW_DATABASE_ID: ${{ steps.provision.outputs.database_id }}
          CLIENT_A: ${{ secrets.CRM_PREVIEW_A_CLIENT_ID }}
          SECRET_A: ${{ secrets.CRM_PREVIEW_A_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {readFileSync,writeFileSync,appendFileSync} from "node:fs";
          import {setTimeout as pause} from "node:timers/promises";
          const env = process.env;
          const config = JSON.parse(readFileSync("apps/cloudflare-crm/preview-wrangler.jsonc","utf8"));
          const api = "https://api.cloudflare.com/client/v4/accounts/" + env.CLOUDFLARE_ACCOUNT_ID +
            "/workers/scripts/" + env.PREVIEW_WORKER;
          async function cf(path,body) {
            const response = await fetch(api + path,{
              headers:{authorization:"Bearer " + env.CLOUDFLARE_API_TOKEN,"content-type":"application/json"},
              ...(body ? {method:"POST",body:JSON.stringify(body)} : {}),signal:AbortSignal.timeout(20000)
            });
            assert.ok(response.ok,"Preview Worker API HTTP " + response.status);
            const json = await response.json();
            assert.equal(json.success,true,"Preview Worker API rejected operation");
            return json.result;
          }
          assert.ok(env.CLIENT_A && env.SECRET_A,"Missing dedicated preview Access credentials");
          const {deployments} = await cf("/deployments");
          const [active] = deployments;
          assert.equal(active.versions.length,1);
          const activeVersion = active.versions[0];
          assert.equal(activeVersion.percentage,100);
          const version = activeVersion.version_id;
          assert.match(version,/^[0-9a-f-]{36}$/);
          const {resources} = await cf("/versions/" + version);
          assert.equal(resources.bindings.find(binding => binding.name === "DB")?.id,env.PREVIEW_DATABASE_ID);
          assert.equal(resources.bindings.find(binding => binding.name === "GIT_SHA")?.text,env.SOURCE_SHA);
          assert.equal(resources.bindings.find(binding => binding.name === "CRM_ACCESS_AUDIENCE")?.text,
            config.vars.CRM_ACCESS_AUDIENCE);
          if (env.PREVIEW_CRON === "true") {
            const schedules = await cf("/schedules");
            assert.deepEqual(schedules.schedules.map(schedule => schedule.cron),["*/5 * * * *"]);
          }
          await cf("/subdomain",{enabled:true,previews_enabled:false});
          const url = "https://" + env.PREVIEW_HOST;
          const auth = {"cf-access-client-id":env.CLIENT_A,"cf-access-client-secret":env.SECRET_A};
          let accepted = false;
          for (let attempt = 0; attempt < 20; attempt++) {
            const options = {redirect:"manual",signal:AbortSignal.timeout(5000)};
            const anon = await fetch(url + "/",options);
            assert.ok(!anon.ok,"Unauthenticated preview asset is public");
            const location = anon.headers.get("location");
            const accessDenied = (anon.status === 302 && location?.startsWith("https://royal-limit-ea43.cloudflareaccess.com/")) ||
              (anon.status === 403 && !anon.headers.has("x-crm-source-sha"));
            const signed = await fetch(url + "/api/version",{...options,headers:auth});
            if (accessDenied && signed.ok && signed.headers.get("x-crm-source-sha") === env.SOURCE_SHA) {
              accepted = true;
              break;
            }
            await pause(2000);
          }
          assert.ok(accepted,"Preview signed Access or anonymous denial could not be verified");
          const lease = {url,source_sha:env.SOURCE_SHA,base_sha:env.BASE_SHA,worker_version:version,
            database_id:env.PREVIEW_DATABASE_ID,cron:env.PREVIEW_CRON === "true",lease_minutes:30};
          writeFileSync(env.RUNNER_TEMP + "/crm-preview-lease.json",JSON.stringify(lease,null,2));
          appendFileSync(env.GITHUB_STEP_SUMMARY,"### Writer preview ready\n\n" +
            "URL: " + url + "\n\nSource SHA: `" + env.SOURCE_SHA + "`\n\nWorker: `" + version + "`\n");
          NODE
      - name: Preserve exact preview lease evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-writer-preview-lease
          path: ${{ runner.temp }}/crm-preview-lease.json
          if-no-files-found: error
          retention-days: 1
      - name: Hold preview for independent Writer Gate B
        run: sleep 1800
      - name: Record physical D1 audit and receipt evidence
        working-directory: apps/cloudflare-crm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          PREVIEW_DATABASE: ${{ steps.provision.outputs.database_name }}
        run: |
          set -euo pipefail
          readback() {
            pnpm exec wrangler d1 execute "$PREVIEW_DATABASE" --remote --config preview-wrangler.jsonc \
              --json --command "$1" > "$RUNNER_TEMP/crm-preview-$2.json"
          }
          readback "SELECT tenant_id, action, request_id FROM crm_audit WHERE tenant_id IN ('writer-a','writer-b') ORDER BY created_at,id" audit
          if [[ "$PREVIEW_CRON" == true ]]; then
            readback "SELECT tenant, source_type, rule_version, status, original_request_id, task_request_id, cancel_request_id, attempt_count FROM crm_activity_automation_runs WHERE tenant IN ('writer-a','writer-b') ORDER BY seq" automation
          fi
          if [[ -f .release/preview/migrations/0043_party_import_source_identity.sql ]]; then
            readback "SELECT tenant, request_id, row_count FROM crm_party_import_receipts WHERE tenant IN ('writer-a','writer-b') ORDER BY request_id" csv
          fi
      - name: Preserve preview physical D1 evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-writer-preview-d1
          path: ${{ runner.temp }}/crm-preview-*.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove writer Worker and lease D1
        if: always() && steps.provision.outputs.database_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          PREVIEW_DATABASE_ID: ${{ steps.provision.outputs.database_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const env = process.env;
          const api = "https://api.cloudflare.com/client/v4/accounts/" + env.CLOUDFLARE_ACCOUNT_ID;
          async function remove(path) {
            const response = await fetch(api + path,{method:"DELETE",
              headers:{authorization:"Bearer " + env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});
            if (response.status === 404) return;
            assert.ok(response.ok,"Preview cleanup HTTP " + response.status);
            assert.equal((await response.json()).success,true,"Preview cleanup failed");
          }
          const errors = [];
          if (["success","failure","cancelled"].includes(env.DEPLOY_OUTCOME)) {
            await remove("/workers/scripts/" + env.PREVIEW_WORKER).catch(error => errors.push(error));
          }
          await remove("/d1/database/" + env.PREVIEW_DATABASE_ID).catch(error => errors.push(error));
          if (errors.length) throw new AggregateError(errors,"Preview cleanup did not finish");
          NODE
