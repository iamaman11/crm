name: CRM Branch Preview

# Coordinator-only control plane. A human dispatches one exact successful
# Writer Gate A run from main; this workflow never executes branch scripts.
on:
  push:
    branches:
      - 'ops/preview-control-plane-20261128'
    paths:
      - '.github/workflows/crm-branch-preview.yml'
  workflow_dispatch:
    inputs:
      source_branch:
        description: Exact allowlisted Writer branch
        required: true
        type: choice
        options:
          - feat/parallel/source-identity
          - feat/parallel/codex-automation-dispatch-20261128
      source_run_id:
        description: Successful Cloudflare CRM Spike CI run ID
        required: true
        type: string
      source_run_attempt:
        description: Successful Gate A attempt number
        required: true
        type: string
      source_sha:
        description: Exact 40-character SHA tested by Gate A
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  workflow_lint:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate trusted preview workflow with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color -ignore 'label "ubuntu-26.04" is unknown' .github/workflows/crm-branch-preview.yml

  preflight:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'iamaman11' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
      source_branch: ${{ steps.gate.outputs.source_branch }}
      source_run_id: ${{ steps.gate.outputs.source_run_id }}
      source_run_attempt: ${{ steps.gate.outputs.source_run_attempt }}
      artifact_name: ${{ steps.gate.outputs.artifact_name }}
      preview_slot: ${{ steps.gate.outputs.preview_slot }}
      worker_name: ${{ steps.gate.outputs.worker_name }}
      preview_host: ${{ steps.gate.outputs.preview_host }}
      expected_migration: ${{ steps.gate.outputs.expected_migration }}
      cron_schedule: ${{ steps.gate.outputs.cron_schedule }}
      production_access_audience: ${{ steps.source.outputs.production_access_audience }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Validate exact successful Writer Gate A run and sealed artifact
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {writeFileSync} from "node:fs";
          const repo = process.env.GITHUB_REPOSITORY;
          const runId = process.env.SOURCE_RUN_ID;
          const attempt = process.env.SOURCE_RUN_ATTEMPT;
          const sha = process.env.SOURCE_SHA;
          const branch = process.env.SOURCE_BRANCH;
          assert.equal(repo, "iamaman11/crm");
          assert.match(runId, /^[0-9]+$/);
          assert.match(attempt, /^[1-9][0-9]*$/);
          assert.match(sha, /^[0-9a-f]{40}$/);
          const targets = {
            "feat/parallel/source-identity": {
              slot: "1",
              worker: "crm-writer-preview-1",
              host: "crm-writer-preview-1.crm-5bd5e1e1.workers.dev",
              migration: "0043_party_import_source_identity.sql",
              cron: "",
            },
            "feat/parallel/codex-automation-dispatch-20261128": {
              slot: "2",
              worker: "crm-writer-preview-2",
              host: "crm-writer-preview-2.crm-5bd5e1e1.workers.dev",
              migration: "0044_activity_automation_dispatch.sql",
              cron: "*/5 * * * *",
            },
          };
          const target = targets[branch];
          assert.ok(target, "source branch is not an explicitly approved preview writer");
          const headers = {
            authorization: "Bearer " + process.env.GH_TOKEN,
            accept: "application/vnd.github+json",
            "x-github-api-version": "2022-11-28",
          };
          const runResponse = await fetch(
            "https://api.github.com/repos/" + repo + "/actions/runs/" + runId,
            {headers},
          );
          const run = await runResponse.json();
          assert.ok(runResponse.ok, "GitHub could not read the selected Gate A run");
          assert.equal(run.id, Number(runId));
          assert.equal(run.workflow_id, 410642125);
          assert.equal(run.path, ".github/workflows/cloudflare-crm-spike.yml");
          assert.equal(run.event, "push");
          assert.equal(run.status, "completed");
          assert.equal(run.conclusion, "success");
          assert.equal(run.run_attempt, Number(attempt));
          assert.equal(run.head_sha, sha);
          assert.equal(run.head_branch, branch);
          assert.equal(run.repository?.full_name, repo);
          assert.equal(run.head_repository?.full_name, repo,
            "fork-originated runs are never eligible for preview credentials");
          const branchResponse = await fetch(
            "https://api.github.com/repos/" + repo + "/branches/" + encodeURIComponent(branch),
            {headers},
          );
          const branchInfo = await branchResponse.json();
          assert.ok(branchResponse.ok, "GitHub could not read the selected source branch");
          assert.equal(branchInfo.commit?.sha, sha,
            "the selected Gate A SHA is stale because the source branch has advanced");
          const artifactName = "crm-native-bundle-" + sha + "-attempt-" + attempt;
          const artifactResponse = await fetch(
            "https://api.github.com/repos/" + repo + "/actions/runs/" + runId + "/artifacts?per_page=100",
            {headers},
          );
          const artifacts = await artifactResponse.json();
          assert.ok(artifactResponse.ok, "GitHub could not read Gate A artifacts");
          const artifact = (artifacts.artifacts ?? []).find(item => item.name === artifactName);
          assert.ok(artifact, "the exact sealed Gate A artifact is absent");
          assert.equal(artifact.workflow_run?.id, Number(runId),
            "the artifact must belong to this exact Gate A run");
          assert.equal(artifact.expired, false, "the exact sealed Gate A artifact has expired");
          assert.ok(artifact.size_in_bytes > 0, "the exact sealed Gate A artifact is empty");
          const output = [
            ["source_sha", sha],
            ["source_branch", branch],
            ["source_run_id", runId],
            ["source_run_attempt", attempt],
            ["artifact_name", artifactName],
            ["preview_slot", target.slot],
            ["worker_name", target.worker],
            ["preview_host", target.host],
            ["expected_migration", target.migration],
            ["cron_schedule", target.cron],
          ].map(([key, value]) => key + "=" + value).join("\n") + "\n";
          writeFileSync(process.env.GITHUB_OUTPUT, output, {flag:"a"});
          console.log("Validated exact successful Gate A run " + runId + " attempt " + attempt + " at " + sha + "; preview slot " + target.slot + ".");
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.gate.outputs.source_sha }}
          path: .preflight-source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate frozen-base migration and runtime audience without Cloudflare credentials
        id: source
        env:
          SOURCE_SHA: ${{ steps.gate.outputs.source_sha }}
          EXPECTED_MIGRATION: ${{ steps.gate.outputs.expected_migration }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .preflight-source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C .preflight-source fetch --no-tags origin dev:refs/remotes/origin/dev
          git -C .preflight-source merge-base --is-ancestor refs/remotes/origin/dev "$SOURCE_SHA"
          BASE_SHA="$(git -C .preflight-source merge-base refs/remotes/origin/dev "$SOURCE_SHA")"
          SOURCE_SHA="$SOURCE_SHA" BASE_SHA="$BASE_SHA" EXPECTED_MIGRATION="$EXPECTED_MIGRATION" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          import {lstatSync} from "node:fs";
          const cwd=".preflight-source";
          const base=process.env.BASE_SHA;
          const sha=process.env.SOURCE_SHA;
          const expected="apps/cloudflare-crm/migrations/"+process.env.EXPECTED_MIGRATION;
          const diff=execFileSync("git",[
            "diff","--name-status","--find-renames",base,sha,"--","apps/cloudflare-crm/migrations"
          ],{cwd,encoding:"utf8"}).trim().split("\n").filter(Boolean);
          assert.deepEqual(diff,["A\t"+expected],
            "only the one branch-approved migration may be added; historical migrations cannot change, disappear or be renamed");
          const stat=lstatSync(cwd+"/"+expected);
          assert.ok(stat.isFile() && !stat.isSymbolicLink(),"approved migration must be a regular file");
          assert.ok(stat.size>0,"approved migration cannot be empty");
          const accessSource=execFileSync("git",["show",sha+":apps/cloudflare-crm/rust-party/src/access.rs"],{cwd,encoding:"utf8"});
          assert.ok(accessSource.includes('env.var("CRM_ACCESS_AUDIENCE")'),
            "the exact preview artifact source must use runtime-configured Access audience");
          assert.ok(!accessSource.includes('const AUDIENCE: &str'),
            "the compile-time production audience must not remain in preview code");
          const productionConfigText=execFileSync("git",[
            "show","refs/remotes/origin/dev:apps/cloudflare-crm/wrangler.jsonc"
          ],{cwd,encoding:"utf8"});
          const productionAudience=JSON.parse(productionConfigText).vars?.CRM_ACCESS_AUDIENCE;
          assert.match(productionAudience??"",/^[0-9a-f]{64}$/,
            "canonical dev must pin its existing production Access audience before previews");
          const sourceConfigText=execFileSync("git",[
            "show",sha+":apps/cloudflare-crm/wrangler.jsonc"
          ],{cwd,encoding:"utf8"});
          assert.equal(JSON.parse(sourceConfigText).vars?.CRM_ACCESS_AUDIENCE,productionAudience,
            "the exact tested source must retain the production audience in its normal Wrangler config");
          writeFileSync(process.env.GITHUB_OUTPUT,
            "production_access_audience="+productionAudience+"\n",{flag:"a"});
          console.log("Read-only preflight accepted the exact additive migration and runtime audience contract.");
          NODE

  preview:
    needs: preflight
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'iamaman11' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-26.04
    environment: crm-preview
    concurrency:
      group: crm-branch-preview-slot-${{ needs.preflight.outputs.preview_slot }}
      cancel-in-progress: false
    timeout-minutes: 45
    outputs:
      worker_name: ${{ needs.preflight.outputs.worker_name }}
      database_name: ${{ steps.d1.outputs.database_name }}
      database_id: ${{ steps.d1.outputs.database_id }}
      preview_host: ${{ steps.access.outputs.preview_host }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      access_app_id: ${{ steps.access.outputs.access_app_id }}
      access_audience: ${{ steps.access.outputs.access_audience }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      SOURCE_BRANCH: ${{ needs.preflight.outputs.source_branch }}
      SOURCE_RUN_ID: ${{ needs.preflight.outputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.preflight.outputs.source_run_attempt }}
      ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
      PREVIEW_SLOT: ${{ needs.preflight.outputs.preview_slot }}
      PREVIEW_WORKER_NAME: ${{ needs.preflight.outputs.worker_name }}
      EXPECTED_PREVIEW_HOST: ${{ needs.preflight.outputs.preview_host }}
      EXPECTED_MIGRATION: ${{ needs.preflight.outputs.expected_migration }}
      PREVIEW_CRON_SCHEDULE: ${{ needs.preflight.outputs.cron_schedule }}
      PRODUCTION_ACCESS_AUDIENCE: ${{ needs.preflight.outputs.production_access_audience }}
    steps:
      - name: Keep preview fail-closed until the owner enables it
        id: gate
        env:
          CRM_BRANCH_PREVIEW_ENABLED: ${{ vars.CRM_BRANCH_PREVIEW_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CRM_BRANCH_PREVIEW_ENABLED" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Preview remains disabled: CRM_BRANCH_PREVIEW_ENABLED is not true." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "The owner-enabled preview flag is true; continuing with the exact preflighted Gate A artifact."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          node-version: '26.13.1'

      - name: Install pinned workspace tools
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.21.0
          pnpm --version | grep -Fx '12.21.0'
          pnpm install --frozen-lockfile

      - name: Select Preview 1 credentials only
        if: ${{ steps.gate.outputs.enabled == 'true' && needs.preflight.outputs.preview_slot == '1' }}
        env:
          PREVIEW_ACCESS_APP_ID: ${{ vars.CRM_PREVIEW_1_ACCESS_APP_ID }}
          PREVIEW_A_CLIENT_ID: ${{ secrets.CRM_PREVIEW_1_A_CLIENT_ID }}
          PREVIEW_A_CLIENT_SECRET: ${{ secrets.CRM_PREVIEW_1_A_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_ACCESS_APP_ID"
          test -n "$PREVIEW_A_CLIENT_ID"
          test -n "$PREVIEW_A_CLIENT_SECRET"
          printf 'PREVIEW_ACCESS_APP_ID=%s\nPREVIEW_A_CLIENT_ID=%s\nPREVIEW_A_CLIENT_SECRET=%s\n' "$PREVIEW_ACCESS_APP_ID" "$PREVIEW_A_CLIENT_ID" "$PREVIEW_A_CLIENT_SECRET" >> "$GITHUB_ENV"

      - name: Select Preview 2 credentials only
        if: ${{ steps.gate.outputs.enabled == 'true' && needs.preflight.outputs.preview_slot == '2' }}
        env:
          PREVIEW_ACCESS_APP_ID: ${{ vars.CRM_PREVIEW_2_ACCESS_APP_ID }}
          PREVIEW_A_CLIENT_ID: ${{ secrets.CRM_PREVIEW_2_A_CLIENT_ID }}
          PREVIEW_A_CLIENT_SECRET: ${{ secrets.CRM_PREVIEW_2_A_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_ACCESS_APP_ID"
          test -n "$PREVIEW_A_CLIENT_ID"
          test -n "$PREVIEW_A_CLIENT_SECRET"
          printf 'PREVIEW_ACCESS_APP_ID=%s\nPREVIEW_A_CLIENT_ID=%s\nPREVIEW_A_CLIENT_SECRET=%s\n' "$PREVIEW_ACCESS_APP_ID" "$PREVIEW_A_CLIENT_ID" "$PREVIEW_A_CLIENT_SECRET" >> "$GITHUB_ENV"

      - name: Require only the selected preview credentials
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PREVIEW_ACCESS_APP_ID"
          test -n "$PREVIEW_A_CLIENT_ID"
          test -n "$PREVIEW_A_CLIENT_SECRET"
          echo "Only the selected preview's Access app and A credential pair entered this job."

      - name: Download the exact sealed Gate A artifact
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/cloudflare-crm/.release/preview
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" --dir apps/cloudflare-crm/.release/preview
          test "$(cat apps/cloudflare-crm/.release/preview/.release/source-sha.txt)" = "$SOURCE_SHA"
          (cd apps/cloudflare-crm/.release/preview && sha256sum --check --strict .release/compiled-sha256.txt)
          SOURCE_SHA="$SOURCE_SHA" node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const p=JSON.parse(readFileSync("apps/cloudflare-crm/.release/preview/.release/provenance.json","utf8"));
            assert.equal(p.tested_sha,process.env.SOURCE_SHA);
            assert.equal(p.production_features.join(","),"native");
            assert.equal(p.production_access_probe.source_sha,process.env.SOURCE_SHA);
            assert.equal(p.production_access_probe.compiled_router_policy_parity,true);
          '
          test -s apps/cloudflare-crm/.release/preview/dist/index.html
          test -s apps/cloudflare-crm/.release/preview/rust-party/build/index.js
          test -s apps/cloudflare-crm/.release/preview/rust-party/build/index_bg.wasm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: .preview-source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate frozen-base migration scope from the exact source SHA
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .preview-source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C .preview-source fetch --no-tags origin dev:refs/remotes/origin/dev
          git -C .preview-source merge-base --is-ancestor refs/remotes/origin/dev "$SOURCE_SHA"
          BASE_SHA="$(git -C .preview-source merge-base refs/remotes/origin/dev "$SOURCE_SHA")"
          SOURCE_SHA="$SOURCE_SHA" BASE_SHA="$BASE_SHA" EXPECTED_MIGRATION="$EXPECTED_MIGRATION" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {execFileSync} from "node:child_process";
          import {lstatSync,writeFileSync} from "node:fs";
          const cwd=".preview-source";
          const base=process.env.BASE_SHA;
          const sha=process.env.SOURCE_SHA;
          const expected="apps/cloudflare-crm/migrations/"+process.env.EXPECTED_MIGRATION;
          const diff=execFileSync("git",[
            "diff","--name-status","--find-renames",base,sha,"--","apps/cloudflare-crm/migrations"
          ],{cwd,encoding:"utf8"}).trim().split("\n").filter(Boolean);
          assert.deepEqual(diff,["A\t"+expected],
            "preview migration input must be exactly the one approved additive migration; historical files cannot change, disappear, or be renamed");
          const stat=lstatSync(cwd+"/"+expected);
          assert.ok(stat.isFile() && !stat.isSymbolicLink(),"approved migration must be a regular file");
          assert.ok(stat.size>0,"approved migration cannot be empty");
          const accessSource=execFileSync("git",["show",sha+":apps/cloudflare-crm/rust-party/src/access.rs"],{cwd,encoding:"utf8"});
          assert.ok(accessSource.includes('env.var("CRM_ACCESS_AUDIENCE")'),
            "the exact preview artifact source must use the runtime-configured Access audience");
          assert.ok(!accessSource.includes('const AUDIENCE: &str'),
            "the compile-time production audience must not remain in preview code");
          const productionConfigText=execFileSync("git",[
            "show","refs/remotes/origin/dev:apps/cloudflare-crm/wrangler.jsonc"
          ],{cwd,encoding:"utf8"});
          const productionAudience=JSON.parse(productionConfigText).vars?.CRM_ACCESS_AUDIENCE;
          assert.match(productionAudience??"",/^[0-9a-f]{64}$/,
            "dev must pin its existing production Access audience before any preview can run");
          assert.equal(productionAudience,process.env.PRODUCTION_ACCESS_AUDIENCE,
            "dev production audience must match the no-secret preflight result");
          console.log("Frozen-base migration scope and runtime Access audience are valid.");
          NODE

      - name: Read and validate the dedicated Access application
        id: access
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          EXPECTED_PREVIEW_HOST: ${{ needs.preflight.outputs.preview_host }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {writeFileSync} from "node:fs";
          const account="5bd5e1e1e813f061afc259e91334262d";
          const slot=process.env.PREVIEW_SLOT;
          const appId=process.env.PREVIEW_ACCESS_APP_ID;
          assert.ok(appId,"the selected crm-preview Access App ID variable is missing");
          const response=await fetch(
            "https://api.cloudflare.com/client/v4/accounts/"+account+"/access/apps/"+appId,
            {headers:{authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN}}
          );
          const payload=await response.json();
          assert.ok(response.ok && payload.success===true,"Cloudflare Access application read failed");
          const app=payload.result;
          assert.equal(app.id,appId);
          assert.equal(app.type,"self_hosted");
          assert.equal(app.domain,process.env.EXPECTED_PREVIEW_HOST,
            "the Access app must protect the fixed hostname assigned to this writer");
          assert.equal(app.session_duration,"1h");
          assert.match(app.aud??"",/^[0-9a-f]{64}$/);
          assert.match(process.env.PRODUCTION_ACCESS_AUDIENCE??"",/^[0-9a-f]{64}$/,
            "the canonical dev production audience must be present");
          assert.notEqual(app.aud,process.env.PRODUCTION_ACCESS_AUDIENCE,
            "a preview must never reuse the production Access audience");
          assert.equal(app.policies?.length,1,"preview Access app must have exactly one policy");
          const policy=app.policies[0];
          assert.equal(policy.decision,"non_identity");
          assert.equal(policy.precedence,1);
          assert.equal(policy.include?.length,2,"the policy must include exactly the two preview Service Tokens");
          assert.ok(policy.include.every(item =>
            Object.keys(item).length===1 &&
            typeof item.service_token?.token_id==="string" &&
            item.service_token.token_id.length>0
          ),"the policy may include Service Tokens only, never Bypass/Everyone/identity rules");
          assert.deepEqual(policy.exclude??[],[]);
          assert.deepEqual(policy.require??[],[]);
          const expectedNames=["crm-preview-"+slot+"-a","crm-preview-"+slot+"-b"];
          const tokenRecords=await Promise.all(policy.include.map(async item=>{
            const tokenId=item.service_token.token_id;
            const tokenResponse=await fetch(
              "https://api.cloudflare.com/client/v4/accounts/"+account+"/access/service_tokens/"+tokenId,
              {headers:{authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN}}
            );
            const tokenPayload=await tokenResponse.json();
            assert.ok(tokenResponse.ok && tokenPayload.success===true,
              "Cloudflare could not read one of the exact preview service tokens");
            const token=tokenPayload.result;
            assert.equal(token.id,tokenId);
            assert.equal(token.enabled,true,"both exact preview Service Tokens must be enabled");
            assert.equal(token.leak_reported_at,undefined,
              "a leaked Service Token must be rotated before preview use");
            assert.ok(token.expires_at && Date.parse(token.expires_at)>Date.now()+60*60*1000,
              "both preview Service Tokens must remain valid for the complete bounded preview lease");
            assert.match(token.client_id??"",/^[0-9a-f]{32}\.access$/);
            return token;
          }));
          assert.deepEqual(tokenRecords.map(token=>token.name).sort(),expectedNames.sort(),
            "the Access policy must contain exactly the named A and B tokens for this preview slot");
          const aToken=tokenRecords.find(token=>token.name==="crm-preview-"+slot+"-a");
          const bToken=tokenRecords.find(token=>token.name==="crm-preview-"+slot+"-b");
          assert.ok(aToken && bToken,"both named A and B tokens must exist");
          const expectedAClientId=process.env.PREVIEW_A_CLIENT_ID;
          assert.equal(aToken.client_id,expectedAClientId,
            "the GitHub A credential pair must belong to this preview's exact A token");
          writeFileSync(process.env.GITHUB_OUTPUT,
            "access_app_id="+appId+"\n"+
            "access_audience="+app.aud+"\n"+
            "preview_host="+app.domain+"\n",
            {flag:"a"});
          writeFileSync(process.env.GITHUB_ENV,
            "PREVIEW_ACCESS_AUD="+app.aud+"\n"+
            "PREVIEW_ACCESS_APP_ID="+appId+"\n"+
            "PREVIEW_HOST="+app.domain+"\n"+
            "PREVIEW_BROWSER_CLIENT_ID="+bToken.client_id+"\n",
            {flag:"a"});
          console.log("Validated isolated Access app, exact enabled A/B tokens, unique audience and fixed host.");
          NODE

      - name: Create one physical EU D1 for this preview lease
        id: d1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {writeFileSync} from "node:fs";
          const account="5bd5e1e1e813f061afc259e91334262d";
          const databaseName=process.env.PREVIEW_WORKER_NAME+"-"+process.env.SOURCE_RUN_ID+"-"+process.env.SOURCE_RUN_ATTEMPT;
          const response=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database",{
            method:"POST",
            headers:{authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN,"content-type":"application/json"},
            body:JSON.stringify({name:databaseName,jurisdiction:"eu"})
          });
          const payload=await response.json();
          assert.ok(response.ok && payload.success===true && payload.result?.uuid,
            "isolated EU D1 creation failed");
          const databaseId=payload.result.uuid;
          writeFileSync(process.env.GITHUB_OUTPUT,
            "database_name="+databaseName+"\n"+
            "database_id="+databaseId+"\n",
            {flag:"a"});
          console.log("Created isolated physical EU D1 for the selected preview lease.");
          NODE

      - name: Write trusted preview Wrangler config from fixed controller inputs
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        env:
          DATABASE_NAME: ${{ steps.d1.outputs.database_name }}
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {writeFileSync} from "node:fs";
          const cron=process.env.PREVIEW_CRON_SCHEDULE;
          const config={
            name:process.env.PREVIEW_WORKER_NAME,
            main:"./.release/preview/rust-party/build/index.js",
            workers_dev:true,
            preview_urls:false,
            account_id:"5bd5e1e1e813f061afc259e91334262d",
            compatibility_date:"2026-11-07",
            d1_databases:[{
              binding:"DB",
              database_name:process.env.DATABASE_NAME,
              database_id:process.env.DATABASE_ID,
              migrations_dir:"../../.preview-source/apps/cloudflare-crm/migrations"
            }],
            assets:{
              directory:"./.release/preview/dist",
              binding:"ASSETS",
              not_found_handling:"single-page-application",
              run_worker_first:["/api/*","/crm.*/*"]
            },
            version_metadata:{binding:"CF_VERSION_METADATA"},
            observability:{
              enabled:true,
              redact_query_string:true,
              logs:{enabled:true,head_sampling_rate:1,invocation_logs:false},
              traces:{enabled:true,head_sampling_rate:1}
            },
            vars:{
              GIT_SHA:process.env.SOURCE_SHA,
              CRM_ACCESS_AUDIENCE:process.env.PREVIEW_ACCESS_AUD
            }
          };
          if(cron) config.triggers={crons:[cron]};
          assert.equal(config.name,process.env.PREVIEW_WORKER_NAME);
          assert.equal(config.vars.CRM_ACCESS_AUDIENCE?.length,64);
          writeFileSync("apps/cloudflare-crm/preview-wrangler.jsonc",JSON.stringify(config,null,2)+"\n");
          writeFileSync(process.env.RUNNER_TEMP+"/crm-preview-lease.json",JSON.stringify({
            worker_name:config.name,
            database_name:process.env.DATABASE_NAME,
            database_id:process.env.DATABASE_ID,
            preview_host:process.env.PREVIEW_HOST,
            access_app_id:process.env.PREVIEW_ACCESS_APP_ID,
            access_audience:process.env.PREVIEW_ACCESS_AUD,
            source_sha:process.env.SOURCE_SHA,
            source_branch:process.env.SOURCE_BRANCH,
            source_run_id:process.env.SOURCE_RUN_ID,
            source_run_attempt:Number(process.env.SOURCE_RUN_ATTEMPT),
            cron_schedule:cron||null,
            created_at:new Date().toISOString(),
            expires_after_minutes:30
          },null,2)+"\n");
          NODE

      - name: Apply exact source migrations to isolated D1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: apps/cloudflare-crm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
        run: pnpm exec wrangler d1 migrations apply "${{ steps.d1.outputs.database_name }}" --remote --config preview-wrangler.jsonc --force

      - name: Enroll only the exact Browser MCP B service principal in isolated preview D1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          PREVIEW_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const account="5bd5e1e1e813f061afc259e91334262d";
          const clientId=process.env.PREVIEW_BROWSER_CLIENT_ID;
          assert.match(clientId??"",/^[0-9a-f]{32}\.access$/,
            "the Browser MCP B client ID must come from the exact enabled Access Service Token");
          const tenantId="crm-preview-"+process.env.PREVIEW_SLOT+"-"+process.env.SOURCE_RUN_ID+"-"+process.env.SOURCE_RUN_ATTEMPT;
          const tenantName="CRM Preview "+process.env.PREVIEW_SLOT+" test";
          const identity="service:"+clientId;
          const endpoint="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+process.env.PREVIEW_DATABASE_ID+"/query";
          async function query(sql,params){
            const response=await fetch(endpoint,{
              method:"POST",
              headers:{
                authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN,
                "content-type":"application/json"
              },
              body:JSON.stringify({sql,params})
            });
            const payload=await response.json();
            assert.ok(response.ok && payload.success===true,"isolated D1 service-principal query failed");
            assert.equal(payload.result?.length,1);
            assert.equal(payload.result[0].success,true);
            return payload.result[0];
          }
          await query(
            "INSERT INTO crm_tenants(id,name) VALUES(?,?) ON CONFLICT(id) DO NOTHING",
            [tenantId,tenantName]
          );
          await query(
            "INSERT INTO crm_users(email,tenant_id,role,active) VALUES(?,?,?,1) ON CONFLICT(email) DO NOTHING",
            [identity,tenantId,"admin"]
          );
          const rows=await query(
            "SELECT email,tenant_id,role,active FROM crm_users WHERE email=?",
            [identity]
          );
          assert.deepEqual(rows.results,[{
            email:identity,tenant_id:tenantId,role:"admin",active:1
          }],"the isolated B principal must be an active admin only in this preview's own test tenant");
          console.log("Seeded and read back only the preview B service principal in its newly created physical D1; no production identity or tenant is copied.");
          NODE

      - name: Deploy exact sealed Worker and React assets behind the pre-provisioned Access app
        id: deploy
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: apps/cloudflare-crm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5bd5e1e1e813f061afc259e91334262d
        run: pnpm exec wrangler deploy --config preview-wrangler.jsonc

      - name: Verify the selected A Service Token passes Access and reaches this exact Worker
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const clientId=process.env.PREVIEW_A_CLIENT_ID;
          const clientSecret=process.env.PREVIEW_A_CLIENT_SECRET;
          assert.ok(clientId && clientSecret,"selected A Service Token pair is missing");
          const url="https://"+process.env.PREVIEW_HOST+"/api/version";
          const anonymous=await fetch(url,{redirect:"manual"});
          assert.notEqual(anonymous.headers.get("x-crm-source-sha"),process.env.SOURCE_SHA,
            "an anonymous request must be stopped by Access before reaching the Worker");
          const authenticated=await fetch(url,{
            headers:{
              "CF-Access-Client-Id":clientId,
              "CF-Access-Client-Secret":clientSecret
            },
            redirect:"manual"
          });
          assert.equal(authenticated.headers.get("x-crm-source-sha"),process.env.SOURCE_SHA,
            "the exact preview A token must pass Access and reach the Worker compiled from this SHA");
          console.log("Access A token reached only the selected preview Worker; anonymous access was stopped before Worker execution.");
          NODE

      - name: Preserve bounded preview lease evidence
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-branch-preview-lease-${{ needs.preflight.outputs.source_run_id }}-${{ needs.preflight.outputs.source_run_attempt }}
          path: ${{ runner.temp }}/crm-preview-lease.json
          if-no-files-found: error
          retention-days: 1

      - name: Record exact preview lease in job summary
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        shell: bash
        run: |
          {
            echo "## Isolated CRM branch preview provisioned"
            echo "- Source branch: $SOURCE_BRANCH"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Gate A run: $SOURCE_RUN_ID attempt $SOURCE_RUN_ATTEMPT"
            echo "- Worker: $PREVIEW_WORKER_NAME"
            echo "- Access app: ${{ steps.access.outputs.access_app_id }}"
            echo "- Access audience: ${{ steps.access.outputs.access_audience }}"
            echo "- Physical EU D1: ${{ steps.d1.outputs.database_name }} (${{ steps.d1.outputs.database_id }})"
            echo "- Protected host: ${{ steps.access.outputs.preview_host }}"
            echo "- Trusted Cron: ${{ needs.preflight.outputs.cron_schedule || 'none' }}"
            echo "- Lease: 30 minutes. Cleanup deletes only this fixed preview Worker and this physical D1; the pre-provisioned Access app/policy/tokens are not changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold bounded lease for independent Writer Browser MCP Gate B
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.deploy.outcome == 'success' }}
        run: sleep 1800

      - name: Remove only the selected preview Worker and physical D1
        if: ${{ always() && steps.d1.outcome == 'success' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CRM_PREVIEW_CLOUDFLARE_API_TOKEN }}
          PREVIEW_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node --input-type=module <<'NODE'
          const account="5bd5e1e1e813f061afc259e91334262d";
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const workerName=process.env.PREVIEW_WORKER_NAME;
          async function remove(path){
            const response=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+path,{
              method:"DELETE",headers:{authorization:"Bearer "+token}
            });
            if(response.status===404)return false;
            const payload=await response.json();
            if(!response.ok||payload.success!==true){
              throw new Error("Cloudflare cleanup failed for "+path+" HTTP "+response.status);
            }
            return true;
          }
          const workerDeleted=await remove("/workers/scripts/"+workerName);
          const databaseId=process.env.PREVIEW_DATABASE_ID;
          const databaseDeleted=databaseId?await remove("/d1/database/"+databaseId):false;
          console.log(JSON.stringify({
            event:"crm.branch-preview-cleanup",
            worker:workerName,
            worker_deleted:workerDeleted,
            database_deleted:databaseDeleted
          }));
          NODE
