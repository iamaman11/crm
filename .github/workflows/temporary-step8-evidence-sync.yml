name: Temporary Step 8 Evidence Sync

on:
  push:
    branches:
      - repository-step-8-evidence-sync
    paths:
      - ".github/step8-evidence-sync.py"
      - ".github/workflows/temporary-step8-evidence-sync.yml"
  pull_request:
    paths:
      - ".github/step8-evidence-sync.py"
      - ".github/workflows/temporary-step8-evidence-sync.yml"

concurrency:
  group: temporary-step8-evidence-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-8-evidence-sync
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Apply and verify accepted evidence synchronization
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements-dev.txt
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/step8-evidence-sync.py')
          source = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "docs/PROJECT_STATUS.md",
              "Repository step 8 is replay-safe resumable Customer Privacy owner execution and crash-window recovery.",
              "Repository step 9 is affected-scope expansion for contracts, migrations, PostgreSQL/process and product-plane checks.",
          )
          replace_once(
              "docs/PROJECT_STATUS.md",
              "Repository step 9 is affected-scope expansion for contracts, migrations, PostgreSQL/process and product-plane checks.",
              "Repository step 10 is governed Customer Privacy access/export assembly.",
          )
          # The preceding two replacements target adjacent sections; restore the first section explicitly.
          replace_once(
              "docs/PROJECT_STATUS.md",
              "## Next permitted repository packet\\n\\nRepository step 10 is governed Customer Privacy access/export assembly.",
              "## Next permitted repository packet\\n\\nRepository step 9 is affected-scope expansion for contracts, migrations, PostgreSQL/process and product-plane checks.",
          )
          replace_once(
              "docs/PROJECT_STATUS.md",
              "## Following permitted repository packet\\n\\nRepository step 9 is affected-scope expansion for contracts, migrations, PostgreSQL/process and product-plane checks.",
              "## Following permitted repository packet\\n\\nRepository step 10 is governed Customer Privacy access/export assembly.",
          )'''
          new = '''replace_once(
              "docs/PROJECT_STATUS.md",
              "## Next permitted repository packet\\n\\nRepository step 8 is replay-safe resumable Customer Privacy owner execution and crash-window recovery.\\n\\n## Following permitted repository packet\\n\\nRepository step 9 is affected-scope expansion for contracts, migrations, PostgreSQL/process and product-plane checks.",
              "## Next permitted repository packet\\n\\nRepository step 9 is affected-scope expansion for contracts, migrations, PostgreSQL/process and product-plane checks.\\n\\n## Following permitted repository packet\\n\\nRepository step 10 is governed Customer Privacy access/export assembly.",
          )'''
          if source.count(old) != 1:
              raise SystemExit(f'project status patch count: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile .github/step8-evidence-sync.py
          python .github/step8-evidence-sync.py
          python scripts/generate_repository_navigation.py --write
          python -m py_compile \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ACTIVE_PACKET.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/PROJECT_STATUS.md \
            repository-packet.json \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          git commit -m "Docs: synchronize accepted repository step 8 evidence"
          git pull --rebase origin repository-step-8-evidence-sync
          git push origin HEAD:repository-step-8-evidence-sync
