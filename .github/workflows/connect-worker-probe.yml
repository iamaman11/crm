name: One-time Connect/Workers WASM compatibility proof
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/connect-worker-probe.yml"
      - ".github/experiments/connect-worker-probe/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned existing Rust CI
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Control — generated Connect server inside workers-rs WASM without D1
        working-directory: .github/experiments/connect-worker-probe
        run: |
          set -o pipefail
          cargo check --target wasm32-unknown-unknown 2>&1 | tee "$RUNNER_TEMP/connect-wasm-baseline.log"
          echo "CONNECT_WASM_NO_D1=PASS"
      - name: Negative control — exact same generated RPC, this time awaiting native D1
        working-directory: .github/experiments/connect-worker-probe
        run: |
          set -o pipefail
          set +e
          cargo check --target wasm32-unknown-unknown --features with_d1 >"$RUNNER_TEMP/connect-wasm-d1.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/connect-wasm-d1.log"
          if [ "$status" -eq 0 ]; then
            echo "CONNECT_WASM_NATIVE_D1=COMPILED; full runtime proof still required"
          elif grep -q 'cannot be sent between threads safely' "$RUNNER_TEMP/connect-wasm-d1.log" && grep -q 'required by.*Send' "$RUNNER_TEMP/connect-wasm-d1.log"; then
            echo "CONNECT_WASM_NATIVE_D1=BLOCKED_BY_GENERATED_SEND_BOUND"
          else
            echo "Unexpected proof failure — not evidence of Send barrier" >&2
            exit 1
          fi
