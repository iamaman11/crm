name: Step 17 Telemetry Budget Refactor

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-telemetry-budget-refactor.yml"
      - "scripts/apply_step17_telemetry_budget_refactor.py"

concurrency:
  group: step17-telemetry-budget-refactor-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-contract-usage-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Correct duplicate test setup matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_step17_telemetry_budget_refactor.py")
          text = path.read_text(encoding="utf-8")
          call = '''replace_once(
              adapter,
              ''' + "'''" + '''        let mut render = None;
              let registries: [Arc<dyn CapabilityRegistryPort>; 2] = [
          ''' + "'''" + ''',
              ''' + "'''" + '''        let registries: [Arc<dyn CapabilityRegistryPort>; 2] = [
          ''' + "'''" + ''',
          )
          '''
          if text.count(call) != 2:
              raise SystemExit(f"expected two duplicate setup calls, found {text.count(call)}")
          replacement = '''content = read(adapter)
          old_render_setup = ''' + "'''" + '''        let mut render = None;
              let registries: [Arc<dyn CapabilityRegistryPort>; 2] = [
          ''' + "'''" + '''
          new_render_setup = ''' + "'''" + '''        let registries: [Arc<dyn CapabilityRegistryPort>; 2] = [
          ''' + "'''" + '''
          if content.count(old_render_setup) != 2:
              raise RuntimeError(
                  f"{adapter}: expected two render setups, found {content.count(old_render_setup)}"
              )
          write(adapter, content.replace(old_render_setup, new_render_setup))
          '''
          text = text.replace(call, replacement, 1).replace(call, "", 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply budget-neutral refactor
        run: python scripts/apply_step17_telemetry_budget_refactor.py
      - name: Regenerate governed artifacts
        run: |
          python scripts/generate_contract_telemetry_catalog.py --write
          python scripts/generate_repository_navigation.py --write
      - name: Run packet and generator tests
        run: |
          python -m unittest \
            tests/test_contract_telemetry_catalog.py \
            tests/test_repository_navigation.py \
            tests/test_architecture_documentation_consistency.py
      - name: Format Rust source
        run: cargo fmt --all
      - name: Test telemetry and runtime integration
        run: |
          cargo test --locked -p crm-capability-adapters contract_usage_telemetry
          cargo check --locked -p crm-application-runtime --all-targets
      - name: Enforce accepted complexity ceilings
        run: |
          mkdir -p artifacts
          python scripts/analyze_workspace.py \
            --json-output artifacts/workspace-complexity-baseline.json \
            --markdown-output artifacts/workspace-complexity-baseline.md
          python scripts/analyze_step13_complexity.py \
            --json-output artifacts/step13-complexity-baseline.json \
            --markdown-output artifacts/step13-complexity-baseline.md
          python scripts/check_step13_exit_evidence.py \
            --check \
            --json-output artifacts/step13-exit-evidence.json \
            --markdown-output artifacts/step13-exit-evidence.md
      - name: Commit non-workflow budget refactor
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/step17-telemetry-budget-refactor.yml
          git rm -f scripts/apply_step17_telemetry_budget_refactor.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Step 17: keep telemetry within accepted budgets"
          git push origin HEAD:step17-contract-usage-telemetry
