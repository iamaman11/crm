name: Materialize Step 13 Plan Evidence

on:
  push:
    branches:
      - repository-step-13-plan-evidence-sync

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-13-plan-evidence-sync
          fetch-depth: 0
      - name: Materialize plan and permanent guards
        run: python scripts/materialize_step13_plan_evidence.py
      - name: Commit evidence and remove temporary materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md docs/PROJECT_STATUS.md tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          git rm .github/workflows/materialize-step13-plan-evidence.yml scripts/materialize_step13_plan_evidence.py
          git commit -m "Synchronize hardened repository step 13 plan evidence"
          git push origin HEAD:repository-step-13-plan-evidence-sync
