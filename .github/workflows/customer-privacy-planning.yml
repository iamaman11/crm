name: Customer Privacy Planning CI

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "architecture-policy.json"
      - "scripts/check_architecture.py"
      - "proto/crm/customer_privacy/**"
      - "modules/crm-customer-privacy/**"
      - "crates/crm-core-data/**"
      - "crates/crm-customer-privacy-application/**"
      - "crates/crm-customer-privacy-postgres/**"
      - "crates/crm-customer-privacy-production/**"
      - "contracts/production-route-classifications.json"
      - "database/migrations/**"
      - "database/tests/0001_platform_foundation.sql"
      - "database/tests/0043_customer_privacy_discovery_scope.sql"
      - "database/tests/0044_customer_privacy_planning.sql"
      - "database/tests/0045_customer_privacy_plan_reads.sql"
      - "contracts/customer-privacy-planning-implementation.json"
      - "contracts/customer-privacy-plan-reads-implementation.json"
      - "docs/CUSTOMER_PRIVACY_PLANNING_IMPLEMENTATION.md"
      - "docs/CUSTOMER_PRIVACY_PLAN_READS_IMPLEMENTATION.md"
      - ".github/workflows/customer-privacy-planning.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "architecture-policy.json"
      - "scripts/check_architecture.py"
      - "proto/crm/customer_privacy/**"
      - "modules/crm-customer-privacy/**"
      - "crates/crm-core-data/**"
      - "crates/crm-customer-privacy-application/**"
      - "crates/crm-customer-privacy-postgres/**"
      - "crates/crm-customer-privacy-production/**"
      - "contracts/production-route-classifications.json"
      - "database/migrations/**"
      - "database/tests/0001_platform_foundation.sql"
      - "database/tests/0043_customer_privacy_discovery_scope.sql"
      - "database/tests/0044_customer_privacy_planning.sql"
      - "database/tests/0045_customer_privacy_plan_reads.sql"
      - "contracts/customer-privacy-planning-implementation.json"
      - "contracts/customer-privacy-plan-reads-implementation.json"
      - "docs/CUSTOMER_PRIVACY_PLANNING_IMPLEMENTATION.md"
      - "docs/CUSTOMER_PRIVACY_PLAN_READS_IMPLEMENTATION.md"
      - ".github/workflows/customer-privacy-planning.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_customer_privacy_planning_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5449:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_customer_privacy_planning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5449
      PGDATABASE: crm_customer_privacy_planning_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5449/crm_customer_privacy_planning_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5449/crm_customer_privacy_planning_test
    steps:
      - name: Check out exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Prepare Rust and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply clean database
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --command "CREATE ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0043_customer_privacy_discovery_scope.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0044_customer_privacy_planning.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0045_customer_privacy_plan_reads.sql
      - name: Verify planning and read packages and production inventory
        shell: bash
        run: |
          set -o pipefail
          cargo test \
            -p crm-customer-privacy-application \
            -p crm-customer-privacy-postgres \
            -p crm-customer-privacy-production \
            --all-features -- --nocapture \
            2>&1 | tee database/customer-privacy-planning-clean.log
      - name: Verify frozen non-effects
        shell: bash
        run: |
          set -euo pipefail
          public_matches="$(grep -R --include='*.rs' -l 'customer_privacy.plan.build' services crates/crm-capability-ingress 2>/dev/null || true)"
          if [ -n "${public_matches}" ]; then
            printf 'unexpected public planning route matches:\n%s\n' "${public_matches}"
            exit 1
          fi
          worker_matches="$(grep -R --include='*.rs' -l 'CustomerPrivacy.*Worker\|customer_privacy.*worker' crates/crm-application-runtime crates/crm-application-composition 2>/dev/null || true)"
          if [ -n "${worker_matches}" ]; then
            printf 'unexpected Customer Privacy worker matches:\n%s\n' "${worker_matches}"
            exit 1
          fi
          outcome_persistence_matches="$(find database/migrations crates/crm-customer-privacy-postgres -type f -print0 | xargs -0 grep -l 'CREATE TABLE crm.customer_privacy_owner_outcomes\|INSERT INTO crm.customer_privacy_owner_outcomes' 2>/dev/null || true)"
          if [ -n "${outcome_persistence_matches}" ]; then
            printf 'unexpected owner outcome persistence matches:\n%s\n' "${outcome_persistence_matches}"
            exit 1
          fi
          package_count="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; print(len(json.load(sys.stdin)["workspace_members"]))')"
          printf 'verified internal planning and bounded reads; workspace packages: %s\n' "${package_count}"
          test "${package_count}" = "112"
      - name: Roll back authoritative schema
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.down.sql' | sort -r)
          count="$(psql --tuples-only --no-align --command "SELECT count(*) FROM pg_namespace WHERE nspname = 'crm'")"
          test "${count}" = "0"
      - name: Reapply and repeat acceptance
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0043_customer_privacy_discovery_scope.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0044_customer_privacy_planning.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0045_customer_privacy_plan_reads.sql
          cargo test \
            -p crm-customer-privacy-application \
            -p crm-customer-privacy-postgres \
            -p crm-customer-privacy-production \
            --all-features -- --nocapture \
            2>&1 | tee database/customer-privacy-planning-reapplied.log
      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          postgres_container="$(docker ps -aq --filter ancestor=postgres:17-alpine | head -n 1)"
          if [ -n "${postgres_container}" ]; then
            docker logs "${postgres_container}" > database/customer-privacy-planning-postgres.log 2>&1
          fi
      - name: Upload planning diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer-privacy-planning-diagnostics
          path: |
            database/customer-privacy-planning-*.log
          if-no-files-found: warn
          retention-days: 7
