name: Customer Privacy Discovery Documentation Wording Fix

on:
  pull_request:
    paths:
      - ".github/workflows/customer-privacy-discovery-doc-wording-fix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/customer-privacy-discovery-accepted
          fetch-depth: 0
      - name: Restore canonical discovery wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          catalog = Path("docs/MODULE_CATALOG.md")
          text = catalog.read_text()
          old = "PR #206 scope discovery/immutable snapshot are accepted"
          new = "PR #206 scope discovery and immutable snapshot are accepted"
          if old not in text:
              raise SystemExit("module catalog discovery wording mismatch")
          catalog.write_text(text.replace(old, new, 1))

          Path(".github/workflows/customer-privacy-discovery-doc-conformance-log.yml").unlink(missing_ok=True)
          Path(".github/workflows/customer-privacy-discovery-doc-wording-fix.yml").unlink()
          PY
      - name: Commit wording fix and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix accepted discovery documentation wording"
          git push origin HEAD:docs/customer-privacy-discovery-accepted
