name: Customer Privacy Discovery Post-Merge Sync

on:
  pull_request:
    paths:
      - ".github/workflows/customer-privacy-discovery-post-merge-sync.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/customer-privacy-discovery-accepted
          fetch-depth: 0
      - name: Synchronize accepted discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          accepted = "086b17a95058eee285fcb67a903bd21d9263d357"
          merge = "95818fd3aeb54a9593a45642583f0b7224d5ecfe"

          contract_path = Path("contracts/customer-privacy-discovery-snapshot-implementation.json")
          contract = json.loads(contract_path.read_text())
          contract["status"] = "accepted_merged"
          contract["acceptance"]["accepted_source_sha"] = accepted
          contract["acceptance"]["permanent_workflow_count"] = 31
          contract["acceptance"]["pull_request"] = 206
          contract["acceptance"]["merge_sha"] = merge
          contract_path.write_text(json.dumps(contract, indent=2) + "\n")

          implementation = Path("docs/CUSTOMER_PRIVACY_DISCOVERY_SNAPSHOT_IMPLEMENTATION.md")
          text = implementation.read_text()
          text = text.replace(
              "Status: **Implemented; exact-head acceptance pending until all applicable permanent workflows pass on one unchanged source SHA.**",
              "Status: **Accepted and merged through PR #206.**",
              1,
          )
          old = "Permanent acceptance is owned by `.github/workflows/customer-privacy-discovery.yml` plus the repository-wide applicable workflows. The machine-readable implementation record is `contracts/customer-privacy-discovery-snapshot-implementation.json`.\n\nThe next bounded packet after merge is deterministic planning and permission-aware plan/outcome reads. Restrictions, holds, retention and execution remain blocked until their own packets."
          new = f"Permanent acceptance is owned by `.github/workflows/customer-privacy-discovery.yml` plus the repository-wide applicable workflows. The machine-readable implementation record is `contracts/customer-privacy-discovery-snapshot-implementation.json`.\n\nAccepted evidence:\n\n- PR `#206`;\n- accepted source `{accepted}`;\n- `31 of 31` permanent workflows succeeded on the unchanged source;\n- squash merge `{merge}`.\n\nThe next bounded packet is deterministic planning and permission-aware plan/outcome reads. Restrictions, holds, retention and execution remain blocked until their own packets."
          if old not in text:
              raise SystemExit("implementation acceptance block mismatch")
          implementation.write_text(text.replace(old, new, 1))

          status = Path("docs/PROJECT_STATUS.md")
          text = status.read_text()
          replacements = {
              "Latest accepted package baseline: PR #205 / merge `f0f46238cf103f6e36487f599181e83849342021`. PR #206 implements trusted-internal production discovery and immutable PostgreSQL scope snapshots inside that package boundary without public routes, workers or package growth.":
                  f"Latest accepted Customer Privacy runtime baseline: PR #206 / accepted source `{accepted}` / merge `{merge}` / 31 of 31 permanent workflows. PR #205 / merge `f0f46238cf103f6e36487f599181e83849342021` remains the accepted package baseline.",
              "PR #206 composes the accepted owner executors into trusted-internal discovery. It adds no Customer Privacy worker, public ingress, planning or owner action execution.":
                  f"PR #206 / accepted source `{accepted}` / merge `{merge}` composes the accepted owner executors into trusted-internal discovery. It adds no Customer Privacy worker, public ingress, planning or owner action execution.",
              "Customer Privacy production scope discovery and immutable snapshot acceptance":
                  "Deterministic Customer Privacy planning and permission-aware plan/outcome reads",
              "## Active product packet — Production scope discovery and immutable snapshot":
                  "## Accepted product packet — Production scope discovery and immutable snapshot",
              "State: **Implemented in PR #206; exact-head gate review pending**.":
                  f"State: **Accepted through PR #206 / source `{accepted}` / merge `{merge}` / 31 of 31 permanent workflows**.",
              "State: **Ready only after PR #206 exact-head acceptance and merge**.":
                  "State: **Ready; implementation not started**.",
              "5. PR #205 — Customer Privacy golden packages accepted without behavior change; accepted source `18c3e991454241f7ee3b02884345eac462bb6c04`; merge `f0f46238cf103f6e36487f599181e83849342021`; 29 of 29 applicable workflows.":
                  f"5. PR #205 — Customer Privacy golden packages accepted without behavior change; accepted source `18c3e991454241f7ee3b02884345eac462bb6c04`; merge `f0f46238cf103f6e36487f599181e83849342021`; 29 of 29 applicable workflows.\n6. PR #206 — production discovery and immutable snapshot accepted; source `{accepted}`; merge `{merge}`; 31 of 31 permanent workflows.",
              "- PR #206 adds no package, no external dependency family/version/feature/source drift and no unjustified lockfile growth.":
                  "- PR #206 added no package, no external dependency family/version/feature/source drift and no unjustified lockfile growth.",
              "2. accept PR #206 on one unchanged exact head;":
                  f"2. preserve accepted PR #206 / source `{accepted}` / merge `{merge}`;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"project status mismatch: {old[:80]}")
              text = text.replace(old, new, 1)
          status.write_text(text)

          roadmap = Path("docs/IMPLEMENTATION_ROADMAP.md")
          text = roadmap.read_text()
          replacements = {
              "All nine privacy owner-scope implementations are accepted. Their coordinates remain non-public owner-owned reads. PR #206 composes them into trusted-internal production discovery while adding no planning or owner execution runtime.":
                  f"All nine privacy owner-scope implementations are accepted. Their coordinates remain non-public owner-owned reads. PR #206 / accepted source `{accepted}` / merge `{merge}` / 31 of 31 permanent workflows composes them into trusted-internal production discovery while adding no planning or owner execution runtime.",
              "3. **Scope discovery and immutable snapshot runtime implementation — Gate review in PR #206.**":
                  "3. **Scope discovery and immutable snapshot runtime implementation — Complete through PR #206.**",
              "### 7.3 Current bounded packet — production scope discovery and immutable snapshot":
                  "### 7.3 Accepted bounded packet — production scope discovery and immutable snapshot",
              "State: **Gate review in PR #206; implementation complete, merge pending exact-head acceptance**.":
                  f"State: **Complete through PR #206 / source `{accepted}` / merge `{merge}` / 31 of 31 permanent workflows**.",
              "Planning, restrictions, holds, retention decisions, owner execution and Phase 8B remain unimplemented. After merge, the next bounded packet is deterministic planning and permission-aware plan/outcome reads.":
                  "Planning, restrictions, holds, retention decisions, owner execution and Phase 8B remain unimplemented. The next bounded packet is deterministic planning and permission-aware plan/outcome reads.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"roadmap mismatch: {old[:80]}")
              text = text.replace(old, new, 1)
          roadmap.write_text(text)

          phase = Path("docs/PHASE8_DELIVERY_PLAN.md")
          text = phase.read_text()
          replacements = {
              "State: **Implemented in PR #206; exact-head gate review pending**.":
                  f"State: **Accepted through PR #206 / source `{accepted}` / merge `{merge}` / 31 of 31 permanent workflows**.",
              "PR #206 implements the frozen Packet B semantics inside the accepted application/PostgreSQL/production packages and records later evidence without rewriting the historical freeze.":
                  f"PR #206 / accepted source `{accepted}` / merge `{merge}` implements the frozen Packet B semantics inside the accepted application/PostgreSQL/production packages and records later evidence without rewriting the historical freeze.",
              "Acceptance requires every applicable permanent workflow to pass on one unchanged exact source SHA, followed by squash merge with expected-head protection.":
                  f"Acceptance completed on source `{accepted}` with 31 of 31 permanent workflows, followed by expected-head squash merge `{merge}`.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"phase plan mismatch: {old[:80]}")
              text = text.replace(old, new, 1)
          phase.write_text(text)

          catalog = Path("docs/MODULE_CATALOG.md")
          text = catalog.read_text()
          replacements = {
              "All nine owner contributions are accepted. PR #206 implements production scope discovery and immutable snapshot and is in exact-head gate review; planning and action execution remain not started and become the next bounded packet only after merge.":
                  f"All nine owner contributions and production discovery are accepted. PR #206 / source `{accepted}` / merge `{merge}` passed 31 of 31 permanent workflows; planning and action execution remain not started and are the next bounded packet.",
              "The PR #206 candidate additionally proves discovery/snapshot without public routes or workers;":
                  "Merged PR #206 additionally proves discovery/snapshot without public routes or workers;",
              "- 8A.11 / #126 — Customer Privacy. All nine owner contributions are accepted through PR #192. PR #206 implements scope discovery and immutable snapshot and awaits exact-head acceptance. Planning, approval, restrictions, legal holds, execution, access/export, deletion/anonymization and convergence remain incomplete.":
                  f"- 8A.11 / #126 — Customer Privacy. All nine owner contributions and PR #206 scope discovery/immutable snapshot are accepted; source `{accepted}`, merge `{merge}`, 31 of 31 permanent workflows. Planning, approval, restrictions, legal holds, execution, access/export, deletion/anonymization and convergence remain incomplete.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"catalog mismatch: {old[:80]}")
              text = text.replace(old, new, 1)
          catalog.write_text(text)

          freeze_test = Path("tests/test_customer_privacy_discovery_snapshot_freeze.py")
          text = freeze_test.read_text()
          old = (
              '        self.assertIn("scope discovery and immutable snapshot", self.status.lower())\n'
              '        self.assertIn("implemented in pr #206", self.status.lower())\n'
              '        self.assertIn("exact-head gate review pending", self.status.lower())\n'
          )
          new = (
              '        self.assertIn("scope discovery and immutable snapshot", self.status.lower())\n'
              '        self.assertIn("accepted through pr #206", self.status.lower())\n'
              f'        self.assertIn("{accepted}", self.status)\n'
              f'        self.assertIn("{merge}", self.status)\n'
          )
          if old not in text:
              raise SystemExit("freeze test mismatch")
          freeze_test.write_text(text.replace(old, new, 1))

          owner_test = Path("tests/test_customer_privacy_owner_scope_contracts.py")
          text = owner_test.read_text()
          text = text.replace(
              "def test_status_sources_track_nine_accepted_owners_and_discovery_gate(self) -> None:",
              "def test_status_sources_track_nine_accepted_owners_and_discovery_acceptance(self) -> None:",
              1,
          )
          old = (
              '        self.assertIn(\n'
              '            "Implemented in PR #206; exact-head gate review pending", phase_plan\n'
              '        )\n'
              '        self.assertIn("PR #206", module_catalog)\n'
          )
          new = (
              '        self.assertIn("Accepted through PR #206", phase_plan)\n'
              f'        self.assertIn("{accepted}", phase_plan)\n'
              f'        self.assertIn("{merge}", phase_plan)\n'
              '        self.assertIn("PR #206", module_catalog)\n'
          )
          if old not in text:
              raise SystemExit("owner test mismatch")
          owner_test.write_text(text.replace(old, new, 1))

          stale = (
              "implemented_pending_exact_head_acceptance",
              "exact-head gate review pending",
              "awaits exact-head acceptance",
              "merge pending exact-head acceptance",
              "Ready only after PR #206 exact-head acceptance and merge",
          )
          checked = [contract_path, implementation, status, roadmap, phase, catalog, freeze_test, owner_test]
          combined = "\n".join(path.read_text() for path in checked)
          for phrase in stale:
              if phrase in combined:
                  raise SystemExit(f"stale acceptance phrase remains: {phrase}")

          Path(".github/workflows/customer-privacy-discovery-post-merge-sync.yml").unlink()
          PY
      - name: Commit post-merge synchronization and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Synchronize accepted Customer Privacy discovery evidence"
          git push origin HEAD:docs/customer-privacy-discovery-accepted
