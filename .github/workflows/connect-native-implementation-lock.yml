name: Temporary CRM native Connect lock regeneration check
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/connect-native-implementation-lock.yml"
      - "apps/cloudflare-crm/rust-party/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Regenerate lock and verify WASM compilation
        working-directory: apps/cloudflare-crm/rust-party
        run: |
          cargo check --target wasm32-unknown-unknown --features native-ci || true
          echo "GENERATED_CONNECT_WRAPPER_START"
          find target -name _connectrpc.rs -print -exec sed -n "1,160p" {} \; | head -n 190
          echo "GENERATED_CONNECT_WRAPPER_END"
          python3 - <<'PY'
          import json, pathlib
          data=pathlib.Path("Cargo.lock").read_text()
          print("LOCK_JSON_START")
          print(json.dumps(data))
          print("LOCK_JSON_END")
          PY
