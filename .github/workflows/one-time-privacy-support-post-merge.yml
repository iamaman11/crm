name: One-time privacy support post-merge synchronization

on:
  pull_request:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'docs/privacy-owner-scope-support-post-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/privacy-owner-scope-support-post-merge
          fetch-depth: 0
      - name: Synchronize accepted PR and next packet
        run: python scripts/one_time_sync_privacy_support_post_merge.py
      - name: Publish documentation-only candidate and remove one-time tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/MODULE_CATALOG.md \
            docs/DELIVERY_GOVERNANCE.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/PRIVACY_OWNER_SCOPE_SHARED_SUPPORT_COMPARISON.md
          git rm scripts/one_time_sync_privacy_support_post_merge.py \
            .github/workflows/one-time-privacy-support-post-merge.yml
          git diff --cached --check -- ':!docs/*.md'
          git commit -m "Synchronize status after shared privacy support"
          git push origin HEAD:docs/privacy-owner-scope-support-post-merge
