name: Customer Privacy Conformance Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/customer-privacy-conformance-diagnostic.yml"
      - "docs/PHASE8_DELIVERY_PLAN.md"
      - "crates/crm-customer-privacy-application/**"
      - "crates/crm-customer-privacy-production/**"
      - "contracts/**"
      - "modules/*/module.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: rustfmt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Architecture boundaries
        continue-on-error: true
        run: python scripts/check_architecture.py
      - name: Module manifests and normalized IR
        continue-on-error: true
        run: python scripts/repo.py manifests
      - name: Generated contract bindings
        continue-on-error: true
        run: python scripts/repo.py contracts
      - name: Native module composition
        continue-on-error: true
        run: python scripts/check_native_module_composition.py
      - name: Production route classifications
        continue-on-error: true
        run: python scripts/check_production_route_classifications.py
      - name: Architecture documentation consistency
        continue-on-error: true
        run: python -m unittest -v tests/test_architecture_documentation_consistency.py
      - name: Contract binding tests
        continue-on-error: true
        run: python -m unittest -v tests/test_contract_bindings.py
      - name: Customer Privacy architecture freeze tests
        continue-on-error: true
        run: python -m unittest -v tests/test_customer_privacy_architecture_freeze.py
      - name: Customer Privacy contract inventory tests
        continue-on-error: true
        run: python -m unittest -v tests/test_customer_privacy_contract_inventory.py
      - name: Customer Privacy owner scope tests
        continue-on-error: true
        run: python -m unittest -v tests/test_customer_privacy_owner_scope_contracts.py
      - name: Module compatibility tests
        continue-on-error: true
        run: python -m unittest -v tests/test_module_compatibility.py
      - name: Module manifest validation tests
        continue-on-error: true
        run: python -m unittest -v tests/test_module_manifest_validation.py
      - name: Module scaffolding tests
        continue-on-error: true
        run: python -m unittest -v tests/test_module_scaffolding.py
      - name: Native composition tests
        continue-on-error: true
        run: python -m unittest -v tests/test_native_module_composition.py
      - name: Production route classification tests
        continue-on-error: true
        run: python -m unittest -v tests/test_production_route_classifications.py
      - name: Production route parity
        continue-on-error: true
        run: cargo test -p crm-application-runtime --test production_route_parity --all-features
      - name: Rust formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
