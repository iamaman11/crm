name: Step 19 Targeted Patch

on:
  push:
    branches:
      - repository-step-19-runtime-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-19-runtime-lifecycle
      - name: Apply fail-closed ignored lifecycle harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/crm-application-runtime/tests/customer_privacy_application_runtime_lifecycle.rs")
          text = path.read_text()
          old = '''#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
          async fn assembled_runtime_discovers_executes_replays_and_honors_uninstall() {
              let Ok(binary) = std::env::var("CRM_API_BINARY") else {
                  eprintln!("skipping assembled runtime lifecycle because CRM_API_BINARY is absent");
                  return;
              };
              let Ok(database_url) = std::env::var("DATABASE_URL") else {
                  eprintln!("skipping assembled runtime lifecycle because DATABASE_URL is absent");
                  return;
              };
          '''
          new = '''#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
          #[ignore = "requires the assembled crm-api binary and authoritative PostgreSQL schema"]
          async fn assembled_runtime_discovers_executes_replays_and_honors_uninstall() {
              let binary = std::env::var("CRM_API_BINARY")
                  .expect("CRM_API_BINARY must name the assembled crm-api binary");
              let database_url = std::env::var("DATABASE_URL")
                  .expect("DATABASE_URL must support assembled runtime lifecycle acceptance");
          '''
          if old not in text:
              raise SystemExit("target lifecycle harness block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "Repository Synchronization Bot"
          git config user.email "repository-sync@users.noreply.github.com"
          git add crates/crm-application-runtime/tests/customer_privacy_application_runtime_lifecycle.rs
          git commit -m "Repository Step 19: make lifecycle harness fail closed"
          git push origin HEAD:repository-step-19-runtime-lifecycle
