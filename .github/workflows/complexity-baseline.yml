name: Complexity Baseline CI

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "architecture-governance.json"
      - "workspace-dependency-policy.json"
      - "step13-complexity-policy.json"
      - "step13-suppression-baseline.json"
      - "crates/**/Cargo.toml"
      - "modules/**/Cargo.toml"
      - "services/**/Cargo.toml"
      - "crates/**/src/**"
      - "modules/**/src/**"
      - "services/**/src/**"
      - ".github/workflows/**"
      - "scripts/analyze_workspace.py"
      - "scripts/analyze_step13_complexity.py"
      - "scripts/analyze_workspace_governance.py"
      - "scripts/check_step13_suppression_baseline.py"
      - "scripts/check_workspace_dependency_policy.py"
      - "tests/test_workspace_analysis.py"
      - "tests/test_step13_complexity_analysis.py"
      - "tests/test_step13_suppression_baseline.py"
      - "tests/test_workspace_governance.py"
      - "tests/test_workspace_dependency_policy.py"
      - "docs/WORKSPACE_COMPLEXITY_BASELINE.md"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "architecture-governance.json"
      - "workspace-dependency-policy.json"
      - "step13-complexity-policy.json"
      - "step13-suppression-baseline.json"
      - "crates/**/Cargo.toml"
      - "modules/**/Cargo.toml"
      - "services/**/Cargo.toml"
      - "crates/**/src/**"
      - "modules/**/src/**"
      - "services/**/src/**"
      - ".github/workflows/**"
      - "scripts/analyze_workspace.py"
      - "scripts/analyze_step13_complexity.py"
      - "scripts/analyze_workspace_governance.py"
      - "scripts/check_step13_suppression_baseline.py"
      - "scripts/check_workspace_dependency_policy.py"
      - "tests/test_workspace_analysis.py"
      - "tests/test_step13_complexity_analysis.py"
      - "tests/test_step13_suppression_baseline.py"
      - "tests/test_workspace_governance.py"
      - "tests/test_workspace_dependency_policy.py"
      - "docs/WORKSPACE_COMPLEXITY_BASELINE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
      - name: Test workspace analyzers
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -m unittest -v \
            tests.test_workspace_analysis \
            tests.test_step13_complexity_analysis \
            tests.test_step13_suppression_baseline \
            tests.test_workspace_governance \
            tests.test_workspace_dependency_policy \
            2>&1 | tee artifacts/workspace-analyzer-tests.log
      - name: Enforce canonical suppression registry formatting
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("step13-suppression-baseline.json")
          current = source.read_text(encoding="utf-8")
          canonical = json.dumps(
              json.loads(current), indent=2, sort_keys=True
          ) + "\n"
          output = Path("artifacts/step13-suppression-baseline.canonical.json")
          output.write_text(canonical, encoding="utf-8")
          if current != canonical:
              raise SystemExit(
                  "step13-suppression-baseline.json is not canonical pretty-printed JSON"
              )
          PY
      - name: Generate measurement-only workspace and CI baseline
        run: |
          set -euo pipefail
          python scripts/analyze_workspace.py \
            --json-output artifacts/workspace-complexity-baseline.json \
            --markdown-output artifacts/workspace-complexity-baseline.md
          cat artifacts/workspace-complexity-baseline.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Generate ADR-031 current-main calibration baseline
        run: |
          set -euo pipefail
          python scripts/analyze_step13_complexity.py \
            --json-output artifacts/step13-complexity-baseline.json \
            --markdown-output artifacts/step13-complexity-baseline.md
          cat artifacts/step13-complexity-baseline.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Enforce registered suppression multiset
        run: |
          set -euo pipefail
          python scripts/check_step13_suppression_baseline.py \
            --check \
            --json-output artifacts/step13-suppression-enforcement.json \
            --markdown-output artifacts/step13-suppression-enforcement.md
          cat artifacts/step13-suppression-enforcement.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Validate dependency, crate and exception governance
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          python scripts/analyze_workspace_governance.py \
            --base-ref "origin/${BASE_REF}" \
            --check \
            --json-output artifacts/workspace-governance-baseline.json \
            --markdown-output artifacts/workspace-governance-baseline.md
          cat artifacts/workspace-governance-baseline.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Enforce calibrated workspace dependency policies
        run: |
          set -euo pipefail
          python scripts/check_workspace_dependency_policy.py \
            --check \
            --json-output artifacts/workspace-dependency-policy.json \
            --markdown-output artifacts/workspace-dependency-policy.md
          cat artifacts/workspace-dependency-policy.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload complexity baseline and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-complexity-baseline
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
