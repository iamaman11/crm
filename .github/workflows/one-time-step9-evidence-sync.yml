name: One-time Step 9 Evidence Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-step9-evidence-sync.yml"

permissions:
  contents: write

concurrency:
  group: one-time-step9-evidence-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install repository tooling dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Materialize accepted repository step 9 evidence
        run: |
          python scripts/one_time_step9_evidence_sync_runner.py
          python scripts/generate_repository_navigation.py --write
      - name: Verify permanent documentation and navigation guards
        run: python -m unittest -v tests.test_architecture_documentation_consistency tests.test_repository_navigation
      - name: Commit synchronized normative evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          paths=(
            docs/ACTIVE_PACKET.md
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md
            docs/IMPLEMENTATION_ROADMAP.md
            docs/PHASE8_DELIVERY_PLAN.md
            docs/PROJECT_STATUS.md
            tests/test_architecture_documentation_consistency.py
            tests/test_repository_navigation.py
          )
          git add "${paths[@]}"
          git diff --cached --exit-code && { echo "Expected evidence changes were not materialized."; exit 1; } || true
          git commit -m "Docs: synchronize accepted repository step 9 evidence"
          git restore scripts/one_time_step9_evidence_sync.py
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
