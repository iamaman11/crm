name: One-time Step 10 Generic Quiescence

on:
  pull_request:
    branches:
      - main

concurrency:
  group: one-time-step10-generic-quiescence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_generic_conformance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_generic_conformance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5437
      PGDATABASE: crm_generic_conformance_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5437/crm_generic_conformance_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5437/crm_generic_conformance_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Install verification dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Materialize exact quiescence and packet fixes
        run: python scripts/one_time_step10_generic_quiescence.py
      - name: Verify navigation, packet and focused compilation
        run: |
          python scripts/generate_repository_navigation.py --check
          python scripts/check_architecture.py
          python -m unittest \
            tests.test_repository_navigation \
            tests.test_architecture_documentation_consistency \
            tests.test_generic_conformance_adoption
          cargo fmt --all --check
          cargo test --locked -p crm-api --test generic_conformance_process_e2e --no-run
      - name: Prepare representative database
        run: |
          bash scripts/prepare_customer_enrichment_consent_policy_database.sh
          psql --set ON_ERROR_STOP=1 --file database/tests/0020_customer_privacy_persistence_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0022_customer_privacy_submit_fixture.sql
          psql --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO crm.capability_registry (
            capability_id, capability_version, owner_module_id, owner_module_version,
            service_name, method_name, input_descriptor_hash, output_descriptor_hash,
            risk_level, idempotency_required, audit_required, approval_required,
            ai_callable, marketplace_callable, bulk_allowed, export_allowed,
            data_classes_touched
          ) VALUES (
            'customer_privacy.case.subject.verify', '1.0.0',
            'crm.customer-privacy', '0.2.0',
            'crm.customer_privacy.v1.CustomerPrivacyCaseService',
            'VerifyPrivacyCaseSubject', decode(repeat('76', 32), 'hex'),
            decode(repeat('77', 32), 'hex'), 'critical', true, true, false,
            false, false, false, false,
            ARRAY['personal', 'confidential']::text[]
          ) ON CONFLICT (capability_id, capability_version) DO NOTHING;
          SQL
      - name: Verify full mutation/query conformance after dispatch quiescence
        run: cargo test --locked -p crm-api --test generic_conformance_process_e2e -- --nocapture
      - name: Commit permanent quiescence fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/crm-api/tests/generic_conformance_process_e2e.rs \
            repository-packet.json \
            docs/ACTIVE_PACKET.md \
            docs/generated/REPOSITORY_MAP.md \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          git diff --cached --quiet && {
            echo "Expected generic-conformance quiescence changes were not produced" >&2
            exit 1
          }
          git commit -m "Step 10: quiesce background dispatch before query conformance"
          git pull --rebase origin "${HEAD_BRANCH}"
          git push origin "HEAD:${HEAD_BRANCH}"
