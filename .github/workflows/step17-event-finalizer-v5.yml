name: Step 17 Event Telemetry Finalizer V7

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-event-finalizer-v5.yml"

concurrency:
  group: step17-event-telemetry-finalizer-v7-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-event-delivery-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Extract verified finalizer scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML

          workflow = YAML(typ="safe").load(
              Path(".github/workflows/step17-complexity-diagnostic.yml").read_text(encoding="utf-8")
          )
          wanted = {
              "Reproduce verified event telemetry candidate": "reproduce",
              "Apply checksum-bound reduction": "reduce",
              "Verify exact fourteen-file tree": "tree",
              "Commit clean candidate locally": "commit",
              "Validate generated policy and packet": "policy",
              "Test focused Rust closure": "rust",
              "Run full workspace Clippy": "clippy",
              "Enforce accepted complexity ceilings": "complexity",
              "Publish clean exact head": "publish",
          }
          steps = workflow["jobs"]["validate-and-publish"]["steps"]
          found = {}
          for step in steps:
              name = step.get("name")
              if name in wanted:
                  found[name] = step["run"]
                  Path(f"/tmp/step17-{wanted[name]}.sh").write_text(step["run"], encoding="utf-8")
          if set(found) != set(wanted):
              raise SystemExit(f"missing finalizer scripts: {sorted(set(wanted) - set(found))}")
          PY
      - name: Build exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/step17-reproduce.sh
          bash /tmp/step17-reduce.sh
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/crm-application-runtime/src/runtime.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "let store = (store, event_delivery_observer).into();":
                  "let store: PostgresDataStore = (store, event_delivery_observer).into();",
              '"worker_error": state.components.last_worker_error(),':
                  '"worker_error": state.components.last_worker_error.lock().ok().and_then(|value| value.clone()),',
              '''    pub fn last_worker_error(&self) -> Option<String> {
                  self.last_worker_error.lock().ok()?.clone()
              }
          ''': "",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one runtime target, found {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/step17-event-finalizer-v5.yml
          cargo fmt --all
          bash /tmp/step17-tree.sh
          bash /tmp/step17-commit.sh
      - name: Validate exact policy, Rust, Clippy and complexity
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/step17-policy.sh
          bash /tmp/step17-rust.sh
          bash /tmp/step17-clippy.sh
          bash /tmp/step17-complexity.sh
      - name: Publish proven clean head
        run: bash /tmp/step17-publish.sh
