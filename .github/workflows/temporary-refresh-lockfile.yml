name: Temporary Refresh Lockfile

on:
  push:
    branches:
      - chore/refresh-displaydoc-lockfile

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/refresh-displaydoc-lockfile
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Generate current lockfile
        run: cargo generate-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Refresh Cargo lockfile resolution"
          git push origin HEAD:chore/refresh-displaydoc-lockfile
