name: Step 17 Budget Package

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-budget-package.yml"
      - "scripts/finalize_step17_budget_refactor.py"

concurrency:
  group: step17-budget-package-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-contract-usage-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Allow exact duplicated telemetry fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_step17_telemetry_budget_refactor.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one target, found {count}: {old[:100]!r}")
              write(path, content.replace(old, new, 1))
          '''
          new = '''def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              duplicated_fixture = (
                  path == "crates/crm-capability-adapters/src/contract_usage_telemetry.rs"
                  and "let mut render = None;" in old
                  and count == 2
              )
              if count != 1 and not duplicated_fixture:
                  raise RuntimeError(f"{path}: expected one target, found {count}: {old[:100]!r}")
              write(path, content.replace(old, new, 1))
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one replace_once helper, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Build final clean tree
        run: |
          python scripts/apply_step17_telemetry_budget_refactor.py
          python scripts/finalize_step17_budget_refactor.py
          python scripts/generate_contract_telemetry_catalog.py --write
          python scripts/generate_repository_navigation.py --write
      - name: Run exact guards
        run: |
          python -m unittest \
            tests/test_contract_telemetry_catalog.py \
            tests/test_repository_navigation.py \
            tests/test_architecture_documentation_consistency.py
      - name: Format and verify Rust
        run: |
          cargo fmt --all
          cargo test --locked -p crm-capability-adapters contract_usage_telemetry
          cargo check --locked -p crm-application-runtime --all-targets
      - name: Enforce accepted complexity ceilings
        run: |
          mkdir -p artifacts
          python scripts/analyze_workspace.py \
            --json-output artifacts/workspace-complexity-baseline.json \
            --markdown-output artifacts/workspace-complexity-baseline.md
          python scripts/analyze_step13_complexity.py \
            --json-output artifacts/step13-complexity-baseline.json \
            --markdown-output artifacts/step13-complexity-baseline.md
          python scripts/check_step13_exit_evidence.py \
            --check \
            --json-output artifacts/step13-exit-evidence.json \
            --markdown-output artifacts/step13-exit-evidence.md
      - name: Package exactly fourteen final files
        shell: bash
        run: |
          cat > artifacts/final-files.txt <<'EOF'
          .github/workflows/contracts.yml
          affected-scope-policy.json
          crates/crm-application-runtime/src/generated_contract_telemetry.rs
          crates/crm-application-runtime/src/lib.rs
          crates/crm-application-runtime/src/process.rs
          crates/crm-application-runtime/src/runtime.rs
          crates/crm-capability-adapters/src/contract_usage_telemetry.rs
          crates/crm-capability-adapters/src/lib.rs
          docs/ACTIVE_PACKET.md
          repository-packet.json
          scripts/generate_contract_telemetry_catalog.py
          tests/test_architecture_documentation_consistency.py
          tests/test_contract_telemetry_catalog.py
          tests/test_repository_navigation.py
          EOF
          sed -i 's/^          //' artifacts/final-files.txt
          while IFS= read -r path; do test -f "$path"; done < artifacts/final-files.txt
          tar -czf artifacts/step17-final-tree.tar.gz -T artifacts/final-files.txt
          sha256sum artifacts/step17-final-tree.tar.gz > artifacts/step17-final-tree.sha256
      - name: Upload proven clean tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: step17-proven-clean-tree
          path: |
            artifacts/final-files.txt
            artifacts/step17-final-tree.tar.gz
            artifacts/step17-final-tree.sha256
            artifacts/*complexity*.*
            artifacts/step13-exit-evidence.*
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            .github/workflows/contracts.yml \
            .github/workflows/step17-budget-package.yml \
            .github/workflows/step17-telemetry-budget-refactor.yml
          git rm -f \
            scripts/apply_step17_telemetry_budget_refactor.py \
            scripts/finalize_step17_budget_refactor.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Step 17: publish proven telemetry runtime tree"
          git push origin HEAD:step17-contract-usage-telemetry
