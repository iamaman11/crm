name: Temporary Step 8 Reads Verify

on:
  pull_request:
    paths:
      - ".github/step8-reads-source.b64"
      - ".github/workflows/temporary-step8-reads-verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Materialize reviewed reads source
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .github/step8-reads-source.b64)" -eq 11796
          echo "e72fc31055df57da5e5f922c843d7ebb4e170855ec081dd6b8af05aa1a06d551  .github/step8-reads-source.b64" | sha256sum --check
          base64 --decode .github/step8-reads-source.b64 > /tmp/step8-reads.rs.gz
          test "$(wc -c < /tmp/step8-reads.rs.gz)" -eq 8847
          echo "6623588dda27edaacd2ece295120bc581613fb726875dd35e142a39e3ff57784  /tmp/step8-reads.rs.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/step8-reads.rs.gz > crates/crm-customer-privacy-application/src/reads.rs
      - name: Verify format, tests and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked -p crm-customer-privacy-application
          cargo clippy --locked -p crm-customer-privacy-application --all-targets -- -D warnings
      - name: Publish verified reads source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/crm-customer-privacy-application/src/reads.rs
          if ! git diff --cached --quiet; then
            git commit -m "WIP: verify step 8 owner-outcome reads"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
