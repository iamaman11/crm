name: Temporary Step 18 PostgreSQL Role Order

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify-and-update:
    if: github.head_ref == 'repository-step-18-dev-up-reset' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.12.0"
      - name: Move required application role before migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          implementation = Path('scripts/local_dev.py')
          content = implementation.read_text(encoding='utf-8')
          old = '''def _initialize(runtime: DockerRuntime, root: Path, config: DevConfig) -> int:
    for relative in config.schema_paths:
        runtime.execute_sql(config, (root / relative).read_text(encoding="utf-8"))
    runtime.execute_sql(
        config,
        """
DO $crm_local$
BEGIN
  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'crm_app_test') THEN
    CREATE ROLE crm_app_test LOGIN PASSWORD 'crm_app_test';
  ELSE
    ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test';
  END IF;
END
$crm_local$;
""",
    )
'''
          new = '''def _initialize(runtime: DockerRuntime, root: Path, config: DevConfig) -> int:
    runtime.execute_sql(
        config,
        """
DO $crm_local$
BEGIN
  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'crm_app_test') THEN
    CREATE ROLE crm_app_test LOGIN PASSWORD 'crm_app_test';
  ELSE
    ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test';
  END IF;
END
$crm_local$;
""",
    )
    for relative in config.schema_paths:
        runtime.execute_sql(config, (root / relative).read_text(encoding="utf-8"))
'''
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'expected initialization block once, found {count}')
          implementation.write_text(content.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_local_dev.py')
          content = tests.read_text(encoding='utf-8')
          marker = '''    def test_fresh_up_then_unchanged_up_is_idempotent(self) -> None:
'''
          method = '''    def test_application_role_is_provisioned_before_first_migration(self) -> None:
        with tempfile.TemporaryDirectory() as temporary:
            root = Path(temporary)
            prepare_root(root)
            runtime = FakeRuntime()
            dev_up(
                root,
                runtime=runtime,
                doctor_report={"ok": True},
                environ={"CRM_LOCAL_NAMESPACE": "unit-role-order"},
            )
        self.assertIn("CREATE ROLE crm_app_test", runtime.sql[0])
        self.assertEqual(runtime.sql[1], "CREATE SCHEMA crm;\\n")

'''
          count = content.count(marker)
          if count != 1:
              raise SystemExit(f'expected test insertion marker once, found {count}')
          tests.write_text(content.replace(marker, method + marker), encoding='utf-8')
          PY
          python -m unittest tests.test_local_dev
      - name: Prove clean Docker create reuse and reset
        env:
          CRM_RUN_LOCAL_DOCKER_ACCEPTANCE: "1"
          CRM_LOCAL_NAMESPACE: role-order-${{ github.run_id }}
          CRM_LOCAL_POSTGRES_PORT: "55433"
        run: python -m unittest tests.test_local_lifecycle_docker
      - name: Commit verified role ordering
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/local_dev.py tests/test_local_dev.py
          git diff --cached --quiet && { echo "No role-order update produced"; exit 1; }
          git commit -m "Provision local application role before migrations"
          git push origin "HEAD:${HEAD_BRANCH}"
