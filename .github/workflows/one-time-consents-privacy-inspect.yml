name: One-time Consents privacy owner inspection

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'feature/consents-privacy-scope-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Collect exact owner contract and persistence inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection
          proto_file="$(grep -R -l 'message ConsentsPrivacyScopeContributionRequest' proto | head -n 1)"
          test -n "${proto_file}"
          cp "${proto_file}" inspection/contributions.proto
          cp modules/crm-customer-privacy/src/scope.rs inspection/customer-privacy-scope.rs
          cp crates/crm-parties-privacy-scope-adapter/src/request.rs inspection/parties-request.rs
          cp crates/crm-parties-privacy-scope-adapter/src/response.rs inspection/parties-response.rs
          cp crates/crm-parties-privacy-scope-adapter/src/postgres.rs inspection/parties-postgres.rs
          cp crates/crm-parties-privacy-scope-adapter/tests/postgres_scope.rs inspection/parties-postgres-test.rs
          cp .github/workflows/parties-privacy-scope.yml inspection/parties-workflow.yml
          cp crates/crm-consents-capability-adapter/src/lib.rs inspection/consents-capability-adapter.rs
          cp modules/crm-consents/src/domain.rs inspection/consents-domain.rs
          cp modules/crm-consents/src/persistence.rs inspection/consents-persistence.rs
          cp crates/crm-consents-query-adapter/src/base_adapter.rs inspection/consents-base-query-adapter.rs
          cp crates/crm-consents-query-adapter/src/lib.rs inspection/consents-query-adapter.rs
          cp services/crm-api/tests/consent_process_e2e.rs inspection/consent-process-e2e.rs
          cp crates/crm-core-data/src/postgres_bound_read.rs inspection/postgres-bound-read.rs
          grep -R -l 'CREATE TABLE.*relationships\|CREATE TABLE IF NOT EXISTS crm.relationships' database/migrations \
            | while IFS= read -r file; do cp "${file}" "inspection/$(basename "${file}")"; done
          grep -R -n -B 30 -A 120 'consents.authorization.party\|PARTY_AUTHORIZATION_RELATIONSHIP_TYPE' crates modules services database \
            > inspection/consents-relationship-usage.txt || true
          grep -R -n -B 30 -A 120 'list_related_records_for_query\|RelatedRecordListQuery' crates/crm-core-data \
            > inspection/related-record-query.txt || true
      - name: Upload inspection evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consents-privacy-owner-inspection
          path: inspection/
          if-no-files-found: error
          retention-days: 7
