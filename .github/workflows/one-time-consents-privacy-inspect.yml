name: One-time Consents privacy owner validator

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'feature/consents-privacy-scope-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_consents_privacy_scope_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_consents_privacy_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5438
      PGDATABASE: crm_consents_privacy_scope_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5438/crm_consents_privacy_scope_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5438/crm_consents_privacy_scope_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/consents-privacy-scope-adapter
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: clippy, rustfmt
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Normalize source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/crm-consents-privacy-scope-adapter/tests/postgres_scope/support.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "unix_nanos: 100_000_000,",
                  "unix_nanos: 700_000_000 + i64::from(seed),",
                  "Consent effective-time fixture",
              ),
              (
                  """pub(crate) async fn insert_canonical_redirect(admin: &PgPool, source: &str, target: &str) {\n    let transaction_id: String = sqlx::query_scalar(""",
                  """pub(crate) async fn insert_canonical_redirect(admin: &PgPool, source: &str, target: &str) {\n    let mut transaction = admin\n        .begin()\n        .await\n        .expect(\"begin canonical redirect fixture transaction\");\n    sqlx::query(\"SELECT set_config('app.tenant_id', $1, true)\")\n        .bind(TENANT_A)\n        .execute(&mut *transaction)\n        .await\n        .expect(\"bind canonical redirect fixture tenant\");\n    let transaction_id: String = sqlx::query_scalar(""",
                  "canonical redirect transaction binding",
              ),
              (
                  ".fetch_one(admin)\n    .await\n    .expect(\"read redirect source transaction\");",
                  ".fetch_one(&mut *transaction)\n    .await\n    .expect(\"read redirect source transaction\");",
                  "canonical redirect source read",
              ),
              (
                  ".execute(admin)\n    .await\n    .expect(\"insert authoritative canonical redirect fixture\");\n}",
                  ".execute(&mut *transaction)\n    .await\n    .expect(\"insert authoritative canonical redirect fixture\");\n    transaction\n        .commit()\n        .await\n        .expect(\"commit authoritative canonical redirect fixture\");\n}",
                  "canonical redirect commit",
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one {label}, found {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo generate-lockfile
          git diff --check -- Cargo.toml Cargo.lock architecture-policy.json crates/crm-consents-privacy-scope-adapter database/tests/0025_consents_privacy_scope_fixture.sql
      - name: Enforce architecture boundary
        run: python scripts/check_architecture.py
      - name: Prepare authoritative PostgreSQL fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0024_parties_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0025_consents_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify Consents privacy scope adapter
        shell: bash
        run: |
          set -o pipefail
          cargo test -p crm-consents-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee database/consents-privacy-scope-validator.log
      - name: Verify workspace dependency graph
        run: cargo check --workspace --all-features
      - name: Publish normalized validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock architecture-policy.json \
            crates/crm-consents-privacy-scope-adapter \
            database/tests/0025_consents_privacy_scope_fixture.sql
          if git diff --cached --quiet; then
            echo "Validated source was already canonical."
            exit 0
          fi
          git commit -m "Normalize validated Consents privacy scope source"
          git push origin HEAD:feature/consents-privacy-scope-adapter
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consents-privacy-scope-validator-diagnostics
          path: database/consents-privacy-scope-validator.log
          if-no-files-found: warn
          retention-days: 7
