name: Pilot Deployment CI

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".dockerignore"
      - ".gitignore"
      - "affected-scope-policy.json"
      - "repository-packet.json"
      - "tests/test_pilot_deployment.py"
      - ".github/workflows/pilot-deployment.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".dockerignore"
      - ".gitignore"
      - "affected-scope-policy.json"
      - "repository-packet.json"
      - "tests/test_pilot_deployment.py"
      - ".github/workflows/pilot-deployment.yml"

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate deployment invariants and migration boundaries
        run: python -m unittest -v tests.test_pilot_deployment
      - name: Validate deployment script syntax
        run: bash -n deploy/{migrate,backup,restore}.sh
      - name: Validate Compose configuration (not an installed app)
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
