name: One-time Step 9 Phase 8 Sequence Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-step9-phase8-sequence-sync.yml"

permissions:
  contents: write

concurrency:
  group: one-time-step9-phase8-sequence-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install repository tooling dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Synchronize Phase 8 binding sequence
        run: python scripts/one_time_step9_phase8_sequence_sync.py
      - name: Verify permanent documentation guards
        run: python -m unittest -v tests.test_architecture_documentation_consistency tests.test_repository_navigation
      - name: Commit synchronized binding sequence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PHASE8_DELIVERY_PLAN.md tests/test_architecture_documentation_consistency.py
          git diff --cached --exit-code && { echo "Expected sequence changes were not materialized."; exit 1; } || true
          git commit -m "Docs: synchronize Phase 8 repository sequence"
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
