name: Contract CI

on:
  push:
    branches:
      - main
    paths:
      - "proto/**"
      - "contracts/**"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen*.yaml"
      - "crates/crm-proto-contracts/**"
      - "crates/crm-application-runtime/src/generated_contract_telemetry.rs"
      - "packages/client/src/contract_hashes.ts"
      - "schemas/module.schema.json"
      - "scripts/contract_bindings.py"
      - "scripts/contract_lifecycle.py"
      - "scripts/contract_lifecycle_transitions.py"
      - "scripts/contract_retirement_evidence.py"
      - "scripts/generate_contract_bindings.py"
      - "scripts/generate_contract_lifecycle.py"
      - "scripts/generate_contract_telemetry_catalog.py"
      - "scripts/validate_module_manifests.py"
      - "tests/test_contract_bindings.py"
      - "tests/test_contract_lifecycle.py"
      - "tests/test_contract_lifecycle_transitions.py"
      - "tests/test_contract_retirement_evidence.py"
      - "tests/test_contract_telemetry_catalog.py"
      - "requirements-dev.txt"
      - "modules/*/module.yaml"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "proto/**"
      - "contracts/**"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen*.yaml"
      - "crates/crm-proto-contracts/**"
      - "crates/crm-application-runtime/src/generated_contract_telemetry.rs"
      - "packages/client/src/contract_hashes.ts"
      - "schemas/module.schema.json"
      - "scripts/contract_bindings.py"
      - "scripts/contract_lifecycle.py"
      - "scripts/contract_lifecycle_transitions.py"
      - "scripts/contract_retirement_evidence.py"
      - "scripts/generate_contract_bindings.py"
      - "scripts/generate_contract_lifecycle.py"
      - "scripts/generate_contract_telemetry_catalog.py"
      - "scripts/validate_module_manifests.py"
      - "tests/test_contract_bindings.py"
      - "tests/test_contract_lifecycle.py"
      - "tests/test_contract_lifecycle_transitions.py"
      - "tests/test_contract_retirement_evidence.py"
      - "tests/test_contract_telemetry_catalog.py"
      - "requirements-dev.txt"
      - "modules/*/module.yaml"
      - ".github/workflows/contracts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install contract validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - name: Build, format, lint, generate and breaking checks
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        shell: bash
        run: |
          mkdir -p contract-diagnostics
          set +e

          buf build proto --output contract-diagnostics/crm-schema.binpb \
            >contract-diagnostics/build.txt 2>&1
          build_status=$?

          buf format -d --exit-code proto \
            >contract-diagnostics/format.diff 2>&1
          format_status=$?

          buf lint proto >contract-diagnostics/lint.txt 2>&1
          lint_status=$?

          python -m unittest tests/test_contract_bindings.py tests/test_contract_lifecycle.py tests/test_contract_lifecycle_transitions.py tests/test_contract_retirement_evidence.py tests/test_contract_telemetry_catalog.py \
            >contract-diagnostics/bindings-unit.txt 2>&1
          bindings_unit_status=$?

          bindings_status=0
          if [ "${build_status}" -eq 0 ]; then
            python scripts/generate_contract_bindings.py \
              --check \
              --descriptor-set contract-diagnostics/crm-schema.binpb \
              >contract-diagnostics/bindings.txt 2>&1
            bindings_status=$?
          else
            echo "Binding generation skipped because descriptor build failed" \
              >contract-diagnostics/bindings.txt
            bindings_status=1
          fi

          lifecycle_status=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/generate_contract_lifecycle.py \
              --check \
              --base-ref "origin/${BASE_REF}" \
              --expected-output contract-diagnostics/contract-lifecycle.expected.json \
              >contract-diagnostics/lifecycle.txt 2>&1
            lifecycle_status=$?
          else
            python scripts/generate_contract_lifecycle.py \
              --check \
              --expected-output contract-diagnostics/contract-lifecycle.expected.json \
              >contract-diagnostics/lifecycle.txt 2>&1
            lifecycle_status=$?
          fi

          breaking_status=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git branch --force "${BASE_REF}" "origin/${BASE_REF}"
            buf breaking proto --against ".git#branch=${BASE_REF}" \
              >contract-diagnostics/breaking.txt 2>&1
            breaking_status=$?
          else
            echo "Breaking check skipped outside pull requests" \
              >contract-diagnostics/breaking.txt
          fi

          for report in \
            contract-diagnostics/build.txt \
            contract-diagnostics/format.diff \
            contract-diagnostics/lint.txt \
            contract-diagnostics/bindings-unit.txt \
            contract-diagnostics/bindings.txt \
            contract-diagnostics/lifecycle.txt \
            contract-diagnostics/breaking.txt; do
            echo "::group::${report}"
            cat "${report}"
            echo "::endgroup::"
          done

          printf 'build=%s format=%s lint=%s bindings_unit=%s bindings=%s lifecycle=%s breaking=%s\n' \
            "${build_status}" "${format_status}" "${lint_status}" \
            "${bindings_unit_status}" "${bindings_status}" "${lifecycle_status}" \
            "${breaking_status}"

          if [ "${build_status}" -ne 0 ] || [ "${format_status}" -ne 0 ] || \
             [ "${lint_status}" -ne 0 ] || [ "${bindings_unit_status}" -ne 0 ] || \
             [ "${bindings_status}" -ne 0 ] || [ "${lifecycle_status}" -ne 0 ] || \
             [ "${breaking_status}" -ne 0 ]; then
            exit 1
          fi
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-diagnostics
          path: contract-diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Upload immutable descriptor artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-protobuf-descriptor
          path: contract-diagnostics/crm-schema.binpb
          if-no-files-found: error
          retention-days: 30
