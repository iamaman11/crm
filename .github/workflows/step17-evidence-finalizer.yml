name: Step 17 Evidence Finalizer

on:
  push:
    branches:
      - repository-step-17-evidence-sync
    paths:
      - ".github/workflows/step17-evidence-finalizer.yml"

concurrency:
  group: step17-evidence-finalizer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-17-evidence-sync
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Synchronize accepted Step 17 evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_step17_evidence_sync.py
          python scripts/generate_repository_navigation.py --write
          python -m unittest -v \
            tests.test_repository_navigation \
            tests.test_architecture_documentation_consistency
          git diff --check
          git add \
            docs/PROJECT_STATUS.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/MODULE_CATALOG.md \
            docs/ACTIVE_PACKET.md \
            docs/generated/REPOSITORY_MAP.md \
            repository-packet.json \
            tests/test_repository_navigation.py \
            tests/test_architecture_documentation_consistency.py
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Synchronize accepted Repository Step 17 evidence"
          git push origin HEAD:repository-step-17-evidence-sync
