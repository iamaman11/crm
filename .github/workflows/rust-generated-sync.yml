name: Rust Generated Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Cargo.toml"
      - "requirements-dev.txt"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "crates/**/*.rs"
      - "modules/**/Cargo.toml"
      - "modules/**/*.rs"
      - "modules/*/module.yaml"
      - "services/**/Cargo.toml"
      - "services/**/*.rs"
      - "proto/**/*.proto"
      - "schemas/module.schema.json"
      - "scripts/contract_bindings.py"
      - "scripts/generate_contract_bindings.py"
      - "scripts/validate_module_manifests.py"
      - "contracts/module-contract-bindings.json"
      - "packages/client/src/contract_hashes.ts"
      - ".github/workflows/rust-generated-sync.yml"

permissions:
  contents: write

concurrency:
  group: rust-generated-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply planning source fixes and restore this workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          application = Path("crates/crm-customer-privacy-application/src/planning.rs")
          text = application.read_text(encoding="utf-8")
          marker = "mod tests {\n    use super::*;\n"
          replacement = "mod tests {\n    use super::*;\n    use crm_module_sdk::SchemaVersion;\n"
          if replacement not in text:
              if marker not in text:
                  raise SystemExit("planning test import source mismatch")
              text = text.replace(marker, replacement, 1)
          application.write_text(text, encoding="utf-8")

          postgres = Path("crates/crm-customer-privacy-postgres/src/planning.rs")
          text = postgres.read_text(encoding="utf-8")
          old = '''    let suffix = match lock {
        RowLock::Share => " FOR SHARE",
        RowLock::Update => " FOR UPDATE",
    };
    let sql = format!(
        "SELECT version, owner_module_id, schema_id, schema_version, descriptor_hash, \\
         data_class, payload_encoding, maximum_payload_size, retention_policy_id, payload_bytes \\
         FROM crm.records WHERE tenant_id = $1 AND owner_module_id = $2 \\
         AND record_type = $3 AND record_id = $4 AND deleted_at IS NULL{suffix}"
    );
    postgres_sqlx::query(&sql)
        .bind(tenant_id.as_str())
        .bind(MODULE_ID)
        .bind(record_type)
        .bind(record_id.as_str())
        .fetch_optional(&mut **transaction)
        .await
        .map_err(database_error)
'''
          new = '''    let query = match lock {
        RowLock::Share => postgres_sqlx::query(
            r#"
            SELECT version, owner_module_id, schema_id, schema_version, descriptor_hash,
                   data_class, payload_encoding, maximum_payload_size, retention_policy_id,
                   payload_bytes
            FROM crm.records
            WHERE tenant_id = $1 AND owner_module_id = $2
              AND record_type = $3 AND record_id = $4 AND deleted_at IS NULL
            FOR SHARE
            "#,
        ),
        RowLock::Update => postgres_sqlx::query(
            r#"
            SELECT version, owner_module_id, schema_id, schema_version, descriptor_hash,
                   data_class, payload_encoding, maximum_payload_size, retention_policy_id,
                   payload_bytes
            FROM crm.records
            WHERE tenant_id = $1 AND owner_module_id = $2
              AND record_type = $3 AND record_id = $4 AND deleted_at IS NULL
            FOR UPDATE
            "#,
        ),
    };
    query
        .bind(tenant_id.as_str())
        .bind(MODULE_ID)
        .bind(record_type)
        .bind(record_id.as_str())
        .fetch_optional(&mut **transaction)
        .await
        .map_err(database_error)
'''
          if new not in text:
              if old not in text:
                  raise SystemExit("dynamic planning SQL source mismatch")
              text = text.replace(old, new, 1)

          old = '''    let mut bytes = Vec::new();
    for value in [
        b"crm.customer-privacy.planning-audit/v1".as_slice(),
        invocation.tenant_id.as_str().as_bytes(),
        invocation.privacy_case_id.as_str().as_bytes(),
        event_type.as_bytes(),
        plan.plan_id().as_str().as_bytes(),
        plan.digest().as_slice(),
        resulting_case_version.to_string().as_bytes(),
        invocation.actor_id.as_str().as_bytes(),
        invocation.request_id.as_str().as_bytes(),
    ] {
'''
          new = '''    let resulting_case_version = resulting_case_version.to_string();
    let mut bytes = Vec::new();
    for value in [
        b"crm.customer-privacy.planning-audit/v1".as_slice(),
        invocation.tenant_id.as_str().as_bytes(),
        invocation.privacy_case_id.as_str().as_bytes(),
        event_type.as_bytes(),
        plan.plan_id().as_str().as_bytes(),
        plan.digest().as_slice(),
        resulting_case_version.as_bytes(),
        invocation.actor_id.as_str().as_bytes(),
        invocation.request_id.as_str().as_bytes(),
    ] {
'''
          if new not in text:
              if old not in text:
                  raise SystemExit("planning audit digest source mismatch")
              text = text.replace(old, new, 1)
          postgres.write_text(text, encoding="utf-8")

          workflow = subprocess.check_output(
              ["git", "show", "origin/main:.github/workflows/rust-generated-sync.yml"],
              text=True,
          )
          Path(".github/workflows/rust-generated-sync.yml").write_text(
              workflow, encoding="utf-8"
          )

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com",
              ],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "add",
                  "crates/crm-customer-privacy-application/src/planning.rs",
                  "crates/crm-customer-privacy-postgres/src/planning.rs",
                  ".github/workflows/rust-generated-sync.yml",
              ],
              check=True,
          )
          subprocess.run(
              ["git", "commit", "-m", "Fix Customer Privacy planning source diagnostics"],
              check=True,
          )
          subprocess.run(
              ["git", "push", "origin", f"HEAD:{os.environ['HEAD_BRANCH']}"],
              check=True,
          )
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install generation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: rustfmt, clippy
      - name: Synchronize lockfile and canonical formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Synchronize generated contract artifacts
        run: |
          cargo run -p crm-proto-contracts --bin generate_hashes -- packages/client/src/contract_hashes.ts
          python scripts/generate_contract_bindings.py --write
      - name: Commit generated Rust and contract artifacts when needed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- Cargo.lock crates modules services packages/client/src/contract_hashes.ts contracts/module-contract-bindings.json; then
            echo "Rust and generated contract artifacts are already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.lock crates modules services packages/client/src/contract_hashes.ts contracts/module-contract-bindings.json
            git commit -m "Synchronize Rust and generated contract artifacts"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Apply machine-fixable Clippy maintenance
        run: |
          cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged -- \
            -W unused-imports -W dead-code || true
      - name: Commit Clippy fixes when needed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- Cargo.lock crates modules services; then
            echo "Rust Clippy maintenance is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.lock crates modules services
            git commit -m "Synchronize machine-fixable Rust maintenance"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Verify canonical Clippy state
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee generated-sync-clippy.txt
      - name: Upload canonical Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-sync-clippy-diagnostics
          path: generated-sync-clippy.txt
          if-no-files-found: error
          retention-days: 7
