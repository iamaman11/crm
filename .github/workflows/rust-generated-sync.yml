name: Rust Generated Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Cargo.toml"
      - "requirements-dev.txt"
      - "Cargo.lock"
      - "repository-packet.json"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen*.yaml"
      - "crates/**/Cargo.toml"
      - "crates/**/*.rs"
      - "crates/crm-proto-contracts/**"
      - "modules/**/Cargo.toml"
      - "modules/**/*.rs"
      - "modules/*/module.yaml"
      - "services/**/Cargo.toml"
      - "services/**/*.rs"
      - "proto/**/*.proto"
      - "schemas/module.schema.json"
      - "scripts/apply_step13_measurement_evidence_sync.py"
      - "scripts/contract_bindings.py"
      - "scripts/generate_contract_bindings.py"
      - "scripts/generate_repository_navigation.py"
      - "scripts/repository_navigation.py"
      - "scripts/repo.py"
      - "scripts/validate_module_manifests.py"
      - "tests/test_repository_navigation.py"
      - "contracts/module-contract-bindings.json"
      - "packages/client/src/contract_hashes.ts"
      - "docs/ACTIVE_PACKET.md"
      - "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md"
      - "docs/IMPLEMENTATION_ROADMAP.md"
      - "docs/MODULE_CATALOG.md"
      - "docs/PHASE8_DELIVERY_PLAN.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/generated/REPOSITORY_MAP.md"
      - ".github/workflows/rust-generated-sync.yml"

permissions:
  contents: write

concurrency:
  group: rust-generated-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install generation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: rustfmt, clippy
      - name: Verify committed lockfile and synchronize canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          lockfile_before="$(sha256sum Cargo.lock | cut -d ' ' -f1)"
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all
          lockfile_after="$(sha256sum Cargo.lock | cut -d ' ' -f1)"
          test "${lockfile_before}" = "${lockfile_after}"
          git diff --exit-code -- Cargo.lock
      - name: Synchronize generated contract artifacts
        run: |
          cargo run --locked -p crm-proto-contracts --bin generate_hashes -- packages/client/src/contract_hashes.ts
          python scripts/generate_contract_bindings.py --write
      - name: Materialize accepted repository step 13 measurement evidence
        run: python scripts/apply_step13_measurement_evidence_sync.py
      - name: Synchronize generated repository navigation
        run: python scripts/generate_repository_navigation.py --write
      - name: Commit generated Rust, contract, evidence and navigation artifacts when needed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- crates modules services packages/client/src/contract_hashes.ts contracts/module-contract-bindings.json docs/ACTIVE_PACKET.md docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md docs/IMPLEMENTATION_ROADMAP.md docs/MODULE_CATALOG.md docs/PHASE8_DELIVERY_PLAN.md docs/PROJECT_STATUS.md docs/generated/REPOSITORY_MAP.md)" ]; then
            echo "Rust, contract, evidence and repository navigation artifacts are already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates modules services packages/client/src/contract_hashes.ts contracts/module-contract-bindings.json docs/ACTIVE_PACKET.md docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md docs/IMPLEMENTATION_ROADMAP.md docs/MODULE_CATALOG.md docs/PHASE8_DELIVERY_PLAN.md docs/PROJECT_STATUS.md docs/generated/REPOSITORY_MAP.md
            git commit -m "Synchronize repository step 13 measurement evidence"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Apply machine-fixable Clippy maintenance
        run: |
          cargo clippy --locked --fix --workspace --all-targets --all-features --allow-dirty --allow-staged -- \
            -W unused-imports -W dead-code || true
          git diff --exit-code -- Cargo.lock
      - name: Commit Clippy fixes when needed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- crates modules services; then
            echo "Rust Clippy maintenance is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates modules services
            git commit -m "Synchronize machine-fixable Rust maintenance"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Verify canonical Clippy state
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee generated-sync-clippy.txt
      - name: Upload canonical Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-sync-clippy-diagnostics
          path: generated-sync-clippy.txt
          if-no-files-found: error
          retention-days: 7
