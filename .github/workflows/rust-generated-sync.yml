name: Rust Generated Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "repository-packet.json"
      - "requirements-dev.txt"
      - "Cargo.lock"
      - "crates/crm-proto-contracts/**"
      - "modules/*/module.yaml"
      - "proto/**/*.proto"
      - "schemas/module.schema.json"
      - "scripts/contract_bindings.py"
      - "scripts/generate_contract_bindings.py"
      - "scripts/generate_repository_navigation.py"
      - "scripts/materialize_step21_evidence.py"
      - "scripts/repository_navigation.py"
      - "scripts/repo.py"
      - "scripts/validate_module_manifests.py"
      - "tests/test_architecture_documentation_consistency.py"
      - "tests/test_repository_navigation.py"
      - "contracts/module-contract-bindings.json"
      - "packages/client/src/contract_hashes.ts"
      - "docs/**"
      - ".github/workflows/rust-generated-sync.yml"

permissions:
  contents: write

concurrency:
  group: rust-generated-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install generation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: rustfmt, clippy
      - name: Materialize accepted Repository Step 21 evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'c21894f47f24e81da1cc150f9ea457fcfdc2bd63' docs/PROJECT_STATUS.md; then
            python - <<'PY'
          from pathlib import Path
          path = Path("scripts/materialize_step21_evidence.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '    "**Phases 0.1–7 are complete. Phase 8A is active. Phase 8A.10 is complete. Phase 8A.11 / issue #126 remains in progress.**",',
                  '    "**Phases 0.1–7 are complete. Phase 8A is active. Phase 8A.10 is complete. Phase 8A.11 / issue #126 is complete.**",',
              ),
              (
                  '    updated, count = re.subn(pattern, body.rstrip() + "\\n\\n", text, flags=re.S)',
                  '    updated, count = re.subn(pattern, lambda _: body.rstrip() + "\\n\\n", text, flags=re.S)',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing fail-closed materializer marker: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
            python scripts/materialize_step21_evidence.py
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_regex(text: str, pattern: str, replacement: str, label: str, *, minimum: int = 1) -> str:
              updated, count = re.subn(pattern, lambda _: replacement, text, flags=re.I | re.S | re.M)
              if count < minimum:
                  raise SystemExit(f"missing fail-closed closure marker {label}: {pattern}")
              return updated

          status_path = Path("docs/PROJECT_STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          status = replace_regex(status, r"step 21 is next", "Step 21 is complete through PR #296", "step21-next")
          status = replace_regex(
              status,
              r"repository step 21 phase 8a closure is (?:the only )?next(?: permitted (?:implementation )?packet)?\.??",
              "Repository Step 21 Phase 8A closure is complete through PR #296; Repository Step 22 is the sole next permitted implementation packet.",
              "step21-next-packet",
          )
          status = replace_regex(
              status,
              r"latest accepted customer privacy public inventory remains:\s*\n\s*- seven public mutations:.*?\n\s*- four permission-aware public queries:.*?\n\s*- one customer privacy owner worker\.",
              "Latest accepted Customer Privacy public inventory is final for Phase 8A:\n\n- **nine public mutations**;\n- **seven permission-aware public queries**;\n- **one Customer Privacy owner worker**.",
              "final-inventory-block",
          )
          status = replace_regex(
              status,
              r"still required before phase 8a\.11 can close:\s*\n\s*- restriction and legal-hold release/read lifecycle where required;\s*\n\s*- repository step 21 phase 8a closure review;\s*\n\s*- a full phase 8a\.11 closure review beyond the accepted bounded step 20a case-read slice\.",
              "Phase 8A.11 closure requirements are accepted through PR #296, including the complete restriction/legal-hold release/read lifecycle and final closure review.",
              "remaining-phase8a11-block",
          )
          status = replace_regex(
              status,
              r"customer privacy and phase 8a remain incomplete\. current product-complete expert modules: \*\*1\*\*\.",
              "Customer Privacy and Phase 8A are complete. Current product-complete expert modules: **1**.",
              "privacy-incomplete",
          )
          status = replace_regex(
              status,
              r"- \*\*stage c — in progress:\*\*[^\n]*",
              "- **Stage C — complete through PR #296:** the Customer Privacy golden owner package now proves the complete public lifecycle, owner execution, privacy convergence and operations evidence; wider adoption is later product work, not a Phase 8A closure blocker.",
              "stage-c",
          )
          status = replace_regex(
              status,
              r"- \*\*stage i — in progress:\*\*[^\n]*",
              "- **Stage I — complete through PR #296:** accepted PRs #292, #294 and #296 prove frontend, accessibility, browser, restore, SLO, observability, performance, security, supply-chain and final lifecycle parity.",
              "stage-i",
          )
          status = replace_regex(
              status,
              r"-> 21\. phase 8a closure(?: — complete through pr #296)?",
              "-> 21. Phase 8A closure — complete through PR #296",
              "continuation-step21",
          )
          status = replace_regex(
              status,
              r"phase 8a closure will not make the universal crm product complete\.",
              "Phase 8A closure does not make the Universal CRM product complete.",
              "future-closure-wording",
          )
          status = replace_regex(
              status,
              r"issue #126 remains open until customer privacy and phase 8a\.11 product evidence is complete\.",
              "Issue #126 is ready for closure after the accepted PR #296 evidence synchronization.",
              "issue126-open",
          )
          status = replace_regex(
              status,
              r"latest public customer privacy inventory remains \*\*seven mutations and four permission-aware public queries\*\*\.",
              "Latest public Customer Privacy inventory is **nine mutations and seven permission-aware public queries**.",
              "step19-inventory",
          )
          status = replace_regex(
              status,
              r"phase 8a\.11 / issue #126 is complete; customer privacy is not product-complete; current product-complete expert modules remain zero;",
              "Phase 8A.11 / issue #126 and Customer Privacy are complete; current product-complete expert modules: **1**;",
              "step19-completeness",
          )
          status = replace_regex(
              status,
              r"phase 8a\.11, phase 8a, product-complete expert modules, architecture 10/10 and the universal crm product remain incomplete\.",
              "Customer Privacy and Phase 8A are complete with current product-complete expert modules: **1**; architecture 10/10 and the Universal CRM product remain incomplete.",
              "step20a-completeness",
          )
          status = replace_regex(
              status,
              r"phase 8a\.11, phase 8a, customer privacy as a complete product capability, product-complete expert modules, architecture 10/10 and the universal crm product remain incomplete\.",
              "Customer Privacy and Phase 8A are complete with current product-complete expert modules: **1**; architecture 10/10 and the Universal CRM product remain incomplete.",
              "step20-completeness",
          )
          status = replace_regex(
              status,
              r"the accepted one-worker customer privacy inventory, seven public mutations, four permission-aware public queries",
              "The accepted one-worker Customer Privacy inventory, nine public mutations, seven permission-aware public queries",
              "step20a-inventory",
          )
          status_path.write_text(status, encoding="utf-8")

          architecture_test_path = Path("tests/test_architecture_documentation_consistency.py")
          architecture_test = architecture_test_path.read_text(encoding="utf-8")
          old_regex = 'r"step 21[^\\n.;]{0,100}(?:not started|in progress|\\bnext\\b)",'
          new_regex = 'r"(?:repository )?step 21(?: phase 8a closure)? (?:is )?(?:not started|in progress|next)\\b",'
          if old_regex not in architecture_test:
              raise SystemExit("missing fail-closed Step 21 stale-state regex")
          architecture_test = architecture_test.replace(old_regex, new_regex)
          architecture_test_path.write_text(architecture_test, encoding="utf-8")

          navigation_test_path = Path("tests/test_repository_navigation.py")
          navigation_test = navigation_test_path.read_text(encoding="utf-8")
          marker = '            "Complexity Baseline CI": ".github/workflows/complexity-baseline.yml",\n'
          additions = (
              marker
              + '            "Customer Privacy Access Export CI": ".github/workflows/customer-privacy-access-export.yml",\n'
              + '            "Customer Privacy Operations CI": ".github/workflows/customer-privacy-operations.yml",\n'
              + '            "Customer Privacy Owner Execution CI": ".github/workflows/customer-privacy-owner-execution.yml",\n'
          )
          if "Customer Privacy Access Export CI" not in navigation_test.split("workflow_paths =", 1)[1].split("}", 1)[0]:
              if marker not in navigation_test:
                  raise SystemExit("missing fail-closed workflow path mapping marker")
              navigation_test = navigation_test.replace(marker, additions, 1)
          navigation_test_path.write_text(navigation_test, encoding="utf-8")
          PY
      - name: Verify committed lockfile and synchronize canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          lockfile_before="$(sha256sum Cargo.lock | cut -d ' ' -f1)"
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all
          lockfile_after="$(sha256sum Cargo.lock | cut -d ' ' -f1)"
          test "${lockfile_before}" = "${lockfile_after}"
          git diff --exit-code -- Cargo.lock
      - name: Synchronize generated contract artifacts
        run: |
          cargo run --locked -p crm-proto-contracts --bin generate_hashes -- packages/client/src/contract_hashes.ts
          python scripts/generate_contract_bindings.py --write
      - name: Synchronize generated repository navigation
        run: python scripts/generate_repository_navigation.py --write
      - name: Verify Step 21 documentation guards
        run: python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
      - name: Commit accepted evidence and generated artifacts when needed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            docs/ACTIVE_PACKET.md
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md
            docs/CUSTOMER_PRIVACY_OPERATIONS_READINESS.md
            docs/IMPLEMENTATION_ROADMAP.md
            docs/MODULE_CATALOG.md
            docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md
            docs/PHASE8_DELIVERY_PLAN.md
            docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md
            docs/PROJECT_STATUS.md
            docs/WORKSPACE_COMPLEXITY_BASELINE.md
            docs/generated/REPOSITORY_MAP.md
            tests/test_architecture_documentation_consistency.py
            tests/test_repository_navigation.py
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "Accepted evidence and generated artifacts are already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "${paths[@]}"
            git commit -m "Synchronize accepted Repository Step 21 evidence"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
