name: One-time first-party contribution aggregation

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare first-party aggregation patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet .
          git remote add origin "${auth_remote}"
          git fetch --quiet --no-tags --depth=1 origin architecture/first-party-module-aggregation
          git checkout --quiet -B architecture/first-party-module-aggregation FETCH_HEAD
          python -m py_compile scripts/one_time_first_party_aggregation.py
          python scripts/one_time_first_party_aggregation.py

      - name: Validate formatting lockfile and governance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          python -m unittest -v \
            tests.test_native_module_composition \
            tests.test_ci_event_policy \
            tests.test_action_pinning
          python scripts/check_native_module_composition.py
          python scripts/check_ci_event_policy.py
          python scripts/check_action_pinning.py

      - name: Run focused aggregation tests
        shell: bash
        run: |
          set -o pipefail
          cargo test \
            -p crm-application-composition \
            -p crm-first-party-modules \
            -p crm-customer-accounts-capability-composition \
            -p crm-consents-capability-composition \
            -p crm-application-runtime \
            --lib 2>&1 | tee /tmp/first-party-focused-tests.log

      - name: Check complete workspace
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace 2>&1 | tee /tmp/first-party-workspace-check.log

      - name: Publish validated aggregation source
        shell: bash
        run: |
          set -euo pipefail
          git restore \
            .github/workflows/application-runtime.yml \
            .github/workflows/governance.yml
          git add \
            Cargo.toml \
            Cargo.lock \
            crates/crm-application-runtime/Cargo.toml \
            crates/crm-application-runtime/src/native_composition.rs \
            crates/crm-first-party-modules/Cargo.toml \
            crates/crm-first-party-modules/src/lib.rs \
            docs/FIRST_PARTY_MODULE_AGGREGATION.md \
            scripts/check_native_module_composition.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggregate proven first-party module contributions"
          git push origin HEAD:architecture/first-party-module-aggregation
