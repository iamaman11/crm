name: One-Time Party Relationships Privacy Inspection

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-party-relationships-privacy-inspection.yml"
      - "crates/crm-contact-points-privacy-scope-adapter/**"
      - "crates/crm-party-relationships-capability-adapter/**"
      - "modules/crm-party-relationships/**"
      - "database/migrations/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Collect exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/migrations
          cp -R crates/crm-contact-points-privacy-scope-adapter inspection/
          cp -R crates/crm-party-relationships-capability-adapter inspection/
          cp -R modules/crm-party-relationships inspection/
          cp .github/workflows/contact-points-privacy-scope.yml inspection/
          cp database/tests/0027_contact_points_privacy_scope_fixture.sql inspection/
          while IFS= read -r migration; do
            if grep -Eq "party-relationships|party_relationship" "${migration}"; then
              cp "${migration}" inspection/migrations/
            fi
          done < <(find database/migrations -maxdepth 1 -type f | sort)
          cp Cargo.toml Cargo.lock architecture-policy.json inspection/
          tar -czf party-relationships-privacy-inspection.tar.gz inspection
      - name: Upload exact source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: party-relationships-privacy-inspection
          path: party-relationships-privacy-inspection.tar.gz
          if-no-files-found: error
          retention-days: 1
