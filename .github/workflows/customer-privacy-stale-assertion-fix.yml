name: Customer Privacy Stale Assertion Fix

on:
  pull_request:
    paths:
      - ".github/workflows/customer-privacy-stale-assertion-fix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/customer-privacy-production-discovery-snapshot
          fetch-depth: 0
      - name: Synchronize current discovery gate assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          freeze_test = Path("tests/test_customer_privacy_discovery_snapshot_freeze.py")
          text = freeze_test.read_text()
          old = (
              '        self.assertIn("scope discovery and immutable snapshot", self.status.lower())\n'
              '        self.assertIn("production implementation not started", self.status.lower())\n'
          )
          new = (
              '        self.assertIn("scope discovery and immutable snapshot", self.status.lower())\n'
              '        self.assertIn("implemented in pr #206", self.status.lower())\n'
              '        self.assertIn("exact-head gate review pending", self.status.lower())\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("freeze status assertion mismatch")
          freeze_test.write_text(text)

          owner_test = Path("tests/test_customer_privacy_owner_scope_contracts.py")
          text = owner_test.read_text()
          text = text.replace(
              "def test_status_sources_freeze_nine_accepted_owners_and_discovery_next(self) -> None:",
              "def test_status_sources_track_nine_accepted_owners_and_discovery_gate(self) -> None:",
              1,
          )
          text = text.replace(
              '            self.assertIn("Scope discovery and immutable snapshot", document)\n',
              '            self.assertIn("scope discovery and immutable snapshot", document.lower())\n',
              1,
          )
          old = (
              '        self.assertIn("production discovery is not implemented", phase_plan)\n'
              '        self.assertIn("planning and action execution remain not started", module_catalog)\n'
          )
          new = (
              '        self.assertIn(\n'
              '            "Implemented in PR #206; exact-head gate review pending", phase_plan\n'
              '        )\n'
              '        self.assertIn("PR #206", module_catalog)\n'
              '        self.assertIn("planning and action execution remain not started", module_catalog)\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("owner status assertion mismatch")
          owner_test.write_text(text)

          Path(".github/workflows/customer-privacy-conformance-log.yml").unlink(missing_ok=True)
          Path(".github/workflows/customer-privacy-stale-assertion-fix.yml").unlink()
          PY
      - name: Commit synchronized assertions and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Synchronize Customer Privacy discovery gate assertions"
          git push origin HEAD:feature/customer-privacy-production-discovery-snapshot
