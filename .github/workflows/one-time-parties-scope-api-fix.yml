name: One-time Parties scope API binding fix

on:
  push:
    branches:
      - agent/phase8a11-parties-privacy-scope
    paths:
      - ".github/workflows/one-time-parties-scope-api-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact current API bindings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet .
          git remote add origin "${auth_remote}"
          git fetch --quiet --no-tags --depth=1 origin agent/phase8a11-parties-privacy-scope
          git checkout --quiet -B agent/phase8a11-parties-privacy-scope FETCH_HEAD
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "crates/crm-parties-privacy-scope-adapter/src/postgres.rs": [
                  ("MODULE_ID, PARTY_RECORD_TYPE, PARTY_STATE_MAXIMUM_BYTES", "MODULE_ID, PARTY_STATE_MAXIMUM_BYTES"),
                  ("use crm_parties_capability_adapter::party_from_snapshot;", "use crm_parties_capability_adapter::{RECORD_TYPE as PARTY_RECORD_TYPE, party_from_snapshot};"),
                  ("party_from_snapshot(snapshot)?", "party_from_snapshot(&snapshot)?"),
              ],
              "crates/crm-parties-privacy-scope-adapter/src/response.rs": [
                  ("use crm_parties::{MODULE_ID, PARTY_RECORD_TYPE, PARTY_STATE_RETENTION_POLICY_ID};", "use crm_parties::{MODULE_ID, PARTY_STATE_RETENTION_POLICY_ID};\nuse crm_parties_capability_adapter::RECORD_TYPE as PARTY_RECORD_TYPE;"),
              ],
              "crates/crm-parties-privacy-scope-adapter/src/request.rs": [
                  ("use crm_customer_privacy::{CANONICAL_SCOPE_REGISTRY_VERSION, canonical_scope_registry};", "use crm_customer_privacy::{CANONICAL_SCOPE_REGISTRY_VERSION, OwnerScopeRegistry};"),
                  ("canonical_scope_registry()", "OwnerScopeRegistry::canonical_v1()"),
              ],
              "crates/crm-parties-privacy-scope-adapter/src/tests.rs": [
                  ("use crm_customer_privacy::{CANONICAL_SCOPE_REGISTRY_VERSION, canonical_scope_registry};", "use crm_customer_privacy::{CANONICAL_SCOPE_REGISTRY_VERSION, OwnerScopeRegistry};"),
                  ("canonical_scope_registry()", "OwnerScopeRegistry::canonical_v1()"),
              ],
              "crates/crm-parties-privacy-scope-adapter/tests/postgres_scope.rs": [
                  ("use crm_customer_privacy::{CANONICAL_SCOPE_REGISTRY_VERSION, canonical_scope_registry};", "use crm_customer_privacy::{CANONICAL_SCOPE_REGISTRY_VERSION, OwnerScopeRegistry};"),
                  ("canonical_scope_registry()", "OwnerScopeRegistry::canonical_v1()"),
                  ("crm_parties::PARTY_RECORD_TYPE", "crm_parties_capability_adapter::RECORD_TYPE"),
              ],
          }
          for relative, edits in replacements.items():
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing replacement anchor in {relative}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/one-time-parties-scope-api-fix.yml
          git rm .github/workflows/one-time-parties-scope-diagnostics.yml
          git add crates/crm-parties-privacy-scope-adapter
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align Parties privacy scope with current APIs"
          git push origin HEAD:agent/phase8a11-parties-privacy-scope
