name: Temporary Step 19 Evidence Sync

on:
  push:
    branches:
      - repository-step-19-evidence-sync
    paths:
      - ".github/workflows/temporary-step-19-evidence-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-19-evidence-sync
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Synchronize accepted Step 19 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re

          ROOT = Path.cwd()
          BASELINE = "49c5e35814adceb2be9d4cc2302bf10032b807a0"
          SOURCE_287 = "23b2f4ea660bcd46884fe054cd0c37e89b1495c4"
          MERGE_287 = "c0fec3ae08c836ab483737442ed4377c99c85e9a"
          SOURCE_288 = "b99a4fc4ff7ef5cfd47813b487900b4c2a9f3b77"
          MERGE_288 = "bc653de5f1a853791d3ab4a03f59f3daad54bf54"
          SOURCE_289 = "3e21e79e1600727ebcda222af389d568d857cff8"
          MERGE_289 = "d1c4dd278853a1e6a426fab284c70b3529d42833"
          SOURCE_290 = "9bbb339f39133955a7f42ea67f3334e597066e2e"
          MERGE_290 = BASELINE

          allowed_paths = [
              "docs/ACTIVE_PACKET.md",
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "docs/IMPLEMENTATION_ROADMAP.md",
              "docs/MODULE_CATALOG.md",
              "docs/PHASE8_DELIVERY_PLAN.md",
              "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
              "docs/PROJECT_STATUS.md",
              "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
              "repository-packet.json",
              "tests/test_architecture_documentation_consistency.py",
              "tests/test_repository_navigation.py",
          ]
          required_checks = [
              "Affected Scope CI",
              "Complexity Baseline CI",
              "Customer Privacy Access Export CI",
              "Customer Privacy Owner Execution CI",
              "Governance CI",
              "Rust Generated Sync",
              "Rust CI",
          ]
          packet = {
              "schema_version": "crm.repository-packet/v1",
              "packet_id": "repository-step-19-evidence-sync",
              "title": "Synchronize accepted Repository Step 19 closure evidence",
              "status": "active",
              "baseline": {"ref": "main", "sha": BASELINE},
              "tracking_issues": [194, 126],
              "objective": "Record exact accepted evidence for Repository Step 19 PRs #287, #288, #289 and #290 across every live normative source, update the first-party Customer Privacy worker inventory from zero to one, close Repository Step 19 and make Repository Step 20 the only next permitted implementation packet without changing runtime or product behavior.",
              "allowed_paths": allowed_paths,
              "forbidden_paths": [
                  ".github/workflows/**",
                  "AGENTS.md",
                  "Cargo.lock",
                  "Cargo.toml",
                  "README.md",
                  "affected-scope-policy.json",
                  "apps/**",
                  "contracts/**",
                  "crates/**",
                  "database/**",
                  "evidence/**",
                  "modules/**",
                  "package.json",
                  "packages/**",
                  "pnpm-lock.yaml",
                  "proto/**",
                  "requirements-dev.txt",
                  "rust-toolchain.toml",
                  "schemas/**",
                  "scripts/**",
                  "services/**",
              ],
              "deliverables": [
                  "record exact PR #287, #288, #289 and #290 source, squash merge and exact-head workflow evidence in every live normative document",
                  "mark Repository Step 19 complete while keeping Customer Privacy, Phase 8A, product-complete expert modules and architecture 10/10 incomplete",
                  "update the accepted first-party background-worker inventory from zero to one crm.customer-privacy owner-execution worker at phase 260",
                  "make Repository Step 20 frontend, accessibility, browser and operations evidence the only next permitted implementation packet",
                  "update active-packet and documentation-consistency guards to the accepted closure evidence-sync packet",
                  "record zero impact to the 5377 public Rust surface, 91 suppressions and the crm-application-runtime 7269 LOC ceiling",
              ],
              "required_checks": required_checks,
              "acceptance": [
                  f"the branch is based exactly on merge commit {BASELINE}",
                  f"all live normative documents contain PR #287 source {SOURCE_287} merge {MERGE_287} and 11 of 11",
                  f"all live normative documents contain PR #288 source {SOURCE_288} merge {MERGE_288} and 24 of 24",
                  f"all live normative documents contain PR #289 source {SOURCE_289} merge {MERGE_289} and 24 of 24",
                  f"all live normative documents contain PR #290 source {SOURCE_290} merge {MERGE_290} and 19 of 19",
                  "Repository Steps 1–19 are complete and Repository Step 20 is the only next permitted implementation packet",
                  "the latest first-party worker inventory is one Customer Privacy owner-execution worker while public mutation and query counts remain seven and four",
                  "Customer Privacy, Phase 8A, product-complete expert modules and architecture 10/10 remain explicitly incomplete",
                  "the final diff contains only the declared documentation, packet, generated navigation and permanent guard files",
                  "one unchanged exact head passes every applicable permanent workflow with zero unresolved comments, reviews or review threads",
              ],
              "non_goals": [
                  "implement or start Repository Step 20",
                  "change Customer Privacy worker behavior, discovery, execution, lifecycle gating or owner-specific actions",
                  "change runtime, routes, contracts, manifests, schemas, migrations, dependencies, lockfiles or product behavior",
                  "complete Customer Privacy, Phase 8A, an expert module, architecture 10/10 or the Universal CRM product",
              ],
          }
          (ROOT / "repository-packet.json").write_text(
              json.dumps(packet, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )

          closure = f"""

          ## Repository Step 19 accepted closure

          Repository Step 19 is complete only through the combined accepted evidence below, each on one unchanged exact source head with no unresolved comments, reviews or review threads:

          - PR #287 / source `{SOURCE_287}` / squash merge `{MERGE_287}` / **11 of 11** applicable permanent workflows — added the bounded Customer Privacy owner-worker boundary without public ingress or new schema/dependency surface;
          - PR #288 / source `{SOURCE_288}` / squash merge `{MERGE_288}` / **24 of 24** — added PostgreSQL ready-work discovery for planned Customer Privacy owner actions;
          - PR #289 / source `{SOURCE_289}` / squash merge `{MERGE_289}` / **24 of 24** — registered `crm.customer-privacy` / `owner-execution` at phase `260` in the production `ApplicationRuntime`, with activation gating and replay-safe canonical execution;
          - PR #290 / source `{SOURCE_290}` / squash merge `{MERGE_290}` / **19 of 19** — proved the assembled real `crm-api` lifecycle on clean and rollback/reapplied PostgreSQL schemas: ready-work discovery, a real Parties privacy action, one durable attempt, successful outcome, completed checkpoint, audit evidence, owner event/outbox and final case transition, plus restart no-duplicate proof and uninstall no-discovery/no-effect proof.

          The accepted first-party background-worker inventory is now **one Customer Privacy owner worker**: module `crm.customer-privacy`, worker `owner-execution`, phase `260`. This is a production background worker, not a new public capability route; the latest public Customer Privacy inventory remains **seven mutations and four permission-aware public queries**.

          Repository Steps 1–19 are complete. Repository Step 20 — Phase 8A frontend, accessibility, browser and operations evidence — is the only next permitted implementation packet. Phase 8A.11 / issue #126 remains in progress; Customer Privacy is not product-complete; current product-complete expert modules remain zero; architecture 10/10 and the Universal CRM product are not declared complete.

          The Step 19 packets add no crate, dependency, route, public API, module manifest, migration or schema. The conservative public Rust surface remains **5,377**, suppression occurrences remain **91**, and `crm-application-runtime` non-comment/source LOC remains within the frozen **7,269** ceiling.
          """
          closure = re.sub(r"^          ", "", closure, flags=re.MULTILINE).rstrip() + "\n"

          normative = [
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "docs/IMPLEMENTATION_ROADMAP.md",
              "docs/MODULE_CATALOG.md",
              "docs/PHASE8_DELIVERY_PLAN.md",
              "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
              "docs/PROJECT_STATUS.md",
              "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
          ]

          replacements = [
              ("Repository Steps 1–18 are complete.", "Repository Steps 1–19 are complete."),
              ("Repository Step 19 is next: the real Customer Privacy worker lifecycle and complete process/end-to-end acceptance.", "Repository Step 19 is complete. Repository Step 20 is next: Phase 8A frontend, accessibility, browser and operations evidence."),
              ("The next permitted bounded implementation packet is Repository Step 19: the real Customer Privacy worker lifecycle and complete process/end-to-end acceptance.", "The next permitted bounded implementation packet is Repository Step 20: Phase 8A frontend, accessibility, browser and operations evidence."),
              ("Customer Privacy still publishes zero workers; its real worker lifecycle remains reserved for Step 19.", "Customer Privacy now publishes one first-party production background worker through the registered `crm.customer-privacy` / `owner-execution` phase-260 runtime boundary accepted in Repository Step 19."),
              ("After Steps 19–21 complete Phase 8A", "After Steps 20–21 complete Phase 8A"),
              ("workers, disable/uninstall proof, frontend and operations proof", "frontend, accessibility, browser and operations proof"),
              ("real Customer Privacy worker adoption Step 19", "preserve the accepted Customer Privacy worker conformance and lifecycle proof"),
          ]

          for relative in normative:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              text = text.replace(
                  "19. real Customer Privacy worker lifecycle and complete process/end-to-end acceptance;",
                  "19. real Customer Privacy worker lifecycle and complete process/end-to-end acceptance — **complete through PR #290**;",
              )
              text = text.replace(
                  "Latest accepted public inventory is **seven mutations, four permission-aware public queries and zero Customer Privacy workers**.",
                  "Latest accepted public inventory remains **seven mutations and four permission-aware public queries**. The accepted first-party background-worker inventory is now **one Customer Privacy owner worker**: `crm.customer-privacy` / `owner-execution` at phase `260`.",
              )
              text = text.replace(
                  "| F — generic conformance and contract lifecycle | **In progress** | reusable mutation/query conformance through PR #235, reusable worker conformance through PRs #269–#270 and complete contract lifecycle enforcement through PRs #275, #278 and #279 | preserve the accepted Customer Privacy worker conformance and lifecycle proof |",
                  "| F — generic conformance and contract lifecycle | **Complete through PR #290** | reusable mutation/query conformance through PR #235, worker conformance through PRs #269–#270, contract lifecycle enforcement through PRs #275, #278 and #279, and real Customer Privacy adoption/lifecycle proof through PRs #287–#290 | preserve the accepted conformance and contract-lifecycle guarantees |",
              )
              if "## Repository Step 19 accepted closure" not in text:
                  text = text.rstrip() + closure
              path.write_text(text, encoding="utf-8")

          def replace_method(text: str, name: str, body: str) -> str:
              pattern = rf"    def {re.escape(name)}\(self\) -> None:\n.*?(?=\n    def |\n\nif __name__)"
              updated, count = re.subn(pattern, body.rstrip(), text, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"expected one method {name}, replaced {count}")
              return updated

          architecture_path = ROOT / "tests/test_architecture_documentation_consistency.py"
          architecture = architecture_path.read_text(encoding="utf-8")
          architecture = replace_method(
              architecture,
              "test_step_18_is_complete_and_step_19_is_next",
              '''    def test_step_19_is_complete_and_step_20_is_next(self) -> None:
                  required = (
                      "PR #287",
                      "23b2f4ea660bcd46884fe054cd0c37e89b1495c4",
                      "c0fec3ae08c836ab483737442ed4377c99c85e9a",
                      "11 of 11",
                      "PR #288",
                      "b99a4fc4ff7ef5cfd47813b487900b4c2a9f3b77",
                      "bc653de5f1a853791d3ab4a03f59f3daad54bf54",
                      "24 of 24",
                      "PR #289",
                      "3e21e79e1600727ebcda222af389d568d857cff8",
                      "d1c4dd278853a1e6a426fab284c70b3529d42833",
                      "PR #290",
                      "9bbb339f39133955a7f42ea67f3334e597066e2e",
                      "49c5e35814adceb2be9d4cc2302bf10032b807a0",
                      "19 of 19",
                  )
                  for document in self.normative_documents:
                      lowered = document.lower()
                      for marker in required:
                          self.assertIn(marker, document)
                      self.assertIn("step 19", lowered)
                      self.assertIn("step 20", lowered)
                      self.assertNotRegex(lowered, r"step 19[^\\n.;]{0,100}(?:not started|in progress|next)")
                  self.assertIn("Repository Steps 1–19 are complete", self.status)
                  self.assertIn("Repository Step 20", self.status)
                  self.assertIn(
                      "19. real Customer Privacy worker lifecycle and complete process/end-to-end acceptance — **complete through PR #290**",
                      self.plan,
                  )
                  self.assertIn("20. Phase 8A frontend", self.plan)
                  for marker in required:
                      self.assertIn(marker, self.product_plan)
                  self.assertIn("After Steps 20–21 complete Phase 8A", self.product_plan)
                  self.assertNotIn("After Steps 19–21 complete Phase 8A", self.product_plan)''',
          )
          architecture = replace_method(
              architecture,
              "test_active_step_19_runtime_lifecycle_packet_is_exact",
              '''    def test_active_step_19_evidence_sync_packet_is_exact(self) -> None:
                  self.assertEqual(self.packet["schema_version"], "crm.repository-packet/v1")
                  self.assertEqual(self.packet["packet_id"], "repository-step-19-evidence-sync")
                  self.assertEqual(self.packet["status"], "active")
                  self.assertEqual(
                      self.packet["baseline"],
                      {"ref": "main", "sha": "49c5e35814adceb2be9d4cc2302bf10032b807a0"},
                  )
                  self.assertEqual(self.packet["tracking_issues"], [194, 126])
                  self.assertEqual(
                      set(self.packet["allowed_paths"]),
                      {
                          "docs/ACTIVE_PACKET.md",
                          "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
                          "docs/IMPLEMENTATION_ROADMAP.md",
                          "docs/MODULE_CATALOG.md",
                          "docs/PHASE8_DELIVERY_PLAN.md",
                          "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
                          "docs/PROJECT_STATUS.md",
                          "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
                          "repository-packet.json",
                          "tests/test_architecture_documentation_consistency.py",
                          "tests/test_repository_navigation.py",
                      },
                  )
                  self.assertEqual(
                      self.packet["required_checks"],
                      [
                          "Affected Scope CI",
                          "Complexity Baseline CI",
                          "Customer Privacy Access Export CI",
                          "Customer Privacy Owner Execution CI",
                          "Governance CI",
                          "Rust Generated Sync",
                          "Rust CI",
                      ],
                  )
                  self.assertIn(self.packet["packet_id"], self.active_packet)
                  self.assertIn(self.packet["baseline"]["sha"], self.active_packet)
                  self.assertIn(
                      "record exact PR #287, #288, #289 and #290 source, squash merge and exact-head workflow evidence in every live normative document",
                      self.packet["deliverables"],
                  )
                  self.assertIn(
                      "make Repository Step 20 frontend, accessibility, browser and operations evidence the only next permitted implementation packet",
                      self.packet["deliverables"],
                  )
                  self.assertIn("implement or start Repository Step 20", self.packet["non_goals"])''',
          )
          architecture = replace_method(
              architecture,
              "test_repository_map_and_product_inventory_remain_exact",
              '''    def test_repository_map_and_product_inventory_remain_exact(self) -> None:
                  self.assertIn("Generated by scripts/generate_repository_navigation.py", self.repository_map)
                  self.assertIn("**Workspace packages:** 112", self.repository_map)
                  self.assertRegex(self.repository_map, r"source-digest: sha256:[0-9a-f]{64}")
                  inventory_patterns = (
                      r"(?:7|seven) (?:public )?mutations",
                      r"(?:4|four) permission-aware public queries",
                      r"(?:1|one) Customer Privacy owner worker",
                  )
                  for document in (self.phase8, self.catalog):
                      for pattern in inventory_patterns:
                          self.assertRegex(document, pattern)
                  self.assertIn("`crm.customer-privacy` / `owner-execution`", self.catalog)
                  self.assertIn("phase `260`", self.catalog)
                  self.assertIn("Current merged authoritative/coordination module count: **12**", self.catalog)
                  self.assertIn("Current merged business-module total: **13**", self.catalog)''',
          )
          architecture_path.write_text(architecture, encoding="utf-8")

          navigation_path = ROOT / "tests/test_repository_navigation.py"
          navigation = navigation_path.read_text(encoding="utf-8")
          navigation = replace_method(
              navigation,
              "test_active_step_19_packet_declaration_is_exact",
              '''    def test_active_step_19_evidence_packet_declaration_is_exact(self) -> None:
                  packet = load_packet(ROOT)
                  self.assertEqual(packet["schema_version"], "crm.repository-packet/v1")
                  self.assertEqual(packet["packet_id"], "repository-step-19-evidence-sync")
                  self.assertEqual(packet["status"], "active")
                  self.assertEqual(
                      packet["baseline"],
                      {"ref": "main", "sha": "49c5e35814adceb2be9d4cc2302bf10032b807a0"},
                  )
                  self.assertEqual(packet["tracking_issues"], [194, 126])
                  self.assertEqual(
                      set(packet["allowed_paths"]),
                      {
                          "docs/ACTIVE_PACKET.md",
                          "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
                          "docs/IMPLEMENTATION_ROADMAP.md",
                          "docs/MODULE_CATALOG.md",
                          "docs/PHASE8_DELIVERY_PLAN.md",
                          "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
                          "docs/PROJECT_STATUS.md",
                          "docs/WORKSPACE_COMPLEXITY_BASELINE.md",
                          "repository-packet.json",
                          "tests/test_architecture_documentation_consistency.py",
                          "tests/test_repository_navigation.py",
                      },
                  )
                  self.assertEqual(
                      packet["required_checks"],
                      [
                          "Affected Scope CI",
                          "Complexity Baseline CI",
                          "Customer Privacy Access Export CI",
                          "Customer Privacy Owner Execution CI",
                          "Governance CI",
                          "Rust Generated Sync",
                          "Rust CI",
                      ],
                  )
                  self.assertIn(
                      "record exact PR #287, #288, #289 and #290 source, squash merge and exact-head workflow evidence in every live normative document",
                      packet["deliverables"],
                  )
                  self.assertIn(
                      "make Repository Step 20 frontend, accessibility, browser and operations evidence the only next permitted implementation packet",
                      packet["deliverables"],
                  )''',
          )
          navigation = replace_method(
              navigation,
              "test_generated_navigation_is_deterministic_and_current",
              '''    def test_generated_navigation_is_deterministic_and_current(self) -> None:
                  first = generated_documents(ROOT)
                  second = generated_documents(ROOT)
                  self.assertEqual(first, second)
                  self.assertEqual(set(first), {ACTIVE_PACKET_PATH, REPOSITORY_MAP_PATH})
                  for content in first.values():
                      self.assertIn("Generated by scripts/generate_repository_navigation.py", content)
                      self.assertRegex(content, r"source-digest: sha256:[0-9a-f]{64}")
                  self.assertIn("repository-step-19-evidence-sync", first[ACTIVE_PACKET_PATH])
                  self.assertIn(
                      "49c5e35814adceb2be9d4cc2302bf10032b807a0",
                      first[ACTIVE_PACKET_PATH],
                  )
                  self.assertIn("**Workspace packages:** 112", first[REPOSITORY_MAP_PATH])
                  self.assertIn("`crm.customer-privacy`", first[REPOSITORY_MAP_PATH])
                  self.assertEqual(stale_generated_documents(ROOT), [])''',
          )
          navigation = replace_method(
              navigation,
              "test_packet_check_uses_exact_planning_baseline",
              '''    def test_packet_check_uses_exact_planning_baseline(self) -> None:
                  packet = load_packet(ROOT)
                  workflow_paths = {
                      "Affected Scope CI": ".github/workflows/affected-scope.yml",
                      "Application Runtime CI": ".github/workflows/application-runtime.yml",
                      "Customer Privacy Approval CI": ".github/workflows/customer-privacy-approval.yml",
                      "Customer Privacy Persistence CI": ".github/workflows/customer-privacy-persistence.yml",
                      "Customer Privacy Restriction Policy CI": ".github/workflows/customer-privacy-restriction-policy.yml",
                      "Data Quality Process Runtime CI": ".github/workflows/data-quality-process-runtime.yml",
                      "Export Process Runtime CI": ".github/workflows/export-process-runtime.yml",
                      "Generic Mutation Query Conformance CI": ".github/workflows/generic-mutation-query-conformance.yaml",
                      "Import Process Runtime CI": ".github/workflows/import-process-runtime.yml",
                      "Import Retryable Process Runtime CI": ".github/workflows/import-retryable-process-runtime.yml",
                      "Contract CI": ".github/workflows/contracts.yml",
                      "Complexity Baseline CI": ".github/workflows/complexity-baseline.yml",
                      "Customer Privacy Access Export CI": ".github/workflows/customer-privacy-access-export.yml",
                      "Customer Privacy Owner Execution CI": ".github/workflows/customer-privacy-owner-execution.yml",
                      "Database CI": ".github/workflows/database.yml",
                      "Event Runtime CI": ".github/workflows/event-runtime.yml",
                      "Governance CI": ".github/workflows/governance.yml",
                      "PostgreSQL Process Isolation Pilot": ".github/workflows/postgres-process-isolation-pilot.yml",
                      "Product Plane CI": ".github/workflows/product-plane.yml",
                      "Projection Runtime CI": ".github/workflows/projection-runtime.yml",
                      "Rust Generated Sync": ".github/workflows/rust-generated-sync.yml",
                      "Rust CI": ".github/workflows/rust.yml",
                  }
                  affected = {
                      "head_sha": "b" * 40,
                      "changed_paths": packet["allowed_paths"],
                      "affected_packages": [],
                      "selected_workflows": [
                          {
                              "name": name,
                              "path": workflow_paths[name],
                              "selected": True,
                              "reasons": ["Step 19 evidence synchronization"],
                          }
                          for name in packet["required_checks"]
                      ],
                  }
                  with (
                      patch(
                          "scripts.repository_navigation._git",
                          return_value="49c5e35814adceb2be9d4cc2302bf10032b807a0",
                      ),
                      patch("scripts.repository_navigation.build_report", return_value=affected),
                      patch("scripts.repository_navigation.stale_generated_documents", return_value=[]),
                  ):
                      report = packet_check(ROOT, "origin/main")
                  self.assertTrue(report["ok"])
                  self.assertEqual(report["changed_paths"], packet["allowed_paths"])
                  self.assertEqual(report["blockers"], [])''',
          )
          navigation_path.write_text(navigation, encoding="utf-8")
          PY

          python scripts/generate_repository_navigation.py --write
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation
          python scripts/check_architecture.py

          rm .github/workflows/temporary-step-19-evidence-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize Repository Step 19 closure evidence"
          git push origin HEAD:repository-step-19-evidence-sync
