name: Temporary Step 19 Evidence Sync

on:
  push:
    branches:
      - repository-step-19-evidence-sync
    paths:
      - ".github/workflows/temporary-step-19-evidence-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize accepted Step 19 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def ensure_replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"neither stale nor accepted text found in {path}: {old[:100]}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          ensure_replace(
              "docs/IMPLEMENTATION_ROADMAP.md",
              "The accepted Step 18 lifecycle changes no product ownership, public contract, schema, migration, dependency or lockfile. Step 18 is complete; Step 19 is complete; Step 20 is next and Customer Privacy still publishes zero workers until that packet is accepted.",
              "The accepted Step 18 lifecycle changes no product ownership, public contract, schema, migration, dependency or lockfile. Steps 18 and 19 are complete; Step 20 is next. Customer Privacy now publishes one accepted first-party production owner worker through `crm.customer-privacy` / `owner-execution` at phase `260`.",
          )
          ensure_replace(
              "docs/PROJECT_STATUS.md",
              "Architecture Stages A, B, D, E, G and H are complete. Stages C, F and I remain incomplete or in progress according to the architecture plan.",
              "Architecture Stages A, B, D, E, F, G and H are complete. Stages C and I remain incomplete or in progress according to the architecture plan.",
          )
          ensure_replace(
              "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
              "This plan does not change the single repository execution order. Repository Steps 1–18 are complete; Repository Step 19 is complete through PRs #287–#290. Repository Step 20 is the only next permitted implementation packet.",
              "This plan does not change the single repository execution order. Repository Steps 1–19 are complete. Repository Step 20 is the only next permitted implementation packet.",
          )
          ensure_replace(
              "docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md",
              "> Repository Step 19 — real Customer Privacy worker lifecycle and complete process/end-to-end acceptance.",
              "> Repository Step 20 — Phase 8A frontend, accessibility, browser and operations evidence.",
          )
          ensure_replace(
              "docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md",
              "| C — golden owner package and persistence model | **In progress** | Customer Privacy golden package, final subject policy, restriction/legal-hold placement, retention precedence, durable owner execution/outcomes, governed access/export, owner actions and accepted Party tombstone/no-orphan convergence through Step 15 | worker lifecycle at Step 19 and Phase 8A closure at Step 21 |",
              "| C — golden owner package and persistence model | **In progress** | Customer Privacy golden package, final subject policy, restriction/legal-hold placement, retention precedence, durable owner execution/outcomes, governed access/export, owner actions, Party tombstone/no-orphan convergence and accepted owner-worker lifecycle through PR #290 | frontend/operations evidence at Step 20 and Phase 8A closure at Step 21 |",
          )

          for relative in ("docs/IMPLEMENTATION_ROADMAP.md", "docs/PROJECT_STATUS.md"):
              target = Path(relative)
              text = target.read_text(encoding="utf-8").replace("-;\n", "")
              target.write_text(text, encoding="utf-8")

          test = Path("tests/test_architecture_documentation_consistency.py")
          text = test.read_text(encoding="utf-8")
          if "Repository Step 20 — Phase 8A frontend" not in text:
              marker = '        self.assertNotIn("After Steps 19–21 complete Phase 8A", self.product_plan)\n'
              addition = '''        self.assertIn("Repository Step 20 — Phase 8A frontend", self.product_plan)
          self.assertNotIn(
              "> Repository Step 19 — real Customer Privacy worker lifecycle",
              self.product_plan,
          )
          for document in self.normative_documents:
              self.assertNotRegex(document, r"(?m)^\\s*-\\s*;\\s*$")
'''
              if marker not in text:
                  raise SystemExit("product-plan guard insertion point missing")
              text = text.replace(marker, marker + addition, 1)
          if 'self.assertNotIn("Stages C, F and I", self.status)' not in text:
              marker = '        self.assertIn("Architecture 10/10 is **not declared**", self.status)\n'
              addition = '''        self.assertIn("Stages C and I remain incomplete or in progress", self.status)
          self.assertNotIn("Stages C, F and I", self.status)
'''
              if marker not in text:
                  raise SystemExit("architecture-stage guard insertion point missing")
              text = text.replace(marker, marker + addition, 1)
          test.write_text(text, encoding="utf-8")

          temporary = Path(".github/workflows/temporary-step-19-normative-quality.yml")
          if temporary.exists():
              temporary.unlink()
          PY
