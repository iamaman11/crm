name: Temporary Step 19 Evidence Sync

on:
  push:
    branches:
      - repository-step-19-evidence-sync
    paths:
      - ".github/workflows/temporary-step-19-evidence-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize accepted Step 19 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for relative in (
              "tests/test_architecture_documentation_consistency.py",
              "tests/test_repository_navigation.py",
          ):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              text = re.sub(r"(?<!\n)\n    def ", "\n\n    def ", text)
              text = re.sub(r"(?<!\n)\nif __name__", "\n\nif __name__", text)
              path.write_text(text, encoding="utf-8")
          PY
