name: Temporary Step 19 Evidence Sync

on:
  push:
    branches:
      - repository-step-19-evidence-sync
    paths:
      - ".github/workflows/temporary-step-19-evidence-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize accepted Step 19 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          architecture = Path("tests/test_architecture_documentation_consistency.py")
          text = architecture.read_text(encoding="utf-8")
          text = text.replace("    @classmethod\n\n    def ", "    @classmethod\n    def ")
          text = text.replace("    @property\n\n    def ", "    @property\n    def ")
          text = re.sub(r"\n{3,}(?=    def )", "\n\n", text)
          text = re.sub(r"\n{2,}(?=if __name__)", "\n\n\n", text)
          architecture.write_text(text, encoding="utf-8")

          navigation = Path("tests/test_repository_navigation.py")
          text = navigation.read_text(encoding="utf-8")
          text = re.sub(r"\n{3,}(?=    def )", "\n\n", text)
          text = re.sub(r"\n{2,}(?=if __name__)", "\n\n\n", text)
          navigation.write_text(text, encoding="utf-8")
          PY
