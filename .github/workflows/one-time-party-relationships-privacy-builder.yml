name: One-Time Party Relationships Privacy Builder

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-party-relationships-privacy-builder.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
      - name: Generate mechanical staging packet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil

          source = Path('crates/crm-contact-points-privacy-scope-adapter')
          target = Path('crates/crm-party-relationships-privacy-scope-adapter')
          shutil.rmtree(target, ignore_errors=True)
          shutil.copytree(source, target)

          replacements = [
              ('crm-contact-points-privacy-scope-adapter', 'crm-party-relationships-privacy-scope-adapter'),
              ('crm_contact_points_privacy_scope_adapter', 'crm_party_relationships_privacy_scope_adapter'),
              ('crm-contact-points-capability-adapter', 'crm-party-relationships-capability-adapter'),
              ('crm_contact_points_capability_adapter', 'crm_party_relationships_capability_adapter'),
              ('crm-contact-points', 'crm-party-relationships'),
              ('crm_contact_points', 'crm_party_relationships'),
              ('ContactPoints', 'PartyRelationships'),
              ('CONTACT_POINTS', 'PARTY_RELATIONSHIPS'),
              ('ContactPoint', 'PartyRelationship'),
              ('CONTACT_POINT', 'PARTY_RELATIONSHIP'),
              ('contact_points', 'party_relationships'),
              ('contact_point', 'party_relationship'),
              ('Contact Points', 'Party Relationships'),
              ('Contact Point', 'Party Relationship'),
              ('contact-points', 'party-relationships'),
              ('contact-point', 'party-relationship'),
          ]
          for path in target.rglob('*'):
              if path.is_file():
                  text = path.read_text()
                  for old, new in replacements:
                      text = text.replace(old, new)
                  path.write_text(text)

          fixture_source = Path('database/tests/0027_contact_points_privacy_scope_fixture.sql')
          fixture_target = Path('database/tests/0028_party_relationships_privacy_scope_fixture.sql')
          text = fixture_source.read_text()
          for old, new in replacements:
              text = text.replace(old, new)
          text = text.replace("'0.3.0'", "'0.2.0'")
          text = text.replace('CreatePartyRelationship', 'CreatePartyRelationship')
          fixture_target.write_text(text)

          cargo_path = Path('Cargo.toml')
          cargo = cargo_path.read_text()
          member = '  "crates/crm-party-relationships-privacy-scope-adapter",\n'
          if member not in cargo:
              anchor = '  "crates/crm-party-relationships-query-adapter",\n'
              if anchor not in cargo:
                  raise SystemExit('workspace anchor missing')
              cargo = cargo.replace(anchor, anchor + member, 1)
              cargo_path.write_text(cargo)

          policy_path = Path('architecture-policy.json')
          policy = json.loads(policy_path.read_text())
          manifest = 'crates/crm-party-relationships-privacy-scope-adapter/Cargo.toml'
          consumers = policy['restricted_dependency_consumers']['crm-customer-privacy-owner-scope-support']
          if manifest not in consumers:
              consumers.append(manifest)
              consumers.sort()
          source_path = 'crates/crm-party-relationships-privacy-scope-adapter/src/postgres.rs'
          openers = policy['restricted_source_markers']['.begin_bound_read_transaction(']
          if source_path not in openers:
              openers.append(source_path)
              openers.sort()
          policy_path.write_text(json.dumps(policy, indent=2) + '\n')
          PY
      - name: Canonicalize workspace metadata
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all
          cargo generate-lockfile
      - name: Remove temporary builders and publish staging packet
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-party-relationships-privacy-inspection.yml
          rm -f .github/workflows/one-time-party-relationships-privacy-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: stage party relationships privacy scope adapter"
          git push origin "HEAD:${HEAD_REF}"
