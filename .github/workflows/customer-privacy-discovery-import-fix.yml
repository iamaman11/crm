name: Customer Privacy Discovery Import Fix

on:
  push:
    branches:
      - feature/customer-privacy-production-discovery-snapshot
    paths:
      - ".github/workflows/customer-privacy-discovery-import-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/customer-privacy-production-discovery-snapshot
          fetch-depth: 0
      - name: Remove invalid duplicate digest import
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/crm-customer-privacy-postgres/src/discovery.rs")
          text = path.read_text()
          old = "    discovery_attempt_digest as _, discovery_scope_snapshot_state_descriptor_hash,\n"
          new = "    discovery_scope_snapshot_state_descriptor_hash,\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one invalid attempt digest import")
          path.write_text(text.replace(old, new))
          Path(".github/workflows/customer-privacy-discovery-import-fix.yml").unlink()
      - name: Commit import fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix Customer Privacy discovery PostgreSQL import"
          git push origin HEAD:feature/customer-privacy-production-discovery-snapshot
