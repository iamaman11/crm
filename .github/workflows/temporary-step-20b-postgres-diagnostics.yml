name: Temporary Step 20B PostgreSQL Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-step-20b-postgres-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'repository-step-20b-customer-privacy-operations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20b-customer-privacy-operations
      - name: Add bounded PostgreSQL error diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/run_customer_privacy_operations.sh")
          text = path.read_text(encoding="utf-8")
          if "POSTGRES_LOG_PATH=" not in text:
              text = text.replace(
                  'VITE_LOG_PATH="${ARTIFACT_DIR}/vite.log"\n',
                  'VITE_LOG_PATH="${ARTIFACT_DIR}/vite.log"\nPOSTGRES_LOG_PATH="${ARTIFACT_DIR}/postgres-error.log"\n',
                  1,
              )
          if '"$POSTGRES_LOG_PATH"' not in text.split("kill_tree()", 1)[0]:
              text = text.replace(
                  '  "$API_LOG_PATH" "$VITE_LOG_PATH" "$SUPPLY_CHAIN_PATH"\n',
                  '  "$API_LOG_PATH" "$VITE_LOG_PATH" "$POSTGRES_LOG_PATH" "$SUPPLY_CHAIN_PATH"\n',
                  1,
              )
          config = '''admin_psql postgres <<'SQL'
          ALTER SYSTEM SET log_min_error_statement = 'error';
          ALTER SYSTEM SET log_error_verbosity = 'verbose';
          ALTER SYSTEM SET log_parameter_max_length_on_error = 0;
          SELECT pg_reload_conf();
          SQL

          '''
          if "ALTER SYSTEM SET log_min_error_statement" not in text:
              anchor = 'apply_database_inputs "$OPS_SOURCE_DATABASE"\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f"database input anchor count: {text.count(anchor)}")
              text = text.replace(anchor, config + anchor, 1)
          if "PostgreSQL error tail for governed seed failure" not in text:
              pattern = (
                  r'DATABASE_URL="\$SOURCE_APP_URL" ADMIN_DATABASE_URL="\$SOURCE_ADMIN_URL" RUST_BACKTRACE=1 \\\n'
                  r'\s*cargo test -p crm-api --test seed_e2e_fixture -- --nocapture'
              )
              replacement = '''if ! DATABASE_URL="$SOURCE_APP_URL" ADMIN_DATABASE_URL="$SOURCE_ADMIN_URL" RUST_BACKTRACE=1 \\
            cargo test -p crm-api --test seed_e2e_fixture -- --nocapture; then
            docker logs "$CONTAINER_NAME" > "$POSTGRES_LOG_PATH" 2>&1 || true
            echo "PostgreSQL error tail for governed seed failure:" >&2
            tail -n 240 "$POSTGRES_LOG_PATH" >&2 || true
            exit 1
          fi'''
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"governed seed regex count: {count}")
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_customer_privacy_operations.sh
          git commit -m "ops: expose bounded PostgreSQL seed diagnostics"
          git push origin HEAD:${{ github.head_ref }}
