name: Step 17 Projection Authorization Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-projection-authorization-sync.yml"

concurrency:
  group: step17-projection-authorization-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-representative-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Synchronize projection acceptance and packet evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/step17-representative-lifecycle)"
          python - <<'PY'
          import json
          from pathlib import Path

          projection = Path("crates/crm-sales-activities-capability-composition/tests/postgres_projections.rs")
          text = projection.read_text(encoding="utf-8")
          old_gateway = '''    let authorization_store = LiveAuthorizationStore::default();
    for definition in capability_definitions().expect("valid production capability definitions") {
        authorization_store
            .upsert(AuthorizationGrant {'''
          new_gateway = '''    let authorization_store = LiveAuthorizationStore::default();
    for capability_id in [
        "sales.deal.create",
        "sales.deal.advance_stage",
        "activities.task.create",
        "activities.task.complete",
    ] {
        let definition = latest_definition(capability_id);
        authorization_store
            .upsert(AuthorizationGrant {'''
          old_lookup = '''    let definition = capability_definitions()
        .expect("valid production definitions")
        .into_iter()
        .find(|definition| definition.capability_id.as_str() == capability_id)
        .unwrap_or_else(|| panic!("missing capability definition: {capability_id}"));'''
          new_lookup = '''    let definition = latest_definition(capability_id);'''
          helper_anchor = '''fn caller_context(identity: &str) -> ModuleExecutionContext {'''
          helper = '''fn latest_definition(
    capability_id: &str,
) -> crm_capability_runtime::CapabilityDefinition {
    capability_definitions()
        .expect("valid production definitions")
        .into_iter()
        .filter(|definition| definition.capability_id.as_str() == capability_id)
        .max_by(|left, right| {
            left.capability_version
                .as_str()
                .cmp(right.capability_version.as_str())
        })
        .unwrap_or_else(|| panic!("missing capability definition: {capability_id}"))
}

'''
          for old, new, label in (
              (old_gateway, new_gateway, "authorization grant loop"),
              (old_lookup, new_lookup, "invocation definition lookup"),
              (helper_anchor, helper + helper_anchor, "latest-definition helper anchor"),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f"projection test: expected one {label}, found {text.count(old)}")
              text = text.replace(old, new, 1)
          projection.write_text(text, encoding="utf-8")

          packet_path = Path("repository-packet.json")
          packet = json.loads(packet_path.read_text(encoding="utf-8"))
          new_path = "crates/crm-sales-activities-capability-composition/tests/postgres_projections.rs"
          if new_path in packet["allowed_paths"]:
              raise SystemExit("projection acceptance path already declared")
          packet["allowed_paths"].append(new_path)
          packet["allowed_paths"].sort()
          packet["objective"] = packet["objective"].replace(
              "register the replacement coordinate in PostgreSQL acceptance fixtures,",
              "register the replacement coordinate in PostgreSQL acceptance fixtures, bind projection acceptance grants and invocations to the same latest exact coordinate,",
          )
          packet["deliverables"].append(
              "select the latest exact capability definition once for each projection acceptance grant and invocation so replacement authorization remains deterministic"
          )
          packet["acceptance"][0] = packet["acceptance"][0].replace(
              "twenty-one declared", "twenty-two declared"
          )
          packet["acceptance"].append(
              "projection acceptance grants and invokes the same latest exact coordinate for each exercised capability ID without changing production authorization-store semantics"
          )
          packet_path.write_text(json.dumps(packet, indent=2) + "\n", encoding="utf-8")

          test_files = [
              Path("tests/test_repository_navigation.py"),
              Path("tests/test_architecture_documentation_consistency.py"),
          ]
          anchor = '                "crates/crm-sales-activities-capability-composition/tests/catalog_contract.rs",\n'
          inserted = anchor + '                "crates/crm-sales-activities-capability-composition/tests/postgres_projections.rs",\n'
          for path in test_files:
              value = path.read_text(encoding="utf-8")
              if value.count(anchor) != 1:
                  raise SystemExit(f"{path}: expected one projection path anchor, found {value.count(anchor)}")
              path.write_text(value.replace(anchor, inserted, 1), encoding="utf-8")
          PY
          cargo fmt --all
          python scripts/generate_repository_navigation.py --write
          python scripts/generate_repository_navigation.py --check
          python -m unittest -v tests.test_repository_navigation tests.test_architecture_documentation_consistency
          cargo test -p crm-sales-activities-capability-composition --all-features --locked --test postgres_projections --no-run
          rm .github/workflows/step17-projection-authorization-sync.yml
          git diff --check
          git add crates/crm-sales-activities-capability-composition/tests/postgres_projections.rs repository-packet.json docs/ACTIVE_PACKET.md docs/generated/REPOSITORY_MAP.md tests/test_repository_navigation.py tests/test_architecture_documentation_consistency.py .github/workflows/step17-projection-authorization-sync.yml
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Align projection acceptance with replacement coordinate"
          git push origin HEAD:step17-representative-lifecycle
