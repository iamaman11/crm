name: Step 19 Lifecycle Example Move

on:
  push:
    branches:
      - repository-step-19-runtime-lifecycle

permissions:
  contents: write

jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-19-runtime-lifecycle
      - name: Move lifecycle acceptance to explicit Cargo example
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/crm-application-runtime/examples
          git mv \
            crates/crm-application-runtime/tests/customer_privacy_application_runtime_lifecycle.rs \
            crates/crm-application-runtime/examples/customer_privacy_application_runtime_lifecycle.rs
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/crm-application-runtime/examples/customer_privacy_application_runtime_lifecycle.rs")
          text = path.read_text()
          old = '''#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
          #[ignore = "requires the assembled crm-api binary and authoritative PostgreSQL schema"]
          async fn assembled_runtime_discovers_executes_replays_and_honors_uninstall() {
          '''
          new = '''#[tokio::main(flavor = "multi_thread", worker_threads = 2)]
          async fn main() {
          '''
          if old not in text:
              raise SystemExit("lifecycle test entry point not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "Repository Synchronization Bot"
          git config user.email "repository-sync@users.noreply.github.com"
          git add crates/crm-application-runtime/examples/customer_privacy_application_runtime_lifecycle.rs
          git commit -m "Repository Step 19: make lifecycle acceptance an explicit executable"
          git push origin HEAD:repository-step-19-runtime-lifecycle
