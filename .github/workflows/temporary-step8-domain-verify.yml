name: Temporary Step 8 Domain Verify

on:
  pull_request:
    paths:
      - ".github/step8-domain-source.b64"
      - ".github/workflows/temporary-step8-domain-verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Materialize reviewed domain source
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .github/step8-domain-source.b64)" -eq 8628
          echo "71eaf19e4f9b2e61ba53a759a913a1c1ddcf2cefe19976a591be9931606ae25d  .github/step8-domain-source.b64" | sha256sum --check
          base64 --decode .github/step8-domain-source.b64 > /tmp/step8-domain.rs.gz
          test "$(wc -c < /tmp/step8-domain.rs.gz)" -eq 6471
          echo "7b357802b17c1d78151e1f3ff043c1605a06162f42050b4b551f76a3f86e4fae  /tmp/step8-domain.rs.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/step8-domain.rs.gz > modules/crm-customer-privacy/src/execution.rs
      - name: Verify format, tests and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked -p crm-customer-privacy
          cargo clippy --locked -p crm-customer-privacy --all-targets -- -D warnings
      - name: Publish verified domain source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/crm-customer-privacy/src/execution.rs
          if ! git diff --cached --quiet; then
            git commit -m "WIP: verify step 8 domain evidence"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
