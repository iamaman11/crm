name: Step 17 Fixture Navigation Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-fixture-navigation-sync.yml"

concurrency:
  group: step17-fixture-navigation-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-representative-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Generate and validate navigation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/step17-representative-lifecycle)"
          python scripts/generate_repository_navigation.py --write
          python scripts/generate_repository_navigation.py --check
          python -m unittest -v tests.test_repository_navigation tests.test_architecture_documentation_consistency
          rm .github/workflows/step17-fixture-navigation-sync.yml
          git diff --check
          git add repository-packet.json docs/ACTIVE_PACKET.md docs/generated/REPOSITORY_MAP.md .github/workflows/step17-fixture-navigation-sync.yml
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Synchronize Step 17 fixture navigation"
          git push origin HEAD:step17-representative-lifecycle
