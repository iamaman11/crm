name: Step 17 Fixture Navigation Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-fixture-navigation-sync.yml"

concurrency:
  group: step17-fixture-navigation-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-representative-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Synchronize exact packet expectations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/step17-representative-lifecycle)"
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("tests/test_repository_navigation.py"),
              Path("tests/test_architecture_documentation_consistency.py"),
          ]
          path_anchor = '                "crates/crm-sales-activities-link-contract-adapter/src/lib.rs",\n'
          path_insert = path_anchor + '                "database/tests/0003_sales_activities_adapters.sql",\n'
          checks_old = '''                "Database CI",
                "Governance CI",
                "Rust Generated Sync",
                "Rust CI",'''
          checks_new = '''                "Database CI",
                "Event Runtime CI",
                "Governance CI",
                "Projection Runtime CI",
                "Rust Generated Sync",
                "Rust CI",'''
          for path in files:
              text = path.read_text(encoding="utf-8")
              if text.count(path_anchor) != 1:
                  raise SystemExit(f"{path}: expected one allowed-path anchor, found {text.count(path_anchor)}")
              if text.count(checks_old) != 1:
                  raise SystemExit(f"{path}: expected one required-check block, found {text.count(checks_old)}")
              text = text.replace(path_anchor, path_insert, 1)
              text = text.replace(checks_old, checks_new, 1)
              path.write_text(text, encoding="utf-8")

          architecture = files[1]
          text = architecture.read_text(encoding="utf-8")
          old = '            "database/**",'
          new = '            "database/migrations/**",'
          if text.count(old) != 1:
              raise SystemExit(f"{architecture}: expected one database forbidden pattern, found {text.count(old)}")
          architecture.write_text(text.replace(old, new, 1), encoding="utf-8")

          navigation = files[0]
          text = navigation.read_text(encoding="utf-8")
          anchor = '            "Database CI": ".github/workflows/database.yml",\n'
          insert = (
              anchor
              + '            "Event Runtime CI": ".github/workflows/event-runtime.yml",\n'
              + '            "Projection Runtime CI": ".github/workflows/projection-runtime.yml",\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"{navigation}: expected one workflow mapping anchor, found {text.count(anchor)}")
          navigation.write_text(text.replace(anchor, insert, 1), encoding="utf-8")
          PY
          python scripts/generate_repository_navigation.py --write
          python scripts/generate_repository_navigation.py --check
          python -m unittest -v tests.test_repository_navigation tests.test_architecture_documentation_consistency
          rm .github/workflows/step17-fixture-navigation-sync.yml
          git diff --check
          git add repository-packet.json docs/ACTIVE_PACKET.md docs/generated/REPOSITORY_MAP.md tests/test_repository_navigation.py tests/test_architecture_documentation_consistency.py .github/workflows/step17-fixture-navigation-sync.yml
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Synchronize Step 17 fixture packet evidence"
          git push origin HEAD:step17-representative-lifecycle
