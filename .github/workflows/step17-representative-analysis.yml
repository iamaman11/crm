name: Step 17 Representative Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-representative-analysis.yml"
      - ".github/step17-representative.patch.00"
      - ".github/step17-representative.patch.01"
      - ".github/step17-representative.patch.02"
      - ".github/step17-representative-fix.patch"

concurrency:
  group: step17-representative-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-representative-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Reproduce exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          expected_main=861b1d5907c43f5e89dc10d5a7c81c1c98aa771b
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${expected_main}"
          cp .github/workflows/step17-representative-analysis.yml /tmp/step17-finalizer.yml
          cp .github/step17-representative.patch.00 /tmp/step17-representative.patch.00
          cp .github/step17-representative.patch.01 /tmp/step17-representative.patch.01
          cp .github/step17-representative.patch.02 /tmp/step17-representative.patch.02
          cp .github/step17-representative-fix.patch /tmp/step17-representative-fix.patch
          echo "9237cc9043d5e5d4a294d48380a57a71abc61706a29e6df66a941effa2d0bfe4  /tmp/step17-representative.patch.00" | sha256sum --check
          echo "751fd1474d3a5e798b0d7dcc516112ab1973c560c608df1f39cf9f25794af36d  /tmp/step17-representative.patch.01" | sha256sum --check
          echo "6727a747dd2aa37cf42a943e10cdec6b450d9f81e5aaafc110a3c9b6188b6296  /tmp/step17-representative.patch.02" | sha256sum --check
          echo "835903db84d0348311232af727a0c8ba6ad22e3c838464b399bf23cebff82fc7  /tmp/step17-representative-fix.patch" | sha256sum --check
          cat /tmp/step17-representative.patch.00 /tmp/step17-representative.patch.01 /tmp/step17-representative.patch.02 > /tmp/step17-representative.patch.b64
          base64 --decode /tmp/step17-representative.patch.b64 | gzip --decompress > /tmp/step17-representative.patch
          echo "1d5070ac438e296a68d6199443a0c432a109b7f407b6d607bdb0afe93d195f01  /tmp/step17-representative.patch" | sha256sum --check
          git reset --hard "${expected_main}"
          git clean -fdx
          git apply --index /tmp/step17-representative.patch
          git apply --index /tmp/step17-representative-fix.patch
          buf build proto --output /tmp/crm-schema.binpb
          python scripts/generate_contract_bindings.py --write --descriptor-set /tmp/crm-schema.binpb
          python scripts/generate_contract_lifecycle.py --write
          python scripts/generate_contract_telemetry_catalog.py --write
          python scripts/generate_repository_navigation.py --write
          cargo fmt --all
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          packet = json.loads(Path("repository-packet.json").read_text(encoding="utf-8"))
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          if changed != sorted(packet["allowed_paths"]):
              raise SystemExit(
                  f"exact packet tree mismatch\nexpected={sorted(packet['allowed_paths'])}\nactual={changed}"
              )
          if len(changed) != 19:
              raise SystemExit(f"expected 19 packet files, found {len(changed)}")
          PY
          test -z "$(git diff --check)"
      - name: Validate contracts and generated evidence
        shell: bash
        run: |
          set -euo pipefail
          buf format -d --exit-code proto
          buf lint proto
          python scripts/validate_module_manifests.py
          python scripts/generate_contract_bindings.py --check --descriptor-set /tmp/crm-schema.binpb
          python scripts/generate_contract_lifecycle.py --check --base-ref origin/main --expected-output /tmp/contract-lifecycle.expected.json
          cmp contracts/contract-lifecycle.json /tmp/contract-lifecycle.expected.json
          python scripts/generate_contract_telemetry_catalog.py --check
          python scripts/generate_repository_navigation.py --check
          python -m unittest \
            tests/test_contract_bindings.py \
            tests/test_contract_lifecycle.py \
            tests/test_contract_lifecycle_transitions.py \
            tests/test_contract_telemetry_catalog.py \
            tests/test_repository_navigation.py \
            tests/test_architecture_documentation_consistency.py
      - name: Validate Rust and architecture closure
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          python scripts/check_architecture.py
          python scripts/check_step13_suppression_baseline.py --check --json-output /tmp/suppressions.json --markdown-output /tmp/suppressions.md
          python scripts/analyze_workspace_governance.py --base-ref origin/main --check --json-output /tmp/governance.json --markdown-output /tmp/governance.md
          python scripts/check_workspace_dependency_policy.py --check --json-output /tmp/dependencies.json --markdown-output /tmp/dependencies.md
          python scripts/analyze_step13_complexity.py --json-output /tmp/complexity.json --markdown-output /tmp/complexity.md
      - name: Commit clean candidate and upload proof
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Implement representative capability deprecation"
          clean_sha="$(git rev-parse HEAD)"
          mkdir -p /tmp/step17-representative-proof
          printf '%s\n' "${clean_sha}" > /tmp/step17-representative-proof/clean-sha.txt
          git diff --binary origin/main HEAD > /tmp/step17-representative-proof/clean.diff
          git diff --name-only origin/main HEAD > /tmp/step17-representative-proof/changed-files.txt
          sha256sum /tmp/step17-representative-proof/clean.diff > /tmp/step17-representative-proof/clean.diff.sha256
          cp /tmp/step17-finalizer.yml .github/workflows/step17-representative-analysis.yml
          cp /tmp/step17-representative.patch.00 .github/step17-representative.patch.00
          cp /tmp/step17-representative.patch.01 .github/step17-representative.patch.01
          cp /tmp/step17-representative.patch.02 .github/step17-representative.patch.02
          cp /tmp/step17-representative-fix.patch .github/step17-representative-fix.patch
          git add .github
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Retain finalizer bootstrap on staging"
          git push --force origin HEAD:step17-representative-clean-staging
      - name: Upload clean candidate proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: step17-representative-clean-proof
          path: /tmp/step17-representative-proof
          if-no-files-found: error
          retention-days: 14
