name: One-time Architecture Editorial Consistency

on:
  pull_request:
    branches:
      - main

concurrency:
  group: one-time-architecture-editorial-consistency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Apply exact editorial consistency corrections
        run: python scripts/one_time_architecture_plan_editorial_consistency.py
      - name: Verify permanent documentation and navigation guards
        run: |
          python scripts/generate_repository_navigation.py --check
          python scripts/check_architecture.py
          python -m unittest \
            tests.test_repository_navigation \
            tests.test_architecture_documentation_consistency
      - name: Commit permanent corrections
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/MODULE_CATALOG.md \
            docs/PROJECT_STATUS.md \
            tests/test_architecture_documentation_consistency.py
          git diff --cached --quiet && {
            echo "Expected editorial consistency corrections were not produced" >&2
            exit 1
          }
          git commit -m "Docs: close remaining architecture plan consistency gaps"
          git pull --rebase origin "${HEAD_BRANCH}"
          git push origin "HEAD:${HEAD_BRANCH}"
