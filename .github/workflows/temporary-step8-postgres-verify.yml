name: Temporary Step 8 PostgreSQL Verify

on:
  pull_request:
    paths:
      - ".github/step8-application-source.b64"
      - ".github/step8-reads-source.b64"
      - ".github/step8-pg-test-source.b64"
      - ".github/step8-structural-fixes.py"
      - ".github/step8-runtime-evidence-fixes.py"
      - ".github/step8-trigger-attribution-fixes.py"
      - ".github/step8-finalize.py"
      - ".github/workflows/temporary-step8-postgres-verify.yml"
      - "crates/crm-customer-privacy-production/src/owner_execution.rs"
      - "crates/crm-customer-privacy-application/**"
      - "crates/crm-customer-privacy-postgres/**"
      - "modules/crm-customer-privacy/**"
      - "database/migrations/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_privacy_owner_execution_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_privacy_owner_execution_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5455
      PGDATABASE: crm_privacy_owner_execution_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5455/crm_privacy_owner_execution_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5455/crm_privacy_owner_execution_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Materialize reviewed step 8 sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .github/step8-application-source.b64)" -eq 7376
          echo "313228caa3ce27a8b5512baf3f2bb9a6be3454b2da340b36ee5b84cd90b21559  .github/step8-application-source.b64" | sha256sum --check
          base64 --decode .github/step8-application-source.b64 > /tmp/step8-application.rs.gz
          test "$(wc -c < /tmp/step8-application.rs.gz)" -eq 5532
          echo "0ba1db0003c521afdc113421ce194e2e1cc398f607011d23c5c91d714ee3c158  /tmp/step8-application.rs.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/step8-application.rs.gz > crates/crm-customer-privacy-application/src/execution.rs

          test "$(wc -c < .github/step8-reads-source.b64)" -eq 11796
          echo "e72fc31055df57da5e5f922c843d7ebb4e170855ec081dd6b8af05aa1a06d551  .github/step8-reads-source.b64" | sha256sum --check
          base64 --decode .github/step8-reads-source.b64 > /tmp/step8-reads.rs.gz
          test "$(wc -c < /tmp/step8-reads.rs.gz)" -eq 8847
          echo "6623588dda27edaacd2ece295120bc581613fb726875dd35e142a39e3ff57784  /tmp/step8-reads.rs.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/step8-reads.rs.gz > crates/crm-customer-privacy-application/src/reads.rs

          test "$(wc -c < .github/step8-pg-test-source.b64)" -eq 7496
          echo "14f2e2ab71a6feedf858fb0f68c6861a364605214a937acaa28571ce99a20cd7  .github/step8-pg-test-source.b64" | sha256sum --check
          base64 --decode .github/step8-pg-test-source.b64 > /tmp/step8-pg-test.rs.gz
          test "$(wc -c < /tmp/step8-pg-test.rs.gz)" -eq 5622
          echo "ae73505cdde00bcf508cf0cdcd2befede6e29b7d6c82941c91f5cd11ff7f3e29  /tmp/step8-pg-test.rs.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/step8-pg-test.rs.gz > crates/crm-application-runtime/tests/customer_privacy_owner_execution_postgres.rs
      - name: Apply reviewed structural and transaction-evidence corrections
        shell: bash
        run: |
          set -euo pipefail
          echo "ca9bc33f6bcbb968480c22b5a8ff70582c1e424535f72c056b765983e1230fd2  .github/step8-structural-fixes.py" | sha256sum --check
          echo "d604a9cfbbcca8f643f27a8010ed3206d72ad17c697efa09429cbc0e263a2499  .github/step8-runtime-evidence-fixes.py" | sha256sum --check
          echo "5865335b93b6976d98e3a1b4a49330335fd07bf2880c87771c5368d34e6608ed  .github/step8-trigger-attribution-fixes.py" | sha256sum --check
          python .github/step8-structural-fixes.py
          python .github/step8-runtime-evidence-fixes.py
          python .github/step8-trigger-attribution-fixes.py
          cargo fmt --all
      - name: Verify format, compile and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked \
            -p crm-customer-privacy \
            -p crm-customer-privacy-application \
            -p crm-customer-privacy-postgres \
            -p crm-customer-privacy-production
          cargo clippy --locked \
            -p crm-customer-privacy \
            -p crm-customer-privacy-application \
            -p crm-customer-privacy-postgres \
            -p crm-customer-privacy-production \
            --all-targets -- -D warnings
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_postgres --no-run
          cargo clippy --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_postgres -- -D warnings
      - name: Apply clean authoritative schema and fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0005_party_adapter.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0007_contact_point_adapter.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0020_customer_privacy_persistence_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify clean PostgreSQL crash-window acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_postgres -- --nocapture \
            2>&1 | tee database/customer-privacy-owner-execution-clean.log
      - name: Roll back authoritative schema
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.down.sql' | sort -r)
          count="$(psql --tuples-only --no-align --command "SELECT count(*) FROM pg_namespace WHERE nspname = 'crm'")"
          test "${count}" = "0"
      - name: Reapply authoritative schema and fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0005_party_adapter.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0007_contact_point_adapter.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0020_customer_privacy_persistence_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Repeat PostgreSQL acceptance after reapply
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_postgres -- --nocapture \
            2>&1 | tee database/customer-privacy-owner-execution-reapplied.log
      - name: Finalize verified step 8 packet
        shell: bash
        run: |
          set -euo pipefail
          echo "1a06dd428ea26c70af2c3e14878b37d1b1a881e7939aa809623972299eac37f4  .github/step8-finalize.py" | sha256sum --check
          python .github/step8-finalize.py
          python scripts/generate_repository_navigation.py --write
          python scripts/repo.py packet-check --base origin/main
          python -m unittest \
            tests.test_customer_privacy_plan_reads_implementation \
            tests.test_generic_conformance_adoption
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Customer Privacy: finalize resumable owner execution"
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: step8-postgres-diagnostics
          path: |
            crates/crm-application-runtime/tests/customer_privacy_owner_execution_postgres.rs
            database/customer-privacy-owner-execution-*.log
          if-no-files-found: warn
          retention-days: 3
