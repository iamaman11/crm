name: Customer Privacy Discovery Compile Fix

on:
  push:
    branches:
      - feature/customer-privacy-production-discovery-snapshot

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/customer-privacy-production-discovery-snapshot
          fetch-depth: 0
      - name: Apply compile and Clippy fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path("crates/crm-customer-privacy-application/src/discovery.rs")
          text = app.read_text()

          if "pub fn is_empty(&self) -> bool" not in text:
              pattern = r"(    pub fn len\(&self\) -> usize \{\n        self\.by_owner\.len\(\)\n    \}\n)"
              replacement = r"\1\n    pub fn is_empty(&self) -> bool {\n        self.by_owner.is_empty()\n    }\n"
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit("endpoint len block mismatch")

          import_line = "    use crm_customer_privacy::{SCOPE_DISCOVERY_COORDINATE, SCOPE_SNAPSHOT_RECORD_TYPE};\n"
          if import_line not in text:
              marker = "#[cfg(test)]\nmod tests {\n    use super::*;\n"
              if text.count(marker) != 1:
                  raise SystemExit("application test module marker mismatch")
              text = text.replace(marker, marker + import_line, 1)
          app.write_text(text)

          production = Path("crates/crm-customer-privacy-production/src/lib.rs")
          text = production.read_text()
          import_line = "    use std::collections::BTreeSet;\n"
          if import_line not in text:
              marker = "#[cfg(test)]\nmod tests {\n    use super::*;\n"
              if text.count(marker) != 1:
                  raise SystemExit("production test module marker mismatch")
              text = text.replace(marker, marker + import_line, 1)
          production.write_text(text)

          Path(".github/workflows/customer-privacy-discovery-test-import-fix.yml").unlink()
          PY
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix Customer Privacy discovery compile checks"
          git push origin HEAD:feature/customer-privacy-production-discovery-snapshot
