name: Customer Privacy Discovery Compile Fix

on:
  push:
    branches:
      - feature/customer-privacy-production-discovery-snapshot

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/customer-privacy-production-discovery-snapshot
          fetch-depth: 0
      - name: Apply compile and Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path("crates/crm-customer-privacy-application/src/discovery.rs")
          text = app.read_text()

          len_block = '''    pub fn len(&self) -> usize {
              self.by_owner.len()
          }
          '''
          replacement = '''    pub fn len(&self) -> usize {
              self.by_owner.len()
          }

              pub fn is_empty(&self) -> bool {
                  self.by_owner.is_empty()
              }
          '''
          if "pub fn is_empty(&self) -> bool" not in text:
              if text.count(len_block) != 1:
                  raise SystemExit("endpoint len block mismatch")
              text = text.replace(len_block, replacement)

          test_marker = '''#[cfg(test)]
          mod tests {
              use super::*;
          '''
          test_replacement = '''#[cfg(test)]
          mod tests {
              use super::*;
              use crm_customer_privacy::{SCOPE_DISCOVERY_COORDINATE, SCOPE_SNAPSHOT_RECORD_TYPE};
          '''
          if "use crm_customer_privacy::{SCOPE_DISCOVERY_COORDINATE, SCOPE_SNAPSHOT_RECORD_TYPE};" not in text:
              if text.count(test_marker) != 1:
                  raise SystemExit("application test module marker mismatch")
              text = text.replace(test_marker, test_replacement)
          app.write_text(text)

          production = Path("crates/crm-customer-privacy-production/src/lib.rs")
          text = production.read_text()
          production_marker = '''#[cfg(test)]
          mod tests {
              use super::*;
          '''
          production_replacement = '''#[cfg(test)]
          mod tests {
              use super::*;
              use std::collections::BTreeSet;
          '''
          if "use std::collections::BTreeSet;" not in text:
              if text.count(production_marker) != 1:
                  raise SystemExit("production test module marker mismatch")
              text = text.replace(production_marker, production_replacement)
          production.write_text(text)

          Path(".github/workflows/customer-privacy-discovery-test-import-fix.yml").unlink()
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix Customer Privacy discovery compile checks"
          git push origin HEAD:feature/customer-privacy-production-discovery-snapshot
