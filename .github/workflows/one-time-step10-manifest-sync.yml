name: One-time Step 10 Manifest Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-step10-manifest-sync.yml"

permissions:
  contents: write

concurrency:
  group: one-time-step10-manifest-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install repository tooling dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Materialize versioned private ownership and diagnostic fixes
        run: |
          python scripts/one_time_step10_manifest_sync.py
          python scripts/generate_repository_navigation.py --write
      - name: Verify module compatibility and packet navigation
        run: |
          python scripts/check_module_compatibility.py --base-ref origin/main
          python -m unittest -v tests.test_repository_navigation tests.test_architecture_documentation_consistency
      - name: Commit synchronized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            modules/crm-customer-privacy/module.yaml \
            modules/crm-customer-data-operations/module.yaml \
            modules/crm-customer-privacy/src/access_export.rs \
            crates/crm-customer-data-operations-execution-composition/src/privacy_export.rs \
            repository-packet.json \
            docs/ACTIVE_PACKET.md
          git diff --cached --exit-code && { echo "Expected changes were not materialized."; exit 1; } || true
          git commit -m "Step 10: synchronize manifests and canonical diagnostics"
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          # Revision 4: install canonical repository tooling dependencies.
