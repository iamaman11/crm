name: Customer Privacy Planning Source Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "crates/crm-customer-privacy-application/src/planning.rs"
      - "crates/crm-customer-privacy-postgres/src/planning.rs"
      - ".github/workflows/_customer-privacy-planning-source-fix.yml"

permissions:
  contents: write

concurrency:
  group: customer-privacy-planning-source-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact planning source fixes
        shell: python
        run: |
          from pathlib import Path

          application = Path("crates/crm-customer-privacy-application/src/planning.rs")
          text = application.read_text(encoding="utf-8")
          old = "mod tests {\n    use super::*;\n"
          new = "mod tests {\n    use super::*;\n    use crm_module_sdk::SchemaVersion;\n"
          if old not in text:
              raise SystemExit("planning test import source mismatch")
          application.write_text(text.replace(old, new, 1), encoding="utf-8")

          postgres = Path("crates/crm-customer-privacy-postgres/src/planning.rs")
          text = postgres.read_text(encoding="utf-8")
          old = '''    let suffix = match lock {
        RowLock::Share => " FOR SHARE",
        RowLock::Update => " FOR UPDATE",
    };
    let sql = format!(
        "SELECT version, owner_module_id, schema_id, schema_version, descriptor_hash, \\
         data_class, payload_encoding, maximum_payload_size, retention_policy_id, payload_bytes \\
         FROM crm.records WHERE tenant_id = $1 AND owner_module_id = $2 \\
         AND record_type = $3 AND record_id = $4 AND deleted_at IS NULL{suffix}"
    );
    postgres_sqlx::query(&sql)
        .bind(tenant_id.as_str())
        .bind(MODULE_ID)
        .bind(record_type)
        .bind(record_id.as_str())
        .fetch_optional(&mut **transaction)
        .await
        .map_err(database_error)
'''
          new = '''    let query = match lock {
        RowLock::Share => postgres_sqlx::query(
            r#"
            SELECT version, owner_module_id, schema_id, schema_version, descriptor_hash,
                   data_class, payload_encoding, maximum_payload_size, retention_policy_id,
                   payload_bytes
            FROM crm.records
            WHERE tenant_id = $1 AND owner_module_id = $2
              AND record_type = $3 AND record_id = $4 AND deleted_at IS NULL
            FOR SHARE
            "#,
        ),
        RowLock::Update => postgres_sqlx::query(
            r#"
            SELECT version, owner_module_id, schema_id, schema_version, descriptor_hash,
                   data_class, payload_encoding, maximum_payload_size, retention_policy_id,
                   payload_bytes
            FROM crm.records
            WHERE tenant_id = $1 AND owner_module_id = $2
              AND record_type = $3 AND record_id = $4 AND deleted_at IS NULL
            FOR UPDATE
            "#,
        ),
    };
    query
        .bind(tenant_id.as_str())
        .bind(MODULE_ID)
        .bind(record_type)
        .bind(record_id.as_str())
        .fetch_optional(&mut **transaction)
        .await
        .map_err(database_error)
'''
          if old not in text:
              raise SystemExit("dynamic planning SQL source mismatch")
          text = text.replace(old, new, 1)

          old = '''    let mut bytes = Vec::new();
    for value in [
        b"crm.customer-privacy.planning-audit/v1".as_slice(),
        invocation.tenant_id.as_str().as_bytes(),
        invocation.privacy_case_id.as_str().as_bytes(),
        event_type.as_bytes(),
        plan.plan_id().as_str().as_bytes(),
        plan.digest().as_slice(),
        resulting_case_version.to_string().as_bytes(),
        invocation.actor_id.as_str().as_bytes(),
        invocation.request_id.as_str().as_bytes(),
    ] {
'''
          new = '''    let resulting_case_version = resulting_case_version.to_string();
    let mut bytes = Vec::new();
    for value in [
        b"crm.customer-privacy.planning-audit/v1".as_slice(),
        invocation.tenant_id.as_str().as_bytes(),
        invocation.privacy_case_id.as_str().as_bytes(),
        event_type.as_bytes(),
        plan.plan_id().as_str().as_bytes(),
        plan.digest().as_slice(),
        resulting_case_version.as_bytes(),
        invocation.actor_id.as_str().as_bytes(),
        invocation.request_id.as_str().as_bytes(),
    ] {
'''
          if old not in text:
              raise SystemExit("planning audit digest source mismatch")
          postgres.write_text(text.replace(old, new, 1), encoding="utf-8")
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: rustfmt
      - name: Format, remove workflow and commit
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/_customer-privacy-planning-source-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/crm-customer-privacy-application/src/planning.rs crates/crm-customer-privacy-postgres/src/planning.rs .github/workflows/_customer-privacy-planning-source-fix.yml
          git commit -m "Fix Customer Privacy planning source diagnostics"
          git push origin "HEAD:${HEAD_BRANCH}"
