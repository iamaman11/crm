name: One-time post-pilot docs sync PR runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'docs/sync-after-aggregation-ci-pilots'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/sync-after-aggregation-ci-pilots
      - name: Execute staged synchronization script
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/one-time-docs-sync.yml \
            | sed '1d;$d;s/^          //' > /tmp/synchronize_docs.py
          python /tmp/synchronize_docs.py
      - name: Commit synchronized documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/IMPLEMENTATION_ROADMAP.md docs/PHASE8_DELIVERY_PLAN.md
          git commit -m "Synchronize status after aggregation and CI pilots"
          git push origin HEAD:docs/sync-after-aggregation-ci-pilots
