name: Temporary Step 13 Evidence Sync

on:
  push:
    branches:
      - docs-step-13-exit-evidence-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs-step-13-exit-evidence-sync
          fetch-depth: 0
      - name: Apply exact normative replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          PR257 = "PR #257 / accepted source `6cde72d7fc9a442018c51fd6e6772e626b26e307` / squash merge `10516e84ea3c2d0fa8ee0c61c9eeec7e96a6273c` / 7 of 7 applicable permanent workflows on one unchanged exact head"
          evidence = PR257 + " completes the remaining ADR-031 blocking exit evidence. It freezes reduction-only workspace and role-aware central-system budgets; separately proves `crm-api` remains production-thin at one runtime internal dependency plus eighteen acceptance-only dev dependencies and `crm-application-runtime` remains at sixty-two runtime plus one dev internal dependency; and blocks unmeasured process-host, representative change-cost, dependency-version/feature, heavy-feature, declaration and workspace-centralization growth while permitting reductions. The nine-file packet changes no product/runtime source, Cargo manifest, dependency declaration, package, route, contract, schema, migration, persistence or worker behavior."
          closure = "Repository step 13 is complete through PRs #253, #255 and #257. This exact-head documentation packet synchronizes the accepted closure evidence across all live normative sources. Repository step 14 is the next permitted implementation step and remains not started until this packet is accepted and merged."

          paths = [
              Path("docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md"),
              Path("docs/PROJECT_STATUS.md"),
              Path("docs/IMPLEMENTATION_ROADMAP.md"),
              Path("docs/PHASE8_DELIVERY_PLAN.md"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if evidence not in text:
                  match = re.search(r'(PR #255 / accepted source `4c80546283af9c869a28c2da9c8697b203d0c327`[^\n]*\n)', text)
                  if not match:
                      raise SystemExit(f"missing PR #255 anchor in {path}")
                  text = text[:match.end()] + "\n" + evidence + "\n" + text[match.end():]
              replacements = {
                  "Repository step 13 remains in progress. The next permitted implementation packet must remeasure accepted `main` against every remaining ADR-031 exit criterion, mechanically prove central process-host dependency reduction or justified non-growth and the representative change-cost/dependency-version-feature budgets, and perform only evidence-required bounded remediation. Repository step 14 remains blocked. No arbitrary packet-count or duration cap is imposed.": closure,
                  "Repository step 13 remains in progress after accepted PR #255 suppression enforcement and direct-lint removal. The next permitted implementation packet remeasures accepted `main` against the remaining ADR-031 exit criteria, proves central process-host dependency reduction or justified non-growth and representative change-cost/dependency-version-feature budgets, and performs only evidence-required bounded remediation. Repository step 14 remains blocked.": "Repository step 14 is the next permitted implementation packet after accepted repository-step-13 closure through PRs #253, #255 and #257 and this exact-head synchronization. It is not started and is limited to the first measured behavior-neutral transitional domain-cluster consolidation.",
                  "Repository step 13 remains in progress after accepted suppression enforcement and direct-lint removal. The next permitted implementation packet remeasures accepted `main` against the remaining ADR-031 exit criteria, proves central process-host dependency reduction or justified non-growth and representative change-cost/dependency-version-feature budgets, and performs only evidence-required bounded remediation. Repository step 14 remains blocked.": closure,
                  "Repository step 13 remains in progress. Its next bounded packet closes only the remaining ADR-031 exit-evidence gaps. PR #255 changes no Customer Privacy behavior, public inventory, worker, route, contract, persistence semantics or Phase 8A readiness; repository step 14 remains blocked.": "Repository step 13 is complete through PRs #253, #255 and #257. None of those architecture packets changes Customer Privacy behavior, public inventory, worker, route, contract, persistence semantics or Phase 8A readiness. Repository step 14 is next and remains not started until this documentation packet is accepted.",
                  "Repository step 13 remains in progress. The next permitted implementation packet remeasures accepted `main` against the remaining ADR-031 exit criteria, proves central process-host dependency reduction or justified non-growth and representative change-cost/dependency-version-feature budgets, and performs only evidence-required bounded remediation. Repository step 14 remains blocked. PR #255 changes no product behavior, dependency family, package count, route, contract, schema, migration, persistence semantics or worker behavior.": closure + " PRs #253, #255 and #257 change no product behavior, dependency family, package count, route, contract, schema, migration, persistence semantics or worker behavior.",
                  "Repository step 13 remains in progress; repository step 14 remains blocked.": "Repository step 13 is complete through PRs #253, #255 and #257; repository step 14 is next and not started.",
                  "repository step 13 is in progress after accepted PRs #253 and #255.": "repository step 13 is complete through PRs #253, #255 and #257.",
                  "repository step 13 is in progress after accepted PR #253 measurement and PR #255 suppression enforcement.": "repository step 13 is complete through PRs #253, #255 and #257.",
                  "repository step 13 is in progress after accepted PR #253 measurement and PR #255 blocking suppression/direct-lint governance.": "repository step 13 is complete through PRs #253, #255 and #257.",
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = text.replace("## Accepted repository step 13 measurement and suppression enforcement", "## Accepted repository step 13 closure evidence")
              text = text.replace("### 3.2 Accepted repository step 13 measurement and suppression enforcement", "### 3.2 Accepted repository step 13 closure evidence")
              text = text.replace("## 5.1 Accepted repository step 13 measurement and suppression enforcement", "## 5.1 Accepted repository step 13 closure evidence")
              text = text.replace("## Repository step 13 measurement and suppression-enforcement evidence", "## Repository step 13 closure evidence")

              if path.name == "PROJECT_STATUS.md":
                  text = re.sub(r'Latest accepted repository implementation packet is PR #255[^\n]*', "Latest accepted repository implementation packet is " + PR257 + ". It completes the remaining ADR-031 blocking exit evidence without product or runtime changes. Repository step 13 is complete after this exact-head synchronization; repository step 14 is next and not started.", text, count=1)
                  text = text.replace("ADR-031 remains the binding architecture decision through PR #251. PR #253 established the exact 113-package measurement baseline, and PR #255 accepted the first blocking remediation packet against that evidence. No architecture score is raised by declaration; repository step 13 closes only after every remaining ADR-031 exit criterion is mechanically proven.", "ADR-031 remains the binding architecture decision through PR #251. PR #253 established the exact 113-package measurement baseline, PR #255 activated suppression/direct-lint enforcement, and PR #257 mechanically proves every remaining process-host, change-cost and dependency-governance exit criterion. No architecture score is raised by declaration; this closes repository step 13 only, not the overall 10/10 program.")
                  text = re.sub(r'## Next permitted repository packet\n\n.*?(?=\n\n## Following permitted repository packet)', "## Next permitted repository packet\n\nRepository step 14 is the next permitted implementation packet after this exact-head repository-step-13 evidence synchronization is accepted and merged. It remains **not started** and is limited to the first measured behavior-neutral transitional domain-cluster consolidation.", text, flags=re.S)
                  text = re.sub(r'## Following permitted repository packet\n\n.*?(?=\n\n## Architecture 10/10 declaration boundary)', "## Following permitted repository packet\n\nRepository step 15 follows only after repository step 14 is accepted and synchronized. It owns Party tombstone, no-orphan and projection/search/cache convergence evidence.", text, flags=re.S)
                  text = text.replace("- Stage B dependency/crate/exception governance is in progress: reproducible metrics, calibrated inheritance cohorts, root-family no-growth, exact Rust `1.97.1`, root `rust-version`, measured zero-warning Rust/Clippy governance, lockfile-preserving Rust workflows, blocking suppression governance and zero direct lint tables are accepted through PR #255; repository step 13 owns the remaining central process-host dependency and representative change-cost/dependency-version-feature exit evidence.", "- Stage B dependency/crate/exception governance is complete through PRs #253, #255 and #257: reproducible metrics, exact Rust `1.97.1`, zero-warning Rust/Clippy governance, lockfile preservation, blocking suppression governance, zero direct lint tables, section-aware process-host non-growth and representative change-cost/dependency-version-feature budgets are mechanically enforced.")
                  text = text.replace("- Stage G remains unstarted and is owned by repository step 14.", "- Stage G remains not started and is the next permitted implementation stage at repository step 14 after this synchronization is accepted.")
                  text = re.sub(r'-> 13\. [^\n]*', '-> 13. ADR-031 measurement, suppression/direct-lint enforcement and remaining exit-evidence enforcement — complete through PR #257', text)
                  text = re.sub(r'-> 14\. [^\n]*', '-> 14. first measured behavior-neutral transitional domain-cluster consolidation — next, not started', text)
                  text = text.replace("Repository step 13 remains **in progress**. PR #255 / accepted source `4c80546283af9c869a28c2da9c8697b203d0c327` / squash merge `393b60bdcfad6e92fc37eacabe0920645d530f6b` / 21 of 21 applicable permanent workflows accepted blocking suppression governance, zero direct lint tables and calibrated role-aware budgets without product behavior changes. The next permitted packet is the remaining ADR-031 exit-gap remeasurement and evidence-driven remediation; repository step 14 remains blocked. Customer Privacy and Phase 8A remain incomplete.", "Repository step 13 is **complete** through PRs #253, #255 and #257 after this exact-head synchronization. Repository step 14 is the next permitted implementation packet and remains **not started**. Customer Privacy and Phase 8A remain incomplete.")
                  text = text.replace("Repository step 13 is **in progress** after accepted PR #253 measurement and accepted PR #255 blocking suppression/direct-lint governance. The next bounded packet remeasures and closes only the remaining ADR-031 exit gaps, with evidence-driven remediation permitted until every criterion is mechanically proven. Repository step 14 remains blocked. Customer Privacy and Phase 8A product readiness remain unchanged; current product-complete expert modules remain **0**.", "Repository step 13 is **complete** through PRs #253, #255 and #257 after this exact-head synchronization. Repository step 14 is **next, not started**. Customer Privacy and Phase 8A product readiness remain unchanged; current product-complete expert modules remain **0**.")
              elif path.name == "ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md":
                  text = text.replace("| B — dependency, crate and exception governance | **In progress** | reproducible baseline, crate justification, calibrated inheritance cohorts, root-family no-growth, exact Rust `1.97.1` toolchain/workspace `rust-version`, measured zero-warning Rust/Clippy baseline, lockfile-preserving Rust workflows, blocking suppression governance and zero direct lint tables accepted through PR #255 | remaining ADR-031 central process-host dependency and representative change-cost/dependency-version-feature exit evidence at step 13, measured consolidation at step 14, and remeasurement at steps 22 and 25 |", "| B — dependency, crate and exception governance | **Complete through PR #257** | reproducible baseline, exact Rust `1.97.1`, zero-warning Rust/Clippy, lockfile preservation, blocking suppression governance, zero direct lint tables, section-aware process-host non-growth and representative change-cost/dependency-version-feature budgets | future checkpoints at steps 22 and 25 remeasure regression; they do not reopen accepted step 13 without new evidence |")
                  text = text.replace("| B — dependency, crate and exception governance | steps 13, 14, 22 and 25, plus every structural preflight | PR #255 accepts blocking calibrated governance and zero direct lint tables; step 13 still requires central process-host dependency reduction or justified non-growth plus representative change-cost/dependency-version-feature exit proof; no unjustified package growth; expired exceptions zero; measured before/after reports |", "| B — dependency, crate and exception governance | step 13 plus every structural preflight; remeasurement at steps 22 and 25 | PRs #253, #255 and #257 accept all ADR-031 exit evidence: no unjustified package growth, expired exceptions zero, process-host non-growth and representative change-cost/dependency-version-feature budgets are blocking |")
                  text = re.sub(r'13\. complete ADR-031 governance closure:[^\n]*', '13. complete ADR-031 governance closure: measurement, blocking suppression/direct-lint governance and remaining process-host/change-cost/dependency-governance exit evidence — **Complete through PR #257**;', text)
                  text = text.replace("Repository step 12 was delivered as sequential bounded behavior-neutral owner batches and is complete through PR #249. Repository step 13 is a separate behavior-neutral governance step: PR #253 accepted measurement and PR #255 accepted blocking suppression/direct-lint governance, while the remaining ADR-031 central process-host dependency and representative change-cost/dependency-version-feature exit evidence must still close before step 14. Repository step 17 separately enforces the published contract lifecycle. Repository step 22 publishes measurements and remaining blockers; it cannot waive the two later-wave requirement or close issue #194.", "Repository step 12 was delivered as sequential bounded behavior-neutral owner batches and is complete through PR #249. Repository step 13 is a separate behavior-neutral governance step completed through PRs #253, #255 and #257 after this exact-head synchronization. Repository step 14 is the next not-started implementation step. Repository step 17 separately enforces the published contract lifecycle. Repository step 22 publishes measurements and remaining blockers; it cannot waive the two later-wave requirement or close issue #194.")
                  text = text.replace("Repository steps 1–12 are complete. Repository step 13 is in progress under ADR-031: PR #253 accepted the exact 113-package measurement baseline and PR #255 accepted blocking suppression governance, zero direct lint tables and calibrated role-aware budgets without product behavior changes. The next permitted packet is remaining exit-gap remeasurement and only evidence-required bounded remediation. Repository step 14 remains blocked.", "Repository steps 1–13 are complete after this exact-head synchronization: PR #253 accepted the 113-package measurement baseline, PR #255 accepted blocking suppression/direct-lint governance, and PR #257 accepted process-host, change-cost and dependency-governance exit enforcement without product behavior changes. Repository step 14 is next and not started.")
                  text = text.replace("PR #253 supplied measurement/calibration and PR #255 activated blocking suppression/direct-lint governance; remaining step-13 remediation is permitted only when current evidence proves an exit gap.", "PR #253 supplied measurement/calibration, PR #255 activated blocking suppression/direct-lint governance, and PR #257 completed the remaining ADR-031 exit enforcement. Step 13 is closed after this synchronization.")
                  text = text.replace("Representative baselines are collected. PR #255 activates blocking suppression and calibrated role-aware governance; any remaining warning-to-blocking transition must be justified by the relevant ADR-031 exit evidence.", "Representative baselines are collected and PR #257 makes their change-cost and dependency/version/feature budgets blocking. Any future budget change requires a new measured decision.")
              elif path.name == "IMPLEMENTATION_ROADMAP.md":
                  text = text.replace("- Stage B dependency, crate and exception governance — **In progress; exact Rust/toolchain governance, lockfile-preserving workflows, blocking suppression governance and zero direct lint tables are accepted through PR #255; remaining ADR-031 exit evidence covers central process-host dependency and representative change-cost/dependency-version-feature budgets**.", "- Stage B dependency, crate and exception governance — **Complete through PR #257: exact Rust/toolchain governance, lockfile-preserving workflows, blocking suppression governance, zero direct lint tables, section-aware process-host non-growth and representative change-cost/dependency-version-feature budgets are enforced**.")
                  text = text.replace("Accepted architecture evidence includes PR #197, PR #199, PR #200, PR #203, PR #204, PR #205, PR #218, PR #222, PR #224, PR #226, PR #228, PR #232, PR #230, PR #235, PR #237, PR #239, PR #241, PR #244, PR #246, PR #248, PR #249, PR #253 and PR #255.", "Accepted architecture evidence includes PR #197, PR #199, PR #200, PR #203, PR #204, PR #205, PR #218, PR #222, PR #224, PR #226, PR #228, PR #232, PR #230, PR #235, PR #237, PR #239, PR #241, PR #244, PR #246, PR #248, PR #249, PR #253, PR #255 and PR #257.")
                  text = re.sub(r'13\. \*\*Repository step 13[^\n]*', '13. **Repository step 13 — calibrated dependency, Rust public-surface, reverse-fan-out and exception governance — Complete through PR #257.**', text)
                  text = re.sub(r'14\. \*\*Repository step 14[^\n]*', '14. **Repository step 14 — first measured behavior-neutral transitional domain-cluster consolidation — Next, not started.**', text)
                  text = text.replace("The inserted prerequisites did not renumber the master sequence. Repository step 13 remains the only active implementation step; its next bounded packet closes only the remaining ADR-031 exit-evidence gaps. Repository step 14 remains blocked.", "The inserted prerequisites did not renumber the master sequence. Repository step 13 is complete through PR #257 after this synchronization. Repository step 14 is the next implementation step and remains not started.")
              elif path.name == "PHASE8_DELIVERY_PLAN.md":
                  text = re.sub(r'13\. repository step 13[^\n]*', '13. repository step 13 — calibrated dependency, Rust public-surface, reverse-fan-out and exception governance — **complete through PR #257**;', text)
                  text = re.sub(r'14\. repository step 14[^\n]*', '14. repository step 14 — first measured behavior-neutral consolidation — **next, not started**;', text)
                  text = text.replace("The inserted prerequisites did not renumber the normative master sequence. Repository step 13 remains the only active implementation step; its next bounded packet closes only the remaining ADR-031 exit-evidence gaps. Repository step 14 remains blocked.", "The inserted prerequisites did not renumber the normative master sequence. Repository step 13 is complete through PR #257 after this synchronization. Repository step 14 is next and remains not started.")
                  text = text.replace("Step 12 is architecture refactoring only and does not change Customer Privacy product behavior. Step 13 is a separate governance program: PR #253 accepted measurement and PR #255 accepted blocking suppression/direct-lint enforcement; only the remaining ADR-031 exit evidence may continue before step 14. Step 14 is physical consolidation only and remains separate from feature behavior.", "Step 12 is architecture refactoring only and does not change Customer Privacy product behavior. Step 13 is a separate governance program completed through PRs #253, #255 and #257 after this synchronization. Step 14 is next, remains not started, and is physical consolidation only, separate from feature behavior.")
              path.write_text(text, encoding="utf-8")

          test = Path("tests/test_architecture_documentation_consistency.py")
          text = test.read_text(encoding="utf-8")
          replacements = {
              '"13. complete ADR-031 governance closure: measurement and blocking suppression/direct-lint governance are accepted through PRs #253 and #255; remaining central process-host dependency and representative change-cost/dependency-version-feature exit proof is unfinished;",': '"13. complete ADR-031 governance closure: measurement, blocking suppression/direct-lint governance and remaining process-host/change-cost/dependency-governance exit evidence — **Complete through PR #257**;",',
              'self.assertIn("Repository step 13 remains in progress.", self.phase8)': 'self.assertIn("Repository step 13 is complete through PRs #253, #255 and #257", self.phase8)',
              '"Latest accepted repository implementation packet is PR #255",': '"Latest accepted repository implementation packet is PR #257",',
              'self.assertIn("Repository step 13 remains in progress.", self.status)': 'self.assertIn("Repository step 13 is complete after this exact-head synchronization", self.status)',
              '"Repository step 14 follows only after repository step 13 is accepted and synchronized.",': '"Repository step 14 is the next permitted implementation packet",',
              '"the checker passes the unchanged exact head and reports the accepted 113-package, 841-edge, aggregate process-host and section-aware manifest baseline",': '"all live normative sources agree that repository step 13 and Stage B are complete while repository step 14 is next and not started",',
              '"production and test-only process-host dependency surfaces are measured separately: crm-api remains one runtime dependency plus eighteen acceptance-only dev dependencies, while crm-application-runtime remains sixty-two runtime plus one dev dependency",': '"repository step 13 is marked complete only through the combined PR #253 measurement, PR #255 suppression/direct-lint enforcement, PR #257 remaining exit-evidence enforcement and this exact-head synchronization",',
              '"## Repository step 13 measurement and suppression-enforcement evidence",': '"## Repository step 13 closure evidence",',
              '"## Accepted repository step 13 measurement and suppression enforcement",': '"## Accepted repository step 13 closure evidence",',
              'self.assertIn("Repository step 14 remains blocked", self.status)': 'self.assertIn("Repository step 14 is the next permitted implementation packet", self.status)',
              '"repository step 13 owns the remaining central process-host dependency and representative change-cost/dependency-version-feature exit evidence",': '"stage b dependency/crate/exception governance is complete through prs #253, #255 and #257",',
              '"## Next permitted repository packet\\n\\nRepository step 13 remains in progress",': '"## Next permitted repository packet\\n\\nRepository step 14 is the next permitted implementation packet",',
              '"## Following permitted repository packet\\n\\nRepository step 14 follows only after repository step 13 is accepted and synchronized",': '"## Following permitted repository packet\\n\\nRepository step 15 follows only after repository step 14 is accepted and synchronized",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing architecture test anchor: {old}")
              text = text.replace(old, new)
          needle = '            (self.privacy_status_documents, "PR #255", "4c80546283af9c869a28c2da9c8697b203d0c327", "393b60bdcfad6e92fc37eacabe0920645d530f6b", "21 of 21"),\n'
          if needle not in text:
              raise SystemExit("missing PR #255 evidence tuple")
          text = text.replace(needle, needle + '            (self.privacy_status_documents, "PR #257", "6cde72d7fc9a442018c51fd6e6772e626b26e307", "10516e84ea3c2d0fa8ee0c61c9eeec7e96a6273c", "7 of 7"),\n')
          stale_anchor = '            "Latest accepted repository implementation packet is PR #253",\n'
          text = text.replace(stale_anchor, stale_anchor + '            "Repository step 13 remains in progress",\n            "Repository step 14 remains blocked",\n')
          test.write_text(text, encoding="utf-8")
          PY
      - name: Verify bounded replacements
        shell: bash
        run: |
          python -m py_compile tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          ! grep -R "Repository step 13 remains in progress" \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/MODULE_CATALOG.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/PROJECT_STATUS.md
          ! grep -R "Repository step 14 remains blocked" \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/MODULE_CATALOG.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/PROJECT_STATUS.md
          python scripts/generate_repository_navigation.py --check
      - name: Commit synchronized normative evidence
        shell: bash
        run: |
          if git diff --quiet -- \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/PROJECT_STATUS.md \
            tests/test_architecture_documentation_consistency.py; then
            echo "No transport changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/PROJECT_STATUS.md \
            tests/test_architecture_documentation_consistency.py
          git commit -m "docs: synchronize accepted step 13 closure evidence"
          git push origin HEAD:docs-step-13-exit-evidence-sync
