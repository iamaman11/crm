name: Temporary Step 20A Packet Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-packet-sync.yml"

permissions:
  contents: read

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-customer-privacy-product-plane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-customer-privacy-product-plane
      - name: Inspect Customer Privacy mutation fixtures
        shell: bash
        run: |
          set -euo pipefail
          echo '=== proto files ==='
          find proto/crm/customer_privacy/v1 -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== capability definition crates ==='
          grep -RIl --include='*.rs' -E 'customer_privacy\.case\.(create|submit|subject\.verify)' crates | sort | head -n 40
          echo '=== request construction sites ==='
          grep -RIn -C 5 --include='*.rs' -E '(Create|Submit|Verify).*Privacy|customer_privacy\.case\.(create|submit|subject\.verify)' crates services | head -n 600 || true
          echo '=== generic record storage ==='
          grep -RIn -C 8 --include='*.sql' -E 'CREATE TABLE crm\.records|INSERT INTO crm\.records' database | head -n 300 || true
          echo '=== capability grant DDL and fixtures ==='
          grep -RIn -C 8 --include='*.sql' -E 'CREATE TABLE crm\.(tenant_)?capability|INSERT INTO crm\.(tenant_)?capability' database | head -n 500 || true
