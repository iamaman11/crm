name: Temporary Step 20A Check Alignment

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-packet-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-evidence-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-evidence-sync
          fetch-depth: 0
      - name: Align packet checks with affected scope
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'black==26.3.1' 'ruamel.yaml>=0.18.6,<0.19'
          python - <<'PY'
          from pathlib import Path
          import json

          required_checks = [
              "Affected Scope CI",
              "Complexity Baseline CI",
              "Customer Privacy Access Export CI",
              "Customer Privacy Owner Execution CI",
              "Governance CI",
              "Rust Generated Sync",
              "Rust CI",
          ]

          packet_path = Path("repository-packet.json")
          packet = json.loads(packet_path.read_text(encoding="utf-8"))
          packet["required_checks"] = required_checks
          packet_path.write_text(
              json.dumps(packet, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          def align_guard(path: Path) -> None:
              lines = path.read_text(encoding="utf-8").splitlines()
              candidates = [
                  index
                  for index, line in enumerate(lines)
                  if '["required_checks"]' in line
              ]
              if len(candidates) != 1:
                  raise SystemExit(
                      f"expected one required_checks assertion in {path}, found {len(candidates)}"
                  )
              key_index = candidates[0]
              start = key_index + 1
              while start < len(lines) and lines[start].strip() != "[":
                  start += 1
              if start == len(lines):
                  raise SystemExit(f"required_checks list start missing in {path}")
              end = start + 1
              while end < len(lines) and lines[end].strip() != "],":
                  end += 1
              if end == len(lines):
                  raise SystemExit(f"required_checks list end missing in {path}")
              indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
              replacement = [indent + "["]
              replacement.extend(
                  indent + "    " + json.dumps(check) + ","
                  for check in required_checks
              )
              replacement.append(indent + "],")
              lines[start : end + 1] = replacement
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          align_guard(Path("tests/test_architecture_documentation_consistency.py"))
          align_guard(Path("tests/test_repository_navigation.py"))
          PY
          python scripts/generate_repository_navigation.py --write
          black tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-20a-packet-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align Step 20A evidence checks with affected scope"
          git push origin HEAD:repository-step-20a-evidence-sync
