name: Temporary Step 20A Packet Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-packet-sync.yml"

permissions:
  contents: read

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-customer-privacy-product-plane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-customer-privacy-product-plane
      - name: Inspect Customer Privacy SQL and authorization fixtures
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Privacy-related SQL files ==='
          grep -RIl --include='*.sql' -E 'privacy_cases|privacy_case|customer_privacy\.case\.(list|get)' database | sort || true
          echo '=== Relevant SQL excerpts ==='
          while IFS= read -r file; do
            echo "--- ${file} ---"
            grep -n -C 8 -E 'privacy_cases|privacy_case|customer_privacy\.case\.(list|get)' "${file}" | head -n 360 || true
          done < <(grep -RIl --include='*.sql' -E 'privacy_cases|privacy_case|customer_privacy\.case\.(list|get)' database | sort)
          echo '=== Authorization fixture patterns ==='
          grep -RIn -C 6 --include='*.sql' -E 'capability_grant|authorization|permission|customer_privacy\.case\.(list|get)' database/tests | head -n 500 || true
