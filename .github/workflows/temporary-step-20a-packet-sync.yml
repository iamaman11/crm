name: Temporary Step 20A Guard Formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-packet-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-evidence-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-evidence-sync
          fetch-depth: 0
      - name: Normalize permanent guard formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'black==26.3.1' 'ruamel.yaml>=0.18.6,<0.19'
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_architecture_documentation_consistency.py")
          text = path.read_text(encoding="utf-8")
          old = '''            for line in document.splitlines():

              lowered_line = line.lower()

              self.assertFalse(
          '''
          new = '''            for line in document.splitlines():
              lowered_line = line.lower()
              self.assertFalse(
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one evidence guard formatting marker, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          black tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-20a-packet-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: normalize Step 20A evidence guards"
          git push origin HEAD:repository-step-20a-evidence-sync
