name: Temporary Step 20A Packet Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-packet-sync.yml"
      - "repository-packet.json"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-customer-privacy-product-plane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-customer-privacy-product-plane
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install 'ruamel.yaml>=0.18.6,<0.19'
      - name: Synchronize packet navigation and guards
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated Customer Privacy TypeScript contracts:"
          find packages/client/gen/crm/customer_privacy/v1 -maxdepth 1 -type f -print | sort || true
          python scripts/generate_repository_navigation.py --write
          python - <<'PY'
          from pathlib import Path
          import re

          BASELINE = "46f5be276cf2935f1940827581b81cf197b87111"
          ALLOWED = {
              "apps/web/e2e/customer-privacy.spec.ts",
              "apps/web/src/App.tsx",
              "apps/web/src/CustomerPrivacyPage.tsx",
              "apps/web/src/CustomerPrivacyPage.test.ts",
              "apps/web/src/customerPrivacyViewModel.ts",
              "apps/web/src/routes.ts",
              "apps/web/src/routes.test.ts",
              "docs/ACTIVE_PACKET.md",
              "docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md",
              "packages/client/src/customerPrivacy.test.ts",
              "packages/client/src/customerPrivacy.ts",
              "packages/client/src/index.ts",
              "repository-packet.json",
              "scripts/run_e2e.sh",
              "tests/test_architecture_documentation_consistency.py",
              "tests/test_repository_navigation.py",
          }
          CHECKS = [
              "Affected Scope CI",
              "Complexity Baseline CI",
              "Governance CI",
              "Product Plane CI",
              "Rust Generated Sync",
              "Rust CI",
          ]

          def replace_method(text: str, names: tuple[str, ...], body: str) -> str:
              for name in names:
                  pattern = rf"    def {re.escape(name)}\(self\) -> None:\n.*?(?=\n    def |\n\nif __name__)"
                  updated, count = re.subn(pattern, lambda _: body.rstrip(), text, flags=re.DOTALL)
                  if count == 1:
                      return updated
              raise RuntimeError(f"none of the methods were found: {names}")

          allowed_literal = "{\n" + "\n".join(
              f'                "{path}",' for path in sorted(ALLOWED)
          ) + "\n            }"
          checks_literal = "[\n" + "\n".join(
              f'                "{name}",' for name in CHECKS
          ) + "\n            ]"

          architecture_path = Path("tests/test_architecture_documentation_consistency.py")
          architecture = architecture_path.read_text(encoding="utf-8")
          architecture = replace_method(
              architecture,
              (
                  "test_active_step_19_evidence_sync_packet_is_exact",
                  "test_active_step_20a_product_plane_packet_is_exact",
              ),
              f'''    def test_active_step_20a_product_plane_packet_is_exact(self) -> None:
                  self.assertEqual(self.packet["schema_version"], "crm.repository-packet/v1")
                  self.assertEqual(
                      self.packet["packet_id"],
                      "repository-step-20a-customer-privacy-product-plane",
                  )
                  self.assertEqual(self.packet["status"], "active")
                  self.assertEqual(
                      self.packet["baseline"],
                      {{"ref": "main", "sha": "{BASELINE}"}},
                  )
                  self.assertEqual(self.packet["tracking_issues"], [194, 126])
                  self.assertEqual(set(self.packet["allowed_paths"]), {allowed_literal})
                  self.assertEqual(self.packet["required_checks"], {checks_literal})
                  self.assertIn(self.packet["packet_id"], self.active_packet)
                  self.assertIn(self.packet["baseline"]["sha"], self.active_packet)
                  self.assertIn(
                      "add a typed governed Customer Privacy client for the existing case.list and case.get query coordinates with exact contract identity and descriptor-hash verification",
                      self.packet["deliverables"],
                  )
                  self.assertIn(
                      "complete the Step 20B restore SLO observability performance security or supply-chain operations evidence",
                      self.packet["non_goals"],
                  )''',
          )
          architecture_path.write_text(architecture, encoding="utf-8")

          navigation_path = Path("tests/test_repository_navigation.py")
          navigation = navigation_path.read_text(encoding="utf-8")
          navigation = replace_method(
              navigation,
              (
                  "test_active_step_19_evidence_packet_declaration_is_exact",
                  "test_active_step_20a_product_plane_packet_declaration_is_exact",
              ),
              f'''    def test_active_step_20a_product_plane_packet_declaration_is_exact(self) -> None:
                  packet = load_packet(ROOT)
                  self.assertEqual(packet["schema_version"], "crm.repository-packet/v1")
                  self.assertEqual(
                      packet["packet_id"],
                      "repository-step-20a-customer-privacy-product-plane",
                  )
                  self.assertEqual(packet["status"], "active")
                  self.assertEqual(
                      packet["baseline"],
                      {{"ref": "main", "sha": "{BASELINE}"}},
                  )
                  self.assertEqual(packet["tracking_issues"], [194, 126])
                  self.assertEqual(set(packet["allowed_paths"]), {allowed_literal})
                  self.assertEqual(packet["required_checks"], {checks_literal})
                  self.assertIn("Product Plane CI", packet["required_checks"])
                  self.assertIn("packages/client/src/customerPrivacy.ts", packet["allowed_paths"])
                  self.assertIn("apps/web/e2e/customer-privacy.spec.ts", packet["allowed_paths"])''',
          )
          navigation_path.write_text(navigation, encoding="utf-8")
          PY
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-20a-packet-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize Repository Step 20A packet"
          git push origin HEAD:repository-step-20a-customer-privacy-product-plane
