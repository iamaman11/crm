name: Temporary Step 20A Evidence Quality Executor

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-packet-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-evidence-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-evidence-sync
          fetch-depth: 0
      - name: Execute semantic quality pass
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'black==26.3.1' 'ruamel.yaml>=0.18.6,<0.19'
          python - <<'PY'
          from pathlib import Path
          import re

          documents = [
              Path("docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md"),
              Path("docs/IMPLEMENTATION_ROADMAP.md"),
              Path("docs/MODULE_CATALOG.md"),
              Path("docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md"),
              Path("docs/PHASE8_DELIVERY_PLAN.md"),
              Path("docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md"),
              Path("docs/PROJECT_STATUS.md"),
              Path("docs/WORKSPACE_COMPLEXITY_BASELINE.md"),
          ]
          replacements = {
              "Repository Steps 1–19 are complete. Repository Step 20 — Phase 8A frontend, accessibility, browser and operations evidence — is the only next permitted implementation packet.":
                  "Repository Steps 1–19 are complete. The bounded Repository Step 20A product-plane slice is accepted. Repository Step 20 remains in progress; Repository Step 20B restore, SLO, observability, performance, security and supply-chain operations evidence is the only next permitted implementation packet.",
              "The next permitted implementation packet is Repository Step 20: Phase 8A frontend, accessibility, browser and operations evidence.":
                  "Repository Step 20A is accepted through PR #292. Repository Step 20 remains in progress; Repository Step 20B restore, SLO, observability, performance, security and supply-chain operations evidence is the only next permitted implementation packet.",
              "Repository Steps 1–19 and the bounded Repository Step 20A product-plane slice are accepted.":
                  "Repository Steps 1–19 are complete. The bounded Repository Step 20A product-plane slice is accepted.",
          }
          for path in documents:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          stale = []
          for path in documents:
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  lowered = line.lower()
                  if (
                      "step 20" in lowered
                      and "next permitted" in lowered
                      and "step 20b" not in lowered
                  ) or (
                      "step 20 is next" in lowered and "step 20b" not in lowered
                  ):
                      stale.append(f"{path}:{number}: {line}")
          if stale:
              raise SystemExit("ambiguous Step 20 state remains:\n" + "\n".join(stale))

          guard = Path("tests/test_architecture_documentation_consistency.py")
          text = guard.read_text(encoding="utf-8")
          text = text.replace(
              "def test_step_19_is_complete_and_step_20_is_next(self) -> None:",
              "def test_step_19_is_complete_step_20a_is_accepted_and_step_20b_is_next(self) -> None:",
          )
          old_assertions = '''        self.assertIn("Repository Steps 1–19 are complete", self.status)
          self.assertIn("Repository Step 20", self.status)
          '''
          new_assertions = '''        self.assertIn("Repository Steps 1–19 are complete", self.status)
          self.assertIn("Repository Step 20A is accepted through PR #292", self.status)
          self.assertIn("Repository Step 20 remains in progress", self.status)
          self.assertIn("Repository Step 20B", self.status)
          '''
          if old_assertions in text:
              text = text.replace(old_assertions, new_assertions, 1)
          old_product_assertion = '''        self.assertIn("Repository Step 20 — Phase 8A frontend", self.product_plan)
          '''
          new_product_assertion = '''        self.assertIn("Repository Step 20A is accepted through PR #292", self.product_plan)
          self.assertIn("Repository Step 20B", self.product_plan)
          '''
          if old_product_assertion in text:
              text = text.replace(old_product_assertion, new_product_assertion, 1)
          if 'and "step 20b" not in lowered_line' not in text:
              pattern = re.compile(
                  r'(?P<block>(?P<indent>\s+)self\.assertNotIn\(\n'
                  r'\s+"next permitted bounded implementation packet is repository step 20",\n'
                  r'\s+lowered,\n\s+\)\n)'
              )
              match = pattern.search(text)
              if match is None:
                  raise SystemExit("stable architecture semantic assertion not found")
              indent = match.group("indent")
              inner = indent + "    "
              assertion = (
                  f"{indent}for line in document.splitlines():\n"
                  f"{inner}lowered_line = line.lower()\n"
                  f"{inner}self.assertFalse(\n"
                  f'{inner}    "step 20" in lowered_line\n'
                  f'{inner}    and "next permitted" in lowered_line\n'
                  f'{inner}    and "step 20b" not in lowered_line,\n'
                  f"{inner}    line,\n"
                  f"{inner})\n"
              )
              text = text[: match.end()] + assertion + text[match.end() :]
          guard.write_text(text, encoding="utf-8")
          PY
          black tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-20a-fixture-fix.yml
          rm .github/workflows/temporary-step-20a-packet-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove residual Step 20 ambiguity"
          git push origin HEAD:repository-step-20a-evidence-sync
