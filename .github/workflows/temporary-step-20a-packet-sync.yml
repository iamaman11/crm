name: Temporary Step 20A Evidence Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-step-20a-packet-sync.yml"

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-20a-evidence-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-20a-evidence-sync
          fetch-depth: 0
      - name: Finalize accepted Step 20A semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'black==26.3.1' 'ruamel.yaml>=0.18.6,<0.19'
          python - <<'PY'
          from pathlib import Path

          documents = [
              Path("docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md"),
              Path("docs/IMPLEMENTATION_ROADMAP.md"),
              Path("docs/MODULE_CATALOG.md"),
              Path("docs/PHASE8A_CUSTOMER_PRIVACY_PRODUCT_PLANE.md"),
              Path("docs/PHASE8_DELIVERY_PLAN.md"),
              Path("docs/PRODUCT_DEVELOPMENT_10_OF_10_PLAN.md"),
              Path("docs/PROJECT_STATUS.md"),
              Path("docs/WORKSPACE_COMPLEXITY_BASELINE.md"),
          ]

          replacements = {
              """Still required before Phase 8A.11 can close:

          - restriction and legal-hold release/read lifecycle where required;
          - frontend, accessibility and browser acceptance;
          - production operations, restore, SLO, security and performance evidence.""":
              """Still required before Phase 8A.11 can close:

          - restriction and legal-hold release/read lifecycle where required;
          - Repository Step 20B production operations, restore, SLO, observability, security, performance and supply-chain evidence;
          - a full Phase 8A.11 closure review beyond the accepted bounded Step 20A case-read slice.""",
              "- **Stage I — incomplete:** frontend and operations parity remain future work.":
                  "- **Stage I — in progress:** the bounded Step 20A frontend, accessibility and browser slice is accepted through PR #292; Step 20B operations parity remains.",
              "-> 20. Phase 8A frontend, accessibility, browser and operations evidence":
                  "-> 20. Phase 8A frontend, accessibility, browser and operations evidence — in progress; Step 20A accepted, Step 20B next",
              "No Step 20 or later implementation may begin before the accepted Repository Step 19 closure evidence is synchronized.":
                  "Repository Step 20B may begin only after the accepted Step 20A evidence is synchronized through this packet.",
          }

          for path in documents:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          forbidden = (
              "- frontend, accessibility and browser acceptance;",
              "frontend and operations parity remain future work",
              "No Step 20 or later implementation may begin",
          )
          stale = []
          for path in documents:
              text = path.read_text(encoding="utf-8")
              for phrase in forbidden:
                  if phrase in text:
                      stale.append(f"{path}: {phrase}")
              for number, line in enumerate(text.splitlines(), 1):
                  lowered = line.lower()
                  if (
                      "step 20" in lowered
                      and "next permitted" in lowered
                      and "step 20b" not in lowered
                  ) or (
                      "step 20 is next" in lowered and "step 20b" not in lowered
                  ):
                      stale.append(f"{path}:{number}: {line}")
          if stale:
              raise SystemExit("stale Step 20 state remains:\n" + "\n".join(stale))

          guard_path = Path("tests/test_architecture_documentation_consistency.py")
          guard = guard_path.read_text(encoding="utf-8")
          guard = guard.replace(
              "def test_step_19_is_complete_and_step_20_is_next(self) -> None:",
              "def test_step_19_is_complete_step_20a_is_accepted_and_step_20b_is_next(self) -> None:",
          )
          indent = " " * 8
          old_status = indent + 'self.assertIn("Repository Step 20", self.status)\n'
          new_status = (
              indent + 'self.assertIn("Repository Step 20A is accepted through PR #292", self.status)\n'
              + indent + 'self.assertIn("Repository Step 20 remains in progress", self.status)\n'
              + indent + 'self.assertIn("Repository Step 20B", self.status)\n'
          )
          if old_status in guard:
              guard = guard.replace(old_status, new_status, 1)
          old_product = indent + 'self.assertIn("Repository Step 20 — Phase 8A frontend", self.product_plan)\n'
          new_product = (
              indent + 'self.assertIn("Repository Step 20A is accepted through PR #292", self.product_plan)\n'
              + indent + 'self.assertIn("Repository Step 20B", self.product_plan)\n'
          )
          if old_product in guard:
              guard = guard.replace(old_product, new_product, 1)

          anchor = indent + 'self.assertIn("Repository Step 20 remains in progress", self.product_plane)\n'
          extra = (
              indent + 'self.assertNotIn("No Step 20 or later implementation may begin", self.status)\n'
              + indent + 'self.assertIn("Repository Step 20B may begin only after", self.status)\n'
              + indent + 'self.assertIn("Stage I — in progress", self.status)\n'
              + indent + 'self.assertNotIn("frontend and operations parity remain future work", self.status)\n'
              + indent + 'self.assertNotIn("- frontend, accessibility and browser acceptance;", self.status)\n'
          )
          if extra not in guard:
              if anchor not in guard:
                  raise SystemExit("Step 20A evidence guard anchor missing")
              guard = guard.replace(anchor, anchor + extra, 1)
          guard_path.write_text(guard, encoding="utf-8")
          PY
          python scripts/generate_repository_navigation.py --write
          black tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-20a-packet-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize accepted Step 20A evidence semantics"
          git push origin HEAD:repository-step-20a-evidence-sync
