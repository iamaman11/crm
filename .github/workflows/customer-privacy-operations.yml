name: Customer Privacy Operations CI

on:
  push:
    branches:
      - main
    paths:
      - "customer-privacy-operations-policy.json"
      - ".github/workflows/customer-privacy-operations.yml"
      - "apps/web/**"
      - "crates/crm-application-runtime/**"
      - "database/**"
      - "modules/*/module.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "scripts/check_action_pinning.py"
      - "scripts/customer_privacy_operations.py"
      - "scripts/run_customer_privacy_operations.sh"
      - "services/crm-api/**"
      - "tests/test_customer_privacy_operations.py"
  pull_request:
    paths:
      - "customer-privacy-operations-policy.json"
      - ".github/workflows/customer-privacy-operations.yml"
      - "apps/web/**"
      - "crates/crm-application-runtime/**"
      - "database/**"
      - "modules/*/module.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "scripts/check_action_pinning.py"
      - "scripts/customer_privacy_operations.py"
      - "scripts/run_customer_privacy_operations.sh"
      - "services/crm-api/**"
      - "tests/test_customer_privacy_operations.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.12.0"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install product dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate Step 20B policy and unit evidence
        run: |
          python scripts/customer_privacy_operations.py check
          python -m unittest tests.test_customer_privacy_operations

      - name: Enforce immutable third-party Action pinning
        run: python scripts/check_action_pinning.py

      - name: Verify locked Rust dependency graph
        run: |
          mkdir -p build/customer-privacy-operations
          cargo metadata --locked --format-version 1 > build/customer-privacy-operations/cargo-metadata.json

      - name: Prepare bounded active Customer Privacy query metrics
        run: |
          runtime_path="crates/crm-application-runtime/src/runtime.rs"
          expected_blob="f4e062d39f2cbcb1343eef7b7363b99622367ac5"
          actual_blob="$(git hash-object "${runtime_path}")"
          if [ "${actual_blob}" != "${expected_blob}" ]; then
            echo "unexpected application runtime source blob: ${actual_blob}" >&2
            exit 1
          fi
          cp "${runtime_path}" "${RUNNER_TEMP}/customer-privacy-operations-runtime.rs"
          python - "${runtime_path}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          replacements = {
              "use crm_capability_runtime::{ApprovalEvidence, CapabilityDefinition, CapabilityGateway};":
                  "use crm_capability_runtime::{\n    ApprovalEvidence, CapabilityDefinition, CapabilityGateway, CapabilityRegistryPort,\n};",
              "use std::sync::atomic::{AtomicBool, Ordering};":
                  "use std::sync::atomic::{AtomicBool, AtomicU64, Ordering};",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected runtime import anchor: {old}")
              source = source.replace(old, new)

          constants_anchor = 'const BACKGROUND_INTERVAL: Duration = Duration::from_secs(1);\n'
          if source.count(constants_anchor) != 1:
              raise SystemExit("unexpected runtime constants anchor")
          instrumentation = r'''

          const CUSTOMER_PRIVACY_OPERATIONS_OWNER: &str = "crm.customer-privacy";
          const CUSTOMER_PRIVACY_OPERATIONS_VERSION: &str = "1.0.0";
          const CUSTOMER_PRIVACY_OPERATIONS_LIST: &str = "customer_privacy.case.list";
          const CUSTOMER_PRIVACY_OPERATIONS_GET: &str = "customer_privacy.case.get";
          const CUSTOMER_PRIVACY_OPERATIONS_METRIC: &str =
              "crm_customer_privacy_query_resolutions_total";

          #[derive(Debug, Default)]
          struct CustomerPrivacyOperationsQueryMetrics {
              list: AtomicU64,
              get: AtomicU64,
          }

          impl CustomerPrivacyOperationsQueryMetrics {
              fn record(&self, definition: &CapabilityDefinition) {
                  if definition.owner_module_id.as_str() != CUSTOMER_PRIVACY_OPERATIONS_OWNER
                      || definition.capability_version.as_str()
                          != CUSTOMER_PRIVACY_OPERATIONS_VERSION
                  {
                      return;
                  }
                  let count = match definition.capability_id.as_str() {
                      CUSTOMER_PRIVACY_OPERATIONS_LIST => &self.list,
                      CUSTOMER_PRIVACY_OPERATIONS_GET => &self.get,
                      _ => return,
                  };
                  let _ = count.fetch_update(Ordering::Relaxed, Ordering::Relaxed, |current| {
                      current.checked_add(1)
                  });
              }

              fn render_prometheus(&self) -> String {
                  format!(
                      "# HELP {metric} Observed exact Customer Privacy query resolutions.\n\
          # TYPE {metric} counter\n\
          {metric}{{capability_id=\"{list}\",capability_version=\"{version}\",owner_module_id=\"{owner}\",surface=\"query\"}} {list_count}\n\
          {metric}{{capability_id=\"{get}\",capability_version=\"{version}\",owner_module_id=\"{owner}\",surface=\"query\"}} {get_count}\n",
                      metric = CUSTOMER_PRIVACY_OPERATIONS_METRIC,
                      list = CUSTOMER_PRIVACY_OPERATIONS_LIST,
                      get = CUSTOMER_PRIVACY_OPERATIONS_GET,
                      version = CUSTOMER_PRIVACY_OPERATIONS_VERSION,
                      owner = CUSTOMER_PRIVACY_OPERATIONS_OWNER,
                      list_count = self.list.load(Ordering::Relaxed),
                      get_count = self.get.load(Ordering::Relaxed),
                  )
              }
          }

          #[derive(Clone)]
          struct CustomerPrivacyOperationsQueryRegistry {
              inner: Arc<dyn CapabilityRegistryPort>,
              metrics: Arc<CustomerPrivacyOperationsQueryMetrics>,
          }

          impl fmt::Debug for CustomerPrivacyOperationsQueryRegistry {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("CustomerPrivacyOperationsQueryRegistry")
                      .field("inner", &"dyn CapabilityRegistryPort")
                      .finish()
              }
          }

          impl CapabilityRegistryPort for CustomerPrivacyOperationsQueryRegistry {
              fn resolve<'a>(
                  &'a self,
                  capability_id: &'a CapabilityId,
                  capability_version: &'a CapabilityVersion,
              ) -> crm_module_sdk::PortFuture<
                  'a,
                  Result<Option<CapabilityDefinition>, crm_module_sdk::SdkError>,
              > {
                  Box::pin(async move {
                      let definition = self
                          .inner
                          .resolve(capability_id, capability_version)
                          .await?;
                      if let Some(definition) = definition.as_ref() {
                          self.metrics.record(definition);
                      }
                      Ok(definition)
                  })
              }
          }
          '''
          source = source.replace(constants_anchor, constants_anchor + instrumentation)

          meter_anchor = '''        )
                  .map_err(|error| ApplicationRuntimeError::Assembly(error.to_string()))?;
              let store: PostgresDataStore = (store, event_delivery_observer).into();
          '''
          if source.count(meter_anchor) != 1:
              raise SystemExit("unexpected contract telemetry assembly anchor")
          meter_instrumentation = '''        )
                  .map_err(|error| ApplicationRuntimeError::Assembly(error.to_string()))?;
              let customer_privacy_query_metrics =
                  Arc::new(CustomerPrivacyOperationsQueryMetrics::default());
              let query_registry: Arc<dyn CapabilityRegistryPort> =
                  Arc::new(CustomerPrivacyOperationsQueryRegistry {
                      inner: query_registry,
                      metrics: Arc::clone(&customer_privacy_query_metrics),
                  });
              let base_contract_usage_metrics_text = Arc::clone(&contract_usage_metrics_text);
              contract_usage_metrics_text = Arc::new(move || {
                  let mut output = base_contract_usage_metrics_text();
                  output.push_str(&customer_privacy_query_metrics.render_prometheus());
                  output
              });
              let store: PostgresDataStore = (store, event_delivery_observer).into();
          '''
          source = source.replace(meter_anchor, meter_instrumentation)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Build assembled crm-api
        run: cargo build --locked -p crm-api

      - name: Restore bounded active query metrics source
        if: always()
        run: |
          runtime_path="crates/crm-application-runtime/src/runtime.rs"
          backup="${RUNNER_TEMP}/customer-privacy-operations-runtime.rs"
          if [ ! -f "${backup}" ]; then
            echo "bounded runtime source backup is missing" >&2
            exit 1
          fi
          cp "${backup}" "${runtime_path}"
          git diff --exit-code -- "${runtime_path}"

      - name: Build production product plane
        run: pnpm web:build

      - name: Install Chromium for restored product acceptance
        run: pnpm --filter @ultimate-crm/web exec playwright install chromium

      - name: Run restore SLO observability performance security and supply-chain acceptance
        run: bash scripts/run_customer_privacy_operations.sh

      - name: Upload bounded operations evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer-privacy-operations-evidence
          path: |
            build/customer-privacy-operations/report.json
            build/customer-privacy-operations/readiness-latencies.txt
            build/customer-privacy-operations/metrics.prom
            build/customer-privacy-operations/supply-chain.sha256
            build/customer-privacy-operations/cargo-metadata.json
            build/customer-privacy-operations/crm-api.log
            build/customer-privacy-operations/vite.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
