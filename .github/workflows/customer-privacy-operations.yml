name: Customer Privacy Operations CI

on:
  push:
    branches:
      - main
    paths:
      - "customer-privacy-operations-policy.json"
      - ".github/workflows/customer-privacy-operations.yml"
      - "apps/web/**"
      - "crates/crm-application-runtime/**"
      - "database/**"
      - "modules/*/module.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "scripts/check_action_pinning.py"
      - "scripts/customer_privacy_operations.py"
      - "scripts/run_customer_privacy_operations.sh"
      - "services/crm-api/**"
      - "tests/test_customer_privacy_operations.py"
  pull_request:
    paths:
      - "customer-privacy-operations-policy.json"
      - ".github/workflows/customer-privacy-operations.yml"
      - "apps/web/**"
      - "crates/crm-application-runtime/**"
      - "database/**"
      - "modules/*/module.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "scripts/check_action_pinning.py"
      - "scripts/customer_privacy_operations.py"
      - "scripts/run_customer_privacy_operations.sh"
      - "services/crm-api/**"
      - "tests/test_customer_privacy_operations.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.12.0"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install product dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate Step 20B policy and unit evidence
        run: |
          python scripts/customer_privacy_operations.py check
          python -m unittest tests.test_customer_privacy_operations

      - name: Enforce immutable third-party Action pinning
        run: python scripts/check_action_pinning.py

      - name: Verify locked Rust dependency graph
        run: |
          mkdir -p build/customer-privacy-operations
          cargo metadata --locked --format-version 1 > build/customer-privacy-operations/cargo-metadata.json

      - name: Build assembled crm-api
        run: cargo build --locked -p crm-api

      - name: Build production product plane
        run: pnpm web:build

      - name: Install Chromium for restored product acceptance
        run: pnpm --filter @ultimate-crm/web exec playwright install chromium

      - name: Run restore SLO observability performance security and supply-chain acceptance
        run: bash scripts/run_customer_privacy_operations.sh

      - name: Upload bounded operations evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer-privacy-operations-evidence
          path: |
            build/customer-privacy-operations/report.json
            build/customer-privacy-operations/readiness-latencies.txt
            build/customer-privacy-operations/metrics.prom
            build/customer-privacy-operations/supply-chain.sha256
            build/customer-privacy-operations/cargo-metadata.json
            build/customer-privacy-operations/crm-api.log
            build/customer-privacy-operations/vite.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
