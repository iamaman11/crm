name: Customer Privacy Discovery SQL Fix

on:
  push:
    branches:
      - feature/customer-privacy-production-discovery-snapshot
    paths:
      - ".github/workflows/customer-privacy-discovery-sql-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/customer-privacy-production-discovery-snapshot
          fetch-depth: 0
      - name: Remove accidental pgcrypto dependency
        shell: python
        run: |
          from pathlib import Path
          path = Path("database/tests/0043_customer_privacy_discovery_scope.sql")
          text = path.read_text()
          old = "  digest(decode('010203', 'hex'), 'sha256')\n"
          new = "  decode('039058c6f2c0cb492c533b0a4d14ef77cc0f78abccced5287d84a1a2011cfb81', 'hex')\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one pgcrypto digest expression")
          path.write_text(text.replace(old, new))
          Path(".github/workflows/customer-privacy-discovery-sql-fix.yml").unlink()
      - name: Commit acceptance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix Customer Privacy discovery SQL acceptance"
          git push origin HEAD:feature/customer-privacy-production-discovery-snapshot
