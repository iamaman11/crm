name: Step 17 Telemetry Bootstrap

on:
  push:
    branches:
      - step17-contract-usage-telemetry
    paths:
      - ".github/workflows/step17-telemetry-bootstrap.yml"
      - "scripts/apply_step17_telemetry_patch.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-telemetry-bootstrap.yml"
      - "scripts/apply_step17_telemetry_patch.py"

concurrency:
  group: step17-telemetry-bootstrap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-contract-usage-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Correct exact assertion matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_step17_telemetry_patch.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "def replace_allowed_set(path: str, items: list[str]) -> None:\n"
          end_marker = "def replace_required_checks(path: str, checks: list[str]) -> None:\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("expected exactly one pair of packet helper boundaries")
          start = text.index(start_marker)
          end = text.index(end_marker)
          if start >= end:
              raise SystemExit("packet helper boundaries are out of order")
          replacement = r'''def replace_allowed_set(path: str, items: list[str]) -> None:
              content = read(path)
              pattern = re.compile(
                  r'(set\((?:self\.)?packet\["allowed_paths"\]\),\n\s*)\{.*?\}(,?\n\s*\))',
                  re.DOTALL,
              )
              body = "{\n" + "".join(f'                "{item}",\n' for item in items) + "            }"
              replaced, count = pattern.subn(
                  lambda match: match.group(1) + body + match.group(2),
                  content,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f"{path}: could not replace allowed path assertion")
              write(path, replaced)


          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Apply deterministic telemetry patch
        run: python scripts/apply_step17_telemetry_patch.py
      - name: Align exact forbidden-path assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_architecture_documentation_consistency.py")
          text = path.read_text(encoding="utf-8")
          old = '"crates/**",'
          new = '"proto/**",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one forbidden-path value, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Generate governed artifacts
        run: |
          python scripts/generate_contract_telemetry_catalog.py --write
          python scripts/generate_repository_navigation.py --write
      - name: Run packet and generator tests
        run: |
          python -m unittest \
            tests/test_contract_telemetry_catalog.py \
            tests/test_repository_navigation.py \
            tests/test_architecture_documentation_consistency.py
      - name: Format Rust source
        run: cargo fmt --all
      - name: Test telemetry module
        run: cargo test --locked -p crm-application-runtime contract_usage_telemetry
      - name: Commit clean bounded packet
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/step17-telemetry-bootstrap.yml
          git rm scripts/apply_step17_telemetry_patch.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repository Step 17: instrument deprecated capability usage"
          git push origin HEAD:step17-contract-usage-telemetry
