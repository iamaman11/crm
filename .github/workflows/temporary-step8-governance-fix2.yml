name: Temporary Step 8 Governance Fix 2

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-step8-governance-fix2.yml"
      - ".github/step8-governance-fix.py"

concurrency:
  group: temporary-step8-governance-fix-2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Apply and verify governance synchronization
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements-dev.txt
          python -m py_compile .github/step8-governance-fix.py
          python .github/step8-governance-fix.py
          python scripts/generate_repository_navigation.py --write
          python -m py_compile \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation \
            tests.test_customer_privacy_plan_reads_implementation \
            tests.test_generic_conformance_adoption
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository-packet.json docs/ACTIVE_PACKET.md \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          git commit -m "governance: synchronize repository step 8 navigation"
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
