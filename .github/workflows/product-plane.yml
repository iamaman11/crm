name: Product Plane CI

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "requirements-dev.txt"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen*.yaml"
      - "apps/web/**"
      - "apps/cloudflare-crm/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "contracts/module-contract-bindings.json"
      - "modules/*/module.yaml"
      - "schemas/module.schema.json"
      - "scripts/contract_bindings.py"
      - "scripts/generate_contract_bindings.py"
      - ".github/workflows/product-plane.yml"
      - "scripts/run_e2e.sh"
      - "proto/**"
      - "crates/crm-application-runtime/**"
      - "crates/crm-proto-contracts/**"
      - "services/crm-api/**"
      - "database/**"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "requirements-dev.txt"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen*.yaml"
      - "apps/web/**"
      - "apps/cloudflare-crm/**"
      - "packages/client/**"
      - "packages/ui/**"
      - "contracts/module-contract-bindings.json"
      - "modules/*/module.yaml"
      - "schemas/module.schema.json"
      - "scripts/contract_bindings.py"
      - "scripts/generate_contract_bindings.py"
      - ".github/workflows/product-plane.yml"
      - "scripts/run_e2e.sh"
      - "proto/**"
      - "crates/crm-application-runtime/**"
      - "crates/crm-proto-contracts/**"
      - "services/crm-api/**"
      - "database/**"

# Only the newest Product Plane validation for a PR/ref is useful. Cancelling stale runs
# prevents old exact-SHA candidates from consuming hosted runners while the current head waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # Rust 1.100.0
        with:
          toolchain: 1.100.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install contract generation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # Uses the single canonical packageManager version from root package.json.

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated contract artifacts are up-to-date
        run: |
          pnpm web:generate
          git diff --exit-code contracts/module-contract-bindings.json packages/client/src/contract_hashes.ts

      - name: Run Web typecheck
        run: pnpm web:typecheck

      - name: Run Web lint
        run: pnpm web:lint

      - name: Run Web unit tests
        run: |
          set -o pipefail
          pnpm web:test 2>&1 | tee product-plane-unit.log

      - name: Run Web build
        run: pnpm web:build

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run E2E Integration Suite
        run: |
          set -o pipefail
          ./scripts/run_e2e.sh 2>&1 | tee product-plane-e2e.log

      - name: Upload Product Plane diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-plane-diagnostics
          path: |
            contracts/module-contract-bindings.json
            packages/client/src/contract_hashes.ts
            product-plane-unit.log
            product-plane-e2e.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
