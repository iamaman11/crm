name: Customer Privacy Owner Execution CI

on:
  push:
    branches:
      - main
    paths:
      - "repository-packet.json"
      - "docs/ACTIVE_PACKET.md"
      - "crates/crm-application-runtime/tests/customer_privacy_application_runtime_lifecycle.rs"
      - "crates/crm-application-runtime/tests/customer_privacy_owner_execution_postgres.rs"
      - "crates/crm-application-runtime/tests/customer_privacy_owner_execution_ready_postgres.rs"
      - "crates/crm-application-runtime/tests/party_tombstone_rebuild_convergence_postgres.rs"
      - "crates/crm-customer-privacy-application/**"
      - "crates/crm-customer-privacy-postgres/**"
      - "crates/crm-customer-privacy-production/**"
      - "modules/crm-customer-privacy/**"
      - "services/crm-api/tests/customer_360_privacy_no_orphan_process_e2e.rs"
      - "database/migrations/**"
      - "tests/test_customer_privacy_plan_reads_implementation.py"
      - "tests/test_generic_conformance_adoption.py"
      - ".github/workflows/customer-privacy-owner-execution.yml"
  pull_request:
    paths:
      - "repository-packet.json"
      - "docs/ACTIVE_PACKET.md"
      - "crates/crm-application-runtime/tests/customer_privacy_application_runtime_lifecycle.rs"
      - "crates/crm-application-runtime/tests/customer_privacy_owner_execution_postgres.rs"
      - "crates/crm-application-runtime/tests/customer_privacy_owner_execution_ready_postgres.rs"
      - "crates/crm-application-runtime/tests/party_tombstone_rebuild_convergence_postgres.rs"
      - "crates/crm-customer-privacy-application/**"
      - "crates/crm-customer-privacy-postgres/**"
      - "crates/crm-customer-privacy-production/**"
      - "modules/crm-customer-privacy/**"
      - "services/crm-api/tests/customer_360_privacy_no_orphan_process_e2e.rs"
      - "database/migrations/**"
      - "tests/test_customer_privacy_plan_reads_implementation.py"
      - "tests/test_generic_conformance_adoption.py"
      - ".github/workflows/customer-privacy-owner-execution.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  owner-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_privacy_owner_execution_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_privacy_owner_execution_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5455
      PGDATABASE: crm_privacy_owner_execution_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5455/crm_privacy_owner_execution_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5455/crm_privacy_owner_execution_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          python -m pip install --requirement requirements-dev.txt
      - name: Run architecture and historical-evidence preflight
        run: |
          python scripts/check_architecture.py
          python -m unittest \
            tests.test_customer_privacy_plan_reads_implementation \
            tests.test_generic_conformance_adoption
      - name: Verify owner-execution packages and runtime acceptance targets
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked \
            -p crm-customer-privacy \
            -p crm-customer-privacy-application \
            -p crm-customer-privacy-postgres \
            -p crm-customer-privacy-production
          cargo clippy --locked \
            -p crm-customer-privacy \
            -p crm-customer-privacy-application \
            -p crm-customer-privacy-postgres \
            -p crm-customer-privacy-production \
            --all-targets -- -D warnings
          cargo build --locked -p crm-api
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_application_runtime_lifecycle --no-run
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_postgres --no-run
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_ready_postgres --no-run
          cargo test --locked -p crm-application-runtime \
            --test party_tombstone_rebuild_convergence_postgres --no-run
          cargo test --locked -p crm-api \
            --test customer_360_privacy_no_orphan_process_e2e --no-run
          cargo clippy --locked -p crm-application-runtime \
            --test customer_privacy_application_runtime_lifecycle -- -D warnings
          cargo clippy --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_postgres -- -D warnings
          cargo clippy --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_ready_postgres -- -D warnings
          cargo clippy --locked -p crm-application-runtime \
            --test party_tombstone_rebuild_convergence_postgres -- -D warnings
          cargo clippy --locked -p crm-api \
            --test customer_360_privacy_no_orphan_process_e2e -- -D warnings
      - name: Prove active packet boundaries and owner-execution non-effects
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python scripts/repo.py packet-check --base "${BASE_SHA}"
      - name: Apply clean authoritative schema and fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0005_party_adapter.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0007_contact_point_adapter.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0020_customer_privacy_persistence_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify clean assembled runtime lifecycle
        shell: bash
        env:
          CRM_API_BINARY: ${{ github.workspace }}/target/debug/crm-api
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_application_runtime_lifecycle -- --ignored --nocapture \
            2>&1 | tee database/customer-privacy-runtime-lifecycle-clean.log
      - name: Verify clean PostgreSQL ready-work acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_ready_postgres -- --nocapture \
            2>&1 | tee database/customer-privacy-owner-ready-work-clean.log
      - name: Verify clean PostgreSQL crash-window acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_postgres -- --nocapture \
            2>&1 | tee database/customer-privacy-owner-execution-clean.log
      - name: Verify clean Party tombstone rebuild convergence
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test party_tombstone_rebuild_convergence_postgres -- --nocapture \
            2>&1 | tee database/customer-privacy-party-rebuild-clean.log
      - name: Verify clean crm-api privacy no-orphan process
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-api \
            --test customer_360_privacy_no_orphan_process_e2e -- --nocapture \
            2>&1 | tee database/customer-privacy-no-orphan-process-clean.log
      - name: Roll back authoritative schema
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.down.sql' | sort -r)
          count="$(psql --tuples-only --no-align --command "SELECT count(*) FROM pg_namespace WHERE nspname = 'crm'")"
          test "${count}" = "0"
      - name: Reapply authoritative schema and fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0005_party_adapter.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0007_contact_point_adapter.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0020_customer_privacy_persistence_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Repeat assembled runtime lifecycle after reapply
        shell: bash
        env:
          CRM_API_BINARY: ${{ github.workspace }}/target/debug/crm-api
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_application_runtime_lifecycle -- --ignored --nocapture \
            2>&1 | tee database/customer-privacy-runtime-lifecycle-reapplied.log
      - name: Repeat PostgreSQL ready-work acceptance after reapply
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_ready_postgres -- --nocapture \
            2>&1 | tee database/customer-privacy-owner-ready-work-reapplied.log
      - name: Repeat PostgreSQL acceptance after reapply
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test customer_privacy_owner_execution_postgres -- --nocapture \
            2>&1 | tee database/customer-privacy-owner-execution-reapplied.log
      - name: Repeat Party tombstone rebuild convergence after reapply
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-application-runtime \
            --test party_tombstone_rebuild_convergence_postgres -- --nocapture \
            2>&1 | tee database/customer-privacy-party-rebuild-reapplied.log
      - name: Repeat crm-api privacy no-orphan process after reapply
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-api \
            --test customer_360_privacy_no_orphan_process_e2e -- --nocapture \
            2>&1 | tee database/customer-privacy-no-orphan-process-reapplied.log
      - name: Capture PostgreSQL diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          postgres_container="$(docker ps -aq --filter ancestor=postgres:17-alpine | head -n 1)"
          if [ -n "${postgres_container}" ]; then
            docker logs "${postgres_container}" > database/customer-privacy-owner-execution-server.log 2>&1
          fi
      - name: Upload owner-execution diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer-privacy-owner-execution-diagnostics
          path: |
            crates/crm-customer-privacy-application/
            crates/crm-customer-privacy-postgres/
            crates/crm-customer-privacy-production/
            crates/crm-application-runtime/tests/customer_privacy_application_runtime_lifecycle.rs
            crates/crm-application-runtime/tests/customer_privacy_owner_execution_postgres.rs
            crates/crm-application-runtime/tests/customer_privacy_owner_execution_ready_postgres.rs
            crates/crm-application-runtime/tests/party_tombstone_rebuild_convergence_postgres.rs
            services/crm-api/tests/customer_360_privacy_no_orphan_process_e2e.rs
            database/customer-privacy-owner-execution-*.log
            database/customer-privacy-owner-ready-work-*.log
            database/customer-privacy-runtime-lifecycle-*.log
            database/customer-privacy-party-rebuild-*.log
            database/customer-privacy-no-orphan-process-*.log
          if-no-files-found: warn
          retention-days: 7
