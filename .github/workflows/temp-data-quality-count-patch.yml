name: Temporary Data Quality Count Patch

on:
  push:
    branches:
      - feature/data-quality-privacy-scope
    paths:
      - ".github/workflows/temp-data-quality-count-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/data-quality-privacy-scope
          fetch-depth: 0
      - name: Replace dynamic SQL helper and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("crates/crm-data-quality-privacy-scope-adapter/tests/postgres_scope.rs")
          text = source.read_text(encoding="utf-8")
          old = '''async fn count(pool: &PgPool, table: &str) -> i64 {
              sqlx::query_scalar::<_, i64>(&format!("SELECT count(*)::bigint FROM {table}"))
                  .fetch_one(pool)
                  .await
                  .unwrap()
          }
          '''
          new = '''async fn count(pool: &PgPool, table: &str) -> i64 {
              match table {
                  "crm.records" => sqlx::query_scalar("SELECT count(*)::bigint FROM crm.records"),
                  "crm.relationships" => {
                      sqlx::query_scalar("SELECT count(*)::bigint FROM crm.relationships")
                  }
                  "crm.business_transactions" => {
                      sqlx::query_scalar("SELECT count(*)::bigint FROM crm.business_transactions")
                  }
                  "crm.idempotency_records" => {
                      sqlx::query_scalar("SELECT count(*)::bigint FROM crm.idempotency_records")
                  }
                  "crm.outbox_events" => {
                      sqlx::query_scalar("SELECT count(*)::bigint FROM crm.outbox_events")
                  }
                  "crm.outbox_delivery" => {
                      sqlx::query_scalar("SELECT count(*)::bigint FROM crm.outbox_delivery")
                  }
                  "crm.audit_heads" => {
                      sqlx::query_scalar("SELECT count(*)::bigint FROM crm.audit_heads")
                  }
                  "crm.audit_records" => {
                      sqlx::query_scalar("SELECT count(*)::bigint FROM crm.audit_records")
                  }
                  _ => panic!("unsupported write-surface table"),
              }
              .fetch_one(pool)
              .await
              .unwrap()
          }
          '''
          if old not in text:
              raise SystemExit("expected dynamic SQL helper was not found")
          source.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/temp-data-quality-count-patch.yml").unlink()
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(privacy): use literal SQL for Data Quality write counts"
          git push origin HEAD:feature/data-quality-privacy-scope
