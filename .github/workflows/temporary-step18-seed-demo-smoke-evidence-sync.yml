name: Temporary Step 18 Seed Demo Smoke Evidence Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-step18-seed-demo-smoke-evidence-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install committed validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Synchronize accepted closure evidence fail closed
        run: python scripts/temporary_step18_seed_demo_smoke_evidence_sync.py
      - name: Verify focused permanent guards
        run: |
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation
          python scripts/generate_repository_navigation.py --check
          git diff --check
      - name: Commit only declared evidence files
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add \
            docs/ACTIVE_PACKET.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/MODULE_CATALOG.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/PROJECT_STATUS.md \
            docs/WORKSPACE_COMPLEXITY_BASELINE.md \
            repository-packet.json \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          if git diff --cached --quiet; then
            echo 'Step 18 closure evidence is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize accepted Repository Step 18 closure evidence'
          git push origin "HEAD:${HEAD_REF}"
