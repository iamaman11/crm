name: One-time privacy owner scope support validator

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'architecture/privacy-owner-scope-shared-support'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_privacy_owner_scope_support_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_privacy_owner_scope_support_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5439
      PGDATABASE: crm_privacy_owner_scope_support_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5439/crm_privacy_owner_scope_support_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5439/crm_privacy_owner_scope_support_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: architecture/privacy-owner-scope-shared-support
          fetch-depth: 0
      - name: Synchronize normative privacy plans
        run: python scripts/one_time_sync_privacy_owner_scope_docs.py
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: clippy, rustfmt
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Normalize source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git diff --check -- Cargo.toml Cargo.lock \
            crates/crm-customer-privacy-owner-scope-support \
            crates/crm-parties-privacy-scope-adapter \
            crates/crm-consents-privacy-scope-adapter
      - name: Enforce architecture boundary
        run: python scripts/check_architecture.py
      - name: Prepare authoritative PostgreSQL fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0024_parties_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0025_consents_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify shared support and both owners
        shell: bash
        run: |
          set -o pipefail
          cargo test -p crm-customer-privacy-owner-scope-support --all-features -- --nocapture \
            2>&1 | tee database/privacy-owner-scope-support.log
          cargo test -p crm-parties-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee -a database/privacy-owner-scope-support.log
          cargo test -p crm-consents-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee -a database/privacy-owner-scope-support.log
      - name: Verify workspace dependency graph
        run: cargo check --workspace --all-features
      - name: Publish normalized validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock \
            crates/crm-customer-privacy-owner-scope-support \
            crates/crm-parties-privacy-scope-adapter \
            crates/crm-consents-privacy-scope-adapter \
            docs/PROJECT_STATUS.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/MODULE_CATALOG.md \
            docs/DELIVERY_GOVERNANCE.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md
          if git diff --cached --quiet; then
            echo "Validated source was already canonical."
            exit 0
          fi
          git commit -m "Synchronize shared privacy scope packet"
          git push origin HEAD:architecture/privacy-owner-scope-shared-support
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-owner-scope-support-validator-diagnostics
          path: database/privacy-owner-scope-support.log
          if-no-files-found: warn
          retention-days: 7
