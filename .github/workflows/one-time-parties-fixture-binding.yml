name: One-time Parties fixture binding

on:
  push:
    branches:
      - agent/phase8a11-parties-privacy-scope
    paths:
      - ".github/workflows/one-time-parties-fixture-binding.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Bind the focused PostgreSQL test to its minimal fixture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet .
          git remote add origin "${auth_remote}"
          git fetch --quiet --no-tags --depth=1 origin agent/phase8a11-parties-privacy-scope
          git checkout --quiet -B agent/phase8a11-parties-privacy-scope FETCH_HEAD
          python - <<'PY'
          from pathlib import Path

          test_path = Path("crates/crm-parties-privacy-scope-adapter/tests/postgres_scope.rs")
          test = test_path.read_text(encoding="utf-8")
          old_actor = 'actor_id: ActorId::try_new("party-fixture").unwrap(),'
          if old_actor not in test:
              raise SystemExit("Party fixture actor anchor not found")
          test_path.write_text(
              test.replace(old_actor, 'actor_id: ActorId::try_new("actor-a").unwrap(),', 1),
              encoding="utf-8",
          )

          workflow_path = Path(".github/workflows/parties-privacy-scope.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          path_anchor = '      - "database/tests/0004_search_runtime_role_grants.sql"\n'
          fixture_path = '      - "database/tests/0024_parties_privacy_scope_fixture.sql"\n'
          if workflow.count(path_anchor) != 2:
              raise SystemExit("workflow path anchors are not exact")
          workflow = workflow.replace(path_anchor, path_anchor + fixture_path)
          fixture_anchor = (
              "          psql --set ON_ERROR_STOP=1 --file "
              "database/tests/0004_search_runtime_role_grants.sql\n"
          )
          fixture_command = (
              "          psql --set ON_ERROR_STOP=1 --file "
              "database/tests/0024_parties_privacy_scope_fixture.sql\n"
          )
          if workflow.count(fixture_anchor) != 2:
              raise SystemExit("workflow fixture anchors are not exact")
          workflow_path.write_text(
              workflow.replace(fixture_anchor, fixture_anchor + fixture_command),
              encoding="utf-8",
          )
          PY
          git rm .github/workflows/one-time-parties-fixture-binding.yml
          git add .github/workflows/parties-privacy-scope.yml
          git add crates/crm-parties-privacy-scope-adapter/tests/postgres_scope.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bind Parties privacy scope acceptance fixture"
          git push origin HEAD:agent/phase8a11-parties-privacy-scope
