name: Temporary Step 18 Seed Demo Smoke Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-step18-seed-demo-smoke-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.12.0"
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Require explicit demo identity in generated guidance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/temporary_step18_seed_demo_smoke_integration.py")
          content = path.read_text(encoding="utf-8")
          old = "Demo state is created only through the governed Party mutation gateway"
          new = "The versioned `local-demo-acme` demo state is created only through the governed Party mutation gateway"
          if content.count(old) != 1:
              raise SystemExit(f"expected one contributor-guidance marker, found {content.count(old)}")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY
      - name: Apply declared integration fail closed
        run: python scripts/temporary_step18_seed_demo_smoke_integration.py
      - name: Verify focused permanent contracts
        run: |
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation \
            tests.test_local_demo \
            tests.test_local_dev \
            tests.test_local_lifecycle
          python scripts/generate_repository_navigation.py --check
          python scripts/repo.py seed-demo --dry-run --json
          python scripts/repo.py smoke --dry-run --json
          cargo fmt --all --check
          cargo test --locked -p crm-api --test local_demo_smoke_e2e --no-run
          cargo clippy --locked -p crm-api --test local_demo_smoke_e2e -- -D warnings
          git diff --check
      - name: Commit declared non-workflow integration files
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add \
            AGENTS.md \
            README.md \
            affected-scope-policy.json \
            docs/ACTIVE_PACKET.md \
            docs/DEVELOPMENT_WORKFLOW.md \
            repository-packet.json \
            scripts/repo.py \
            tests/test_architecture_documentation_consistency.py \
            tests/test_local_demo.py \
            tests/test_repository_navigation.py
          if git diff --cached --quiet; then
            echo 'Step 18 demo integration is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Step 18 seed-demo and smoke commands'
          git push origin "HEAD:${HEAD_REF}"
