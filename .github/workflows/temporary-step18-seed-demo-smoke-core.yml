name: Temporary Step 18 Seed Demo Smoke Core

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: temporary-step18-seed-demo-smoke-core-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-core:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.12.0"
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify unit contract
        run: python -m unittest tests.test_local_demo tests.test_local_dev tests.test_local_lifecycle
      - name: Verify formatting and compile real process target
        run: |
          cargo fmt --all --check
          cargo test --locked -p crm-api --test local_demo_smoke_e2e --no-run
          cargo clippy --locked -p crm-api --test local_demo_smoke_e2e -- -D warnings
      - name: Verify clean seed replay and smoke
        env:
          CRM_LOCAL_NAMESPACE: demo-core-${{ github.run_id }}
          CRM_LOCAL_POSTGRES_PORT: "55433"
        run: |
          python - <<'PY'
          from scripts.local_dev import dev_reset
          from scripts.local_demo import seed_demo, smoke

          reset = dev_reset()
          assert reset["action"] == "reset"
          first = seed_demo()
          second = seed_demo()
          verified = smoke()
          assert first["mode"] == second["mode"] == "seed"
          assert verified["mode"] == "smoke"
          PY
