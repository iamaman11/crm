name: One-Time Contact Points Privacy Builder

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/one_time_build_contact_points_privacy.py"
      - ".github/workflows/one-time-contact-points-privacy-builder.yml"
      - "crates/crm-contact-points-privacy-scope-adapter/**"
      - "database/tests/0027_contact_points_privacy_scope_fixture.sql"
      - ".github/workflows/contact-points-privacy-scope.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "architecture-policy.json"

permissions:
  contents: write

concurrency:
  group: one-time-contact-points-privacy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_contact_points_privacy_scope_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_contact_points_privacy_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5440
      PGDATABASE: crm_contact_points_privacy_scope_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5440/crm_contact_points_privacy_scope_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5440/crm_contact_points_privacy_scope_test
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: feature/contact-points-privacy-scope-adapter
          fetch-depth: 0
      - name: Prepare toolchain and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Generate bounded Contact Points privacy packet
        run: python scripts/one_time_build_contact_points_privacy.py
      - name: Normalize source and dependency lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          support = Path("crates/crm-contact-points-privacy-scope-adapter/tests/postgres_scope/support.rs")
          text = support.read_text()
          text = text.replace(", core::v1 as core", "")
          for signature in (
              "pub(crate) async fn create_contact_point(",
              "pub(crate) async fn update_contact_point_status(",
          ):
              marker = "#[allow(clippy::too_many_arguments)]\n" + signature
              if marker not in text:
                  text = text.replace(signature, marker, 1)
          text = text.replace("account_id", "contact_point_id")
          text = text.replace("request-corrupt-account", "request-corrupt-contact-point")
          text = text.replace(
              'format!("account-{contact_point_id}-tx")',
              'format!("contact-point-{contact_point_id}-tx")',
          )
          text = text.replace(
              "crm.customer-accounts.account.state.invalid",
              "crm.contact-points.contact-point.state.invalid",
          )
          support.write_text(text)

          acceptance = Path("crates/crm-contact-points-privacy-scope-adapter/tests/postgres_scope.rs")
          text = acceptance.read_text().replace(
              '"scope-member@example.net"',
              '"chat:scope-member@example.net"',
          )
          acceptance.write_text(text)
          PY
          cargo fmt --all
          cargo generate-lockfile
      - name: Publish staging implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/contact-points-privacy-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Stage Contact Points privacy scope adapter"
            git push origin HEAD:feature/contact-points-privacy-scope-adapter
          fi
      - name: Enforce architecture boundary
        run: python scripts/check_architecture.py
      - name: Verify source formatting
        run: cargo fmt --all -- --check
      - name: Run focused Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p crm-contact-points-privacy-scope-adapter --all-targets --all-features -- -D warnings \
            2>&1 | tee database/contact-points-privacy-scope-clippy.log
      - name: Run focused unit tests
        run: >-
          cargo test
          -p crm-contact-points-privacy-scope-adapter
          --all-features
          --lib
      - name: Apply clean migrations and owner fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0024_parties_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0027_contact_points_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify clean Contact Points PostgreSQL acceptance
        shell: bash
        run: |
          set -o pipefail
          cargo test -p crm-contact-points-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee database/contact-points-privacy-scope-clean.log
      - name: Roll back authoritative schema and prove removal
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.down.sql' | sort -r)
          count="$(psql --tuples-only --no-align --command "SELECT count(*) FROM pg_namespace WHERE nspname = 'crm'")"
          test "${count}" = "0"
      - name: Reapply migrations and owner fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0024_parties_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0027_contact_points_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify reapplied Contact Points PostgreSQL acceptance
        shell: bash
        run: |
          set -o pipefail
          cargo test -p crm-contact-points-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee database/contact-points-privacy-scope-reapplied.log
      - name: Verify workspace dependency graph
        run: cargo check --workspace --all-features
      - name: Remove staging builder and publish validated packet
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/one_time_build_contact_points_privacy.py
          rm .github/workflows/one-time-contact-points-privacy-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Contact Points privacy scope staging"
          git push origin HEAD:feature/contact-points-privacy-scope-adapter
      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          git status --short > database/contact-points-privacy-scope-git-status.log
          git diff > database/contact-points-privacy-scope-working.diff
          postgres_container="$(docker ps -aq --filter ancestor=postgres:17-alpine | head -n 1)"
          if [ -n "${postgres_container}" ]; then
            docker logs "${postgres_container}" > database/contact-points-privacy-scope-postgres.log 2>&1
          fi
          find crates/crm-contact-points-privacy-scope-adapter -maxdepth 4 -type f -print \
            > database/contact-points-privacy-scope-files.log 2>&1
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contact-points-privacy-scope-staging-diagnostics
          path: |
            database/contact-points-privacy-scope-*.log
            database/contact-points-privacy-scope-*.diff
          if-no-files-found: warn
          retention-days: 7
