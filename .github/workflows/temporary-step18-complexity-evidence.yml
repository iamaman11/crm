name: Temporary Step 18 Complexity Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-18-doctor-bootstrap-evidence-sync' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install navigation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Add exact complexity non-effect evidence
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          SOURCE = "76a0d93d594b6ffbb890f90d3cb9037febf4c3f8"
          MERGE = "87bc0d33befc4525b62aa7e0e1884abc07e12abf"
          BASELINE_PATH = "docs/WORKSPACE_COMPLEXITY_BASELINE.md"

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file_path.write_text(content.replace(old, new), encoding="utf-8")

          marker = (
              "> Stage B measurement baseline. Dependency/version/feature/fan-out/public-surface observations are reports and warnings, not calibrated blocking budgets. Invalid or expired architecture exceptions, missing exception ownership/documentation, broken core workspace invariants, unjustified newly added workspace members and violations of explicit calibrated workspace dependency policies are blocking.\n\n"
          )
          section = (
              marker
              + "## Accepted Repository Step 18 doctor/bootstrap complexity non-effect\n\n"
              + "PR #281 / accepted source `"
              + SOURCE
              + "` / squash merge `"
              + MERGE
              + "` / 7 of 7 applicable permanent workflows added deterministic repository-pinned `doctor` and locked isolated `bootstrap`. "
              + "The accepted slice changed no workspace package, dependency declaration, feature set, internal edge, public Rust surface, Cargo manifest or `Cargo.lock`; this file remains a historical Stage B measurement baseline rather than a replacement for current generated complexity artifacts.\n\n"
          )
          replace_once(BASELINE_PATH, marker, section)

          packet_path = Path("repository-packet.json")
          packet = json.loads(packet_path.read_text(encoding="utf-8"))
          allowed = packet["allowed_paths"]
          if BASELINE_PATH in allowed:
              raise SystemExit("complexity baseline path already declared")
          allowed.insert(6, BASELINE_PATH)
          packet["deliverables"].append(
              "record the accepted doctor/bootstrap zero-impact result in the historical workspace complexity baseline"
          )
          packet["acceptance"].insert(
              5,
              "Complexity Baseline CI is applicable and succeeds on the same final exact head through the declared complexity-baseline evidence path",
          )
          packet_path.write_text(json.dumps(packet, indent=2) + "\n", encoding="utf-8")

          consistency = "tests/test_architecture_documentation_consistency.py"
          replace_once(
              consistency,
              '        cls.plan = read("docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md")\n',
              '        cls.plan = read("docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md")\n'
              '        cls.complexity = read("docs/WORKSPACE_COMPLEXITY_BASELINE.md")\n',
          )
          for path in (consistency, "tests/test_repository_navigation.py"):
              replace_once(
                  path,
                  '                "docs/PROJECT_STATUS.md",\n                "repository-packet.json",',
                  '                "docs/PROJECT_STATUS.md",\n'
                  '                "docs/WORKSPACE_COMPLEXITY_BASELINE.md",\n'
                  '                "repository-packet.json",',
              )
          replace_once(
              consistency,
              '        self.assertIn(self.packet["packet_id"], self.active_packet)\n',
              '        for marker in (\n'
              '            "PR #281",\n'
              '            "76a0d93d594b6ffbb890f90d3cb9037febf4c3f8",\n'
              '            "87bc0d33befc4525b62aa7e0e1884abc07e12abf",\n'
              '            "7 of 7",\n'
              '            "changed no workspace package",\n'
              '        ):\n'
              '            self.assertIn(marker, self.complexity)\n'
              '        self.assertIn(self.packet["packet_id"], self.active_packet)\n',
          )
          PY
          python scripts/generate_repository_navigation.py --write
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation
      - name: Commit complexity evidence
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/ACTIVE_PACKET.md \
            docs/WORKSPACE_COMPLEXITY_BASELINE.md \
            repository-packet.json \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          if git diff --cached --quiet; then
            echo "No complexity evidence changes produced"
            exit 1
          fi
          git commit -m "Record Step 18 complexity baseline non-effect"
          git push origin "HEAD:${HEAD_BRANCH}"
