name: Temporary Customer Enrichment Governance Sync

on:
  push:
    branches:
      - docs/customer-enrichment-privacy-accepted
    paths:
      - ".github/workflows/temp-enrichment-governance-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/customer-enrichment-privacy-accepted
          fetch-depth: 0
      - name: Synchronize nine-owner authoritative state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          SOURCE = "e90e36027de18a07be68e43327ea732810ff332a"
          MERGE = "e41cbab0cd30819fcbe2e3c5f2c7415fc6de3e8c"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new)

          # PROJECT_STATUS
          path = "docs/PROJECT_STATUS.md"
          text = read(path)
          text = replace_once(text,
