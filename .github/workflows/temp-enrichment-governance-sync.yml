          text = replace_once(text,
              "8. Data Quality — PR #190 / source `dcfe8faebc7462b888f8fc1721cb379a40fea88a` / merge `deac197c97cddc15bb9916092ca87f6e767ce1de` / 27 of 27 permanent workflows.",
              "8. Data Quality — PR #190 / source `dcfe8faebc7462b888f8fc1721cb379a40fea88a` / merge `deac197c97cddc15bb9916092ca87f6e767ce1de` / 27 of 27 permanent workflows.\n9. Customer Enrichment — PR #192 / source `" + SOURCE + "` / merge `" + MERGE + "` / 28 of 28 permanent workflows.",
              "phase owner entry")
