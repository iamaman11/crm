name: One-Time Party Relationships Privacy Patcher

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-party-relationships-privacy-patcher.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
      - name: Apply exact owner patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          postgres = Path('crates/crm-party-relationships-privacy-scope-adapter/src/postgres.rs')
          text = postgres.read_text()
          pattern = re.compile(r"    if party_relationship\.party_ref\(\)\.as_str\(\) != canonical_party_id\.as_str\(\) \{\n        return Ok\(None\);\n    \}\n")
          replacement = """    let matches_canonical_party = party_relationship.from_party_ref().as_str()
              == canonical_party_id.as_str()
              || party_relationship.to_party_ref().as_str() == canonical_party_id.as_str();
          if !matches_canonical_party {
              return Ok(None);
          }
          """
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one single-endpoint matcher, found {count}')
          postgres.write_text(text)

          lib = Path('crates/crm-party-relationships-privacy-scope-adapter/src/lib.rs')
          text = lib.read_text()
          start = text.index('//! The adapter enumerates Party Relationship records')
          end = text.index('\n\nmod contract;', start)
          description = """//! The adapter enumerates authoritative Party Relationship records when either
          //! rehydrated `from_party_ref` or `to_party_ref` matches one canonical Party inside
          //! a tenant-bound repeatable read-only PostgreSQL snapshot. It reuses only the
          //! proven common owner-scope protocol support; two-endpoint matching, relationship
          //! semantics, scans, pagination, classification, retention and errors remain
          //! owner-specific."""
          lib.write_text(text[:start] + description + text[end:])

          tests = Path('crates/crm-party-relationships-privacy-scope-adapter/src/tests.rs')
          text = tests.read_text()
          for old, new in [
              ('request-account-scope', 'request-party-relationship-scope'),
              ('correlation-account-scope', 'correlation-party-relationship-scope'),
              ('trace-account-scope', 'trace-party-relationship-scope'),
              ('privacy-case-accounts', 'privacy-case-party-relationships'),
          ]:
              text = text.replace(old, new)
          tests.write_text(text)
          PY
          cat > database/tests/0028_party_relationships_privacy_scope_fixture.sql <<'SQL'
          \set ON_ERROR_STOP on

          -- Minimal durable registry fixture required only to create and update
          -- authoritative Party Relationship records for the non-runtime owner privacy-scope
          -- PostgreSQL acceptance suite. Party creation remains supplied by fixture 0024.
          INSERT INTO crm.module_versions (
            module_id, version, canonicalization_profile, manifest_sha256,
            normalized_manifest_json, published_at, publisher_id
          )
          VALUES (
            'crm.party-relationships', '0.2.0', 'crm.cjson/v1',
            decode(repeat('a1', 32), 'hex'),
            '{"module_id":"crm.party-relationships","version":"0.2.0"}'::jsonb,
            clock_timestamp(), 'customer-platform'
          )
          ON CONFLICT (module_id, version) DO NOTHING;

          INSERT INTO crm.capability_registry (
            capability_id, capability_version, owner_module_id, owner_module_version,
            service_name, method_name, input_descriptor_hash, output_descriptor_hash,
            risk_level, idempotency_required, audit_required, approval_required,
            ai_callable, marketplace_callable, bulk_allowed, export_allowed,
            data_classes_touched
          )
          VALUES
            (
              'party-relationships.party-relationship.create', '1.0.0',
              'crm.party-relationships', '0.2.0',
              'crm.party_relationships.v1.PartyRelationshipService',
              'CreatePartyRelationship', decode(repeat('a2', 32), 'hex'),
              decode(repeat('a3', 32), 'hex'), 'medium', true, true, false,
              false, false, false, false, ARRAY['personal']::text[]
            ),
            (
              'party-relationships.party-relationship.update', '1.0.0',
              'crm.party-relationships', '0.2.0',
              'crm.party_relationships.v1.PartyRelationshipService',
              'UpdatePartyRelationship', decode(repeat('a4', 32), 'hex'),
              decode(repeat('a5', 32), 'hex'), 'medium', true, true, false,
              false, false, false, false, ARRAY['personal']::text[]
            )
          ON CONFLICT (capability_id, capability_version) DO UPDATE
          SET owner_module_id = EXCLUDED.owner_module_id,
              owner_module_version = EXCLUDED.owner_module_version,
              service_name = EXCLUDED.service_name,
              method_name = EXCLUDED.method_name,
              input_descriptor_hash = EXCLUDED.input_descriptor_hash,
              output_descriptor_hash = EXCLUDED.output_descriptor_hash,
              risk_level = EXCLUDED.risk_level,
              idempotency_required = EXCLUDED.idempotency_required,
              audit_required = EXCLUDED.audit_required,
              approval_required = EXCLUDED.approval_required,
              ai_callable = EXCLUDED.ai_callable,
              marketplace_callable = EXCLUDED.marketplace_callable,
              bulk_allowed = EXCLUDED.bulk_allowed,
              export_allowed = EXCLUDED.export_allowed,
              data_classes_touched = EXCLUDED.data_classes_touched;
          SQL
      - name: Canonicalize and publish owner patch
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all
          cargo generate-lockfile
          rm -f .github/workflows/one-time-party-relationships-privacy-validator.yml
          rm -f .github/workflows/one-time-party-relationships-privacy-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce party relationships two-endpoint privacy semantics"
          git push origin "HEAD:${HEAD_REF}"
