name: Temporary Step 18 Evidence Sync PR Trigger

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-18-doctor-bootstrap-evidence-sync' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install navigation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Reuse fail-closed synchronization script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temporary-step18-evidence-sync.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'temporary-step18-evidence-sync', 'exec'))

          def indent_method_body(path: str, start_marker: str, end_marker: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding='utf-8')
              method_start = content.index(start_marker)
              method_end = content.index(end_marker, method_start)
              block = content[method_start:method_end]
              lines = block.splitlines(keepends=True)
              fixed = lines[0] + ''.join(
                  ('    ' + line) if line.strip() else line
                  for line in lines[1:]
              )
              file_path.write_text(
                  content[:method_start] + fixed + content[method_end:],
                  encoding='utf-8',
              )

          indent_method_body(
              'tests/test_architecture_documentation_consistency.py',
              '    def test_active_step_18_doctor_bootstrap_evidence_sync_packet_is_exact',
              '    def test_repository_map_and_product_inventory_remain_exact',
          )
          indent_method_body(
              'tests/test_repository_navigation.py',
              '    def test_active_packet_declaration_is_exact',
              '    def test_generated_navigation_is_deterministic_and_current',
          )
          PY
          python scripts/generate_repository_navigation.py --write
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation
      - name: Commit synchronized evidence
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/ACTIVE_PACKET.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/MODULE_CATALOG.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/PROJECT_STATUS.md \
            repository-packet.json \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          if git diff --cached --quiet; then
            echo "No evidence changes produced"
            exit 1
          fi
          git commit -m "Synchronize accepted Step 18 doctor bootstrap evidence"
          git push origin "HEAD:${HEAD_BRANCH}"
