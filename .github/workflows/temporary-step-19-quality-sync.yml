name: Temporary Step 19 Quality Sync

on:
  push:
    branches: [repository-step-19-evidence-sync]
    paths: [.github/workflows/temporary-step-19-quality-sync.yml]

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: repository-step-19-evidence-sync
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruamel.yaml
      - name: Reconcile current and historical worker wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/PHASE8_DELIVERY_PLAN.md")
          text = path.read_text(encoding="utf-8")
          old = "Step 16 proves denial without side effects, retryable progress preservation, exact restart recovery, completed replay, tenant isolation and contention convergence without a generic lease API or production-algorithm change. Customer Privacy still has **1 Customer Privacy owner worker** (`crm.customer-privacy` / `owner-execution`, phase `260`); its real worker lifecycle remains Step 19."
          new = "Step 16 proves denial without side effects, retryable progress preservation, exact restart recovery, completed replay, tenant isolation and contention convergence without a generic lease API or production-algorithm change. At the Step 16 boundary Customer Privacy still had no production worker; Repository Step 19 subsequently accepted `crm.customer-privacy` / `owner-execution` at phase `260` and its complete assembled lifecycle."
          if old not in text:
              raise SystemExit("expected stale Step 16/19 wording was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m unittest tests.test_architecture_documentation_consistency tests.test_repository_navigation
          python scripts/check_architecture.py
          rm .github/workflows/temporary-step-19-quality-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: distinguish Step 16 history from accepted Step 19 lifecycle"
          git push origin HEAD:repository-step-19-evidence-sync
