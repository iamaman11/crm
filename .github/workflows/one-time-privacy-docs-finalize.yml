name: One-time privacy documentation finalizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'architecture/privacy-owner-scope-shared-support'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: architecture/privacy-owner-scope-shared-support
          fetch-depth: 0
      - name: Apply missing normative synchronization idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-time-privacy-owner-scope-support-validator.yml')
          source = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = textwrap.dedent(source[start:end])

          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"expected one synchronization anchor in {path}, found {count}: {old[:100]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          new = '''    if new in text:\n        return\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"expected one synchronization anchor in {path}, found {count}: {old[:100]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          if code.count(old) != 1:
              raise SystemExit('unable to identify replace_once implementation in validator')
          code = code.replace(old, new, 1)
          exec(compile(code, str(workflow), 'exec'), {'__name__': '__main__'})
          PY
          git diff --check -- \
            docs/PROJECT_STATUS.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/MODULE_CATALOG.md \
            docs/DELIVERY_GOVERNANCE.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md
      - name: Publish synchronized documents and remove staging workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/PROJECT_STATUS.md \
            docs/IMPLEMENTATION_ROADMAP.md \
            docs/PHASE8_DELIVERY_PLAN.md \
            docs/MODULE_CATALOG.md \
            docs/DELIVERY_GOVERNANCE.md \
            docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md
          git rm \
            .github/workflows/one-time-privacy-owner-scope-support-validator.yml \
            .github/workflows/one-time-privacy-docs-finalize.yml
          git commit -m "Synchronize shared privacy scope packet"
          git push origin HEAD:architecture/privacy-owner-scope-shared-support
