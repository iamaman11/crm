name: Temporary repository navigation regeneration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.18'
      - name: Install repository Python requirements
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Regenerate repository navigation
        run: python scripts/generate_repository_navigation.py
      - name: Commit generated documents
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ACTIVE_PACKET.md docs/generated/REPOSITORY_MAP.md
          if git diff --cached --quiet; then
            echo "Generated navigation is already current."
            exit 0
          fi
          git commit -m "docs: regenerate repository navigation"
          git push origin HEAD:dev
