name: Universal Browser MCP CI
# Independent app on the mcp branch; NEVER deploys the Rust CRM or runs D1 migrations.
on:
  push:
    branches:
      - mcp
  pull_request:
    branches:
      - mcp
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  browser-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Verify MCP branch and workflow isolation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_ci_event_policy.py
          python -m unittest tests.test_ci_event_policy
          python scripts/check_action_pinning.py
          echo "Standalone Browser MCP CI; no CRM Rust deployment in this workflow."
      - name: Detect MCP sources
        id: sources
        shell: bash
        run: |
          if test -f services/crm-browser-mcp/package.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Base mcp branch established; candidate source not merged yet."
          fi
      - name: Resolve reviewable lockfile artifact (pre-merge only)
        if: steps.sources.outputs.present == 'true'
        working-directory: services/crm-browser-mcp
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
      - name: Preserve generated lockfile for canonical commit
        if: steps.sources.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-mcp-dependency-lock-${{ github.sha }}
          path: services/crm-browser-mcp/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Require immutable checked-in dependency lock
        if: steps.sources.outputs.present == 'true'
        working-directory: services/crm-browser-mcp
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          git -C ../.. ls-files --error-unmatch services/crm-browser-mcp/package-lock.json
          git diff --exit-code -- package-lock.json
      - name: Install exact Browser MCP dependencies
        if: steps.sources.outputs.present == 'true'
        working-directory: services/crm-browser-mcp
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and security tests
        if: steps.sources.outputs.present == 'true'
        working-directory: services/crm-browser-mcp
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
      - name: Build independent Browser MCP Worker without publishing
        if: steps.sources.outputs.present == 'true'
        working-directory: services/crm-browser-mcp
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir /tmp/crm-browser-mcp-build
          test -n "$(find /tmp/crm-browser-mcp-build -type f -print -quit)"
          echo "Browser MCP artifact built. No CRM build/deploy or D1 mutation performed."
