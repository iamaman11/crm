name: Universal Browser MCP CI
# Dedicated mcp-only application. Never builds/deploys CRM Rust, React, or D1.
on:
  push:
    branches:
      - mcp
  pull_request:
    branches:
      - mcp
  workflow_dispatch:
    inputs:
      release_browser_mcp:
        description: 'Publish only the protected mcp HEAD to crm-browser-mcp'
        type: boolean
        required: true
        default: false
      expected_sha:
        description: 'Exact approved 40-character mcp HEAD SHA'
        type: string
        required: true
      restart_do_immediately:
        description: 'Explicitly restart active Browser MCP Durable Objects during protected manual deployment'
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: services/crm-browser-mcp/package-lock.json

      - name: Enforce isolated MCP source changes in PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
          test "$base_sha" != "null"
          git fetch --no-tags --depth=1 origin "$base_sha"
          while IFS= read -r changed; do
            case "$changed" in
              services/crm-browser-mcp/*|.github/workflows/browser-mcp.yml) ;;
              *) echo "::error::Browser MCP PR changes forbidden CRM/shared path: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only "$base_sha" HEAD)
          echo "MCP PR changes limited to the independent Browser MCP app and workflow."

      - name: Check MCP branch policy and pinned GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_ci_event_policy.py
          python -m unittest tests.test_ci_event_policy
          python scripts/check_action_pinning.py

      - name: Install exact pinned MCP dependencies
        working-directory: services/crm-browser-mcp
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript and browser security tests
        working-directory: services/crm-browser-mcp
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          git diff --exit-code -- package-lock.json

      - name: Build ONLY the Browser MCP Worker (no deployment)
        working-directory: services/crm-browser-mcp
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc --dry-run --outdir /tmp/crm-browser-mcp-build
          test -n "$(find /tmp/crm-browser-mcp-build -type f -print -quit)"
          echo "Independent Browser MCP bundle verified; CRM and D1 untouched."

      - name: Physical workerd restart with persisted Browser MCP Durable Object
        working-directory: services/crm-browser-mcp
        env:
          MCP_TEST_BUNDLE_DIR: /tmp/crm-browser-mcp-build
        run: npm run test:do-lifecycle

  # One protected release path: both push and explicit manual dispatch require
  # the same repository flag and browser-mcp Environment / one-Worker token.
  # CRM service identity / existing-owner tenant delegation remains disabled.
  deploy-browser-mcp:
    if: >-
      github.ref == 'refs/heads/mcp' &&
      vars.BROWSER_MCP_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_browser_mcp == true))
    needs: browser-mcp
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: browser-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify exact reviewed mcp commit for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Approved mcp SHA matches checked-out commit."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: services/crm-browser-mcp/package-lock.json
      - name: Check isolated Cloudflare release credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if test -z "$CLOUDFLARE_API_TOKEN"; then
            echo "::error::browser-mcp Environment has no CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - name: Install pinned MCP release dependencies
        working-directory: services/crm-browser-mcp
        run: npm ci --no-audit --no-fund
      - name: Deploy ONLY crm-browser-mcp (never CRM or D1)
        working-directory: services/crm-browser-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DO_UPDATE_IMMEDIATE: ${{ inputs.restart_do_immediately || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          # One deploy command, unchanged default. Immediate DO reset is an
          # explicit per-release owner choice, never an automatic PR/push action.
          args=()
          if [[ "$DO_UPDATE_IMMEDIATE" == "true" ]]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            args+=(--durable-objects-code-update-mode immediate)
            echo "Explicit immediate DO code update requested for protected release."
          fi
          npx wrangler deploy --config wrangler.jsonc --name crm-browser-mcp "${args[@]}"
