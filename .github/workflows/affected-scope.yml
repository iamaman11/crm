name: Affected Scope CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  affected-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: clippy, rustfmt
      - name: Install analysis dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Test affected-scope analyzer
        run: python -m unittest -v tests.test_affected_scope
      - name: Explain affected scope
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/repo.py affected --base "${BASE_REF}"
      - name: Run affected structural and package checks
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/repo.py check-affected --base "${BASE_REF}"
