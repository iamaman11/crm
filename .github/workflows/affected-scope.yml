name: Affected Scope CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  affected-scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Buf
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.50.1
          setup_only: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: clippy, rustfmt
      - name: Install analysis dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Test affected-scope policy and analyzer
        run: python -m unittest -v tests.test_affected_scope
      - name: Explain and enforce affected scope
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -o pipefail
          python scripts/repo.py affected --base "${BASE_REF}" --json 2>&1 | tee affected-scope.json
      - name: Upload deterministic affected-scope report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affected-scope-report
          path: affected-scope.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate active repository packet
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/repo.py packet-check --base "${BASE_REF}"
      - name: Run affected structural preflight
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/repo.py check-affected --base "${BASE_REF}" --phase structural
      - name: Run affected Clippy closure
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/repo.py check-affected --base "${BASE_REF}" --phase clippy
      - name: Run affected test closure
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/repo.py check-affected --base "${BASE_REF}" --phase test
