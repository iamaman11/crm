name: One-time privacy golden rustfmt

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'architecture/privacy-owner-scope-shared-support'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: architecture/privacy-owner-scope-shared-support
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-25
        with:
          components: rustfmt
      - name: Canonicalize digest compatibility test
        run: cargo fmt --all
      - name: Publish canonical source and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/crm-customer-privacy-owner-scope-support/tests/digest_compatibility.rs
          git rm .github/workflows/one-time-privacy-golden-rustfmt.yml
          git commit -m "Canonicalize privacy scope digest compatibility test"
          git push origin HEAD:architecture/privacy-owner-scope-shared-support
