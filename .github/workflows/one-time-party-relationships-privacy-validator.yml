name: One-Time Party Relationships Privacy Validator

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-party-relationships-privacy-validator.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_party_relationships_privacy_scope_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_party_relationships_privacy_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PGHOST: 127.0.0.1
      PGPORT: 5441
      PGDATABASE: crm_party_relationships_privacy_scope_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5441/crm_party_relationships_privacy_scope_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5441/crm_party_relationships_privacy_scope_test
    steps:
      - name: Check out exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
      - name: Apply exact two-endpoint owner semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          postgres = Path('crates/crm-party-relationships-privacy-scope-adapter/src/postgres.rs')
          text = postgres.read_text()
          old = '''    if party_relationship.party_ref().as_str() != canonical_party_id.as_str() {
              return Ok(None);
          }
          '''
          new = '''    let matches_canonical_party = party_relationship.from_party_ref().as_str()
              == canonical_party_id.as_str()
              || party_relationship.to_party_ref().as_str() == canonical_party_id.as_str();
          if !matches_canonical_party {
              return Ok(None);
          }
          '''
          if old not in text:
              raise SystemExit('single-endpoint Party Relationship matcher not found')
          postgres.write_text(text.replace(old, new, 1))

          lib = Path('crates/crm-party-relationships-privacy-scope-adapter/src/lib.rs')
          text = lib.read_text()
          old = '''//! The adapter enumerates Party Relationship records whose authoritative persisted
          //! Party reference matches one canonical Party inside a tenant-bound repeatable
          //! read-only PostgreSQL snapshot. It reuses only the proven common owner-scope
          //! protocol support; Party Relationship scans, Party matching, pagination,
          //! classification, retention and errors remain owner-specific.
          '''
          new = '''//! The adapter enumerates authoritative Party Relationship records when either
          //! rehydrated `from_party_ref` or `to_party_ref` matches one canonical Party inside
          //! a tenant-bound repeatable read-only PostgreSQL snapshot. It reuses only the
          //! proven common owner-scope protocol support; two-endpoint matching, relationship
          //! semantics, scans, pagination, classification, retention and errors remain
          //! owner-specific.
          '''
          if old not in text:
              raise SystemExit('Party Relationships crate description anchor not found')
          lib.write_text(text.replace(old, new, 1))

          tests = Path('crates/crm-party-relationships-privacy-scope-adapter/src/tests.rs')
          text = tests.read_text()
          text = text.replace('request-account-scope', 'request-party-relationship-scope')
          text = text.replace('correlation-account-scope', 'correlation-party-relationship-scope')
          text = text.replace('trace-account-scope', 'trace-party-relationship-scope')
          text = text.replace('privacy-case-accounts', 'privacy-case-party-relationships')
          tests.write_text(text)
          PY
          cat > database/tests/0028_party_relationships_privacy_scope_fixture.sql <<'SQL'
          \set ON_ERROR_STOP on

          -- Minimal durable registry fixture required only to create and update
          -- authoritative Party Relationship records for the non-runtime owner privacy-scope
          -- PostgreSQL acceptance suite. Party creation remains supplied by fixture 0024.
          INSERT INTO crm.module_versions (
            module_id,
            version,
            canonicalization_profile,
            manifest_sha256,
            normalized_manifest_json,
            published_at,
            publisher_id
          )
          VALUES (
            'crm.party-relationships',
            '0.2.0',
            'crm.cjson/v1',
            decode(repeat('a1', 32), 'hex'),
            '{"module_id":"crm.party-relationships","version":"0.2.0"}'::jsonb,
            clock_timestamp(),
            'customer-platform'
          )
          ON CONFLICT (module_id, version) DO NOTHING;

          INSERT INTO crm.capability_registry (
            capability_id,
            capability_version,
            owner_module_id,
            owner_module_version,
            service_name,
            method_name,
            input_descriptor_hash,
            output_descriptor_hash,
            risk_level,
            idempotency_required,
            audit_required,
            approval_required,
            ai_callable,
            marketplace_callable,
            bulk_allowed,
            export_allowed,
            data_classes_touched
          )
          VALUES
            (
              'party-relationships.party-relationship.create',
              '1.0.0',
              'crm.party-relationships',
              '0.2.0',
              'crm.party_relationships.v1.PartyRelationshipService',
              'CreatePartyRelationship',
              decode(repeat('a2', 32), 'hex'),
              decode(repeat('a3', 32), 'hex'),
              'medium',
              true,
              true,
              false,
              false,
              false,
              false,
              false,
              ARRAY['personal']::text[]
            ),
            (
              'party-relationships.party-relationship.update',
              '1.0.0',
              'crm.party-relationships',
              '0.2.0',
              'crm.party_relationships.v1.PartyRelationshipService',
              'UpdatePartyRelationship',
              decode(repeat('a4', 32), 'hex'),
              decode(repeat('a5', 32), 'hex'),
              'medium',
              true,
              true,
              false,
              false,
              false,
              false,
              false,
              ARRAY['personal']::text[]
            )
          ON CONFLICT (capability_id, capability_version) DO UPDATE
          SET owner_module_id = EXCLUDED.owner_module_id,
              owner_module_version = EXCLUDED.owner_module_version,
              service_name = EXCLUDED.service_name,
              method_name = EXCLUDED.method_name,
              input_descriptor_hash = EXCLUDED.input_descriptor_hash,
              output_descriptor_hash = EXCLUDED.output_descriptor_hash,
              risk_level = EXCLUDED.risk_level,
              idempotency_required = EXCLUDED.idempotency_required,
              audit_required = EXCLUDED.audit_required,
              approval_required = EXCLUDED.approval_required,
              ai_callable = EXCLUDED.ai_callable,
              marketplace_callable = EXCLUDED.marketplace_callable,
              bulk_allowed = EXCLUDED.bulk_allowed,
              export_allowed = EXCLUDED.export_allowed,
              data_classes_touched = EXCLUDED.data_classes_touched;
          SQL
      - name: Prepare Rust and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          cargo fmt --all
          cargo generate-lockfile
      - name: Enforce architecture boundary
        run: python scripts/check_architecture.py
      - name: Run focused Party Relationships privacy Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p crm-party-relationships-privacy-scope-adapter --all-targets --all-features -- -D warnings \
            2>&1 | tee database/party-relationships-privacy-scope-clippy.log
      - name: Run focused Party Relationships privacy unit tests
        run: cargo test -p crm-party-relationships-privacy-scope-adapter --all-features --lib
      - name: Apply clean migrations and owner fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0024_parties_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0028_party_relationships_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify clean Party Relationships privacy scope adapter
        shell: bash
        run: |
          set -o pipefail
          cargo test -p crm-party-relationships-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee database/party-relationships-privacy-scope-clean.log
      - name: Roll back authoritative schema
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.down.sql' | sort -r)
          count="$(psql --tuples-only --no-align --command "SELECT count(*) FROM pg_namespace WHERE nspname = 'crm'")"
          test "${count}" = "0"
      - name: Reapply migrations and owner fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0024_parties_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0028_party_relationships_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify reapplied Party Relationships privacy scope adapter
        shell: bash
        run: |
          set -o pipefail
          cargo test -p crm-party-relationships-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee database/party-relationships-privacy-scope-reapplied.log
      - name: Verify workspace dependency graph
        run: cargo check --workspace --all-features
      - name: Remove validator and publish accepted staging packet
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-party-relationships-privacy-validator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement party relationships privacy scope adapter"
          git push origin "HEAD:${HEAD_REF}"
      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          postgres_container="$(docker ps -aq --filter ancestor=postgres:17-alpine | head -n 1)"
          if [ -n "${postgres_container}" ]; then
            docker logs "${postgres_container}" > database/party-relationships-privacy-scope-postgres.log 2>&1
          fi
          git diff > database/party-relationships-privacy-scope-worktree.diff
      - name: Upload Party Relationships privacy scope diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: party-relationships-privacy-scope-diagnostics
          path: |
            database/party-relationships-privacy-scope-*.log
            database/party-relationships-privacy-scope-worktree.diff
          if-no-files-found: warn
          retention-days: 7
