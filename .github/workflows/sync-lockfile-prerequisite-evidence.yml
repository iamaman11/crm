name: Temporary Lockfile Prerequisite Evidence Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - ".github/workflows/sync-lockfile-prerequisite-evidence.yml"
      - "scripts/sync_lockfile_prerequisite_evidence.py"
      - "repository-packet.json"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Synchronize accepted prerequisite evidence
        run: python scripts/sync_lockfile_prerequisite_evidence.py
      - name: Commit synchronized evidence
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_COMPLEXITY_AND_SCALABILITY_PLAN.md docs/IMPLEMENTATION_ROADMAP.md docs/PHASE8_DELIVERY_PLAN.md docs/PROJECT_STATUS.md tests/test_architecture_documentation_consistency.py tests/test_repository_navigation.py
          git commit -m "Synchronize accepted lockfile prerequisite evidence"
          git push origin "HEAD:${HEAD_BRANCH}"
