name: Step 17 Representative DB Fixture Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-representative-db-fixture-finalizer.yml"

concurrency:
  group: step17-representative-db-fixture-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_event_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_event_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5434
      PGDATABASE: crm_event_runtime_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5434/crm_event_runtime_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5434/crm_event_runtime_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-representative-db-fixture-finalizer
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Install Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: 1.50.1
          setup_only: true
      - name: Install validation dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Reproduce exact 21-file candidate
        shell: bash
        run: |
          set -euo pipefail
          expected_main=861b1d5907c43f5e89dc10d5a7c81c1c98aa771b
          expected_head=d174cbbfc5bbe943fcb4a28fb46a8cf12d5914d3
          git fetch origin main step17-representative-lifecycle
          test "$(git rev-parse origin/main)" = "${expected_main}"
          test "$(git rev-parse origin/step17-representative-lifecycle)" = "${expected_head}"
          git reset --hard "${expected_head}"
          git clean -fdx
          python - <<'PY'
          from pathlib import Path
          import json

          fixture_path = Path("database/tests/0003_sales_activities_adapters.sql")
          fixture = fixture_path.read_text(encoding="utf-8")
          old_module = """(
            'crm.sales',
            '0.1.0',
            'crm.cjson/v1',
            decode(repeat('ad', 32), 'hex'),
            '{}'::jsonb,
            clock_timestamp(),
            'platform'
          );
          """
          new_module = """(
            'crm.activities',
            '0.1.1',
            'crm.cjson/v1',
            decode(repeat('ae', 32), 'hex'),
            '{}'::jsonb,
            clock_timestamp(),
            'platform'
          ),
          (
            'crm.sales',
            '0.1.0',
            'crm.cjson/v1',
            decode(repeat('ad', 32), 'hex'),
            '{}'::jsonb,
            clock_timestamp(),
            'platform'
          );
          """
          if fixture.count(old_module) != 1:
              raise SystemExit(f"expected one crm.sales module fixture tail, found {fixture.count(old_module)}")
          fixture = fixture.replace(old_module, new_module, 1)
          old_capability = """  (
              'activities.task.update', '1.0.0', 'crm.activities', '0.1.0',
          """
          new_capability = """  (
              'activities.task.create', '1.1.0', 'crm.activities', '0.1.1',
              'crm.activities.v1.TaskService', 'CreateTask',
              decode(repeat('31', 32), 'hex'), decode(repeat('32', 32), 'hex'),
              'low', true, true, false, false, false, false, false
            ),
            (
              'activities.task.update', '1.0.0', 'crm.activities', '0.1.0',
          """
          if fixture.count(old_capability) != 1:
              raise SystemExit(
                  f"expected one activities.task.update fixture boundary, found {fixture.count(old_capability)}"
              )
          fixture = fixture.replace(old_capability, new_capability, 1)
          fixture += """

          DO $$
          DECLARE
            published_count integer;
          BEGIN
            SELECT count(*)
            INTO published_count
            FROM crm.capability_registry
            WHERE capability_id = 'activities.task.create'
              AND (
                (capability_version = '1.0.0' AND owner_module_version = '0.1.0')
                OR
                (capability_version = '1.1.0' AND owner_module_version = '0.1.1')
              );

            IF published_count <> 2 THEN
              RAISE EXCEPTION
                'expected immutable activities.task.create publications at 1.0.0 and 1.1.0, found %',
                published_count;
            END IF;
          END
          $$;
          """
          fixture_path.write_text(fixture, encoding="utf-8")

          packet_path = Path("repository-packet.json")
          packet = json.loads(packet_path.read_text(encoding="utf-8"))
          old_objective = "bump both changed module publication identities to 0.1.1, record"
          new_objective = (
              "bump both changed module publication identities to 0.1.1, publish both immutable "
              "capability coordinates in the PostgreSQL runtime fixture, record"
          )
          if packet["objective"].count(old_objective) != 1:
              raise SystemExit("packet objective publication boundary was not found exactly once")
          packet["objective"] = packet["objective"].replace(old_objective, new_objective, 1)
          allowed_path = "database/tests/0003_sales_activities_adapters.sql"
          if allowed_path in packet["allowed_paths"]:
              raise SystemExit("database fixture was already declared in the packet")
          packet["allowed_paths"].insert(3, allowed_path)
          if packet["forbidden_paths"].count("database/**") != 1:
              raise SystemExit("expected the previous broad database forbidden path exactly once")
          packet["forbidden_paths"] = [
              "database/migrations/**" if value == "database/**" else value
              for value in packet["forbidden_paths"]
          ]
          packet["deliverables"].insert(
              4,
              "publish activities.task.create@1.0.0 under crm.activities@0.1.0 and activities.task.create@1.1.0 under crm.activities@0.1.1 in the PostgreSQL runtime acceptance fixture",
          )
          if "Event Runtime CI" in packet["required_checks"]:
              raise SystemExit("Event Runtime CI was already declared")
          packet["required_checks"].insert(
              packet["required_checks"].index("Governance CI"), "Event Runtime CI"
          )
          if packet["acceptance"][0].count("twenty") != 1:
              raise SystemExit("expected the previous twenty-file acceptance exactly once")
          packet["acceptance"][0] = packet["acceptance"][0].replace(
              "twenty", "twenty-one", 1
          )
          packet["acceptance"].insert(
              4,
              "the PostgreSQL runtime fixture preserves the immutable 1.0.0 publication under crm.activities@0.1.0 and adds 1.1.0 under crm.activities@0.1.1 with identical descriptor hashes",
          )
          packet_path.write_text(json.dumps(packet, indent=2) + "\n", encoding="utf-8")

          exact_files = (
              "tests/test_repository_navigation.py",
              "tests/test_architecture_documentation_consistency.py",
          )
          for filename in exact_files:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              needle = '                "crates/crm-sales-activities-link-contract-adapter/src/lib.rs",\n'
              replacement = needle + '                "database/tests/0003_sales_activities_adapters.sql",\n'
              if text.count(needle) != 1:
                  raise SystemExit(f"expected one allowed-path insertion point in {filename}")
              path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          navigation_path = Path("tests/test_repository_navigation.py")
          navigation = navigation_path.read_text(encoding="utf-8")
          required_old = '                "Database CI",\n                "Governance CI",'
          required_new = '                "Database CI",\n                "Event Runtime CI",\n                "Governance CI",'
          if navigation.count(required_old) != 1:
              raise SystemExit("navigation required-check insertion point was not found")
          navigation = navigation.replace(required_old, required_new, 1)
          map_old = '            "Database CI": ".github/workflows/database.yml",\n            "Governance CI":'
          map_new = '            "Database CI": ".github/workflows/database.yml",\n            "Event Runtime CI": ".github/workflows/event-runtime.yml",\n            "Governance CI":'
          if navigation.count(map_old) != 1:
              raise SystemExit("navigation workflow-map insertion point was not found")
          navigation_path.write_text(navigation.replace(map_old, map_new, 1), encoding="utf-8")

          architecture_path = Path("tests/test_architecture_documentation_consistency.py")
          architecture = architecture_path.read_text(encoding="utf-8")
          required_old = '                "Database CI",\n                "Governance CI",'
          required_new = '                "Database CI",\n                "Event Runtime CI",\n                "Governance CI",'
          if architecture.count(required_old) != 1:
              raise SystemExit("architecture required-check insertion point was not found")
          architecture = architecture.replace(required_old, required_new, 1)
          if architecture.count('            "database/**",\n') != 1:
              raise SystemExit("architecture forbidden-path assertion was not found")
          architecture = architecture.replace(
              '            "database/**",\n', '            "database/migrations/**",\n', 1
          )
          marker = "    def test_active_step_17_representative_capability_deprecation_packet_is_exact(self) -> None:\n"
          fixture_test = '''    def test_representative_postgres_fixture_preserves_both_exact_publications(self) -> None:
              fixture = read("database/tests/0003_sales_activities_adapters.sql")
              self.assertIn("'activities.task.create', '1.0.0', 'crm.activities', '0.1.0'", fixture)
              self.assertIn("'activities.task.create', '1.1.0', 'crm.activities', '0.1.1'", fixture)
              self.assertEqual(fixture.count("decode(repeat('31', 32), 'hex')"), 2)
              self.assertEqual(fixture.count("decode(repeat('32', 32), 'hex')"), 2)
              self.assertIn("expected immutable activities.task.create publications", fixture)

          '''
          if architecture.count(marker) != 1:
              raise SystemExit("architecture fixture-test insertion point was not found")
          architecture_path.write_text(
              architecture.replace(marker, fixture_test + marker, 1), encoding="utf-8"
          )
          PY
          python scripts/generate_repository_navigation.py --write
          cargo fmt --all
          buf build proto --output /tmp/crm-schema.binpb
          python scripts/generate_contract_bindings.py --check --descriptor-set /tmp/crm-schema.binpb
          python scripts/generate_contract_lifecycle.py --check --base-ref origin/main --expected-output /tmp/contract-lifecycle.expected.json
          cmp contracts/contract-lifecycle.json /tmp/contract-lifecycle.expected.json
          python scripts/generate_contract_telemetry_catalog.py --check
          python scripts/generate_repository_navigation.py --check
          python scripts/validate_module_manifests.py
          python scripts/check_module_compatibility.py --base-ref origin/main
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          packet = json.loads(Path("repository-packet.json").read_text(encoding="utf-8"))
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          expected = sorted(packet["allowed_paths"])
          if changed != expected:
              raise SystemExit(
                  f"exact packet tree mismatch\nexpected={expected}\nactual={changed}"
              )
          if len(changed) != 21:
              raise SystemExit(f"expected 21 packet files, found {len(changed)}")
          PY
          test -z "$(git diff --check)"
      - name: Validate focused lifecycle and navigation closure
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests/test_contract_bindings.py \
            tests/test_contract_lifecycle.py \
            tests/test_contract_lifecycle_transitions.py \
            tests/test_contract_telemetry_catalog.py \
            tests/test_repository_navigation.py \
            tests/test_architecture_documentation_consistency.py
      - name: Validate full Rust and architecture closure
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          python scripts/check_architecture.py
          python scripts/check_step13_suppression_baseline.py --check --json-output /tmp/suppressions.json --markdown-output /tmp/suppressions.md
          python scripts/analyze_workspace_governance.py --base-ref origin/main --check --json-output /tmp/governance.json --markdown-output /tmp/governance.md
          python scripts/check_workspace_dependency_policy.py --check --json-output /tmp/dependencies.json --markdown-output /tmp/dependencies.md
          python scripts/analyze_step13_complexity.py --json-output /tmp/complexity.json --markdown-output /tmp/complexity.md
          python - <<'PY'
          import json
          report = json.load(open("/tmp/complexity.json", encoding="utf-8"))
          actual = report["workspace_baseline"]["composition"]["application_runtime"]["non_comment_lines"]
          if actual != 7269:
              raise SystemExit(f"application-runtime LOC must equal accepted ceiling 7269, found {actual}")
          PY
      - name: Apply Event Runtime database
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/000{1..8}_*.up.sql; do
            psql --set ON_ERROR_STOP=1 --file "${migration}"
          done
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0003_sales_activities_adapters.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Validate production event delivery and projections
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p crm-sales-activities-capability-composition \
            --features postgres-integration \
            --test postgres_link_delivery -- --nocapture
          cargo test -p crm-sales-activities-capability-composition \
            --features postgres-integration \
            --test postgres_projections -- --nocapture
      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish replacement capability in PostgreSQL fixture"
          mkdir -p /tmp/step17-db-fixture-proof
          git rev-parse HEAD > /tmp/step17-db-fixture-proof/clean-sha.txt
          git diff --name-only origin/main HEAD > /tmp/step17-db-fixture-proof/changed-files.txt
          git diff --binary origin/main HEAD > /tmp/step17-db-fixture-proof/clean.diff
          sha256sum /tmp/step17-db-fixture-proof/clean.diff > /tmp/step17-db-fixture-proof/clean.diff.sha256
          cp /tmp/suppressions.json /tmp/governance.json /tmp/dependencies.json /tmp/complexity.json /tmp/step17-db-fixture-proof/
          git push --force origin HEAD:step17-representative-clean-staging-v3
      - name: Upload proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: step17-representative-db-fixture-proof
          path: /tmp/step17-db-fixture-proof
          if-no-files-found: error
          retention-days: 14
