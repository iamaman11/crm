          PY
          git diff --check
          git diff -- docs/PROJECT_STATUS.md docs/IMPLEMENTATION_ROADMAP.md docs/PHASE8_DELIVERY_PLAN.md
      - name: Commit synchronized documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/IMPLEMENTATION_ROADMAP.md docs/PHASE8_DELIVERY_PLAN.md
          git commit -m "Synchronize status after aggregation and CI pilots"
          git push origin HEAD:docs/sync-after-aggregation-ci-pilots
