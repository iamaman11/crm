name: Temporary proof ConnectRPC plus native D1 via official workers-rs send
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/connect-native-d1-proof.yml"
      - ".github/experiments/connect-d1-native-20261110/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-and-workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Compile Connect 0.9.1 and workers-rs 0.8.7 native D1 with official worker::send
        working-directory: .github/experiments/connect-d1-native-20261110
        run: |
          set -euo pipefail
          cargo check --target wasm32-unknown-unknown
          echo "CONNECT_NATIVE_D1_OFFICIAL_SEND_COMPILE=PASS"
      - name: Cache pinned native Rust tool CLIs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-crm-rust1971-wasm-bindgen-0.2.130-worker-build-0.8.7-v1
      - name: Install pinned wasm-bindgen CLI
        run: |
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.130" ]; then
            cargo install --locked wasm-bindgen-cli --version 0.2.130
          fi
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.130"
          echo "WASM_BINDGEN_BIN=$(command -v wasm-bindgen)" >> "$GITHUB_ENV"
      - name: Install pinned wasm-opt
        run: |
          npm install --prefix "$RUNNER_TEMP/crm-binaryen" --no-save --no-audit --no-fund binaryen@132.0.0
          WASM_OPT="$RUNNER_TEMP/crm-binaryen/node_modules/binaryen/bin/wasm-opt"
          test -x "$WASM_OPT"
          echo "WASM_OPT_BIN=$WASM_OPT" >> "$GITHUB_ENV"
      - name: Install pinned worker-build
        run: |
          if ! command -v worker-build >/dev/null || ! worker-build --version 2>&1 | grep -Fq '0.8.7'; then
            cargo install --locked worker-build --version 0.8.7
          fi
      - name: Build runnable Connect Worker with native D1
        working-directory: .github/experiments/connect-d1-native-20261110
        run: |
          worker-build --release
          test -s build/index_bg.wasm
          test -s build/index.js
      - name: Install existing CRM Wrangler
        working-directory: apps/cloudflare-crm
        run: npm install --no-audit --no-fund
      - name: Real Connect JSON RPC and independent local D1 SQL readback
        run: node .github/experiments/connect-d1-native-20261110/verify.mjs
