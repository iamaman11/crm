name: Temporary Step 18 Required Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'repository-step-18-doctor-bootstrap-evidence-sync' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install navigation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Synchronize exact applicable gate set
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          packet_path = Path("repository-packet.json")
          packet = json.loads(packet_path.read_text(encoding="utf-8"))
          expected = [
              "Affected Scope CI",
              "Complexity Baseline CI",
              "Governance CI",
              "Rust Generated Sync",
              "Rust CI",
          ]
          required = [
              "Affected Scope CI",
              "Complexity Baseline CI",
              "Customer Privacy Access Export CI",
              "Customer Privacy Owner Execution CI",
              "Governance CI",
              "Rust Generated Sync",
              "Rust CI",
          ]
          if packet["required_checks"] != expected:
              raise SystemExit(
                  f"unexpected existing required_checks: {packet['required_checks']!r}"
              )
          packet["required_checks"] = required
          packet["acceptance"].append(
              "the exact final head passes both Customer Privacy process gates selected by the permanent historical-evidence preflight"
          )
          packet_path.write_text(json.dumps(packet, indent=2) + "\n", encoding="utf-8")

          old = '''            [
                "Affected Scope CI",
                "Complexity Baseline CI",
                "Governance CI",
                "Rust Generated Sync",
                "Rust CI",
            ],'''
          new = '''            [
                "Affected Scope CI",
                "Complexity Baseline CI",
                "Customer Privacy Access Export CI",
                "Customer Privacy Owner Execution CI",
                "Governance CI",
                "Rust Generated Sync",
                "Rust CI",
            ],'''
          for path in (
              "tests/test_architecture_documentation_consistency.py",
              "tests/test_repository_navigation.py",
          ):
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected required-check list once, found {count}")
              file_path.write_text(content.replace(old, new), encoding="utf-8")
          PY
          python scripts/generate_repository_navigation.py --write
          python -m unittest \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation
      - name: Commit exact gate declaration
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/ACTIVE_PACKET.md \
            repository-packet.json \
            tests/test_architecture_documentation_consistency.py \
            tests/test_repository_navigation.py
          if git diff --cached --quiet; then
            echo "No required-gate changes produced"
            exit 1
          fi
          git commit -m "Declare all applicable Step 18 evidence gates"
          git push origin "HEAD:${HEAD_BRANCH}"
