name: One-time Customer Accounts golden contribution

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build and validate golden contribution commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee golden-patch.log) 2>&1
          set -euo pipefail
          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet .
          git remote add origin "${auth_remote}"
          git fetch --quiet --no-tags --depth=1 origin architecture/customer-accounts-golden-contribution
          git checkout --quiet -B architecture/customer-accounts-golden-contribution FETCH_HEAD
          python scripts/one_time_customer_accounts_golden.py
          cargo fmt --all
          python -m unittest -v tests.test_native_module_composition
          python scripts/check_native_module_composition.py
          cargo test -p crm-application-composition -p crm-customer-accounts-capability-composition -p crm-application-runtime --lib
          cargo check --workspace
          git rm .github/workflows/one-time-customer-accounts-golden.yml
          git rm scripts/one_time_customer_accounts_golden.py
          git add \
            crates/crm-application-composition/src/lib.rs \
            crates/crm-customer-accounts-capability-composition/Cargo.toml \
            crates/crm-customer-accounts-capability-composition/src/lib.rs \
            crates/crm-application-runtime/src/native_composition.rs \
            scripts/check_native_module_composition.py \
            docs/GOLDEN_MODULE_CONTRIBUTION.md \
            Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Customer Accounts golden module contribution"
          echo "GOLDEN_COMMIT_SHA=$(git rev-parse HEAD)"
          set +e
          git push origin HEAD:architecture/customer-accounts-golden-contribution
          push_status=$?
          set -e
          echo "PUSH_STATUS=${push_status}"
          exit 0
      - name: Upload golden patch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer-accounts-golden-patch
          path: golden-patch.log
          if-no-files-found: error
          retention-days: 7
