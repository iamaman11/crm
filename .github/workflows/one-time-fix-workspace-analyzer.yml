name: One-time fix workspace analyzer

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-fix-workspace-analyzer.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Stage analyzer fix commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee analyzer-fix.log) 2>&1
          set -euo pipefail
          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet .
          git remote add origin "${auth_remote}"
          git fetch --quiet --no-tags --depth=1 origin architecture/complexity-baseline
          git checkout --quiet -B architecture/complexity-baseline FETCH_HEAD
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/analyze_workspace.py')
          text = path.read_text(encoding='utf-8')
          old = 'run_step_count=sum(1 for line in lines if re.match(r"^\\s*run:\\s*", line)),'
          new = 'run_step_count=sum(1 for line in lines if re.match(r"^\\s*-?\\s*run:\\s*", line)),'
          if text.count(old) != 1:
              raise SystemExit('run-step scanner anchor is not exact')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m unittest -v tests.test_workspace_analysis
          git rm .github/workflows/one-time-fix-workspace-analyzer.yml
          git add scripts/analyze_workspace.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Count all workflow run-step forms"
          echo "ANALYZER_FIX_COMMIT_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:architecture/complexity-baseline
      - name: Upload analyzer fix diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analyzer-fix-commit-log
          path: analyzer-fix.log
          if-no-files-found: error
          retention-days: 7
