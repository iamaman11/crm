name: One-time fix workspace analyzer

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-fix-workspace-analyzer.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Stage analyzer fix commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee analyzer-fix.log) 2>&1
          set -euo pipefail
          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet .
          git remote add origin "${auth_remote}"
          git fetch --quiet --no-tags --depth=1 origin architecture/complexity-baseline
          git checkout --quiet -B architecture/complexity-baseline FETCH_HEAD
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/analyze_workspace.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          run_anchor = 'run_step_count=sum(1 for line in lines if re.match(r"^\\s*run:\\s*", line)),'
          run_replacement = 'run_step_count=sum(1 for line in lines if re.match(r"^\\s*-?\\s*run:\\s*", line)),'
          run_matches = [index for index, line in enumerate(lines) if run_anchor in line]
          if len(run_matches) != 1:
              raise SystemExit(f'run-step scanner matches: {run_matches}')
          index = run_matches[0]
          lines[index] = lines[index].replace(run_anchor, run_replacement)

          path_start = next(
              (index for index, line in enumerate(lines) if line == '    path_filter_count = sum('),
              None,
          )
          timeout_start = next(
              (index for index, line in enumerate(lines) if line.startswith('    timeouts = ')),
              None,
          )
          if path_start is None or timeout_start is None or path_start >= timeout_start:
              raise SystemExit(
                  f'path-filter block boundaries are invalid: {path_start}, {timeout_start}'
              )
          path_block = [
              '    path_filter_count = 0',
              '    inside_paths = False',
              '    for line in event_lines:',
              '        if line.rstrip() == "    paths:":',
              '            inside_paths = True',
              '            continue',
              '        if inside_paths and re.match(r"^\\s{6}-\\s+", line):',
              '            path_filter_count += 1',
              '            continue',
              '        if inside_paths and line.strip() and not line.startswith(("      ", "\\t", "#")):',
              '            inside_paths = False',
              '',
          ]
          lines[path_start:timeout_start] = path_block
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m unittest -v tests.test_workspace_analysis
          git rm .github/workflows/one-time-fix-workspace-analyzer.yml
          git add scripts/analyze_workspace.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Measure workflow paths and run steps precisely"
          echo "ANALYZER_FIX_COMMIT_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:architecture/complexity-baseline
      - name: Upload analyzer fix diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analyzer-fix-commit-log
          path: analyzer-fix.log
          if-no-files-found: error
          retention-days: 7
