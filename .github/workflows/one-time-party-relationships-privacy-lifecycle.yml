name: One-Time Party Relationships Privacy Lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-party-relationships-privacy-lifecycle.yml"
      - "crates/crm-party-relationships-privacy-scope-adapter/**"
      - "crates/crm-party-relationships-capability-adapter/**"
      - "modules/crm-party-relationships/**"
      - "database/tests/0028_party_relationships_privacy_scope_fixture.sql"
      - "Cargo.toml"
      - "Cargo.lock"
      - "architecture-policy.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lifecycle:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm_party_relationships_privacy_scope_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_party_relationships_privacy_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PGHOST: 127.0.0.1
      PGPORT: 5441
      PGDATABASE: crm_party_relationships_privacy_scope_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://crm_app_test:crm_app_test@127.0.0.1:5441/crm_party_relationships_privacy_scope_test
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5441/crm_party_relationships_privacy_scope_test
    steps:
      - name: Check out exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD
      - name: Prepare Rust and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Enforce architecture and formatting
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_architecture.py
          cargo fmt --all -- --check
      - name: Run focused Clippy and unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p crm-party-relationships-privacy-scope-adapter --all-targets --all-features -- -D warnings \
            2>&1 | tee database/party-relationships-privacy-scope-clippy.log
          cargo test -p crm-party-relationships-privacy-scope-adapter --all-features --lib
      - name: Apply clean migrations and owner fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do psql --set ON_ERROR_STOP=1 --file "${migration}"; done \
            < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0024_parties_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0028_party_relationships_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify clean acceptance
        shell: bash
        run: |
          set -o pipefail
          cargo test -p crm-party-relationships-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee database/party-relationships-privacy-scope-clean.log
      - name: Roll back authoritative schema
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do psql --set ON_ERROR_STOP=1 --file "${migration}"; done \
            < <(find database/migrations -maxdepth 1 -type f -name '*.down.sql' | sort -r)
          test "$(psql --tuples-only --no-align --command "SELECT count(*) FROM pg_namespace WHERE nspname = 'crm'")" = "0"
      - name: Reapply migrations and owner fixtures
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do psql --set ON_ERROR_STOP=1 --file "${migration}"; done \
            < <(find database/migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          psql --set ON_ERROR_STOP=1 --file database/tests/0001_platform_foundation.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0004_search_runtime_role_grants.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0024_parties_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --file database/tests/0028_party_relationships_privacy_scope_fixture.sql
          psql --set ON_ERROR_STOP=1 --command "ALTER ROLE crm_app_test LOGIN PASSWORD 'crm_app_test'"
      - name: Verify reapplied acceptance and workspace graph
        shell: bash
        run: |
          set -o pipefail
          cargo test -p crm-party-relationships-privacy-scope-adapter --all-features -- --nocapture \
            2>&1 | tee database/party-relationships-privacy-scope-reapplied.log
          cargo check --workspace --all-features
      - name: Remove successful lifecycle workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-party-relationships-privacy-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: complete party relationships privacy lifecycle"
          git push origin "HEAD:${HEAD_REF}"
      - name: Capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          postgres_container="$(docker ps -aq --filter ancestor=postgres:17-alpine | head -n 1)"
          if [ -n "${postgres_container}" ]; then
            docker logs "${postgres_container}" > database/party-relationships-privacy-scope-postgres.log 2>&1
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: party-relationships-privacy-scope-lifecycle-diagnostics
          path: database/party-relationships-privacy-scope-*.log
          if-no-files-found: warn
          retention-days: 7
