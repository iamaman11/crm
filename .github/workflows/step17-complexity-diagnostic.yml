name: Step 17 Complexity Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-complexity-diagnostic.yml"

concurrency:
  group: step17-complexity-diagnostic-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-event-delivery-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Reproduce clean candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML

          workflow = YAML(typ="safe").load(
              Path(".github/workflows/step17-event-delivery-analysis.yml").read_text(encoding="utf-8")
          )
          target = next(
              step["run"]
              for step in workflow["jobs"]["validate-and-publish"]["steps"]
              if step.get("name") == "Apply checksum-bound event telemetry patch"
          )
          Path("/tmp/apply-step17.sh").write_text(target, encoding="utf-8")
          PY
          bash /tmp/apply-step17.sh
          rm -f .github/workflows/step17-complexity-diagnostic.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Step 17 diagnostic candidate"
          test "$(git diff --name-only origin/main HEAD | wc -l)" -eq 14
          test -z "$(git status --porcelain)"
      - name: Capture complexity evidence
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          python scripts/analyze_workspace.py \
            --json-output artifacts/workspace-complexity-baseline.json \
            --markdown-output artifacts/workspace-complexity-baseline.md \
            > artifacts/workspace.log 2>&1
          echo $? > artifacts/workspace.exit
          python scripts/analyze_step13_complexity.py \
            --json-output artifacts/step13-complexity-baseline.json \
            --markdown-output artifacts/step13-complexity-baseline.md \
            > artifacts/step13.log 2>&1
          echo $? > artifacts/step13.exit
          python scripts/check_step13_exit_evidence.py \
            --check \
            --json-output artifacts/step13-exit-evidence.json \
            --markdown-output artifacts/step13-exit-evidence.md \
            > artifacts/exit-evidence.log 2>&1
          echo $? > artifacts/exit-evidence.exit
          cat artifacts/*.log
          exit 0
      - name: Upload complexity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: step17-complexity-diagnostic
          path: artifacts
          if-no-files-found: error
          retention-days: 1
