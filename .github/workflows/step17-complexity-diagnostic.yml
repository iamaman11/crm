name: Step 17 Event Telemetry Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/step17-complexity-diagnostic.yml"
      - ".github/step17-event-reduction.txt"

concurrency:
  group: step17-event-telemetry-finalizer-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: step17-event-delivery-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # exact Rust 1.97.1 policy
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Reproduce verified event telemetry candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML

          workflow = YAML(typ="safe").load(
              Path(".github/workflows/step17-event-delivery-analysis.yml").read_text(encoding="utf-8")
          )
          target = next(
              step["run"]
              for step in workflow["jobs"]["validate-and-publish"]["steps"]
              if step.get("name") == "Apply checksum-bound event telemetry patch"
          )
          Path("/tmp/apply-step17.sh").write_text(target, encoding="utf-8")
          PY
          bash /tmp/apply-step17.sh
      - name: Apply checksum-bound reduction
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < .github/step17-event-reduction.txt > /tmp/step17-reduction.patch.gz.b64
          echo "e65a4fe0265c49bb430f0b5a96c80c26b4957d6cac8b1d5c2635067f588232e2  /tmp/step17-reduction.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/step17-reduction.patch.gz.b64 | gzip --decompress > /tmp/step17-reduction.patch
          echo "7aafca243a85741f6e3e85434f8b5bb62f4d54e1d3433676b8e8105caad779cd  /tmp/step17-reduction.patch" | sha256sum --check
          git apply --check /tmp/step17-reduction.patch
          git apply /tmp/step17-reduction.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/crm-core-data/tests/postgres_event_delivery.rs")
          text = path.read_text(encoding="utf-8")
          old = 'Arc::new(|_: &EventDelivery| panic!("observer failure"))'
          new = 'Arc::new(|_: &EventDelivery| -> () { panic!("observer failure") })'
          if text.count(old) != 1:
              raise SystemExit(f"expected one panic observer target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f .github/step17-event-reduction.txt
          rm -f .github/workflows/step17-complexity-diagnostic.yml
          cargo fmt --all
      - name: Verify exact fourteen-file tree
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          crates/crm-application-runtime/src/generated_contract_telemetry.rs
          crates/crm-application-runtime/src/runtime.rs
          crates/crm-capability-adapters/src/contract_usage_telemetry.rs
          crates/crm-core-data/src/lib.rs
          crates/crm-core-data/src/postgres.rs
          crates/crm-core-data/src/postgres_event_delivery_ledger.rs
          crates/crm-core-data/src/postgres_projection.rs
          crates/crm-core-data/tests/postgres_event_delivery.rs
          docs/ACTIVE_PACKET.md
          repository-packet.json
          scripts/generate_contract_telemetry_catalog.py
          tests/test_architecture_documentation_consistency.py
          tests/test_contract_telemetry_catalog.py
          tests/test_repository_navigation.py
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only origin/main | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(wc -l < /tmp/actual-files)" -eq 14
          git diff --check
      - name: Commit clean candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --name-only origin/main | sort > /tmp/staged-files
          diff -u /tmp/expected-files /tmp/staged-files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Step 17: instrument deprecated event delivery usage"
          git diff --name-only origin/main HEAD | sort > /tmp/candidate-files
          diff -u /tmp/expected-files /tmp/candidate-files
          test -z "$(git status --porcelain)"
      - name: Validate generated policy and packet
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_contract_telemetry_catalog.py --check
          python scripts/generate_repository_navigation.py --check
          python -m unittest -v \
            tests.test_contract_telemetry_catalog \
            tests.test_architecture_documentation_consistency \
            tests.test_repository_navigation
          python scripts/repo.py packet-check --base origin/main
      - name: Test focused Rust closure
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p crm-capability-adapters contract_usage_telemetry
          cargo test --locked -p crm-core-data --test postgres_event_delivery --features postgres-integration
          cargo check --locked -p crm-application-runtime --all-targets
      - name: Run full workspace Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Enforce accepted complexity ceilings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/analyze_workspace.py \
            --json-output artifacts/workspace-complexity-baseline.json \
            --markdown-output artifacts/workspace-complexity-baseline.md
          python scripts/analyze_step13_complexity.py \
            --json-output artifacts/step13-complexity-baseline.json \
            --markdown-output artifacts/step13-complexity-baseline.md
          python scripts/check_step13_exit_evidence.py \
            --check \
            --json-output artifacts/step13-exit-evidence.json \
            --markdown-output artifacts/step13-exit-evidence.md
      - name: Publish clean exact head
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/main HEAD | sort > /tmp/final-files
          diff -u /tmp/expected-files /tmp/final-files
          test "$(wc -l < /tmp/final-files)" -eq 14
          test -z "$(git status --porcelain)"
          git push origin HEAD:step17-event-delivery-telemetry
